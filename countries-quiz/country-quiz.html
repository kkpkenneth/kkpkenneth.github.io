<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Country Quiz | 全球國家問答遊戲</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
            overflow: hidden;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--primary);
        }
        h2 {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .btn:hover:not(:disabled) {
            background-color: #2980b9;
        }
        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .btn.correct { background-color: var(--success) !important; color: white; }
        .btn.wrong { background-color: var(--danger) !important; color: white; }
        
        #quiz-screen {
            display: none;
        }
        .flag-container {
            width: 100%;
            height: 250px;
            background-color: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .flag-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* This forces the image to completely fill the container */
        }
        .fact-box {
            background: #fffbea;
            border-left: 5px solid #f1c40f;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 4px;
            display: none; 
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .fact-box h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .fact-item {
            margin-bottom: 10px;
        }
        .fact-item strong {
            color: var(--secondary);
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media (max-width: 500px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
        #next-btn {
            background-color: var(--primary);
            display: none;
            margin-top: 10px;
        }
        #next-btn:hover {
            background-color: var(--secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>Global Country Quiz<br>全球國家問答遊戲</h1>
        <h2>Test your geography knowledge!<br>測試你的地理知識！</h2>
        <button class="btn" onclick="startQuiz()">Start Quiz / 開始遊戲</button>
    </div>

    <div id="quiz-screen">
        <h2 id="question-text">Which country is this? / 這是哪個國家？</h2>
        
        <div class="flag-container">
            <img id="flag-img" src="" alt="Country Flag / 國家圖片">
        </div>

        <div class="fact-box" id="fact-box">
            <h3 id="fact-title">Hints / 提示</h3>
            <div class="fact-item" id="fact-geo"></div>
            <div class="fact-item" id="fact-nickname"></div>
            <div class="fact-item" id="fact-most"></div>
        </div>
        
        <div id="options-container" class="options-grid">
        </div>

        <button class="btn" id="next-btn" onclick="loadNextQuestion()">Next Question / 下一題</button>
    </div>
</div>

<script>
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

    const countryData = [
        { id: "003", img: "003-japan.jpg", en: "Japan", zh: "日本", geoEn: "An island nation located off the east coast of Asia.", geoZh: "位於亞洲東海岸外的島國。", nickEn: "The Land of the Rising Sun", nickZh: "日出之國", mostEn: "Has the most elderly population in the world.", mostZh: "擁有世界上最老齡化的人口。" },
        { id: "007", img: "007-china.jpg", en: "China", zh: "中國", geoEn: "A massive continental country in East Asia.", geoZh: "位於東亞的巨型大陸國家。", nickEn: "The Red Dragon", nickZh: "東方巨龍", mostEn: "Has the most borders with other countries (14 countries).", mostZh: "世界上接壤國家最多的國家（14個）。" },
        { id: "009", img: "009-united-kingdom.jpg", en: "United Kingdom", zh: "英國", geoEn: "An island nation in northwestern Europe.", geoZh: "位於歐洲西北部的島國。", nickEn: "Britannia", nickZh: "不列顛", mostEn: "Has the most tornadoes by area in the world.", mostZh: "按面積計算，世界上龍捲風發生最密集的國家。" },
        { id: "010", img: "010-france.jpg", en: "France", zh: "法國", geoEn: "A continental country in Western Europe.", geoZh: "位於西歐的大陸國家。", nickEn: "L'Hexagone (The Hexagon)", nickZh: "六邊形國", mostEn: "Is the most visited country in the world.", mostZh: "是世界上遊客訪問量最多的國家。" },
        { id: "018", img: "018-united-states.jpg", en: "United States", zh: "美國", geoEn: "A massive continental country in North America.", geoZh: "位於北美洲的巨型大陸國家。", nickEn: "Uncle Sam / Land of the Free", nickZh: "山姆大叔 / 自由之土", mostEn: "Has the most active volcanoes after Indonesia and Japan.", mostZh: "活躍火山數量僅次於印尼和日本。" },
        { id: "033", img: "033-australia.jpg", en: "Australia", zh: "澳洲", geoEn: "A massive continental island in Oceania.", geoZh: "位於大洋洲的巨大陸地島嶼。", nickEn: "The Land Down Under", nickZh: "南半球之國", mostEn: "Has the most venomous snakes in the world.", mostZh: "擁有世界上最多的毒蛇種類。" },
        { id: "069", img: "069-egypt.jpg", en: "Egypt", zh: "埃及", geoEn: "A transcontinental country spanning northeast Africa and southwest Asia.", geoZh: "橫跨非洲東北部和亞洲西南部的跨洲國家。", nickEn: "The Gift of the Nile", nickZh: "尼羅河的贈禮", mostEn: "Has the most ancient pyramids in the Arab world.", mostZh: "擁有阿拉伯世界中最古老的金字塔群。" },
        { id: "081", img: "081-india.jpg", en: "India", zh: "印度", geoEn: "A large peninsula in South Asia.", geoZh: "位於南亞的大型半島。", nickEn: "The Subcontinent", nickZh: "次大陸", mostEn: "Has the most vegetarians in the world.", mostZh: "擁有世界上最多的素食主義者。" },
        { id: "097", img: "097-brazil.jpg", en: "Brazil", zh: "巴西", geoEn: "A massive coastal country in South America.", geoZh: "位於南美洲的廣闊沿海國家。", nickEn: "The Land of the Holy Cross", nickZh: "聖十字架之地", mostEn: "Contains the most biodiverse rainforest in the world (Amazon).", mostZh: "擁有世界上生物多樣性最豐富的雨林（亞馬遜）。" },
        { id: "113", img: "113-thailand.jpg", en: "Thailand", zh: "泰國", geoEn: "A coastal country located in the center of the Indochinese Peninsula.", geoZh: "位於中南半島中心的沿海國家。", nickEn: "The Land of Smiles", nickZh: "微笑之國", mostEn: "The most visited city in the world is its capital (Bangkok).", mostZh: "其首都（曼谷）是全球遊客訪問量最多的城市。" },
        { id: "153", img: "153-italy.jpg", en: "Italy", zh: "意大利", geoEn: "A boot-shaped peninsula in Southern Europe.", geoZh: "位於南歐的靴子形半島。", nickEn: "The Boot (Lo Stivale)", nickZh: "靴子國", mostEn: "Contains the most UNESCO World Heritage sites.", mostZh: "擁有世界上最多的聯合國教科文組織世界遺產。" },
        { id: "159", img: "159-switzerland.jpg", en: "Switzerland", zh: "瑞士", geoEn: "A landlocked country in Central Europe.", geoZh: "位於中歐的內陸國家。", nickEn: "The Playground of Europe", nickZh: "歐洲的遊樂場", mostEn: "Has the most chocolate consumption per capita.", mostZh: "全球人均巧克力消費量最多的國家。" }
    ];

    const allCountryNames = [
        {en: "Hong Kong", zh: "香港"}, {en: "Taiwan", zh: "台灣"}, {en: "South Korea", zh: "南韓"}, 
        {en: "North Korea", zh: "北韓"}, {en: "Mongolia", zh: "蒙古"}, {en: "Macau", zh: "澳門"}, 
        {en: "Spain", zh: "西班牙"}, {en: "Portugal", zh: "葡萄牙"}, {en: "Netherlands", zh: "荷蘭"}, 
        {en: "Belgium", zh: "比利時"}, {en: "Germany", zh: "德國"}, {en: "Ireland", zh: "愛爾蘭"}, 
        {en: "Canada", zh: "加拿大"}, {en: "Mexico", zh: "墨西哥"}, {en: "Cuba", zh: "古巴"},
        {en: "South Africa", zh: "南非"}, {en: "New Zealand", zh: "新西蘭"}, {en: "Fiji", zh: "斐濟"},
        {en: "Argentina", zh: "阿根廷"}, {en: "United Arab Emirates", zh: "阿拉伯聯合酋長國"},
        {en: "Iceland", zh: "冰島"}, {en: "Norway", zh: "挪威"}, {en: "Morocco", zh: "摩洛哥"}
    ];

    let currentQuestion = null;
    let questionsPool = [...countryData];

    function startQuiz() {
        initAudio();
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadNextQuestion();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function loadNextQuestion() {
        document.getElementById('next-btn').style.display = 'none';
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        if (questionsPool.length === 0) {
            questionsPool = [...countryData];
        }
        const qIndex = Math.floor(Math.random() * questionsPool.length);
        currentQuestion = questionsPool.splice(qIndex, 1)[0];

        document.getElementById('flag-img').src = currentQuestion.img;
        document.getElementById('flag-img').onerror = function() {
            this.src = 'https://via.placeholder.com/400x250?text=Image+Missing+(' + currentQuestion.img + ')';
        };

        document.getElementById('fact-title').innerHTML = `Hints / 提示`;
        document.getElementById('fact-geo').innerHTML = `<strong>Location / 地理:</strong> ${currentQuestion.geoEn}<br><em>${currentQuestion.geoZh}</em>`;
        document.getElementById('fact-nickname').innerHTML = `<strong>Nickname / 綽號:</strong> ${currentQuestion.nickEn}<br><em>${currentQuestion.nickZh}</em>`;
        document.getElementById('fact-most').innerHTML = `<strong>"The Most" / 「最」之冷知識:</strong> ${currentQuestion.mostEn}<br><em>${currentQuestion.mostZh}</em>`;
        
        document.getElementById('fact-box').style.borderLeftColor = '#f1c40f';
        document.getElementById('fact-box').style.display = 'block';

        let options = [{ en: currentQuestion.en, zh: currentQuestion.zh, isCorrect: true }];
        
        let shuffledDistractors = shuffleArray([...allCountryNames, ...countryData.filter(c => c.id !== currentQuestion.id)]);
        for (let i = 0; i < 3; i++) {
            options.push({ en: shuffledDistractors[i].en, zh: shuffledDistractors[i].zh, isCorrect: false });
        }

        options = shuffleArray(options);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.style.marginBottom = "0"; 
            btn.innerHTML = `${opt.en}<br>${opt.zh}`;
            btn.onclick = () => checkAnswer(btn, opt.isCorrect);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(clickedBtn, isCorrect) {
        playSound(isCorrect ? 'correct' : 'wrong');

        const buttons = document.getElementById('options-container').querySelectorAll('.btn');
        
        buttons.forEach(btn => {
            btn.disabled = true;
            if (btn.innerHTML.includes(currentQuestion.en)) {
                btn.classList.add('correct');
            }
        });

        if (!isCorrect) {
            clickedBtn.classList.add('wrong');
        }

        const resultPrefix = isCorrect ? 'Correct: ' : 'Incorrect: ';
        document.getElementById('fact-title').innerHTML = `${resultPrefix} ${currentQuestion.en} / ${currentQuestion.zh}`;
        
        document.getElementById('fact-box').style.borderLeftColor = isCorrect ? '#2ecc71' : '#e74c3c';

        document.getElementById('next-btn').style.display = 'block';
    }
</script>

</body>
</html>
