<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokémon Dex Generator</title>
    <style>
        :root { --pokedex-red: #cc0000; --pokedex-dark: #222; --text-light: #f0f0f0; --accent: #ffcb05; }
        body { background-color: #333; color: var(--text-light); font-family: 'Courier New', Courier, monospace; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 1000px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: var(--pokedex-red); padding: 20px; border-radius: 20px; border: 8px solid #000; }
        .panel { background: var(--pokedex-dark); padding: 20px; border-radius: 10px; height: 85vh; overflow-y: auto; }
        h1, h2 { color: var(--accent); text-transform: uppercase; margin-top: 0; }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
        select, textarea { width: 100%; padding: 8px; margin-top: 4px; background: #444; color: white; border: 1px solid var(--accent); border-radius: 4px; }
        button { width: 100%; padding: 12px; background: var(--accent); border: none; font-weight: bold; cursor: pointer; margin-top: 10px; color: #222; }
        .trait-name { color: var(--accent); font-size: 0.7rem; text-transform: uppercase; }
        .trait-value { font-size: 0.9rem; margin-bottom: 8px; display: block; border-bottom: 1px solid #444; padding-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel" id="controls">
        <h1>Dex Forge</h1>
        <div class="control-group"><label>Type 1</label><select id="type1"></select></div>
        <div class="control-group"><label>Type 2</label><select id="type2"><option value="">None</option></select></div>
    </div>

    <div class="panel">
        <h2>Entry Profile</h2>
        <div id="res-display"></div>
        <textarea id="prompt-text" rows="12"></textarea>
        <button onclick="copyPrompt()">COPY PROMPT</button>
    </div>
</div>

<script>
    const types = ["Normal", "Fire", "Water", "Grass", "Electric", "Ice", "Fighting", "Poison", "Ground", "Flying", "Psychic", "Bug", "Rock", "Ghost", "Dragon", "Dark", "Steel", "Fairy"];
    const data = {
        stage: ["Baby", "Basic", "Evolved", "Legendary"],
        habitat: ["Forest", "Mountain", "Ocean", "Cave", "Urban", "Volcanic", "Desert"],
        torso: ["Bipedal", "Quadrupedal", "Serpentine", "Floating", "Insectoid", "Amorphous"],
        head: ["Spiky crest", "Long snout", "Pointed ears", "Multiple eyes", "Horned", "Beak"],
        appendages: ["Scythe claws", "Webbed flippers", "Tentacles", "Prehensile vines", "Hover pods", "Heavy hooves"],
        texture: ["Glossy chitin", "Coarse fur", "Crystalline scales", "Soft rubbery skin", "Moss-covered", "Metallic plating"],
        tail: ["Bushy", "Club-tipped", "Whip-like", "Fan-shaped", "Stinger-tipped", "None"],
        colorPalette: ["Neon and Dark", "Pastel and Metallic", "Earth tones", "Camo-pattern", "High-contrast"],
        aura: ["Crackling electricity", "Steaming mist", "Floating embers", "Shimmering light", "Poisonous vapor"],
        eyes: ["Slanted", "Large circular", "Rectangular pupils", "Opaque"],
        pattern: ["Striped", "Spotted", "Chevron-patterned", "Gradient", "Bioluminescent nodes"]
    };

    function init() {
        const controls = document.getElementById('controls');
        document.getElementById('type1').innerHTML = types.map(t => `<option value="${t}">${t}</option>`).join('');
        document.getElementById('type2').innerHTML = '<option value="">None</option>' + types.map(t => `<option value="${t}">${t}</option>`).join('');
        
        Object.keys(data).forEach(key => {
            controls.innerHTML += `<div class="control-group"><label>${key.toUpperCase()}</label><select id="${key}">${data[key].map(v => `<option value="${v}">${v}</option>`).join('')}</select></div>`;
        });
        controls.innerHTML += `<button onclick="randomizeAll()">GENERATE NEW ENTRY</button>`;
        document.querySelectorAll('select').forEach(s => s.addEventListener('change', update));
        randomizeAll();
    }

    function update() {
        let t1 = document.getElementById('type1').value;
        let t2 = document.getElementById('type2').value;
        let displayHTML = `<span class="trait-name">Type</span><span class="trait-value">${t1}${t2 ? '/' + t2 : ''}</span>`;
        let promptParts = [`Professional Pokémon character design, a ${t1}${t2 ? '-' + t2 : ''} type Pokémon.`];
        
        Object.keys(data).forEach(key => {
            const val = document.getElementById(key).value;
            displayHTML += `<span class="trait-name">${key}</span><span class="trait-value">${val}</span>`;
            
            // Grammar logic for the prompt
            if (key === 'stage') {
                promptParts.push(`It is a ${val.toLowerCase()}-stage Pokémon.`);
            } else {
                promptParts.push(`It features ${val.toLowerCase()} characteristics.`);
            }
        });

        document.getElementById('res-display').innerHTML = displayHTML;
        document.getElementById('prompt-text').value = promptParts.join(' ') + " High quality, Ken Sugimori art style, official Pokémon game aesthetic, clean background.";
    }

    function randomizeAll() {
        document.querySelectorAll('select').forEach(s => s.selectedIndex = Math.floor(Math.random() * s.options.length));
        update();
    }

    function copyPrompt() { navigator.clipboard.writeText(document.getElementById('prompt-text').value); }

    init();
</script>
</body>
</html>
