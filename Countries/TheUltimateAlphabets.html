<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Latin Alphabet Explorer</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 1.5rem 1rem;
            line-height: 1.5;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            width: 100%;
        }

        header h1 {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            background: var(--bg-secondary);
            color: var(--text-main);
            border: 2px solid transparent;
            padding: 0.8rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: #334155;
        }

        .tab-btn.active {
            border-color: var(--accent);
            background: var(--accent);
        }

        .view-panel {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        .view-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fluid Explorer Grid Layout */
        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 0.5rem;
            width: 100%;
        }

        .letter-card {
            background: var(--bg-secondary);
            border: 1px solid #334155;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            user-select: none;
        }

        .letter-card:hover, .letter-card:active {
            transform: scale(1.05);
            border-color: var(--accent);
            background: #243146;
        }

        /* Centered Explanatory Popup Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            padding: 1rem;
            transition: opacity 0.2s ease;
            backdrop-filter: blur(3px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            position: relative;
            background: var(--bg-secondary);
            padding: 2.5rem 2rem 2rem 2rem;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid #475569;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }
        
        .modal-overlay.active .modal {
            transform: scale(1);
        }
        
        .modal-number {
            position: absolute;
            top: 1.2rem;
            left: 1.2rem;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-muted);
            background: var(--bg-primary);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            border: 1px solid #475569;
        }

        .modal-char {
            font-size: 4.5rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 0.25rem;
            line-height: 1.1;
        }

        .modal-title {
            font-size: 1.3rem;
            margin-bottom: 0.75rem;
        }

        .modal-desc {
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .modal-example {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            padding: 0.75rem;
            border-radius: 8px 8px 0 0;
            font-style: italic;
            font-size: 0.95rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-bottom: none;
        }

        .modal-anglicized {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            padding: 0.75rem;
            border-radius: 0 0 8px 8px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 0.4rem;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-btn:hover, .close-btn:active {
            background: #334155;
            color: var(--text-main);
        }

        /* Vertical Stack Quiz Layout */
        .quiz-container {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            border: 1px solid #334155;
        }

        .quiz-score {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 0.75rem;
        }

        .quiz-prompt {
            font-size: 1.05rem;
            margin-bottom: 1.25rem;
            color: var(--text-main);
        }

        .quiz-target {
            font-size: 4rem;
            font-weight: bold;
            background: var(--bg-primary);
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 1.75rem;
            border: 1px solid #334155;
            min-width: 120px;
            line-height: 1.2;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            width: 100%;
        }

        .option-btn {
            background: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid #475569;
            padding: 1.1rem 1.25rem;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            line-height: 1.4;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn:hover:not(:disabled), .option-btn:active:not(:disabled) {
            border-color: var(--accent);
            background: #1e293b;
        }

        .option-btn.correct {
            background: var(--success) !important;
            border-color: var(--success) !important;
            color: white !important;
            font-weight: 600;
        }

        .option-btn.wrong {
            background: var(--error) !important;
            border-color: var(--error) !important;
            color: white !important;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 1rem 0.75rem;
            }
            
            header h1 {
                font-size: 1.75rem;
            }

            .alphabet-grid {
                grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
                gap: 0.4rem;
            }

            .letter-card {
                font-size: 1.4rem;
            }

            .modal {
                padding: 3rem 1.25rem 1.5rem 1.25rem;
                width: 95%;
            }

            .modal-char {
                font-size: 3.5rem;
            }
            
            .modal-number {
                top: 1rem;
                left: 1rem;
            }
            
            .close-btn {
                top: 0.5rem;
                right: 0.5rem;
            }

            .quiz-container {
                padding: 1.5rem 1rem;
            }

            .quiz-target {
                font-size: 3rem;
                padding: 0.5rem 1.5rem;
            }

            .option-btn {
                padding: 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Modern Latin Alphabet</h1>
        <p>Interactive catalog and quiz training tool for the 65 basic Latin letters and common regional extensions.</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('explore')">Explore</button>
        <button class="tab-btn" onclick="switchTab('quiz')">Quiz Game</button>
    </div>

    <div id="explore-panel" class="view-panel active">
        <div class="alphabet-grid" id="grid-container"></div>
    </div>

    <div id="quiz-panel" class="view-panel">
        <div class="quiz-container">
            <div class="quiz-score">Score: <span id="score-counter">0</span> Points</div>
            <div class="quiz-prompt">Examine the character below. Identify its corresponding classification:</div>
            <div class="quiz-target" id="quiz-letter">-</div>
            <div class="options-grid" id="quiz-options"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-number" id="modal-number"></div>
            <button class="close-btn" onclick="closeModal()" aria-label="Close">✕</button>
            <div class="modal-char" id="modal-char">-</div>
            <div class="modal-title" id="modal-title">-</div>
            <div class="modal-desc" id="modal-desc">-</div>
            <div class="modal-example" id="modal-example">-</div>
            <div class="modal-anglicized" id="modal-anglicized">-</div>
        </div>
    </div>

    <script>
        const alphabetData = [
            { char: 'A', type: 'Base Letter', desc: 'The basic foundational Latin character used globally.', example: 'Apple, Art', anglicized: 'A' },
            { char: 'Á', type: 'A with Acute', desc: 'Marks vowel length or high tone across Spanish, Czech, Irish, Hungarian, and Vietnamese.', example: 'Rápido (Spanish), Mám (Czech)', anglicized: 'A' },
            { char: 'À', type: 'A with Grave', desc: 'Used in French, Italian, and Vietnamese to indicate emphasis, pronunciation shifts, or tone levels.', example: 'Voilà (French), Città (Italian)', anglicized: 'A' },
            { char: 'Â', type: 'A with Circumflex', desc: 'Indicates historical phonetic changes or alters vowel sounds entirely in French, Romanian, and Portuguese.', example: 'Château (French), Você (Portuguese)', anglicized: 'A' },
            { char: 'Ä', type: 'A with Umlaut', desc: 'Shifts vowel articulation deeper forward in the mouth in languages like German, Swedish, and Finnish.', example: 'Mädchen (German), Björn (Swedish)', anglicized: 'A (or AE)' },
            { char: 'Ã', type: 'A with Tilde', desc: 'Indicates specialized nasalized vowel pronunciations standard in Portuguese and Vietnamese.', example: 'São Paulo (Portuguese), Pão (Portuguese)', anglicized: 'A' },
            { char: 'Å', type: 'A with Ring Above', desc: 'Represents a specific rounded "O" sound in Nordic writing scripts like Swedish, Norwegian, and Danish.', example: 'Smörgåsbord (Swedish)', anglicized: 'A (or AA)' },
            { char: 'Æ', type: 'A-E Ligature', desc: 'A fusion letter blending structural elements of A and E together into single phonetics in Nordic languages.', example: 'Encyclopædia (English), Færøerne (Danish)', anglicized: 'AE' },
            { char: 'B', type: 'Base Letter', desc: 'The standard Latin bilabial stop consonant foundation used globally.', example: 'Banana, Book', anglicized: 'B' },
            { char: 'C', type: 'Base Letter', desc: 'The fundamental third character configuration of the global standard core.', example: 'Cat, City', anglicized: 'C' },
            { char: 'Ć', type: 'C with Acute', desc: 'Represents a specialized soft, palatalized sound profile inside Polish and Serbo-Croatian formats.', example: 'Cześć (Polish)', anglicized: 'C' },
            { char: 'Ç', type: 'C with Cedilla', desc: 'Changes hard structural "K" sounds into sibilant "S" or "Ch" outputs in French, Turkish, and Portuguese.', example: 'Façade (French), Curaçao (Portuguese)', anglicized: 'C' },
            { char: 'D', type: 'Base Letter', desc: 'The base dynamic character platform for standard dental stop consonant processing.', example: 'Dog, Door', anglicized: 'D' },
            { char: 'Ð', type: 'Eth', desc: 'Represents the soft voiced "th" phonetic component native to Icelandic and old Anglo-Saxon texts.', example: 'Niður (Icelandic)', anglicized: 'D (or DH)' },
            { char: 'E', type: 'Base Letter', desc: 'The fifth core component of the global standard Latin structural system.', example: 'Elephant, Energy', anglicized: 'E' },
            { char: 'É', type: 'E with Acute', desc: 'Dictates sharp vocal targeting or precise vowel styling profiles throughout European text bases.', example: 'Café (French), Él (Spanish)', anglicized: 'E' },
            { char: 'È', type: 'E with Grave', desc: 'Sets explicit pitch rules or alternative open vowel targets inside Italian and French syntax formats.', example: 'Père (French), Caffè (Italian)', anglicized: 'E' },
            { char: 'Ê', type: 'E with Circumflex', desc: 'Adjusts vowel depth values across Western European systems and Vietnamese phonetic definitions.', example: 'Fête (French), Crêpe (French)', anglicized: 'E' },
            { char: 'Ë', type: 'E with Diaeresis', desc: 'Forces separation from surrounding vowels or forms custom open profiles in French, Dutch, and Albanian.', example: 'Naïve (French), Citroën (Dutch/French)', anglicized: 'E' },
            { char: 'F', type: 'Base Letter', desc: 'The global standard configuration for voiceless labiodental fricative mechanics.', example: 'Fish, Fire', anglicized: 'F' },
            { char: 'G', type: 'Base Letter', desc: 'The foundational standard Latin platform for voiced velar stop sound production.', example: 'Guitar, Globe', anglicized: 'G' },
            { char: 'H', type: 'Base Letter', desc: 'The global standard character tracking foundation for standard glottal transition sounds.', example: 'House, Heart', anglicized: 'H' },
            { char: 'I', type: 'Base Letter', desc: 'The traditional standard Latin foundation for high front vowel tracking structures.', example: 'Ice, Iron', anglicized: 'I' },
            { char: 'Í', type: 'I with Acute', desc: 'Represents an elongated or stressed high front vowel in languages like Spanish, Icelandic, and Hungarian.', example: 'Día (Spanish), Ísland (Icelandic)', anglicized: 'I' },
            { char: 'Ì', type: 'I with Grave', desc: 'Marks a stressed open or short "i" sound, commonly found in Italian and Scottish Gaelic.', example: 'Sì (Italian)', anglicized: 'I' },
            { char: 'Î', type: 'I with Circumflex', desc: 'Indicates historical dropped consonants or altered sounds in French, Romanian, and Welsh.', example: 'Île (French)', anglicized: 'I' },
            { char: 'Ï', type: 'I with Diaeresis', desc: 'Indicates that the vowel should be pronounced separately from adjacent vowels in French and Dutch.', example: 'Moïse (French), Aïda (Italian)', anglicized: 'I' },
            { char: 'J', type: 'Base Letter', desc: 'The standard Latin character path handling palatal semivowel tracking operations.', example: 'Jump, Joy', anglicized: 'J' },
            { char: 'K', type: 'Base Letter', desc: 'The universal base line framework for voiceless velar stop sound execution.', example: 'Kite, King', anglicized: 'K' },
            { char: 'L', type: 'Base Letter', desc: 'The universal foundational platform handling standard lateral liquid sounds.', example: 'Lion, Light', anglicized: 'L' },
            { char: 'Ł', type: 'L with Stroke', desc: 'Transforms traditional sounds into a "w" style glided sound profile unique to standard Polish text formats.', example: 'Złoty (Polish)', anglicized: 'L' },
            { char: 'M', type: 'Base Letter', desc: 'The baseline universal profile mapping standard bilabial nasal sound operations.', example: 'Moon, Music', anglicized: 'M' },
            { char: 'N', type: 'Base Letter', desc: 'The foundational global standard processing format for alveolar nasal mechanics.', example: 'Night, Nature', anglicized: 'N' },
            { char: 'Ń', type: 'N with Acute', desc: 'Specifies soft palatalized configurations across Polish linguistic groups.', example: 'Koń (Polish)', anglicized: 'N' },
            { char: 'Ñ', type: 'N with Tilde', desc: 'The official independent 27th letter configuration defining Spanish phonetics worldwide.', example: 'Jalapeño (Spanish), Piñata (Spanish)', anglicized: 'N' },
            { char: 'O', type: 'Base Letter', desc: 'The core baseline structural character profile for mid-back rounded vowels.', example: 'Ocean, Orange', anglicized: 'O' },
            { char: 'Ó', type: 'O with Acute', desc: 'Indicates stress or long vowel status in languages like Spanish, Polish, and Hungarian.', example: 'Adiós (Spanish), Kraków (Polish)', anglicized: 'O' },
            { char: 'Ò', type: 'O with Grave', desc: 'Marks open vowel pronunciations or specific word stresses inside Italian and Catalan.', example: 'Però (Italian)', anglicized: 'O' },
            { char: 'Ô', type: 'O with Circumflex', desc: 'Used in French and Portuguese to denote closed vowel sounds or historical linguistic shifts.', example: 'Hôtel (French)', anglicized: 'O' },
            { char: 'Ö', type: 'O with Umlaut', desc: 'Shifts standard vowels into forward positions across Germanic, Turkish, and Azerbaijani alphabets.', example: 'Schön (German), Göteborg (Swedish)', anglicized: 'O (or OE)' },
            { char: 'Õ', type: 'O with Tilde', desc: 'Represents distinct nasalized back vowels native to Portuguese and Estonian alphabets.', example: 'Corações (Portuguese)', anglicized: 'O' },
            { char: 'Ø', type: 'O with Stroke', desc: 'An independent letter indicating distinct vowel structures within Nordic and Danish language sheets.', example: 'København (Danish)', anglicized: 'O (or OE)' },
            { char: 'Œ', type: 'O-E Ligature', desc: 'Traditional structural character configuration fusing two vowels across historical and modern French texts.', example: 'Cœur (French)', anglicized: 'OE' },
            { char: 'P', type: 'Base Letter', desc: 'The universal Latin starting platform for basic voiceless bilabial stops.', example: 'Piano, Planet', anglicized: 'P' },
            { char: 'Q', type: 'Base Letter', desc: 'The standard core character used dynamically for structural sounds, representing a hard "G" or click in variations like Azerbaijani.', example: 'Queen, Quiet', anglicized: 'Q' },
            { char: 'R', type: 'Base Letter', desc: 'The structural anchor letter managing liquid rhotic sounds across international text.', example: 'River, Rose', anglicized: 'R' },
            { char: 'S', type: 'Base Letter', desc: 'The universal baseline character profile managing standard sibilant voiceless sound ranges.', example: 'Sun, Star', anglicized: 'S' },
            { char: 'Ś', type: 'S with Acute', desc: 'Generates a soft, palatalized voiceless sibilant native to Polish orthography.', example: 'Świat (Polish)', anglicized: 'S' },
            { char: 'Ş', type: 'S with Cedilla', desc: 'Transforms standard shapes into "Sh" sound systems inside Turkish and Azerbaijani scripts.', example: 'Teşekkür (Turkish)', anglicized: 'S' },
            { char: 'ß', type: 'Eszett / Sharp S', desc: 'A special ligature blending historical forms into a high sibilant configuration unique to German.', example: 'Straße (German)', anglicized: 'SS' },
            { char: 'T', type: 'Base Letter', desc: 'The baseline universal character target for regular voiceless alveolar stops.', example: 'Tree, Time', anglicized: 'T' },
            { char: 'Þ', type: 'Thorn', desc: 'A structural heritage letter representing unvoiced "th" mechanics inside modern Icelandic scripts.', example: 'Þingvellir (Icelandic)', anglicized: 'TH' },
            { char: 'U', type: 'Base Letter', desc: 'The standard Latin character foundation representing high back rounded vowel sets.', example: 'Universe, Umbrella', anglicized: 'U' },
            { char: 'Ú', type: 'U with Acute', desc: 'Denotes extended length or primary stress on the vowel across Spanish, Hungarian, and Icelandic.', example: 'Música (Spanish)', anglicized: 'U' },
            { char: 'Ù', type: 'U with Grave', desc: 'Primarily used to distinguish homophones or mark stress patterns in French and Italian.', example: 'Où (French)', anglicized: 'U' },
            { char: 'Û', type: 'U with Circumflex', desc: 'Adjusts vowel pronunciation and historical markers in languages like French and Welsh.', example: 'Août (French)', anglicized: 'U' },
            { char: 'Ü', type: 'U with Umlaut', desc: 'Shifts base sounds to high front values inside German, Spanish, French, Turkish, and Azerbaijani.', example: 'München (German)', anglicized: 'U (or UE)' },
            { char: 'V', type: 'Base Letter', desc: 'The global benchmark profile tracking voiced labiodental fricative behaviors.', example: 'Voice, Valley', anglicized: 'V' },
            { char: 'W', type: 'Base Letter', desc: 'The core architectural character form standard for labio-velar approximant handling.', example: 'Water, Wind', anglicized: 'W' },
            { char: 'X', type: 'Base Letter', desc: 'The traditional standard Latin variable anchor representing voiceless velar fricatives or a raspy "H" in Azerbaijani.', example: 'Xylophone, Xenon', anglicized: 'X' },
            { char: 'Y', type: 'Base Letter', desc: 'The foundational placeholder tracking front vowels and closing semivowel adjustments.', example: 'Yellow, Youth', anglicized: 'Y' },
            { char: 'Ý', type: 'Y with Acute', desc: 'Marks long vowel shifts or stress components primarily inside Icelandic and Turkmen.', example: 'Ýmsir (Icelandic)', anglicized: 'Y' },
            { char: 'Ÿ', type: 'Y with Diaeresis', desc: 'Used to signify separate pronunciation of the vowel in specialized French and archaic texts.', example: 'L’Haÿ-les-Roses (French)', anglicized: 'Y' },
            { char: 'Z', type: 'Base Letter', desc: 'The ultimate base character platform capturing global voiced alveolar sibilance profiles.', example: 'Zebra, Zero', anglicized: 'Z' },
            { char: 'Ź', type: 'Z with Acute', desc: 'Represents a voiced alveolo-palatal fricative unique to standard Polish phonetics.', example: 'Źródło (Polish)', anglicized: 'Z' }
        ];

        let score = 0;
        let currentQuestion = null;

        function initGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            alphabetData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'letter-card';
                card.innerText = item.char;
                card.onclick = () => showExplanation(item, index + 1, alphabetData.length);
                container.appendChild(card);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
            
            if (event && event.target) {
                event.target.classList.add('active');
            }
            
            document.getElementById(`${tabName}-panel`).classList.add('active');
            
            if (tabName === 'quiz') {
                generateQuizQuestion();
            }
        }

        function showExplanation(item, currentIndex, totalCount) {
            document.getElementById('modal-number').innerText = `#${currentIndex} of ${totalCount}`;
            document.getElementById('modal-char').innerText = item.char;
            document.getElementById('modal-title').innerText = item.type;
            document.getElementById('modal-desc').innerText = item.desc;
            document.getElementById('modal-example').innerText = "Example: " + item.example;
            document.getElementById('modal-anglicized').innerText = "Anglicized: " + item.anglicized;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        function generateQuizQuestion() {
            const correctItem = alphabetData[Math.floor(Math.random() * alphabetData.length)];
            currentQuestion = correctItem;
            document.getElementById('quiz-letter').innerText = correctItem.char;
            
            let options = [correctItem];
            while (options.length < 4) {
                const randItem = alphabetData[Math.floor(Math.random() * alphabetData.length)];
                if (!options.some(opt => opt.type === randItem.type)) {
                    options.push(randItem);
                }
            }
            
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerText = opt.type + " — (" + opt.desc + ")";
                button.onclick = () => handleAnswerSubmit(button, opt);
                optionsContainer.appendChild(button);
            });
        }

        function handleAnswerSubmit(selectedButton, selectedOption) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            if (selectedOption.type === currentQuestion.type) {
                selectedButton.classList.add('correct');
                score += 10;
                document.getElementById('score-counter').innerText = score;
            } else {
                selectedButton.classList.add('wrong');
                buttons.forEach(btn => {
                    if (btn.innerText.startsWith(currentQuestion.type)) {
                        btn.classList.add('correct');
                    }
                });
            }
            
            setTimeout(() => {
                generateQuizQuestion();
            }, 2000);
        }

        window.onload = initGrid;
    </script>
</body>
</html>
