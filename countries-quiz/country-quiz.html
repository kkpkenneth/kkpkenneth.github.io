<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Quiz - Level Progression</title>
    <style>
        :root {
            --success: #27ae60;
            --danger: #c0392b;
            --hint: #d35400;
            --btn-bg: rgba(200, 200, 200, 0.3);
            --btn-hover: rgba(200, 200, 200, 0.6);
            --text-color: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0e0e0 0%, #f5f7fa 50%, #c3cfe2 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 700px;
            padding: 40px 30px;
            text-align: center;
            overflow: hidden;
            min-height: 600px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        #start-screen {
            padding: 20px 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #start-screen h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: #2c3e50;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            letter-spacing: 1px;
        }
        #start-screen h2 {
            font-size: 1.4rem;
            font-weight: 300;
            margin-bottom: 40px;
            color: #556;
        }
        
        .primary-action-btn {
            background: #34495e;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 15px 50px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #2c3e50;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        .primary-action-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: #2c3e50;
        }
        .primary-action-btn:active {
            transform: translateY(1px);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            font-size: 1rem;
            font-weight: 600;
            color: #34495e;
        }

        .level-badge {
            background: #e67e22;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h2#question-text {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: #2c3e50;
        }

        .flag-container {
            width: 100%;
            aspect-ratio: 16 / 9; 
            background-color: rgba(0, 0, 0, 0.05);
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .flag-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .btn {
            background-color: #34495e; 
            color: #ffffff; 
            border: 1px solid #2c3e50;
            padding: 15px 15px;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .btn .en-text {
            font-weight: bold;
        }
        .btn .zh-text {
            font-size: 0.9em;
            font-weight: normal;
        }
        .btn:hover:not(:disabled) {
            background-color: #2c3e50;
            border-color: #1a252f;
        }
        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }
        .btn.correct { 
            background-color: var(--success) !important; 
            color: white !important;
            border-color: var(--success) !important;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.3);
        }
        .btn.wrong { 
            background-color: var(--danger) !important; 
            color: white !important;
            border-color: var(--danger) !important;
        }
        
        #quiz-screen, #result-screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        
        .fact-box {
            background: rgba(230, 230, 230, 0.5);
            border-left: 5px solid var(--hint);
            padding: 18px;
            margin: 20px 0;
            text-align: left;
            border-radius: 0 8px 8px 0;
            display: block; 
            font-size: 1rem;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: #34495e;
            width: 100%;
            box-sizing: border-box;
        }
        .fact-box h3 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 8px;
            color: #2c3e50;
        }
        .fact-item {
            margin-bottom: 10px;
        }
        .fact-item strong {
            color: #e67e22;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
        }
        
        #next-btn-container {
            display: none;
            margin-top: 15px;
            margin-bottom: 10px;
            width: 100%;
        }

        @media (max-width: 600px) {
            body { padding: 10px 0; align-items: center; }
            .container { width: 95%; padding: 25px 15px; min-height: 85vh; justify-content: center; align-items: center; }
            #start-screen h1, #result-screen h1 { font-size: 2.2rem; }
            #start-screen h2, #result-screen h2 { font-size: 1.1rem; }
            h2#question-text { font-size: 1.3rem; margin-bottom: 15px; }
            .flag-container { aspect-ratio: 1 / 1; margin-bottom: 15px; }
            .options-grid { grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }
            .btn { padding: 10px 10px; font-size: 1rem; }
            .fact-box { font-size: 0.9rem; padding: 12px; margin: 10px 0; }
            .primary-action-btn { padding: 12px 30px; font-size: 1.1rem; }
        }
    </style>
</head>

<audio id="bg-music" src="global-fusion.mp3" loop></audio>

<div class="container">

    <div id="quiz-screen">

            <div class="fact-item" id="fact-nickname"></div>
            <div class="fact-item" id="fact-most"></div>
        </div>
        
        <div id="options-container" class="options-grid"></div>

        <div id="next-btn-container">

        </div>
    </div>

    <div id="result-screen">

</div>

    const parsedData = rawData.split('\n').filter(line => line.trim() !== '').map(line => {
        const parts = line.split('|');
        const enName = parts[2];
        const level = levelMapping[enName] || 4; 
        
        return {
            id: parts[0],
            image: parts[1],
            enName: enName,
            zhName: parts[3],
            desc: parts[4],
            nickname: parts[5],
            facts: parts[6],
            level: level
        };
    });

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function startBackgroundMusic() {
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.2; 
        bgMusic.play().catch(error => {
            console.log("Autoplay prevented by browser:", error);
        });
    }

    function startQuiz() {
        initAudio();
        startBackgroundMusic();
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'flex';
        
        currentLevel = 1;
        startLevel(currentLevel);
    }

    function startLevel(levelNum) {
        currentLevelQuestions = parsedData.filter(d => d.level === levelNum);
        currentLevelQuestions = currentLevelQuestions.sort(() => 0.5 - Math.random()); 
        
        if(currentLevelQuestions.length === 0 && levelNum <= maxLevel) {
            currentLevel++;
            startLevel(currentLevel);
            return;
        }

        score = 0;
        currentQuestionIndex = 0;
        
        document.getElementById('level-display').textContent = `Level ${levelNum}`;
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= currentLevelQuestions.length) {
            showLevelResults();
            return;
        }

        const question = currentLevelQuestions[currentQuestionIndex];
        
        document.getElementById('score-display').textContent = `Score: ${score}`;
        document.getElementById('question-count').textContent = `Q: ${currentQuestionIndex + 1}/${currentLevelQuestions.length}`;
        
        // Direct relative path so images in the same directory load properly
        document.getElementById('flag-img').src = question.image; 
        
        document.getElementById('next-btn-container').style.display = 'none';
        document.getElementById('fact-box').style.display = 'block';
        
        document.getElementById('fact-geo').innerHTML = `<strong>Geography:</strong> ${question.desc}`;
        document.getElementById('fact-nickname').innerHTML = `<strong>Nickname:</strong> ${question.nickname}`;
        document.getElementById('fact-most').innerHTML = `<strong>Facts:</strong><br>${question.facts}`;

        generateOptions(question);
    }

    function generateOptions(correctData) {
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        let allOtherOptions = parsedData.filter(d => d.enName !== correctData.enName);
        allOtherOptions = allOtherOptions.filter((d, index, self) => 
            index === self.findIndex((t) => t.enName === d.enName)
        );
        allOtherOptions = allOtherOptions.sort(() => 0.5 - Math.random());

        let options = [correctData, allOtherOptions[0], allOtherOptions[1], allOtherOptions[2]];
        options = options.sort(() => 0.5 - Math.random()); 

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            
            btn.innerHTML = `<span class="en-text">${opt.enName}</span><span class="zh-text">${opt.zhName}</span>`;
            
            btn.onclick = () => checkAnswer(opt.enName === correctData.enName, btn, correctData);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(isCorrect, btnElement, correctData) {
        const allBtns = document.querySelectorAll('.options-grid .btn');
        allBtns.forEach(b => b.disabled = true); 

        if (isCorrect) {
            btnElement.classList.add('correct');
            playSound('correct');
            score++;
            document.getElementById('score-display').textContent = `Score: ${score}`;
        } else {
            btnElement.classList.add('wrong');
            playSound('wrong');
            allBtns.forEach(b => {
                if (b.querySelector('.en-text').textContent === correctData.enName) {
                    b.classList.add('correct');
                }
            });
        }

        speakAnswer(correctData.enName, correctData.zhName);
        document.getElementById('next-btn-container').style.display = 'block';
    }

    function loadNextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function showLevelResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';
        
        document.getElementById('final-score-text').textContent = `You scored ${score} out of ${currentLevelQuestions.length} in Level ${currentLevel}`;
        
        const actionBtn = document.getElementById('result-action-btn');
        
        if (currentLevel < maxLevel) {
            document.getElementById('result-title').textContent = `Level ${currentLevel} Complete!`;
            actionBtn.textContent = `Start Level ${currentLevel + 1}`;
            actionBtn.onclick = () => {
                document.getElementById('result-screen').style.display = 'none';
                document.getElementById('quiz-screen').style.display = 'flex';
                currentLevel++;
                startLevel(currentLevel);
            };
        } else {
            document.getElementById('result-title').textContent = "Game Complete!";
            actionBtn.textContent = "Back to Start";
            actionBtn.onclick = () => {
                document.getElementById('result-screen').style.display = 'none';
                document.getElementById('start-screen').style.display = 'flex';
            };
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'start') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'correct') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

    function speakAnswer(enText, zhText) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utteranceEn = new SpeechSynthesisUtterance(enText);
            utteranceEn.lang = 'en-US';
            utteranceEn.rate = 1.0;
            const utteranceZh = new SpeechSynthesisUtterance(zhText);
            utteranceZh.lang = 'zh-HK'; 
            utteranceZh.rate = 1.0;
            window.speechSynthesis.speak(utteranceEn);
            window.speechSynthesis.speak(utteranceZh);
        }
    }
</script>
