<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Master Quiz</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .panel {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .title-large {
            font-size: 2.8rem;
            color: #0984e3;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #636e72;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Selection Grid Styles */
        .grid-2col {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: 1fr; /* Forces all rows to be the exact same height */
            gap: 12px;
            margin-top: 20px;
        }

        .btn-select {
            background-color: #74b9ff;
            color: white;
            font-size: 1.1rem;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            height: 100%; /* Take full height of the grid cell */
            display: flex;
            flex-direction: column; /* Stack contents vertically */
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            margin: 0;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-select:hover {
            background-color: #0984e3;
        }
        
        .btn-select:active {
            transform: scale(0.98);
        }

        .op-symbol {
            font-size: 2rem;
            margin-top: 5px;
            line-height: 1;
        }

        /* Quiz Screen Styles */
        .score-board {
            font-size: 1.2rem;
            color: #636e72;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .question-area {
            font-size: 3rem;
            font-weight: bold;
            color: #0984e3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        input[type="number"] {
            font-size: 2.5rem;
            width: 100px;
            text-align: center;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            outline: none;
            color: #2d3436;
            transition: border-color 0.2s;
            /* Hide arrows in input */
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: #74b9ff;
        }

        button {
            font-size: 1.1rem;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
            margin: 5px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #0984e3;
            color: white;
            width: 100%;
            margin: 0 0 15px 0;
            padding: 15px;
            font-size: 1.3rem;
        }

        .btn-primary:hover {
            background-color: #076bbb;
        }

        .btn-next {
            background-color: #00b894;
            color: white;
            width: 100%;
            margin: 0 0 15px 0;
            display: none;
            padding: 15px;
            font-size: 1.3rem;
        }

        .btn-next:hover {
            background-color: #009678;
        }

        .btn-reset, .btn-menu {
            background-color: #dfe6e9;
            color: #2d3436;
            font-size: 0.9rem;
            padding: 8px 16px;
            flex: 1;
            margin: 0;
        }

        .btn-reset:hover, .btn-menu:hover {
            background-color: #b2bec3;
        }

        .feedback {
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
            margin-bottom: 20px;
        }

        .correct { color: #00b894; }
        .incorrect { color: #d63031; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div class="panel" id="start-screen">
        <h1 class="title-large">Math Master</h1>
        <p class="subtitle">Sharpen your math skills!</p>
        <button class="btn-primary" id="begin-btn">PLAY NOW</button>
    </div>

    <!-- Mode Selection Screen -->
    <div class="panel hidden" id="mode-screen">
        <h1>Select a Mode</h1>
        <p style="color: #636e72; margin-top: -10px;">Choose an operation</p>
        <div class="grid-2col">
            <button class="btn-select" onclick="selectMode('add')">
                <span>Addition</span>
                <span class="op-symbol">+</span>
            </button>
            <button class="btn-select" onclick="selectMode('sub')">
                <span>Subtraction</span>
                <span class="op-symbol">&minus;</span>
            </button>
            <button class="btn-select" onclick="selectMode('mul')">
                <span>Multiplication</span>
                <span class="op-symbol">&times;</span>
            </button>
            <button class="btn-select" onclick="selectMode('div')">
                <span>Division</span>
                <span class="op-symbol">&divide;</span>
            </button>
        </div>
        <button class="btn-menu" id="mode-back-btn" style="width: 100%; margin-top: 20px; box-sizing: border-box;">Back to Title</button>
    </div>

    <!-- Level Selection Screen -->
    <div class="panel hidden" id="level-screen">
        <h1 id="level-title">Select a Level</h1>
        <p style="color: #636e72; margin-top: -10px;">Choose a number family</p>
        <div class="grid-2col" id="level-grid">
            <!-- Buttons Level 1-10 will be generated here by JS -->
        </div>
        <button class="btn-menu" id="level-back-btn" style="width: 100%; margin-top: 20px; box-sizing: border-box;">Back to Modes</button>
    </div>

    <!-- Quiz Screen -->
    <div class="panel hidden" id="quiz-screen">
        <h1 id="quiz-title">Quiz</h1>
        <div class="score-board" id="score-board">Score: 0 / 0</div>
        
        <div class="question-area">
            <span id="num1">0</span> <span id="operator">&times;</span> <span id="num2">0</span> = 
            <input type="number" id="answer" autocomplete="off">
        </div>

        <div class="feedback" id="feedback"></div>

        <button class="btn-primary" id="submit-btn">Submit Answer</button>
        <button class="btn-next" id="next-btn">Next Question</button>
        
        <div style="display: flex; justify-content: space-between; gap: 10px; margin-top: 10px;">
            <button class="btn-menu" id="menu-btn">Levels</button>
            <button class="btn-reset" id="reset-btn">Reset</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const modeScreen = document.getElementById('mode-screen');
        const levelScreen = document.getElementById('level-screen');
        const quizScreen = document.getElementById('quiz-screen');
        
        const levelGrid = document.getElementById('level-grid');
        const levelTitle = document.getElementById('level-title');
        const quizTitle = document.getElementById('quiz-title');
        
        const beginBtn = document.getElementById('begin-btn');
        const modeBackBtn = document.getElementById('mode-back-btn');
        const levelBackBtn = document.getElementById('level-back-btn');
        
        const num1El = document.getElementById('num1');
        const operatorEl = document.getElementById('operator');
        const num2El = document.getElementById('num2');
        const answerInput = document.getElementById('answer');
        
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const resetBtn = document.getElementById('reset-btn');
        const menuBtn = document.getElementById('menu-btn');
        const feedbackEl = document.getElementById('feedback');
        const scoreBoardEl = document.getElementById('score-board');

        // Game State Variables
        let currentMode = 'mul'; // 'add', 'sub', 'mul', 'div'
        let currentLevel = 1;
        let currentNum1 = 0;
        let currentNum2 = 0;
        let currentAnswer = 0;
        let score = 0;
        let totalQuestions = 0;
        let isQuestionActive = true;

        // Initialize the Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Generate Level Selection Buttons
        for (let i = 1; i <= 10; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-select';
            btn.textContent = `Level ${i}`;
            btn.onclick = () => startLevel(i);
            levelGrid.appendChild(btn);
        }

        // Navigation Functions
        beginBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            startScreen.classList.add('hidden');
            modeScreen.classList.remove('hidden');
        });

        modeBackBtn.addEventListener('click', () => {
            modeScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });

        levelBackBtn.addEventListener('click', () => {
            levelScreen.classList.add('hidden');
            modeScreen.classList.remove('hidden');
        });

        menuBtn.addEventListener('click', () => {
            quizScreen.classList.add('hidden');
            levelScreen.classList.remove('hidden');
        });

        function selectMode(mode) {
            currentMode = mode;
            
            const modeNames = {
                'add': 'Addition',
                'sub': 'Subtraction',
                'mul': 'Multiplication',
                'div': 'Division'
            };
            
            levelTitle.textContent = `${modeNames[mode]} Levels`;
            modeScreen.classList.add('hidden');
            levelScreen.classList.remove('hidden');
        }

        function startLevel(level) {
            currentLevel = level;
            
            const modeNames = {
                'add': 'Addition',
                'sub': 'Subtraction',
                'mul': 'Multiplication',
                'div': 'Division'
            };

            quizTitle.textContent = `${modeNames[currentMode]} - Level ${level}`;
            levelScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            
            if (audioCtx.state === 'suspended') audioCtx.resume();
            resetQuiz();
        }

        // Sound Generator Function
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1); 
                
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);

            } else if (type === 'incorrect') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime); 
                
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.4);
            }
        }

        // Generate a random number between 1 and 10
        function getRandomNumber() {
            return Math.floor(Math.random() * 10) + 1;
        }

        // Initialize a new question based on Mode and Level
        function generateQuestion() {
            let randomNum = getRandomNumber();
            let isSwap = Math.random() > 0.5;
            
            if (currentMode === 'add') {
                currentNum1 = isSwap ? currentLevel : randomNum;
                currentNum2 = isSwap ? randomNum : currentLevel;
                currentAnswer = currentNum1 + currentNum2;
                operatorEl.innerHTML = '+';

            } else if (currentMode === 'sub') {
                // To avoid negative numbers: total = level + random. Question is total - part
                let total = currentLevel + randomNum;
                currentNum1 = total;
                currentNum2 = isSwap ? currentLevel : randomNum;
                currentAnswer = currentNum1 - currentNum2;
                operatorEl.innerHTML = '&minus;';

            } else if (currentMode === 'mul') {
                currentNum1 = isSwap ? currentLevel : randomNum;
                currentNum2 = isSwap ? randomNum : currentLevel;
                currentAnswer = currentNum1 * currentNum2;
                operatorEl.innerHTML = '&times;';

            } else if (currentMode === 'div') {
                // To avoid decimals: product = level * random. Question is product / part
                let product = currentLevel * randomNum;
                currentNum1 = product;
                currentNum2 = isSwap ? currentLevel : randomNum;
                currentAnswer = currentNum1 / currentNum2;
                operatorEl.innerHTML = '&divide;';
            }
            
            num1El.textContent = currentNum1;
            num2El.textContent = currentNum2;
            
            answerInput.value = '';
            answerInput.disabled = false;
            answerInput.focus();
            
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            
            submitBtn.style.display = 'block';
            nextBtn.style.display = 'none';
            
            isQuestionActive = true;
        }

        // Check the user's answer
        function checkAnswer() {
            if (!isQuestionActive || answerInput.value.trim() === '') return;

            if (audioCtx.state === 'suspended') audioCtx.resume();

            const userAnswer = parseInt(answerInput.value, 10);
            
            totalQuestions++;
            isQuestionActive = false;
            answerInput.disabled = true;

            const opText = currentMode === 'add' ? '+' : currentMode === 'sub' ? '-' : currentMode === 'mul' ? '×' : '÷';

            if (userAnswer === currentAnswer) {
                score++;
                feedbackEl.textContent = 'Correct! 🎉';
                feedbackEl.className = 'feedback correct';
                playSound('correct'); 
            } else {
                feedbackEl.textContent = `Incorrect. ${currentNum1} ${opText} ${currentNum2} = ${currentAnswer}`;
                feedbackEl.className = 'feedback incorrect';
                playSound('incorrect'); 
            }

            // Update Scoreboard
            scoreBoardEl.textContent = `Score: ${score} / ${totalQuestions}`;

            // Toggle Buttons
            submitBtn.style.display = 'none';
            nextBtn.style.display = 'block';
            nextBtn.focus();
        }

        // Reset the active quiz
        function resetQuiz() {
            score = 0;
            totalQuestions = 0;
            scoreBoardEl.textContent = `Score: 0 / 0`;
            generateQuestion();
        }

        // Event Listeners
        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', generateQuestion);
        resetBtn.addEventListener('click', resetQuiz);

        // Allow pressing "Enter" to submit or go to next question
        document.addEventListener('keydown', (e) => {
            // Only capture Enter key if the quiz screen is active
            if (e.key === 'Enter' && !quizScreen.classList.contains('hidden')) {
                if (isQuestionActive) {
                    checkAnswer();
                } else {
                    generateQuestion();
                }
            }
        });
    </script>

</body>
</html>
