<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjective Upgrader</title>
    <style>
        :root { --bg: #f4f7f6; --primary: #3498db; --success: #2ecc71; --error: #e74c3c; }
        
        /* Updated Body for Centering */
        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; /* Vertical Center */
            min-height: 100vh;   /* Full viewport height */
            margin: 0; 
            padding: 20px;
        }

        .container { 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        
        .word-box { font-size: 2rem; font-weight: bold; margin: 20px 0; color: #2c3e50; cursor: pointer; padding: 10px; border-bottom: 2px dashed #ccc; }
        button { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #eee; border-radius: 8px; cursor: pointer; background: #f8f9fa; font-size: 1.1rem; }
        .correct { background: #d4edda !important; border-color: var(--success) !important; }
        .wrong { background: #f8d7da !important; border-color: var(--error) !important; }
    </style>
</head>
<body>

<div class="container">
    <p>Tap any word to hear it</p>
    <div id="word" class="word-box" onclick="speakWord(this.innerText)"></div>
    <div id="options"></div>
</div>

    { weak: "cold", strong: "frigid", bad: ["tepid", "warm", "balmy"] },
    { weak: "slow", strong: "languid", bad: ["rapid", "brisk", "hasty"] },
    { weak: "tough", strong: "resilient", bad: ["brittle", "weak", "soft"] },
    { weak: "soft", strong: "pliant", bad: ["rigid", "stiff", "firm"] },
    { weak: "brave", strong: "gallant", bad: ["meek", "fearful", "weak"] }
];

let currentIndex = 0;

function speakWord(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();
    const indianVoice = voices.find(v => v.lang.startsWith('en-IN')) || voices.find(v => v.name.includes('India'));
    
    if (indianVoice) {
        utterance.voice = indianVoice;
        utterance.lang = indianVoice.lang;
    } else {
        utterance.lang = 'en-IN';
    }
    window.speechSynthesis.speak(utterance);
}

function loadGame() {
    let q = challenges[currentIndex % challenges.length];
    document.getElementById('word').innerText = q.weak;
    
    const options = [q.strong, ...q.bad].sort(() => Math.random() - 0.5);
    const optDiv = document.getElementById('options');
    optDiv.innerHTML = '';
    
    options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => {
            speakWord(opt);
            check(opt === q.strong, btn);
        };
        optDiv.appendChild(btn);
    });
}

function check(isCorrect, btn) {
    if(isCorrect) {
        btn.classList.add('correct');
        setTimeout(() => { currentIndex++; loadGame(); }, 1000);
    } else {
        btn.classList.add('wrong');
    }
}

window.onload = () => {
    window.speechSynthesis.onvoiceschanged = loadGame;
    loadGame();
};
</script>

</html>
