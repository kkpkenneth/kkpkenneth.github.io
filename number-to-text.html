<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number Wordle Hangman (0-300)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121213;
            color: #ffffff;
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            touch-action: manipulation;
            user-select: none;
        }
        
        .board-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            max-width: 100%;
            padding: 1rem;
        }

        .grid-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #3a3a3c;
            transition: all 0.3s ease;
            background-color: #121213;
            border-radius: 0.25rem;
        }

        @media (min-width: 600px) {
            .grid-cell {
                width: 3.5rem;
                height: 3.5rem;
                font-size: 1.75rem;
            }
        }

        .correct {
            background-color: #538d4e !important;
            border-color: #538d4e !important;
            color: white;
        }

        .present {
            background-color: #b59f3b !important;
            border-color: #b59f3b !important;
            color: white;
        }
        
        .hyphen-cell {
            border: none !important;
            background-color: transparent !important;
            color: #ffffff;
        }

        .key {
            background-color: #818384;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            transition: background-color 0.2s, opacity 0.2s, color 0.2s;
        }
        
        .key:not(.wrong):active {
            transform: scale(0.95);
        }

        .key.correct { background-color: #538d4e; color: white; }
        
        /* New styling for wrong letters */
        .key.wrong { 
            background-color: #3a3a3c; 
            color: #787c7e; 
            cursor: default;
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            40% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .pop {
            animation: pop 0.1s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start pb-4">

    <!-- Header -->
    <header class="w-full flex flex-col items-center justify-center p-4 border-b border-gray-700">
        <div class="w-full max-w-2xl flex justify-between items-center mb-2 px-4">
            <h1 class="text-2xl font-bold tracking-wider">NUMDLE</h1>
            <div class="text-xl font-bold text-green-400">Score: <span id="score-display">0</span></div>
        </div>
        <div class="text-sm text-gray-400">Spell the number (0-300)</div>
        <div id="target-number" class="text-5xl font-extrabold text-blue-400 mt-1">?</div>
        <div class="flex items-center gap-4 mt-2">
            <div id="attempts-left" class="text-sm font-semibold text-orange-400">Mistakes Left: 5 / 5</div>
        </div>
    </header>

    <!-- Game Board -->
    <main class="flex items-center justify-center w-full max-w-4xl mt-6 mb-6">
        <div id="board" class="board-container">
            <!-- Dynamic Grid injected here -->
        </div>
    </main>

    <!-- Keyboard -->
    <div id="keyboard" class="w-full max-w-2xl px-2 flex flex-col gap-2">
        <!-- Keyboard rows injected by JS -->
    </div>

    <!-- Modals -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 border border-gray-600 rounded-lg p-8 max-w-sm w-full text-center shadow-2xl">
            <h2 id="modal-title" class="text-3xl font-bold mb-4"></h2>
            <p id="modal-message" class="text-lg mb-2"></p>
            <p id="modal-word" class="text-2xl font-bold text-blue-400 mb-2"></p>
            <p id="modal-score" class="text-xl text-green-400 font-bold mb-6"></p>
            <button id="play-again-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg w-full transition duration-200 cursor-pointer">
                Play Again (Enter)
            </button>
        </div>
    </div>

    <script>
        const units = ["ZERO", "ONE", "TWO", "THREE", "FOUR", "FIVE", "SIX", "SEVEN", "EIGHT", "NINE"];
        const teens = ["TEN", "ELEVEN", "TWELVE", "THIRTEEN", "FOURTEEN", "FIFTEEN", "SIXTEEN", "SEVENTEEN", "EIGHTEEN", "NINETEEN"];
        const tens = ["", "", "TWENTY", "THIRTY", "FORTY", "FIFTY", "SIXTY", "SEVENTY", "EIGHTY", "NINETY"];

        function getNumberWord(n) {
            if (n === 0) return "ZERO";

            function getBelowHundred(num) {
                if (num < 10) return units[num];
                if (num < 20) return teens[num - 10];
                let t = Math.floor(num / 10);
                let u = num % 10;
                return u === 0 ? tens[t] : tens[t] + "-" + units[u];
            }

            if (n < 100) {
                return getBelowHundred(n);
            }

            let h = Math.floor(n / 100);
            let rem = n % 100;
            let hundredsStr = units[h] + "-HUNDRED";

            if (rem === 0) return hundredsStr;
            return hundredsStr + "-" + getBelowHundred(rem);
        }

        let currentNum = 0;
        let targetWord = "";
        let revealedLetters = {}; 
        let mistakes = 0;
        const maxMistakes = 5;
        let score = 0;
        let gameOver = false;
        const keyboardState = {}; // Tracks 'correct' or 'wrong'

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, idx) => {
                        setTimeout(() => {
                            try {
                                const o = audioCtx.createOscillator();
                                const g = audioCtx.createGain();
                                o.connect(g);
                                g.connect(audioCtx.destination);
                                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                                g.gain.setValueAtTime(0.15, audioCtx.currentTime);
                                g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                                o.start(audioCtx.currentTime);
                                o.stop(audioCtx.currentTime + 0.25);
                            } catch (e) {}
                        }, idx * 100);
                    });
                }
            } catch (e) {
                console.error("Audio error", e);
            }
        }

        function initGame() {
            currentNum = Math.floor(Math.random() * 301);
            targetWord = getNumberWord(currentNum);
            revealedLetters = {};
            mistakes = 0;
            gameOver = false;
            Object.keys(keyboardState).forEach(k => delete keyboardState[k]);

            for (let i = 0; i < targetWord.length; i++) {
                if (targetWord[i] === '-') {
                    revealedLetters[i] = '-';
                }
            }

            document.getElementById('target-number').textContent = currentNum;
            document.getElementById('attempts-left').textContent = `Mistakes Left: ${maxMistakes - mistakes} / ${maxMistakes}`;
            document.getElementById('score-display').textContent = score;
            document.getElementById('modal').classList.add('hidden');

            renderBoard();
            renderKeyboard();
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            for (let i = 0; i < targetWord.length; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                
                if (targetWord[i] === '-') {
                    cell.classList.add('hyphen-cell');
                    cell.textContent = '-';
                } else if (revealedLetters[i]) {
                    cell.textContent = revealedLetters[i];
                    cell.classList.add('pop');
                    cell.classList.add('correct');
                }
                
                board.appendChild(cell);
            }
        }

        const keyboardRows = [
            ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
            ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
            ['Z', 'X', 'C', 'V', 'B', 'N', 'M']
        ];

        function renderKeyboard() {
            const kbContainer = document.getElementById('keyboard');
            kbContainer.innerHTML = '';

            keyboardRows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex justify-center gap-1 w-full my-1';
                row.forEach(key => {
                    const button = document.createElement('button');
                    button.textContent = key;
                    button.className = 'key h-12 w-8 sm:w-10 text-sm font-bold rounded';
                    
                    if (keyboardState[key]) {
                        button.classList.add(keyboardState[key]); // Adds 'correct' or 'wrong'
                    }

                    button.addEventListener('click', () => handleGuess(key));
                    rowDiv.appendChild(button);
                });
                kbContainer.appendChild(rowDiv);
            });
        }

        function handleGuess(letter) {
            // Prevent guessing if game is over or letter was already guessed
            if (gameOver || keyboardState[letter]) return;

            if (targetWord.includes(letter)) {
                playSound('correct');
                for (let i = 0; i < targetWord.length; i++) {
                    if (targetWord[i] === letter) {
                        revealedLetters[i] = letter;
                    }
                }
                keyboardState[letter] = 'correct';
                renderBoard();
                renderKeyboard();

                let isWon = true;
                for (let i = 0; i < targetWord.length; i++) {
                    if (targetWord[i] !== revealedLetters[i]) {
                        isWon = false;
                        break;
                    }
                }

                if (isWon) {
                    gameOver = true;
                    score += 10; 
                    document.getElementById('score-display').textContent = score;
                    playSound('win');
                    setTimeout(() => showEndModal(true), 400);
                }

            } else {
                playSound('wrong');
                mistakes++;
                keyboardState[letter] = 'wrong'; // Mark as wrong to darken the key
                
                document.getElementById('attempts-left').textContent = `Mistakes Left: ${maxMistakes - mistakes} / ${maxMistakes}`;
                
                const boardEl = document.getElementById('board');
                boardEl.classList.add('shake');
                setTimeout(() => boardEl.classList.remove('shake'), 400);

                renderKeyboard();

                if (mistakes >= maxMistakes) {
                    gameOver = true;
                    score = 0; 
                    document.getElementById('score-display').textContent = score;
                    
                    for (let i = 0; i < targetWord.length; i++) {
                        revealedLetters[i] = targetWord[i];
                    }
                    renderBoard();
                    setTimeout(() => showEndModal(false), 500);
                }
            }
        }

        function showEndModal(isWin) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');
            const wordDisplay = document.getElementById('modal-word');
            const scoreDisplay = document.getElementById('modal-score');

            if (isWin) {
                title.textContent = "Genius!";
                message.textContent = "You successfully spelled the number!";
                title.classList.remove('text-red-400');
                title.classList.add('text-green-400');
            } else {
                title.textContent = "Game Over";
                message.textContent = "Too many mistakes! The correct spelling was:";
                title.classList.remove('text-green-400');
                title.classList.add('text-red-400');
            }
            
            wordDisplay.textContent = `${currentNum} = ${targetWord}`;
            scoreDisplay.textContent = `Current Score: ${score}`;
            modal.classList.remove('hidden');
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const modal = document.getElementById('modal');
                if (!modal.classList.contains('hidden')) {
                    initGame();
                }
            }
            
            const key = e.key.toUpperCase();
            if (/^[A-Z]$/.test(key)) {
                handleGuess(key);
            }
        });

        document.getElementById('play-again-btn').addEventListener('click', initGame);

        window.onload = initGame;
    </script>
</body>
</html>
