<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Analog Clock</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }

        /* Clock container */
        .clock-container {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: white;
            border-radius: 50%;
            border: 8px solid #2c3e50;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            touch-action: none;
        }

        /* Center dot */
        .clock-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background-color: #e74c3c;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Clock Numbers */
        .clock-number {
            position: absolute;
            font-size: 1.5rem;
            font-weight: bold;
            color: #34495e;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none; 
        }

        /* Clock Hands */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            cursor: grab;
        }

        .hand:active {
            cursor: grabbing;
        }

        .hour-hand {
            width: 8px;
            height: 80px;
            background-color: #2c3e50;
            margin-left: -4px;
            z-index: 5;
        }
        .hour-hand.dragging { background-color: #3498db; }

        .minute-hand {
            width: 6px;
            height: 110px;
            background-color: #7f8c8d;
            margin-left: -3px;
            z-index: 6;
        }
        .minute-hand.dragging { background-color: #e67e22; }

        .second-hand {
            width: 4px;
            height: 125px;
            background-color: #e74c3c;
            margin-left: -2px;
            z-index: 7;
        }
        .second-hand.dragging { background-color: #c0392b; }

        /* Controls Section */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
            width: 100%;
            max-width: 350px;
        }

        /* Editable Time Input - FIXED WIDTH ISSUE */
        .time-input {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            background: white;
            padding: 10px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-family: inherit;
            cursor: pointer;
            text-align: center;
            /* Allow the browser to size it naturally to fit all content */
            width: auto; 
            min-width: 220px;
            max-width: 90vw; /* Prevents it from breaking off small phone screens */
            box-sizing: border-box;
        }
        
        .time-input:focus {
            outline: none;
            border-color: #3498db;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: bold;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover { background-color: #2980b9; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(0,0,0,0.1); }

        button.ticking-active { background-color: #e74c3c; }
        button.ticking-active:hover { background-color: #c0392b; }

        button.sound-off { background-color: #95a5a6; }
        button.sound-off:hover { background-color: #7f8c8d; }

        .instructions {
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
            text-align: center;
            max-width: 320px;
        }
    </style>
</head>
<body>

    <div class="clock-container" id="clock">
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
    </div>

    <div class="controls-container">
        <input type="time" class="time-input" id="timeInput" step="1">
        
        <div class="button-group">
            <button id="toggleClockBtn">Start Clock</button>
            <button id="toggleSoundBtn">Sound: ON</button>
            <button id="currentTimeBtn">Current Time</button>
        </div>
    </div>
    
    <div class="instructions">Drag hands, edit the box, or use buttons to control time. Sound requires interaction to activate.</div>

    <script>
        const clock = document.getElementById('clock');
        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const secondHand = document.getElementById('secondHand');
        const timeInput = document.getElementById('timeInput');
        
        const toggleClockBtn = document.getElementById('toggleClockBtn');
        const toggleSoundBtn = document.getElementById('toggleSoundBtn');
        const currentTimeBtn = document.getElementById('currentTimeBtn');

        let activeHand = null;
        let prevAngle = 0;
        let totalSeconds = (10 * 3600) + (10 * 60);

        let isTicking = false;
        let tickerInterval = null;
        let soundEnabled = true;
        let dragAccumulator = 0; 

        // --- Audio Context for Synthetic Sounds ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound(isWinding = false) {
            if (!audioCtx || !soundEnabled) return;
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = isWinding ? 'square' : 'sine'; 
            
            const startFreq = isWinding ? 1200 : 800;
            const duration = isWinding ? 0.015 : 0.04;
            const volume = isWinding ? 0.05 : 0.5;

            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
            
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        }

        // --- Generate Clock Numbers ---
        function generateNumbers() {
            const radius = 120;
            const clockCenter = 150; 

            for (let i = 1; i <= 12; i++) {
                const numberDiv = document.createElement('div');
                numberDiv.className = 'clock-number';
                numberDiv.textContent = i;

                const angle = (i * 30 - 90) * (Math.PI / 180);
                const x = clockCenter + radius * Math.cos(angle);
                const y = clockCenter + radius * Math.sin(angle);

                numberDiv.style.left = `${x}px`;
                numberDiv.style.top = `${y}px`;

                clock.appendChild(numberDiv);
            }
        }
        
        generateNumbers();

        function calculateAngle(e) {
            const rect = clock.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const x = e.clientX;
            const y = e.clientY;

            let angle = Math.atan2(y - centerY, x - centerX) * (180 / Math.PI) + 90;
            if (angle < 0) angle += 360;
            return angle;
        }

        function updateDisplay() {
            const secAngle = (totalSeconds % 60) * 6;
            const minAngle = (totalSeconds / 60) * 6; 
            const hourAngle = (totalSeconds / 3600) * 30; 

            secondHand.style.transform = `rotate(${secAngle}deg)`;
            minuteHand.style.transform = `rotate(${minAngle}deg)`;
            hourHand.style.transform = `rotate(${hourAngle}deg)`;
            
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = Math.floor(totalSeconds % 60);
            
            const pad = (num) => num.toString().padStart(2, '0');
            timeInput.value = `${pad(h)}:${pad(m)}:${pad(s)}`;
        }

        function tick() {
            if (!activeHand) {
                totalSeconds = (totalSeconds + 1) % 86400;
                updateDisplay();
                playTickSound();
            }
        }

        toggleClockBtn.addEventListener('click', () => {
            initAudio();
            isTicking = !isTicking;
            
            if (isTicking) {
                tickerInterval = setInterval(tick, 1000);
                toggleClockBtn.textContent = "Stop Clock";
                toggleClockBtn.classList.add('ticking-active');
                if (!activeHand) playTickSound(); 
            } else {
                clearInterval(tickerInterval);
                toggleClockBtn.textContent = "Start Clock";
                toggleClockBtn.classList.remove('ticking-active');
            }
        });

        toggleSoundBtn.addEventListener('click', () => {
            initAudio();
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                toggleSoundBtn.textContent = "Sound: ON";
                toggleSoundBtn.classList.remove('sound-off');
            } else {
                toggleSoundBtn.textContent = "Sound: OFF";
                toggleSoundBtn.classList.add('sound-off');
            }
        });

        currentTimeBtn.addEventListener('click', () => {
            initAudio();
            const now = new Date();
            totalSeconds = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
            updateDisplay();
        });

        timeInput.addEventListener('change', () => {
            const parts = timeInput.value.split(':');
            if (parts.length >= 2) {
                const h = parseInt(parts[0]) || 0;
                const m = parseInt(parts[1]) || 0;
                const s = parseInt(parts[2]) || 0;
                totalSeconds = (h * 3600) + (m * 60) + s;
                updateDisplay();
            }
        });

        function startDrag(e, handType) {
            initAudio();
            activeHand = handType;
            prevAngle = calculateAngle(e);
            dragAccumulator = 0;
            
            if (handType === 'second') secondHand.classList.add('dragging');
            if (handType === 'minute') minuteHand.classList.add('dragging');
            if (handType === 'hour') hourHand.classList.add('dragging');
            
            document.addEventListener('pointermove', onDrag);
            document.addEventListener('pointerup', endDrag);
        }

        function onDrag(e) {
            if (!activeHand) return;
            
            const angle = calculateAngle(e);
            let diff = angle - prevAngle;

            if (diff > 180) diff -= 360;
            else if (diff < -180) diff += 360;

            prevAngle = angle;

            dragAccumulator += Math.abs(diff);
            if (dragAccumulator > 2.5) {
                playTickSound(true); 
                dragAccumulator = 0;
            }

            if (activeHand === 'second') totalSeconds += diff / 6; 
            else if (activeHand === 'minute') totalSeconds += diff * 10; 
            else if (activeHand === 'hour') totalSeconds += diff * 120; 

            totalSeconds = (totalSeconds + 86400) % 86400;
            updateDisplay();
        }

        function endDrag() {
            secondHand.classList.remove('dragging');
            minuteHand.classList.remove('dragging');
            hourHand.classList.remove('dragging');
            activeHand = null;
            
            document.removeEventListener('pointermove', onDrag);
            document.removeEventListener('pointerup', endDrag);
        }

        secondHand.addEventListener('pointerdown', (e) => startDrag(e, 'second'));
        minuteHand.addEventListener('pointerdown', (e) => startDrag(e, 'minute'));
        hourHand.addEventListener('pointerdown', (e) => startDrag(e, 'hour'));

        secondHand.addEventListener('dragstart', (e) => e.preventDefault());
        minuteHand.addEventListener('dragstart', (e) => e.preventDefault());
        hourHand.addEventListener('dragstart', (e) => e.preventDefault());

        updateDisplay();
    </script>
</body>
</html>
