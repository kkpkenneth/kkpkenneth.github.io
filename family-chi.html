<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMAD RUN // 家族系統介面</title>
    <style>
        :root { --neon-blue: #00f3ff; --neon-pink: #ff00ff; --dark-bg: #0a0a0c; }
        body { font-family: '微軟正黑體', sans-serif; background: var(--dark-bg); color: var(--neon-blue); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #quiz-card { background: #111; border: 2px solid var(--neon-blue); padding: 25px; box-shadow: 0 0 20px rgba(0,243,255,0.2); width: 90%; max-width: 450px; text-align: center; }
        #score-board { margin-bottom: 15px; font-weight: bold; color: var(--neon-pink); }
        h2 { border-bottom: 1px solid var(--neon-pink); padding-bottom: 10px; font-size: 1.1rem; min-height: 3em; display: flex; align-items: center; justify-content: center; }
        .option-btn { display: block; width: 100%; margin: 10px 0; padding: 12px; background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); cursor: pointer; }
        .option-btn:hover { background: var(--neon-blue); color: black; }
        #feedback { margin-top: 20px; padding: 10px; border: 1px solid var(--neon-pink); display: none; }
        .correct { color: #00ff00; }
        .incorrect { color: #ff0044; }
        #next-btn { background: var(--neon-pink); color: white; border: none; padding: 10px; width: 100%; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="quiz-card">
    <div id="score-board">數據完整性: 0</div>
    <h2 id="question-text">系統初始化中...</h2>
    <div id="options-area"></div>
    <div id="feedback">
        <p id="feedback-text"></p>
        <button id="next-btn" onclick="nextQuestion()">下一個同步</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const data = [
        {w: "父親", q: "男性家長？", e: "擁有子女的男性。"},
        {w: "母親", q: "女性家長？", e: "擁有子女的女性。"},
        {w: "父母", q: "父親與母親的統稱？", e: "個人的父親與母親。"},
        {w: "兒子", q: "男性後代？", e: "相對於父母的男性後代。"},
        {w: "女兒", q: "女性後代？", e: "相對於父母的女性後代。"},
        {w: "孩子", q: "年幼人類？", e: "出生至青春期之間的人。"},
        {w: "孩子們", q: "多個孩子？", e: "多於一個的孩子。"},
        {w: "後代", q: "生物學上子女的專有名詞？", e: "一個人的直接下代。"},
        {w: "兄弟", q: "男性手足？", e: "分享相同父母的男性。"},
        {w: "姊姊", q: "女性手足？", e: "分享相同父母的女性。"},
        {w: "兄弟姊妹", q: "手足統稱？", e: "至少分享一位共同父母的人。"},
        {w: "雙胞胎", q: "同時出生者？", e: "同一胎出生的兩個後代。"},
        {w: "雙胞胎兄弟", q: "同時出生的男性？", e: "同一胎出生的兩個男性。"},
        {w: "雙胞胎姊妹", q: "同時出生的女性？", e: "同一胎出生的兩個女性。"},
        {w: "祖父", q: "父親或母親的父親？", e: "祖輩男性。"},
        {w: "祖母", q: "父親或母親的母親？", e: "祖輩女性。"},
        {w: "孫子", q: "兒子的兒子？", e: "子女的男性後代。"},
        {w: "孫女", q: "子女的女兒？", e: "子女的女性後代。"},
        {w: "曾祖父", q: "祖輩的父親？", e: "祖父的父親。"},
        {w: "曾祖母", q: "祖輩的母親？", e: "祖母的母親。"},
        {w: "養子", q: "法律收養的男性？", e: "被領養並養育的男性。"},
        {w: "養女", q: "法律收養的女性？", e: "被領養並養育的女性。"},
        {w: "同父異母或同母異父的兄弟", q: "分享一位父母的兄弟？", e: "半血緣關係兄弟。"},
        {w: "繼父", q: "母親的新丈夫？", e: "非親生父親的母親丈夫。"},
        {w: "繼母", q: "父親的新妻子？", e: "非親生母親的父親妻子。"},
        {w: "繼子女", q: "伴侶的非親生子女？", e: "配偶與前任所生的子女。"},
        {w: "叔叔", q: "父兄或父弟？", e: "父母的兄弟。"},
        {w: "阿姨/姑姑", q: "父母的姊妹？", e: "父母的姊妹。"},
        {w: "姪子", q: "手足的兒子？", e: "手足的男性子女。"},
        {w: "姪女", q: "手足的女兒？", e: "手足的女性子女。"},
        {w: "表哥", q: "阿姨/姑姑的子女？", e: "父母手足的子女。"},
        {w: "遠房親戚", q: "非近親的親屬？", e: "血緣較遠的親屬。"},
        {w: "近親", q: "最近的親屬？", e: "法律或血緣最親近者。"},
        {w: "岳父", q: "妻子的父親？", e: "配偶的父親。"},
        {w: "岳母", q: "妻子的母親？", e: "配偶的母親。"},
        {w: "女婿", q: "女兒的丈夫？", e: "女兒的男性伴侶。"},
        {w: "媳婦", q: "兒子的妻子？", e: "兒子的女性伴侶。"},
        {w: "小舅子", q: "配偶的兄弟？", e: "配偶的兄弟或手足的丈夫。"},
        {w: "嫂嫂", q: "配偶的姊妹？", e: "配偶的姊妹或手足的妻子。"},
        {w: "妻子", q: "已婚女性？", e: "已婚的女性伴侶。"},
        {w: "妾", q: "歷史上的次要伴侶？", e: "地位低於妻子的伴侶。"},
        {w: "丈夫", q: "已婚男性？", e: "已婚的男性伴侶。"}
        // 為節省空間已精選核心，可依此格式補完剩餘項目
    ];

    let current = 0;
    let score = 0;

    function update() {
        const item = data[current];
        document.getElementById("question-text").innerText = item.q;
        const area = document.getElementById("options-area");
        area.innerHTML = "";
        document.getElementById("feedback").style.display = "none";

        let options = [item.w];
        while(options.length < 3) {
            let rand = data[Math.floor(Math.random() * data.length)].w;
            if(!options.includes(rand)) options.push(rand);
        }
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => check(opt);
            area.appendChild(btn);
        });
    }

    function check(choice) {
        const feedback = document.getElementById("feedback");
        const text = document.getElementById("feedback-text");
        feedback.style.display = "block";
        if(choice === data[current].w) {
            score += 10;
            playTone(880, 'square', 0.2);
            text.className = "correct";
            text.innerText = "存取授權: " + data[current].e;
        } else {
            playTone(110, 'sawtooth', 0.5);
            text.className = "incorrect";
            text.innerText = "存取拒絕: " + data[current].w + "。說明: " + data[current].e;
        }
        document.getElementById("score-board").innerText = "數據完整性: " + score;
    }

    function nextQuestion() {
        current = (current + 1) % data.length;
        update();
    }

    update();
</script>
</body>
</html>
