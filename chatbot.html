<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZhongYi AI - Chinese Medicine Assistant</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --panel-bg: #ffffff;
            --primary-color: #2c5e43; /* Jade Green */
            --accent-color: #8c2d19;  /* Deep Madder/Crimson */
            --text-main: #333333;
            --text-light: #666666;
            --border-color: #e0dacb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(44, 94, 67, 0.1);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        /* Avatar Panel */
        .avatar-panel {
            background: linear-gradient(135deg, var(--primary-color), #1b3d2b);
            padding: 20px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .avatar-container {
            width: 100px;
            height: 100px;
            position: relative;
        }

        /* Animated Face SVG */
        .face-svg {
            width: 100%;
            height: 100%;
        }

        .eye {
            transform-origin: center;
            animation: blink 4s infinite;
        }

        .mouth {
            transform-origin: 50px 70px;
            transition: d 0.2s ease;
        }

        /* Idle Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .avatar-container {
            animation: float 4s ease-in-out infinite;
        }

        /* Eye Blinking Animation */
        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Talking Animation (Triggered via JS) */
        .talking .mouth {
            animation: speak-move 0.25s infinite alternate;
        }

        @keyframes speak-move {
            0% { transform: scaleY(0.6) translateY(5px); }
            100% { transform: scaleY(1.4) translateY(-3px); }
        }

        /* Controls / Voice Dropdown */
        .controls {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .controls label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
        }

        .voice-select {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            max-width: 200px;
        }

        .voice-select option {
            background: #1b3d2b;
            color: #ffffff;
        }

        /* Chat Display Area */
        .chat-log {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #faf9f6;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .message.bot {
            background-color: #ffffff;
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .message.user {
            background-color: var(--primary-color);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Input Panel */
        .input-panel {
            padding: 15px 20px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            background-color: #fcfbfa;
        }

        .chat-input:focus {
            border-color: var(--primary-color);
        }

        .send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #732414;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Panel with Animated Face & Voice Select -->
    <div class="avatar-panel" id="avatar-panel">
        <div class="avatar-container" id="avatar-container">
            <svg class="face-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Head Background -->
                <circle cx="50" cy="50" r="45" fill="#eaddca" stroke="#cbbba3" stroke-width="2"/>

                <circle class="eye" cx="35" cy="42" r="4" fill="#2c5e43"/>
                <circle class="eye" cx="65" cy="42" r="4" fill="#2c5e43"/>

                <circle cx="28" cy="48" r="5" fill="#e29c8e" opacity="0.6"/>
                <circle cx="72" cy="48" r="5" fill="#e29c8e" opacity="0.6"/>
                <!-- Mouth (Default Smile) -->
                <path class="mouth" d="M 38 65 Q 50 75 62 65" fill="none" stroke="#8c2d19" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
        
        <div class="controls">
            <label for="voice-select">Voice:</label>
            <select id="voice-select" class="voice-select">
                <option value="">Default System Voice</option>
            </select>
        </div>
    </div>

    <!-- Chat Logs -->
    <div class="chat-log" id="chat-log">
        <div class="message bot">Greetings. I am your Chinese Medicine assistant. You may ask me about concepts like Qi, Yin and Yang, Acupuncture, or specific herbal wisdom. What balancing insights do you seek today?</div>
    </div>

    <!-- User Input Actions -->
    <div class="input-panel">
        <input type="text" id="user-input" class="chat-input" placeholder="Ask about Qi, Yin & Yang, or herbs..." autocomplete="off">
        <button id="send-btn" class="send-btn">Ask</button>
    </div>
</div>

    // Load available voices for Text-to-Speech dropdown
    function populateVoiceList() {
        if (typeof synth === 'undefined') return;
        
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        
        // Prioritize English or Chinese voices depending on what's available
        voices.forEach((voice) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.value = voice.name;
            voiceSelect.appendChild(option);
        });
    }

    populateVoiceList();
    if (synth && synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = populateVoiceList;
    }

    // Dynamic AI response text generator
    function generateBotResponse(text) {
        const lowerText = text.toLowerCase();
        for (let key in knowledgeBase) {
            if (lowerText.includes(key)) {
                return knowledgeBase[key];
            }
        }
        return "To understand health, we look at the whole body as an ecosystem rather than isolated parts. Tell me more about your balance, energy levels, or elements you want to explore. For example: Chinese medicine, yin and yang etc.";
    }

    // Handle standard Text-to-Speech vocal output and face animation sync
    function speakText(text) {
        if (!synth) return;
        
        // Stop any current speaking tasks immediately
        synth.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const selectedVoiceName = voiceSelect.value;
        
        if (selectedVoiceName) {
            const selectedVoice = voices.find(v => v.name === selectedVoiceName);
            if (selectedVoice) utterance.voice = selectedVoice;
        }

        // Synchronize animation with audio events
        utterance.onstart = () => {
            avatarContainer.classList.add('talking');
        };

        utterance.onend = () => {
            avatarContainer.classList.remove('talking');
        };

        utterance.onerror = () => {
            avatarContainer.classList.remove('talking');
        };

        synth.speak(utterance);
    }

    function appendMessage(sender, text) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', sender);
        messageDiv.textContent = text;
        chatLog.appendChild(messageDiv);
        chatLog.scrollTop = chatLog.scrollHeight; // Auto-scroll to latest response
    }

    function handleUserInput() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';

        // Simulate AI thinking buffer delay
        setTimeout(() => {
            const reply = generateBotResponse(text);
            appendMessage('bot', reply);
            speakText(reply);
        }, 600);
    }

    // Action listeners for standard event handling
    sendBtn.addEventListener('click', handleUserInput);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleUserInput();
    });
</script>
