<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trace 50 Levels (Mobile)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f3f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            overscroll-behavior-y: contain; 
        }

        .game-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 1.5rem;
        }

        .level-select {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0984e3;
            padding: 4px 8px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            background-color: #f4f7f6;
            outline: none;
            cursor: pointer;
        }

        .level-select:focus { border-color: #0984e3; }

        .level-title {
            color: #0984e3;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .feedback {
            font-size: 1.1rem;
            font-weight: 600;
            color: #636e72;
            height: 28px;
            margin-bottom: 15px;
        }

        .correct { color: #00b894; }
        .incorrect { color: #d63031; }

        .canvas-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1; 
            margin-bottom: 20px;
        }

        canvas {
            background-color: #fafafa;
            border: 3px solid #dfe6e9;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            touch-action: none; 
            cursor: crosshair;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        button {
            font-size: 1.1rem;
            padding: 14px 20px; 
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            flex: 1; 
            max-width: 200px;
        }

        button:active { transform: scale(0.96); }

        .btn-retry {
            background-color: #dfe6e9;
            color: #2d3436;
        }

        .btn-next {
            background-color: #00b894;
            color: white;
            display: none;
            box-shadow: 0 4px 12px rgba(0, 184, 148, 0.3);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header-row">
            <h1>Level</h1>
            <select id="level-select" class="level-select"></select>
            <h1>/ 50</h1>
        </div>
        
        <div class="level-title" id="shape-name">Line</div>
        <div class="feedback" id="feedback">Start drawing from the green dot!</div>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>
        
        <div class="controls">
            <button class="btn-retry" id="retry-btn">Retry</button>
            <button class="btn-next" id="next-btn">Next ➔</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const feedbackEl = document.getElementById('feedback');
        const retryBtn = document.getElementById('retry-btn');
        const nextBtn = document.getElementById('next-btn');
        const levelSelect = document.getElementById('level-select');
        const shapeNameEl = document.getElementById('shape-name');

        let currentLevel = 1;
        const MAX_LEVELS = 50;
        let targetPath = [];
        let targetLength = 0;
        let userPath = [];
        let isDrawing = false;
        let gameWon = false;
        const TOLERANCE = 35; 

        // Populate Dropdown
        for (let i = 1; i <= MAX_LEVELS; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = i;
            levelSelect.appendChild(option);
        }

        levelSelect.addEventListener('change', (e) => {
            currentLevel = parseInt(e.target.value, 10);
            initLevel();
        });

        // Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1); 
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Shape Generator
        function generateShapeForLevel(level) {
            const cx = 200, cy = 200, r = 140; 
            let pts = [];
            let name = "";

            if (level === 1) {
                name = "A Straight Line";
                pts.push({x: cx - r, y: cy}, {x: cx + r, y: cy});
            } else if (level >= 2 && level <= 9) {
                const sides = level + 1;
                const names = ["", "", "Triangle", "Square", "Pentagon", "Hexagon", "Heptagon", "Octagon", "Nonagon", "Decagon"];
                name = names[sides - 1];
                for(let i=0; i<=sides; i++) {
                    let angle = (i * Math.PI * 2) / sides - Math.PI/2;
                    pts.push({x: cx + Math.cos(angle)*r, y: cy + Math.sin(angle)*r});
                }
            } else if (level === 10) {
                name = "Perfect Circle";
                for(let i=0; i<=60; i++) {
                    let angle = (i * Math.PI * 2) / 60;
                    pts.push({x: cx + Math.cos(angle)*r, y: cy + Math.sin(angle)*r});
                }
            } else if (level >= 11 && level <= 20) {
                const spikes = level - 6; 
                name = `${spikes}-Point Star`;
                const outer = r, inner = r * 0.4;
                for(let i=0; i<=spikes*2; i++) {
                    let radius = (i % 2 === 0) ? outer : inner;
                    let angle = (i * Math.PI) / spikes - Math.PI/2;
                    pts.push({x: cx + Math.cos(angle)*radius, y: cy + Math.sin(angle)*radius});
                }
            } else if (level >= 21 && level <= 35) {
                const a = (level - 19), b = (level - 18);
                name = `Lissajous Curve (${a}:${b})`;
                for(let i=0; i<=200; i++) { // Increased resolution for smoother curves
                    let t = (i * Math.PI * 2) / 200;
                    pts.push({x: cx + Math.sin(a*t + Math.PI/2)*r, y: cy + Math.sin(b*t)*r});
                }
            } else {
                const k = (level - 33); 
                name = `Rose Curve (${k} Petals)`;
                for(let i=0; i<=300; i++) { // Increased resolution
                    let theta = (i * Math.PI * 2) / 300;
                    let rad = Math.cos(k * theta) * r;
                    pts.push({x: cx + Math.cos(theta)*rad, y: cy + Math.sin(theta)*rad});
                }
            }
            return { points: pts, name: name };
        }

        // Geometry Helpers
        function getDist(p1, p2) { return Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2); }
        
        function distToSegment(p, v, w) {
            const l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
            if (l2 === 0) return getDist(p, v);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return getDist(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) });
        }

        function isPointOnPath(p) {
            for (let i = 0; i < targetPath.length - 1; i++) {
                if (distToSegment(p, targetPath[i], targetPath[i+1]) <= TOLERANCE) return true;
            }
            return false;
        }

        function getPathLength(path) {
            let len = 0;
            for(let i=0; i<path.length-1; i++) len += getDist(path[i], path[i+1]);
            return len;
        }

        // Init Level
        function initLevel() {
            const shapeData = generateShapeForLevel(currentLevel);
            targetPath = shapeData.points;
            targetLength = getPathLength(targetPath);
            
            levelSelect.value = currentLevel;
            shapeNameEl.textContent = shapeData.name;
            
            userPath = [];
            isDrawing = false;
            gameWon = false;
            
            nextBtn.style.display = 'none';
            retryBtn.style.display = 'block';
            feedbackEl.textContent = 'Start drawing from the green dot!';
            feedbackEl.className = 'feedback';
            
            drawScene();
        }

        // Render Graphics
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- SMOOTHED GUIDE LINE ---
            ctx.beginPath();
            ctx.moveTo(targetPath[0].x, targetPath[0].y);
            
            // Check if the shape is a continuous curve (Circle, Lissajous, Rose)
            const isCurve = currentLevel === 10 || currentLevel >= 21;

            if (isCurve) {
                // Apply Bezier Smoothing to the Guide Line
                for (let i = 1; i < targetPath.length - 1; i++) {
                    const xc = (targetPath[i].x + targetPath[i + 1].x) / 2;
                    const yc = (targetPath[i].y + targetPath[i + 1].y) / 2;
                    ctx.quadraticCurveTo(targetPath[i].x, targetPath[i].y, xc, yc);
                }
                const last = targetPath.length - 1;
                ctx.lineTo(targetPath[last].x, targetPath[last].y);
            } else {
                // Keep sharp corners for Line, Polygons, and Stars
                for (let i = 1; i < targetPath.length; i++) {
                    ctx.lineTo(targetPath[i].x, targetPath[i].y);
                }
            }

            ctx.lineWidth = 18;
            ctx.strokeStyle = '#dfe6e9';
            ctx.setLineDash([10, 2]);
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.setLineDash([]); 

            // Starting Dot
            ctx.beginPath();
            ctx.arc(targetPath[0].x, targetPath[0].y, 10, 0, Math.PI * 2);
            ctx.fillStyle = gameWon ? '#b2bec3' : '#00b894';
            ctx.fill();

            // --- SMOOTHED USER TRACE ---
            if (userPath.length > 0) {
                ctx.beginPath();
                ctx.moveTo(userPath[0].x, userPath[0].y);
                
                for (let i = 1; i < userPath.length - 1; i++) {
                    const xc = (userPath[i].x + userPath[i + 1].x) / 2;
                    const yc = (userPath[i].y + userPath[i + 1].y) / 2;
                    ctx.quadraticCurveTo(userPath[i].x, userPath[i].y, xc, yc);
                }
                
                if (userPath.length > 1) {
                    const last = userPath.length - 1;
                    ctx.lineTo(userPath[last].x, userPath[last].y);
                }

                ctx.lineWidth = 18;
                ctx.strokeStyle = gameWon ? '#b2bec3' : '#00b894'; 
                ctx.lineCap = 'round'; 
                ctx.lineJoin = 'round';
                ctx.stroke();
            }
        }

        // Input Mechanics
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
            
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDrawing(e) {
            if (gameWon) return;
            e.preventDefault(); 
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const pos = getPointerPos(e);
            
            if (getDist(pos, targetPath[0]) > TOLERANCE * 1.5) {
                feedbackEl.textContent = 'Start at the green dot!';
                return;
            }

            isDrawing = true;
            userPath = [pos];
            feedbackEl.textContent = 'Keep going...';
            feedbackEl.className = 'feedback';
            drawScene();
        }

        function draw(e) {
            if (!isDrawing || gameWon) return;
            e.preventDefault(); 

            const pos = getPointerPos(e);

            if (!isPointOnPath(pos)) {
                isDrawing = false;
                userPath = [];
                feedbackEl.textContent = 'Oops! You went outside the line.';
                feedbackEl.className = 'feedback incorrect';
                playSound('error');
                drawScene();
                return;
            }

            userPath.push(pos);

            const uLen = getPathLength(userPath);
            const distToEnd = getDist(pos, targetPath[targetPath.length - 1]);
            
            if (uLen > targetLength * 0.8 && distToEnd < 3) {
                isDrawing = false;
                gameWon = true;
                feedbackEl.textContent = 'Perfect! 🎉';
                feedbackEl.className = 'feedback correct';
                nextBtn.style.display = 'block';
                retryBtn.style.display = 'none';
                playSound('win');
            }

            drawScene();
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            e.preventDefault(); 
            isDrawing = false;

            if (!gameWon) {
                feedbackEl.textContent = 'You lifted your finger! Try again.';
                userPath = [];
                drawScene();
            }
        }

        // --- Event Listeners ---
        canvas.addEventListener('mousedown', startDrawing);
        window.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        window.addEventListener('touchmove', draw, { passive: false });
        window.addEventListener('touchend', stopDrawing, { passive: false });
        window.addEventListener('touchcancel', stopDrawing, { passive: false });

        retryBtn.addEventListener('click', initLevel);
        
        nextBtn.addEventListener('click', () => {
            if (currentLevel < MAX_LEVELS) {
                currentLevel++;
                initLevel();
            } else {
                feedbackEl.textContent = "🏆 YOU BEAT ALL 50 LEVELS! 🏆";
                nextBtn.style.display = 'none';
            }
        });

        initLevel();
    </script>
</body>
</html>
