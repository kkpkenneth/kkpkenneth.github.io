<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atomic Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Press Start 2P', monospace; background-color: #0f172a; color: #e2e8f0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .pixel-border { box-shadow: -4px 0 0 0 #4ade80, 4px 0 0 0 #4ade80, 0 -4px 0 0 #4ade80, 0 4px 0 0 #4ade80; margin: 4px; }
        .btn-pixel { box-shadow: -3px 0 0 0 white, 3px 0 0 0 white, 0 -3px 0 0 white, 0 3px 0 0 white; transition: transform 0.1s; }
        .btn-pixel:active { transform: scale(0.95); }
        .correct { background-color: #16a34a !important; box-shadow: -3px 0 0 0 #4ade80, 3px 0 0 0 #4ade80, 0 -3px 0 0 #4ade80, 0 3px 0 0 #4ade80 !important; color: white !important; }
        .incorrect { background-color: #dc2626 !important; box-shadow: -3px 0 0 0 #f87171, 3px 0 0 0 #f87171, 0 -3px 0 0 #f87171, 0 3px 0 0 #f87171 !important; color: white !important; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <header class="w-full max-w-md text-center mb-6">
        <h1 class="text-xl text-green-400 mb-4 tracking-widest">ATOMIC ARCADE</h1>
        <div class="text-yellow-300 text-sm">SCORE: <span id="score">0</span></div>
    </header>

    <main class="w-full max-w-sm flex flex-col items-center">
        <div class="bg-black w-full py-8 px-4 flex flex-col items-center pixel-border mb-8">
            <div id="element-symbol" class="text-7xl text-white mb-6">?</div>
            <div id="element-name" class="text-md text-yellow-300 mb-3 text-center">Loading...</div>
            <div id="element-group" class="text-[10px] text-cyan-300 mb-4 text-center"></div>
            <div id="element-fact" class="text-[10px] text-gray-400 text-center italic border-t border-gray-800 pt-4"></div>
        </div>

        <div id="options-container" class="w-full flex flex-col items-center gap-5">
            <button class="choice-btn w-full max-w-[280px] bg-gray-800 text-white py-5 btn-pixel text-sm" onclick="checkAnswer(0)"></button>
            <button class="choice-btn w-full max-w-[280px] bg-gray-800 text-white py-5 btn-pixel text-sm" onclick="checkAnswer(1)"></button>
            <button class="choice-btn w-full max-w-[280px] bg-gray-800 text-white py-5 btn-pixel text-sm" onclick="checkAnswer(2)"></button>
            <button class="choice-btn w-full max-w-[280px] bg-gray-800 text-white py-5 btn-pixel text-sm" onclick="checkAnswer(3)"></button>
        </div>
    </main>

    <script>
        // Example dataset - expand this list to 118 entries
        const elements = [
            {a:1, s:"H", n:"Hydrogen", g:"Group 1", f:"Used in rocket fuel"},
            {a:2, s:"He", n:"Helium", g:"Group 18", f:"Used in balloons"},
            {a:8, s:"O", n:"Oxygen", g:"Group 16", f:"Essential for breathing"},
            {a:26, s:"Fe", n:"Iron", g:"Group 8", f:"Used in steel construction"},
            {a:79, s:"Au", n:"Gold", g:"Group 11", f:"Used in high-end electronics"}
        ];

        let score = 0, current = null, audioCtx = null;

        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            osc.type = type === 'win' ? 'square' : 'sawtooth';
            osc.frequency.setValueAtTime(type === 'win' ? 440 : 300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(type === 'win' ? 880 : 100, audioCtx.currentTime + 0.2);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function next() {
            current = elements[Math.floor(Math.random() * elements.length)];
            document.getElementById('element-symbol').innerText = current.s;
            document.getElementById('element-name').innerText = current.n;
            document.getElementById('element-group').innerText = current.g;
            document.getElementById('element-fact').innerText = current.f;
            
            let opts = [current.a];
            while(opts.length < 4) { let n = Math.floor(Math.random()*118)+1; if(!opts.includes(n)) opts.push(n); }
            opts.sort(() => Math.random() - 0.5);
            document.querySelectorAll('.choice-btn').forEach((b, i) => { 
                b.innerText = opts[i]; 
                b.className = "choice-btn w-full max-w-[280px] bg-gray-800 text-white py-5 btn-pixel text-sm"; 
                b.disabled = false; 
            });
        }

        function checkAnswer(i) {
            const btn = document.querySelectorAll('.choice-btn')[i];
            if(parseInt(btn.innerText) === current.a) {
                playSound('win'); score += 10; btn.className += " correct";
            } else {
                playSound('loss'); btn.className += " incorrect";
            }
            document.getElementById('score').innerText = score;
            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
            setTimeout(next, 1500);
        }

        next();
    </script>
</body>
</html>
