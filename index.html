<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Turtle | Discovery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Images/icon.png" type="image/png" sizes="16x16">
    
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-175443844-1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'UA-175443844-1');
    </script>

    <!-- AdSense & Analytics -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; padding: 0; font-family: helvetica; background-color: white; overflow-x: hidden; }

        /* MENU STYLES */
        .menuspace { height: 50px; background-color: rgb(50,50,50); }
        .menu { 
            background-color: rgba(50, 50, 50, 0.95); 
            backdrop-filter: blur(10px);              
            width: 100%; position: fixed; top: 0; z-index: 2000; 
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s ease;
        }
        .menu-list { margin: 0; padding: 0; display: flex; list-style: none; }
        .menu-list li { position: relative; }
        .menu-list a { 
            color: rgb(194, 194, 194); text-decoration: none; display: block;
            padding: 15px 25px; font-size: 13px; text-transform: uppercase;
            letter-spacing: 1.5px; transition: color 0.3s ease;
        }
        .menu-toggle { display: none; color: white; font-size: 20px; padding: 15px; cursor: pointer; }

        @media only screen and (max-width: 900px) {
            .menu { justify-content: space-between; }
            .menu-toggle { display: block; }
            .menu-list {
                display: none; flex-direction: column; position: absolute;
                top: 100%; left: 0; width: 100%; background-color: rgb(50,50,50);
                border-top: 1px solid #444;
            }
            .menu-list.active { display: flex; }
        }

        /* LAYOUT */
        .full-container, .split-grid { display: grid; width: 100vw; gap: 20px; margin-bottom: 20px; }
        .full-container { grid-template-columns: 1fr; }
        .split-grid { grid-template-columns: 1fr 1fr; }

        /* COVER BLOCKS */
        .cover-block {
            overflow: hidden; background-position: center; background-size: cover;
            text-align: center; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-decoration: none; transition: opacity 0.3s;
        }
        .full-height { height: 600px; }
        .split-height { height: 450px; }

        /* NEW: Text Background Box */
        .text-box {
            background-color: rgba(0, 0, 0, 0.3); /* Semi-transparent black */
            padding: 20px 40px;
            border-radius: 2px;
            backdrop-filter: blur(0px); /* Optional: blurs the image behind the text box */
            max-width: 80%;
        }

        .cover-block h1 { font-size: 55px; margin: 5px; }
        .cover-block h2 { font-size: 35px; margin: 5px; }
        .cover-block h3 { font-size: 25px; font-weight: 1; margin: 5px; }
        .cover-block p { font-size: 15px; margin: 5px; }

        @media only screen and (max-width: 900px) {
            .split-grid { grid-template-columns: 1fr; gap: 10px; }
            .cover-block h1 { font-size: 35px; }
            .text-box { padding: 15px 20px; }
        }

        /* FOOTER */
        footer {
            background-color: gray; text-align: center;
            padding: 60px 20px; width: 100%; color: white;
            box-sizing: border-box; margin-top: 20px;
        }
        .legal { margin-top: 30px; }
        .legal a { color: white; text-decoration: none; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; padding: 0 15px; opacity: 0.7; }
    </style>
</head>
<body>

<nav class="menu">
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    <ul class="menu-list" id="menuList">
        <li><a href="">🌎 Take me somewhere</a></li>
        <li><a href="#asia">Asia</a></li>
        <li><a href="#europe">Europe</a></li>
        <li><a href="#africa">Africa</a></li>
        <li><a href="#americas">Americas</a></li>
        <li><a href="#oceania">Oceania</a></li>
        <li><a href="about.html">About</a></li>
    </ul>
</nav>
<div class="menuspace"></div>

<div id="full-section" class="full-container"></div>
<div id="split-section" class="split-grid"></div>

<footer>
    <p>Support the journey</p>
    <a href="https://payme.hsbc/yourmoneymymoney"><img src="Images/qr.jpg" height="120" alt="Support"></a>
    <a><img src="Images/paypal.png" height="120px"></a>
    <div class="legal">
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms</a>
        <a href="contact.html">Contact</a>
    </div>
    <p style="margin-top:20px; font-size:10px;">Copyright © 2026 Travel Turtle. All rights reserved.</p>
</footer>

<script>
    function toggleMenu() {
        document.getElementById('menuList').classList.toggle('active');
    }

    const destinations = [
        { title: "Myanmar", caption: "Where sunrise lights up your soul", image: "Images/Myanmar.jpg", link: "myanmar.html", color: "white" },
        { title: "Canada", caption: "Living in Ice Age", image: "Images/Canada.jpg", link: "canada.html", color: "white" },
        { title: "Australia", caption: "Peering into the Wild", image: "Images/Australia.jpg", link: "australia.html", color: "white" },
        { title: "Maldives", caption: "Chill Like a Boss", image: "Images/Maldives.jpg", link: "maldives.html", color: "white" },
        { title: "Cuba", caption: "Travel Back in Time", image: "Images/Cuba.jpg", link: "cuba.html", color: "white" },
        { title: "Portugal", caption: "Into the Unknown", image: "Images/Portugal.jpg", link: "portugal.html", color: "white" },
        { title: "Indonesia", caption: "The Jungle Rook", image: "Images/Indonesia.jpg", link: "indonesia.html", color: "white" },
        { title: "Tunisia", caption: "The Gem of Africa", image: "Images/Tunisia.jpg", link: "tunisia.html", color: "white" },
        { title: "Fiji", caption: "Garden of the Sea", image: "Images/Fiji.jpg", link: "fiji.html", color: "white" },
        { title: "Nepal", caption: "Roof of the World", image: "Images/Nepal.jpg", link: "nepal.html", color: "white" },
        { title: "Azerbaijan", caption: "Fire and Silk", image: "Images/Azerbaijan.jpg", link: "azerbaijan.html", color: "white" }
    ];

    function buildLayout() {
        const shuffled = [...destinations].sort(() => 0.5 - Math.random());
        const fullSection = document.getElementById('full-section');
        const splitSection = document.getElementById('split-section');

        // Build 3 Full Covers
        shuffled.slice(0, 3).forEach(item => {
            const block = document.createElement('a');
            block.className = 'cover-block full-height';
            block.href = item.link;
            block.style.backgroundImage = `url('${item.image}')`;
            block.innerHTML = `
                <div class="text-box">
                    <h1 style="color: ${item.color}">${item.title}</h1>
                    <h3 style="color: ${item.color}">${item.caption}</h3>
                    <p style="color: ${item.color}">Read more ></p>
                </div>
            `;
            fullSection.appendChild(block);
        });

        // Build 6 Split Covers
        shuffled.slice(3, 9).forEach(item => {
            const block = document.createElement('a');
            block.className = 'cover-block split-height';
            block.href = item.link;
            block.style.backgroundImage = `url('${item.image}')`;
            block.innerHTML = `
                <div class="text-box">
                    <h2 style="color: ${item.color}">${item.title}</h2>
                    <p style="color: ${item.color}">${item.caption}</p>
                    <p style="color: ${item.color}; font-size: 12px;">Read more ></p>
                </div>
            `;
            splitSection.appendChild(block);
        });
    }

    window.onload = buildLayout;
</script>

</body>
</html>
