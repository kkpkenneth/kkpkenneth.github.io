<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12-Horse Racing Simulator (Autosave & Stats)</title>
<style>
  :root {
    --track-bg: #4a752c;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a1a;
    color: #f0f0f0;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    width: 100%;
    max-width: 900px;
  }
  .dashboard {
    background: #2a2a2a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .balance-card {
    background: #ffd700;
    color: #000;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 1.2rem;
    font-weight: bold;
    display: flex;
    gap: 15px;
  }
  .stat-divider {
    color: #000;
    opacity: 0.3;
  }
  .control-group {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #333;
    color: white;
    font-size: 1rem;
  }
  button {
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    background: #2ed573;
    color: #000;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { background: #555; color: #888; cursor: not-allowed; }
  
  .btn-blue { background: #3498db; color: #fff; }
  .btn-orange { background: #e67e22; color: #fff; }
  .btn-red { background: #e74c3c; color: #fff; }

  .message {
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    margin-bottom: 20px;
    min-height: 28px;
    color: #2ed573;
  }

  .track {
    background: var(--track-bg);
    border: 8px solid #fff;
    border-radius: 12px;
    position: relative;
    padding: 10px 0;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }
  .lane {
    border-bottom: 2px dashed rgba(255,255,255,0.3);
    height: 40px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .lane:last-child { border-bottom: none; }
  
  .horse-stat-text {
    width: 50px;
    text-align: right;
    padding-right: 15px;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.85);
    font-family: monospace;
    z-index: 1;
  }

  .finish-line {
    position: absolute;
    right: 50px;
    top: 0;
    bottom: 0;
    width: 8px;
    background: repeating-linear-gradient(to bottom, #fff, #fff 10px, #000 10px, #000 20px);
    z-index: 5;
  }
  
  .horse {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    position: absolute;
    /* Updated starting position to leave room for the win rate text */
    left: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
    transition: left 0.05s linear;
    z-index: 10;
  }

  /* Results Table Styles */
  .results-container {
    background: #2a2a2a;
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    display: none;
  }
  .results-container.show {
    display: block;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #444;
  }
  th {
    background: #333;
    font-weight: bold;
  }
  .text-win { color: #2ed573; font-weight: bold; }
  .text-loss { color: #ff4757; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="dashboard">
    <div class="balance-card">
      <span>Bankroll: $<span id="bankroll">1000</span></span>
      <span class="stat-divider">|</span>
      <span>Win Rate: <span id="winRate">0.0</span>%</span>
    </div>
    <div class="control-group">
      <select id="horseSelect"></select>
      <input type="number" id="wager" value="50" min="1" max="10000" style="width: 100px;" placeholder="Bet Amount">
      <button id="betBtn">Race</button>
      <button id="skipBtn" class="btn-orange" disabled>Fast Forward</button>
      <button id="toggleResultsBtn" class="btn-blue">Results</button>
      <button id="resetSaveBtn" class="btn-red" title="Reset all data and start over">Reset Save</button>
    </div>
  </div>

  <div id="message" class="message">Select a horse and place your bet!</div>

  <div class="track" id="track">
    <div class="finish-line"></div>
    <!-- Lanes generated by JavaScript -->
  </div>

  <div class="results-container" id="resultsContainer">
    <h3 style="margin-top: 0; color: #f0f0f0;">Race History</h3>
    <table>
      <thead>
        <tr>
          <th>Race #</th>
          <th>Winner</th>
          <th>Your Bet</th>
          <th>Wager</th>
          <th>Net Result</th>
          <th>Bankroll</th>
        </tr>
      </thead>
      <tbody id="resultsBody">
        <!-- Results injected here -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // 12 Horses with individual win tracking
  const horses = [
    { id: 1, name: "1. Thunderbolt", odds: 2, color: '#e74c3c', winCount: 0 },
    { id: 2, name: "2. Star Catcher", odds: 3, color: '#3498db', winCount: 0 },
    { id: 3, name: "3. Midnight Rider", odds: 4, color: '#9b59b6', winCount: 0 },
    { id: 4, name: "4. Desert Wind", odds: 5, color: '#f1c40f', winCount: 0 },
    { id: 5, name: "5. Shadowfax", odds: 6, color: '#e67e22', winCount: 0 },
    { id: 6, name: "6. Iron Hoof", odds: 8, color: '#1abc9c', winCount: 0 },
    { id: 7, name: "7. Silver Blaze", odds: 10, color: '#bdc3c7', winCount: 0 },
    { id: 8, name: "8. Crimson Fury", odds: 12, color: '#c0392b', winCount: 0 },
    { id: 9, name: "9. Ghost Phantom", odds: 15, color: '#8e44ad', winCount: 0 },
    { id: 10, name: "10. Golden Arrow", odds: 20, color: '#d35400', winCount: 0 },
    { id: 11, name: "11. Mystic River", odds: 25, color: '#2980b9', winCount: 0 },
    { id: 12, name: "12. Lucky Strike", odds: 30, color: '#27ae60', winCount: 0 }
  ];

  let bankroll = 1000;
  let isRacing = false;
  let currentBet = null;
  let raceCount = 0;
  let wins = 0; 
  let raceHistory = [];
  
  const select = document.getElementById('horseSelect');
  const track = document.getElementById('track');
  const resultsContainer = document.getElementById('resultsContainer');
  const resultsBody = document.getElementById('resultsBody');
  const skipBtn = document.getElementById('skipBtn');
  
  // Initialize track and betting options
  horses.forEach((h, i) => {
    let opt = document.createElement('option');
    opt.value = h.id;
    opt.text = `${h.name} (${h.odds}/1)`;
    select.appendChild(opt);

    let lane = document.createElement('div');
    lane.className = 'lane';
    
    // Horse Individual Win Rate Stat
    let statEl = document.createElement('div');
    statEl.className = 'horse-stat-text';
    statEl.id = 'stat-' + h.id;
    statEl.innerText = '0.0%';
    
    let horseEl = document.createElement('div');
    horseEl.className = 'horse';
    horseEl.id = 'horse-' + h.id;
    horseEl.innerText = h.id;
    horseEl.style.backgroundColor = h.color;
    horseEl.style.color = [3, 6].includes(i) ? '#000' : '#fff'; 
    
    lane.appendChild(statEl);
    lane.appendChild(horseEl);
    track.appendChild(lane);
  });

  // Load Autosave Data on Startup
  loadGame();

  // Manual Toggle Results Table
  document.getElementById('toggleResultsBtn').addEventListener('click', () => {
    resultsContainer.classList.toggle('show');
  });

  // Reset Save Data
  document.getElementById('resetSaveBtn').addEventListener('click', () => {
    if(confirm("Are you sure you want to reset your bankroll, stats, and history?")) {
      localStorage.removeItem('horseRaceState');
      location.reload();
    }
  });

  document.getElementById('betBtn').addEventListener('click', () => {
    if (isRacing) return;
    
    const wager = parseInt(document.getElementById('wager').value);
    const selectedHorseId = parseInt(select.value);

    if (isNaN(wager) || wager <= 0) {
      alert('Please enter a valid bet amount.');
      return;
    }
    if (wager > bankroll) {
      alert('Insufficient funds!');
      return;
    }

    bankroll -= wager;
    updateBankroll();
    currentBet = { horseId: selectedHorseId, amount: wager };
    
    startRace();
  });

  function updateBankroll() {
    document.getElementById('bankroll').innerText = bankroll;
  }

  function updateWinRate() {
    if (raceCount === 0) {
      document.getElementById('winRate').innerText = "0.0";
      return;
    }
    let winPercentage = ((wins / raceCount) * 100).toFixed(1);
    document.getElementById('winRate').innerText = winPercentage;
  }

  function updateHorseStats() {
    horses.forEach(h => {
      let hWinRate = raceCount === 0 ? "0.0" : ((h.winCount / raceCount) * 100).toFixed(1);
      document.getElementById('stat-' + h.id).innerText = hWinRate + '%';
    });
  }

  function startRace() {
    isRacing = true;
    document.getElementById('betBtn').disabled = true;
    skipBtn.disabled = false;
    select.disabled = true;
    document.getElementById('wager').disabled = true;
    document.getElementById('message').innerText = "And they're off!";
    document.getElementById('message').style.color = "#fff";
    
    const trackWidth = track.clientWidth - 80; 
    let positions = Array(12).fill(60); // Starting at 60px to clear the text stats
    let elements = horses.map(h => document.getElementById('horse-' + h.id));
    
    let raceInterval = setInterval(() => {
      let finished = false;
      let winnerId = -1;

      for (let i = 0; i < 12; i++) {
        let move = Math.random() * 5; 
        positions[i] += move;
        elements[i].style.left = positions[i] + 'px';

        if (positions[i] >= trackWidth) {
          finished = true;
          winnerId = horses[i].id;
          break;
        }
      }

      if (finished) {
        clearInterval(raceInterval);
        resolveBet(winnerId);
      }
    }, 50);
    
    skipBtn.onclick = () => {
      clearInterval(raceInterval);
      skipBtn.disabled = true;
      
      let finished = false;
      let winnerId = -1;
      
      while (!finished) {
        for (let i = 0; i < 12; i++) {
          let move = Math.random() * 5; 
          positions[i] += move;
          
          if (positions[i] >= trackWidth && !finished) {
            finished = true;
            winnerId = horses[i].id;
          }
        }
      }
      
      for (let i = 0; i < 12; i++) {
        elements[i].style.left = Math.min(positions[i], trackWidth + 10) + 'px';
      }
      resolveBet(winnerId);
    };
  }

  function resolveBet(winnerId) {
    skipBtn.disabled = true; 
    raceCount++;
    
    let winner = horses.find(h => h.id === winnerId);
    winner.winCount++; // Increment the winning horse's stat

    let betHorse = horses.find(h => h.id === currentBet.horseId);
    let msg = `Race finished! ${winner.name} wins! `;
    let netResult = 0;
    
    if (currentBet.horseId === winnerId) {
      wins++; 
      let profit = currentBet.amount * winner.odds;
      let payout = currentBet.amount + profit;
      bankroll += payout; 
      netResult = profit;
      
      msg += `You won $${payout}!`;
      document.getElementById('message').style.color = "#2ed573";
    } else {
      netResult = -currentBet.amount; 
      msg += `You lost $${currentBet.amount}.`;
      document.getElementById('message').style.color = "#ff4757";
    }
    
    updateBankroll();
    updateWinRate(); 
    updateHorseStats(); 
    document.getElementById('message').innerText = msg;
    
    // Log result and save game state
    logResult(winner, betHorse, netResult);
    saveGame();
    
    setTimeout(() => {
      horses.forEach(h => {
        document.getElementById('horse-' + h.id).style.left = '60px';
      });
      document.getElementById('betBtn').disabled = false;
      select.disabled = false;
      document.getElementById('wager').disabled = false;
      document.getElementById('message').innerText = "Place your bets for the next race!";
      document.getElementById('message').style.color = "#2ed573";
      isRacing = false;
    }, 4000);
  }

  function logResult(winner, betHorse, netResult) {
    if (!resultsContainer.classList.contains('show')) {
      resultsContainer.classList.add('show');
    }

    // Add to history array
    raceHistory.unshift({
      raceNum: raceCount,
      winnerName: winner.name,
      betName: betHorse.name,
      wager: currentBet.amount,
      netResult: netResult,
      bankrollAfter: bankroll
    });

    renderHistory();
  }

  function renderHistory() {
    resultsBody.innerHTML = '';
    raceHistory.forEach(record => {
      let tr = document.createElement('tr');
      let netClass = record.netResult >= 0 ? 'text-win' : 'text-loss';
      let netText = record.netResult >= 0 ? `+$${record.netResult}` : `-$${Math.abs(record.netResult)}`;
      
      tr.innerHTML = `
        <td>${record.raceNum}</td>
        <td>${record.winnerName}</td>
        <td>${record.betName}</td>
        <td>$${record.wager}</td>
        <td class="${netClass}">${netText}</td>
        <td>$${record.bankrollAfter}</td>
      `;
      resultsBody.appendChild(tr);
    });
  }

  // --- AUTOSAVE FUNCTIONS ---
  function saveGame() {
    try {
      const state = {
        bankroll: bankroll,
        raceCount: raceCount,
        wins: wins,
        horseWins: horses.map(h => h.winCount),
        history: raceHistory
      };
      localStorage.setItem('horseRaceState', JSON.stringify(state));
    } catch (e) {
      console.warn("Autosave failed. LocalStorage might be disabled.");
    }
  }

  function loadGame() {
    try {
      const saved = localStorage.getItem('horseRaceState');
      if (saved) {
        const state = JSON.parse(saved);
        bankroll = state.bankroll || 1000;
        raceCount = state.raceCount || 0;
        wins = state.wins || 0;
        
        if (state.horseWins && state.horseWins.length === 12) {
          state.horseWins.forEach((winCnt, i) => {
            horses[i].winCount = winCnt;
          });
        }
        
        raceHistory = state.history || [];
        
        // Update the UI with loaded data
        updateBankroll();
        updateWinRate();
        updateHorseStats();
        
        if (raceHistory.length > 0) {
          renderHistory();
        }
      }
    } catch (e) {
      console.warn("Failed to load save data.");
    }
  }
</script>
</body>
</html>
