<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insect Explorer: Quiz & Gallery</title>
    <style>
        :root {
            --primary: #2e7d32;
            --bg: #eceff1;
            --text: #263238;
            --card: #ffffff;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centers everything vertically */
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px; /* Widened slightly for the gallery view */
            text-align: center; /* Centers all internal text and inline elements */
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 { 
            color: var(--primary); 
            margin-bottom: 10px;
        }
        
        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px; /* Pill-shaped buttons for a modern look */
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(46, 125, 50, 0.2);
        }
        
        button:hover { 
            background-color: #1b5e20; 
            box-shadow: 0 6px 12px rgba(46, 125, 50, 0.3);
        }
        button:active { transform: scale(0.97); }
        
        .btn-secondary { 
            background-color: #546e7a; 
            box-shadow: 0 4px 6px rgba(84, 110, 122, 0.2);
        }
        .btn-secondary:hover { 
            background-color: #37474f; 
            box-shadow: 0 6px 12px rgba(84, 110, 122, 0.3);
        }
        
        /* Views */
        #start-page, #quiz-page, #gallery-page { display: none; }
        .active-page { display: block !important; }

        /* Quiz UI */
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #546e7a;
        }

        .quiz-image-container {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin: 0 auto 30px auto;
            max-width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .quiz-image-container img {
            max-width: 100%;
            height: auto;
            max-height: 280px;
            border-radius: 8px;
        }

        #options-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        /* Gallery UI - Centered Flexbox */
        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; /* Centers the cards */
            gap: 25px;
            padding: 20px 0;
        }

        .gallery-item {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            width: 140px; /* Fixed width for uniform gallery look */
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.12); 
        }

        .gallery-item img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .gallery-item-title {
            font-weight: 600;
            color: var(--text);
            font-size: 16px;
        }
        
        /* Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(38, 50, 56, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card);
            padding: 40px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content img { 
            max-width: 100%; 
            height: 200px; 
            object-fit: contain; 
            margin-bottom: 20px;
        }
        
        .classification { 
            font-style: italic; 
            color: #78909c; 
            margin-bottom: 20px;
            font-size: 16px;
        }

        #modal-fact {
            font-size: 18px;
            line-height: 1.5;
            color: #455a64;
            margin-bottom: 30px;
        }

        #modal-diet {
            font-size: 12px;
            line-height: 1.5;
            color: #455a64;
            margin-bottom: 30px;
        }

    </style>
</head>

    <script>
        // --- Sound Effects System ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, now);
                oscillator.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } else if (type === 'wrong') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, now);
                oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } else if (type === 'click') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                oscillator.start(now);
                oscillator.stop(now + 0.1);
            } else if (type === 'win') {
                playTone(440, now, 0.1);       
                playTone(554.37, now + 0.1, 0.1); 
                playTone(659.25, now + 0.2, 0.3); 
            }
        }

        function playTone(freq, time, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.2, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
            osc.start(time);
            osc.stop(time + duration);
        }

        let currentQuestionIndex = 0;
        let score = 0;
        let quizQuestions = [];
        let synth = window.speechSynthesis;

        function speak(text) {
            if (synth.speaking) synth.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            let voices = synth.getVoices();
            let maleVoice = voices.find(v => 
                v.name.toLowerCase().includes('male') || 
                v.name.toLowerCase().includes('guy') || 
                v.name.toLowerCase().includes('david') ||
                v.name.toLowerCase().includes('mark')
            );
            if (maleVoice) utterance.voice = maleVoice;
            utterance.pitch = 0.9; 
            synth.speak(utterance);
        }

        function switchPage(pageId) {
            document.querySelectorAll('.container').forEach(el => el.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            if (synth.speaking) synth.cancel();
            window.scrollTo(0, 0);
        }

        function goHome() {
            switchPage('start-page');
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startQuiz() {
            score = 0;
            currentQuestionIndex = 0;
            quizQuestions = shuffleArray(insects).slice(0, 52);
            updateScoreUI();
            loadQuestion();
            switchPage('quiz-page');
            speak("Let's begin the insect quiz. What is this insect?");

        }

        function loadQuestion() {
            const currentBug = quizQuestions[currentQuestionIndex];
            document.getElementById('quiz-img').src = `images/${currentBug.file}`;
            document.getElementById('question-display').innerText = `Question: ${currentQuestionIndex + 1}/${quizQuestions.length}`;
            let options = [currentBug];
            let remainingBugs = shuffleArray(insects.filter(b => b.name !== currentBug.name));
            options.push(...remainingBugs.slice(0, 3));
            options = shuffleArray(options);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt.name;
                btn.onclick = () => checkAnswer(opt.name, currentBug.name);
                optionsContainer.appendChild(btn);
            });

            // --- NEW AUDIO LOGIC ---
                // If it's the first question, include the greeting. Otherwise, just ask.
                if (currentQuestionIndex === 0) {
                    speak("Let's begin. What is this insect?");
                } else {
                    speak("What is this insect?");
                }
        }

        function checkAnswer(selectedName, correctName) {
            if (selectedName === correctName) {
                score++;
                playSound('correct');
                speak(`Correct. It is a ${correctName}.`);

            } else {
                playSound('wrong');
                speak(`Incorrect. That was a ${correctName}.`);
            }
            
            currentQuestionIndex++;
            updateScoreUI();



            setTimeout(() => {
                if (currentQuestionIndex < quizQuestions.length) {
                    loadQuestion();
                } else {
                    endQuiz();
                }
            }, 3000);
        }

        function updateScoreUI() {
            document.getElementById('score-display').innerText = `Score: ${score}`;
        }

        function endQuiz() {
            playSound('win');
            const finalScore = `You scored ${score} out of ${quizQuestions.length}.`;
            speak(`Quiz complete. ${finalScore}`);
            document.getElementById('options-container').innerHTML = 
                `<div style="width: 100%; text-align: center;">
                    <h3 style="font-size: 24px;">Quiz Complete!</h3>
                    <p style="font-size: 18px; margin-bottom: 20px;">${finalScore}</p>
                    <button onclick="playSound('click'); startQuiz()">Play Again</button>
                </div>`;
        }

        function showGallery() {
            const grid = document.getElementById('gallery-grid');
            if (grid.innerHTML === '') {
                insects.forEach(bug => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.innerHTML = `
                        <img src="images/${bug.file}" alt="${bug.name}">
                        <div class="gallery-item-title">${bug.name}</div>
                    `;
                    div.onclick = () => { playSound('click'); openModal(bug); };
                    grid.appendChild(div);
                });
            }
            switchPage('gallery-page');
        }

        let currentModalBug = null;

        function openModal(bug) {
            currentModalBug = bug;
            document.getElementById('modal-img').src = `images/${bug.file}`;
            document.getElementById('modal-title').innerText = bug.name;
            document.getElementById('modal-class').innerText = `Order: ${bug.order}`;
            document.getElementById('modal-fact').innerText = bug.fact;
            document.getElementById('modal-diet').innerText = bug.diet;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal(force = false) {
            if (force === true || event.target.id === 'modal') {
                document.getElementById('modal').style.display = 'none';
                if (synth.speaking) synth.cancel();
            }
        }

        function readFactOutLoud() {
            if (currentModalBug) {
                speak(`${currentModalBug.name}. Scientific order: ${currentModalBug.order}. ${currentModalBug.fact}. ${currentModalBug.diet}`);
            }
        }
        
        speechSynthesis.onvoiceschanged = () => {
             synth.getVoices();
        };
    </script>
</body>
</html>
