<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global Asset Audit Terminal</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --border: #e2e8f0;
            --text-main: #334155;
            --text-dim: #94a3b8;
            --brand: #0f172a;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; padding: 40px; }
        .container { width: 100%; max-width: 450px; background: var(--panel); padding: 24px; border-radius: 4px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .header { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 20px; }
        
        .preview-pane { width: 100%; height: 220px; background: #f1f5f9; border-radius: 2px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .preview-pane img { width: 140px; height: 140px; image-rendering: pixelated; }

        .data-table { border-top: 1px solid var(--border); padding-top: 15px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; }
        .label { color: var(--text-dim); }

        input { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid var(--border); box-sizing: border-box; }
        button { width: 100%; background: var(--brand); color: white; border: none; padding: 14px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Global Asset Audit Terminal // ID System</div>

    <div class="preview-pane">
        <img id="sprite" src="" alt="Asset Preview">
    </div>

    <div class="data-table">
        <div class="row"><span class="label">ASSET_NAME</span><span id="name">PENDING</span></div>
        <div class="row"><span class="label">ID_REFERENCE</span><span id="id">000</span></div>
        <div class="row"><span class="label">STATUS</span><span id="status">UNINITIALIZED</span></div>
    </div>

    <input type="number" id="idInput" placeholder="Enter ID (1 - 1025)" min="1" max="1025">
    <button onclick="fetchAsset()">RETRIEVE SPECIFIC ID</button>
    <button onclick="fetchRandomAsset()" style="background: #475569;">PULL RANDOM ASSET</button>
</div>

<script>
    async function fetchAsset() {
        const id = document.getElementById('idInput').value;
        if (!id || id < 1 || id > 1025) return alert("Invalid ID range.");
        
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        const data = await response.json();

        document.getElementById('sprite').src = data.sprites.front_default;
        document.getElementById('name').innerText = data.name.toUpperCase();
        document.getElementById('id').innerText = data.id.toString().padStart(4, '0');
        document.getElementById('status').innerText = "DATA_SYNCED";
    }

    function fetchRandomAsset() {
        const randomID = Math.floor(Math.random() * 1025) + 1;
        document.getElementById('idInput').value = randomID;
        fetchAsset();
    }
</script>

</body>
</html>
