<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimon Tycoon & Digidex</title>
    <style>
        :root {
            --primary: #ff6600;
            --primary-dark: #cc5200;
            --bg-dark: #1a1a2e;
            --panel-bg: #16213e;
            --card-bg: #0f3460;
            --text-light: #f1f1f1;
            --accent: #e94560;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 3px solid var(--primary);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.8rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        .container {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* Dashboard Resource Bar */
        .resource-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .resource-card {
            background-color: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .resource-card h3 {
            margin: 0 0 5px 0;
            font-size: 0.9rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .resource-card span {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        /* Tycoon Layout */
        .tycoon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .tycoon-grid {
                grid-template-columns: 1fr;
            }
        }

        .tycoon-panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .tycoon-panel h2 {
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .build-item, .manager-item {
            background-color: var(--card-bg);
            border-radius: 6px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info div:first-child {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .item-info div:last-child {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 3px;
        }

        button.action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button.action-btn:hover:not(:disabled) {
            background-color: var(--primary-dark);
        }

        button.action-btn:disabled {
            background-color: #444;
            color: #777;
            cursor: not-allowed;
        }

        /* Digidex Layout */
        .digidex-header {
            margin-bottom: 20px;
        }

        .partner-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }

        .partner-btn {
            background-color: var(--panel-bg);
            border: 2px solid transparent;
            color: var(--text-light);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: 0.2s;
        }

        .partner-btn.active, .partner-btn:hover {
            border-color: var(--primary);
            background-color: var(--card-bg);
        }

        .evolution-line {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .evo-card {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .evo-stage {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .evo-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .evo-desc {
            font-size: 0.85rem;
            color: #bbb;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>Digimon Tycoon & Digidex</h1>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('tycoon')">Tycoon Base</button>
            <button class="tab-btn" onclick="switchTab('digidex')">Digidex</button>
        </div>
    </header>

    <div class="container">
        <!-- TYCOON SECTION -->
        <div id="tycoon-section" class="view-section active">
            <div class="resource-bar">
                <div class="resource-card">
                    <h3>Bits (Currency)</h3>
                    <span id="bits-display">0</span>
                </div>
                <div class="resource-card">
                    <h3>Data Fragments</h3>
                    <span id="data-display">0</span>
                </div>
                <div class="resource-card">
                    <h3>Digi-Core Power</h3>
                    <span id="power-display">0</span>/sec
                </div>
            </div>

            <div class="tycoon-grid">
                <!-- Facilities / Buildings -->
                <div class="tycoon-panel">
                    <h2>Training Facilities</h2>
                    <div id="buildings-list">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Managers / Automation -->
                <div class="tycoon-panel">
                    <h2>Tamer Automations</h2>
                    <div id="managers-list">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- DIGIDEX SECTION -->
        <div id="digidex-section" class="view-section">
            <div class="digidex-header">
                <h2>Legendary Partner Digimon Database</h2>
                <p>Explore the evolutionary lines of the main 8 DigiDestined from In-Training to Mega!</p>
            </div>

            <div class="partner-selector" id="partner-selector">
                <!-- Populated by JS -->
            </div>

            <div class="evolution-line" id="evolution-line">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        const game = {
            bits: 10,
            data: 0,
            totalPower: 0,
            buildings: {
                meatFarm: { name: "Meat Farm", cost: 15, power: 1, owned: 0, costMult: 1.15, desc: "Produces Bits from basic Digital Meat." },
                trainingGym: { name: "Rookie Gym", cost: 100, power: 5, owned: 0, costMult: 1.2, desc: "Generates Bits via Rookie sparring matches." },
                colosseum: { name: "Champion Colosseum", cost: 1100, power: 32, owned: 0, costMult: 1.22, desc: "High-tier matches yielding massive Bits." },
                serverCore: { name: "Server Core Hub", cost: 14000, power: 260, owned: 0, costMult: 1.25, desc: "Taps directly into core network architecture." }
            },
            managers: {
                tanemon: { name: "Tanemon Farm Auto", cost: 200, owned: false, target: "meatFarm", desc: "Automates Meat Farm production completely." },
                koromon: { name: "Koromon Sparring Bot", cost: 1500, owned: false, target: "trainingGym", desc: "Runs the Rookie Gym automatically." }
            }
        };

        // --- DIGIDEX DATA (Main 8 Partners: In-Training to Mega) ---
        const digidexData = [
            {
                partner: "Tai & Agumon",
                crest: "Courage",
                line: [
                    { stage: "In-Training", name: "Koromon", desc: "A small slime Digimon covered in soft, pink fuzz. It can spit bubbles to intimidate foes." },
                    { stage: "Rookie", name: "Agumon", desc: "A small dinosaur Digimon that walks on two legs. It breathes fire breath from its mouth." },
                    { stage: "Champion", name: "Greymon", desc: "A giant dinosaur Digimon with a tough skull shell resembling a triceratops shield." },
                    { stage: "Ultimate", name: "MetalGreymon", desc: "A cyborg dinosaur equipped with organic-steel armor and powerful organic missiles." },
                    { stage: "Mega", name: "WarGreymon", desc: "The ultimate dragon warrior clad in Chrome Digizoid armor, wielding the Brave Shield." }
                ]
            },
            {
                partner: "Matt & Gabumon",
                crest: "Friendship",
                line: [
                    { stage: "In-Training", name: "Tsunomon", desc: "A tiny fur-covered Digimon featuring a sharp horn protruding right from its head." },
                    { stage: "Rookie", name: "Gabumon", desc: "A timid reptile Digimon that wears a pelt skinned off a Garurumon to stay warm." },
                    { stage: "Champion", name: "Garurumon", desc: "A blue wolf beast Digimon covered in freezing silver-white fur with supreme agility." },
                    { stage: "Ultimate", name: "WereGarurumon", desc: "A bipedal werewolf martial artist capable of incredible leaping kicks and claw strikes." },
                    { stage: "Mega", name: "MetalGarurumon", desc: "A fully mechanized cyborg wolf loaded with hidden missile batteries and freezing beams." }
                ]
            },
            {
                partner: "Sora & Biyomon",
                crest: "Love",
                line: [
                    { stage: "In-Training", name: "Yokomon", desc: "A bulb-headed plant Digimon whose flower head changes expression based on its mood." },
                    { stage: "Rookie", name: "Biyomon", desc: "A pink bird Digimon with wings shaped like arms, allowing it to grasp objects deftly." },
                    { stage: "Champion", name: "Birdramon", desc: "A giant flaming phoenix-like bird soaring through the sky wrapped in burning hot fire." },
                    { stage: "Ultimate", name: "Garudamon", desc: "A humanoid bird deity possessing immense spiritual strength and protective instincts." },
                    { stage: "Mega", name: "Hououmon (Phoenixmon)", desc: "A sacred mythical bird of fire adorned with holy rings, bringing peace and purification." }
                ]
            },
            {
                partner: "Izzy & Tentomon",
                crest: "Knowledge",
                line: [
                    { stage: "In-Training", name: "Motimon", desc: "A paddy-shaped elastic organism with exceptional computational capability and processors." },
                    { stage: "Rookie", name: "Tentomon", desc: "An insectoid shell-backed Digimon that communicates using analytical insect logic." },
                    { stage: "Champion", name: "Kabuterimon", desc: "A giant armored beetle Digimon utilizing massive pincers and electric shock waves." },
                    { stage: "Ultimate", name: "MegaKabuterimon", desc: "An evolved insect warrior equipped with heavy armor plating and four powerful wings." },
                    { stage: "Mega", name: "HerculesKabuterimon", desc: "The supreme golden beetle monarch boasting absolute defense and heavy particle cannons." }
                ]
            },
            {
                partner: "Mimi & Palmon",
                crest: "Sincerity / Purity",
                line: [
                    { stage: "In-Training", name: "Tanemon", desc: "A budding seed Digimon that hides underground with only its head sprout visible." },
                    { stage: "Rookie", name: "Palmon", desc: "A tropical plant Digimon featuring a large sweet-scented flower blooming on its head." },
                    { stage: "Champion", name: "Togemon", desc: "A desert cactus brawler that shoots hard thorn needles and packs a heavy punch." },
                    { stage: "Ultimate", name: "Lillymon", desc: "A delicate fairy princess Digimon emerging from a flower bud, commanding nature's energy." },
                    { stage: "Mega", name: "Rosemon", desc: "The queen of flowers, draped in gorgeous aesthetic grace and wielding the Tiarabursto whip." }
                ]
            },
            {
                partner: "Joe & Gomamon",
                crest: "Reliability",
                line: [
                    { stage: "In-Training", name: "Pukamon", desc: "A marine-type floating balloon Digimon sporting a tiny horn atop its soft head." },
                    { stage: "Rookie", name: "Gomamon", desc: "A playful aquatic seal pup Digimon capable of commanding schools of fish companions." },
                    { stage: "Champion", name: "Ikkakumon", desc: "A massive marine walrus beast with an unyielding spiral horn forged from pure ice." },
                    { stage: "Ultimate", name: "Zudomon", desc: "A pre-historic marine beast wielding a heavy metal-plated shell and the legendary Thor Hammer." },
                    { stage: "Mega", name: "Vikemon", desc: "A supreme northern viking warlord clad in thick furs, commanding freezing blizzards." }
                ]
            },
            {
                partner: "T.K. & Patamon",
                crest: "Hope",
                line: [
                    { stage: "In-Training", name: "Tokomon", desc: "A round buoyant creature featuring a large mouth filled with surprisingly sharp teeth." },
                    { stage: "Rookie", name: "Patamon", desc: "A cute mammal-like Digimon with large ears that double as wings for clumsy flight." },
                    { stage: "Champion", name: "Angemon", desc: "A majestic celestial angel wrapped in holy white cloth, wielding the Rod of Virtue." },
                    { stage: "Ultimate", name: "MagnaAngemon", desc: "A high-ranking warrior priest holding the Gate of Destiny to banish evil into dimensions." },
                    { stage: "Mega", name: "Seraphimon", desc: "The highest ranking celestial seraph angel encased in brilliant holy armor and pure light." }
                ]
            },
            {
                partner: "Kari & Gatomon",
                crest: "Light",
                line: [
                    { stage: "In-Training", name: "Nyaromon", desc: "A feline-type agile training Digimon with sensitive whiskers tuned to network signals." },
                    { stage: "Rookie", name: "Salamon", desc: "A holy mammalian puppy Digimon possessing sacred data properties hidden in its tail ring." },
                    { stage: "Champion", name: "Gatomon", desc: "A cunning sacred cat beast that wears a holy ring granting it exceptional combat strength." },
                    { stage: "Ultimate", name: "Angewomon", desc: "A radiant archangel humanoid warrior of light wielding celestial bow and arrows." },
                    { stage: "Mega", name: "Ophanimon (or Magnadramon)", desc: "A supreme holy mother throne-angel governing divine love, light, and cosmic order." }
                ]
            }
        ];

        // --- NAVIGATION LOGIC ---
        function switchTab(tabId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabId === 'tycoon') {
                document.getElementById('tycoon-section').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (tabId === 'digidex') {
                document.getElementById('digidex-section').classList.add('active');
                event.currentTarget.classList.add('active');
                renderDigidex();
            }
        }

        // --- TYCOON LOGIC ---
        function buyBuilding(key) {
            const b = game.buildings[key];
            if (game.bits >= b.cost) {
                game.bits -= b.cost;
                b.owned += 1;
                b.cost = Math.floor(b.cost * b.costMult);
                updateTycoonUI();
            }
        }

        function buyManager(key) {
            const m = game.managers[key];
            if (!m.owned && game.bits >= m.cost) {
                game.bits -= m.cost;
                m.owned = true;
                updateTycoonUI();
            }
        }

        function updateTycoonUI() {
            // Calculate total power generation rate
            let pps = 0;
            for (let key in game.buildings) {
                pps += game.buildings[key].owned * game.buildings[key].power;
            }
            game.totalPower = pps;

            // Render Bits & Stats
            document.getElementById('bits-display').innerText = Math.floor(game.bits);
            document.getElementById('data-display').innerText = Math.floor(game.data);
            document.getElementById('power-display').innerText = game.totalPower;

            // Render Buildings HTML
            let bHtml = '';
            for (let key in game.buildings) {
                let b = game.buildings[key];
                // Check if manager automates this
                let automated = false;
                if (key === 'meatFarm' && game.managers.tanemon.owned) automated = true;
                if (key === 'trainingGym' && game.managers.koromon.owned) automated = true;

                bHtml += `
                    <div class="build-item">
                        <div class="item-info">
                            <div>${b.name} (Owned: ${b.owned}) ${automated ? '⚡ [Auto]' : ''}</div>
                            <div>+${b.power} Bits/s | Cost: ${b.cost} Bits</div>
                        </div>
                        <button class="action-btn" onclick="buyBuilding('${key}')" ${game.bits < b.cost ? 'disabled' : ''}>Buy</button>
                    </div>
                `;
            }
            document.getElementById('buildings-list').innerHTML = bHtml;

            // Render Managers HTML
            let mHtml = '';
            for (let key in game.managers) {
                let m = game.managers[key];
                mHtml += `
                    <div class="manager-item">
                        <div class="item-info">
                            <div>${m.name}</div>
                            <div>${m.desc} (Cost: ${m.cost} Bits)</div>
                        </div>
                        <button class="action-btn" onclick="buyManager('${key}')" ${m.owned || game.bits < m.cost ? 'disabled' : ''}>
                            ${m.owned ? 'Hired' : 'Hire'}
                        </button>
                    </div>
                `;
            }
            document.getElementById('managers-list').innerHTML = mHtml;
        }

        // --- DIGIDEX RENDERING LOGIC ---
        let selectedPartnerIndex = 0;

        function renderDigidex() {
            // Render partner buttons selector tabs if empty
            const selectorContainer = document.getElementById('partner-selector');
            if (selectorContainer.children.length === 0) {
                let sHtml = '';
                digidexData.forEach((item, index) => {
                    sHtml += `
                        <button class="partner-btn ${index === selectedPartnerIndex ? 'active' : ''}" onclick="selectPartner(${index})">
                            ${item.partner.split(' & ')[1]}<br><small style="color:#aaa;">${item.partner.split(' & ')[0]}</small>
                        </button>
                    `;
                });
                selectorContainer.innerHTML = sHtml;
            }

            // Render Evolution Line Cards
            const lineContainer = document.getElementById('evolution-line');
            const currentPartner = digidexData[selectedPartnerIndex];
            
            let eHtml = '';
            currentPartner.line.forEach(evo => {
                eHtml += `
                    <div class="evo-card">
                        <div class="evo-stage">${evo.stage}</div>
                        <div class="evo-name">${evo.name}</div>
                        <div class="evo-desc">${evo.desc}</div>
                    </div>
                `;
            });
            lineContainer.innerHTML = eHtml;
        }

        function selectPartner(index) {
            selectedPartnerIndex = index;
            document.querySelectorAll('.partner-btn').forEach((btn, idx) => {
                if (idx === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            renderDigidex();
        }

        // --- GAME TICK LOOP ---
        setInterval(() => {
            // Passive income generation from buildings
            if (game.totalPower > 0) {
                game.bits += game.totalPower * 0.1; // 10 ticks per second execution step logic
                // Accumulate Data fragments as a secondary resource scaled down
                game.data += (game.totalPower * 0.005);
                updateTycoonUI();
            }
        }, 100);

        // Initial UI Call
        updateTycoonUI();
    </script>
</body>
</html>
