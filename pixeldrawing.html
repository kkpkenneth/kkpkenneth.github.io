<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Drawing</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      font-family: monospace;
      /* Prevent pull-to-refresh on mobile browsers */
      overscroll-behavior-y: contain; 
    }

    .rainbow-pixel-canvas {
      width: 100%;
      /* Use Viewport Height (vh) so it fits any phone screen */
      height: 75vh; 
      box-sizing: border-box;
      background: white;
      border-bottom: 2px solid #eee;

      /* Prevents the browser from hijacking touches for scrolling */
      user-select: none;
      touch-action: none;
    }

    .instructions {
      padding: 10px;
    }

    p {
      text-align: center;
      font-size: 1rem;
      margin: 10px 0;
      color: #333;
    }
  </style>
</head>
<body>

  <canvas class="rainbow-pixel-canvas"></canvas>
  
  <div class="instructions">
    <p><strong>Drag</strong> to draw. <strong>Double tap</strong> to clear.</p>
    <p>Draw about a country and ask your friends to guess!</p>
  </div>

<script type="module">
import interact from 'https://cdn.interactjs.io/v1.10.11/interactjs/index.js'

var pixelSize = 16

interact('.rainbow-pixel-canvas')
  .draggable({
    max: Infinity,
    maxPerElement: Infinity,
    origin: 'self',
    modifiers: [
      interact.modifiers.snap({
        // snap to the corners of a grid
        targets: [
          interact.snappers.grid({ x: pixelSize, y: pixelSize })
        ]
      })
    ],
    listeners: {
      // draw colored squares on move
      move: function (event) {
        var context = event.target.getContext('2d')
        // calculate the angle of the drag direction
        var dragAngle = 180 * Math.atan2(event.dx, event.dy) / Math.PI

        // set color based on drag angle and speed
        context.fillStyle =
          'hsl(' +
          dragAngle +
          ', 86%, ' +
          (30 + Math.min(event.speed / 1000, 1) * 50) +
          '%)'

        // draw squares
        context.fillRect(
          event.pageX - pixelSize / 2,
          event.pageY - pixelSize / 2,
          pixelSize,
          pixelSize
        )
      }
    }
  })
  // clear the canvas on doubletap
  .on('doubletap', function (event) {
    var context = event.target.getContext('2d')

    context.clearRect(0, 0, context.canvas.width, context.canvas.height)
    resizeCanvases()
  })

function resizeCanvases () {
  [].forEach.call(document.querySelectorAll('.rainbow-pixel-canvas'), function (
    canvas
  ) {
    delete canvas.width
    delete canvas.height

    var rect = canvas.getBoundingClientRect()

    canvas.width = rect.width
    canvas.height = rect.height
  })
}

// Initialize canvas size
resizeCanvases()

// Update canvas size if the user rotates their phone
interact(window).on('resize', resizeCanvases)
</script>
  
</body>
</html>
