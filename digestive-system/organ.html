<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organ Tycoon</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a2e; 
        user-select: none;
    }

    /* The Body Canvas Container */
    #body-canvas {
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 100vw; 
        height: 100vh;
        background: radial-gradient(circle, #16213e 0%, #0f3460 70%, #1a1a2e 100%);
        z-index: 1; 
    }

    /* Start Screen */
    #start-screen {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: radial-gradient(circle, #e94560, #0f3460, #1a1a2e);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        color: white;
    }
    #start-screen h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    #start-btn {
        padding: 15px 40px; font-size: 1.5em; font-weight: bold;
        background: #e94560; color: white; border: none; border-radius: 50px;
        cursor: pointer; box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        transition: transform 0.2s;
    }
    #start-btn:hover { transform: scale(1.1); }

    /* UI Overlay */
    #ui-layer {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 10; padding: 20px; box-sizing: border-box;
        display: flex; justify-content: space-between; align-items: flex-start;
    }
    
    .hud-column {
        display: flex; flex-direction: column; gap: 10px;
    }

    .hud-box {
        background: rgba(22, 33, 62, 0.75); backdrop-filter: blur(5px);
        padding: 15px 25px; border-radius: 15px; border: 2px solid rgba(233, 69, 96, 0.6);
        color: #fff; font-weight: bold; font-size: 1.5em; pointer-events: auto;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    
    #auto-harvest-box {
        font-size: 1em; padding: 10px 20px; background: rgba(76, 175, 80, 0.4); border-color: rgba(76, 175, 80, 0.8);
        display: none; 
    }

    .btn-column {
        display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    }

    #sound-btn, #reset-btn {
        cursor: pointer; transition: transform 0.2s; color: white; font-size: 1em; padding: 10px 15px;
    }
    #sound-btn { background: rgba(76, 175, 80, 0.3); border: 2px solid rgba(76, 175, 80, 0.6); }
    #sound-btn:hover { transform: scale(1.05); background: rgba(76, 175, 80, 0.5); }

    #collection-btn {
        background: rgba(233, 69, 96, 0.3); cursor: pointer; transition: transform 0.2s; border: 2px solid rgba(233, 69, 96, 0.6); color: white;
    }
    #collection-btn:hover { transform: scale(1.05); }

    #reset-btn { background: rgba(255, 71, 87, 0.3); border: 2px solid rgba(255, 71, 87, 0.6); }
    #reset-btn:hover { transform: scale(1.05); background: rgba(255, 71, 87, 0.5); }

    /* Organ Elements */
    .organ {
        position: absolute;
        cursor: grab;
        transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex; 
        flex-direction: column;
        justify-content: center; 
        align-items: center;
        touch-action: none;
    }
    .organ:active { cursor: grabbing; }
    
    .organ-name {
        font-size: 14px;
        font-weight: bold;
        color: #fff;
        background: rgba(15, 52, 96, 0.8);
        padding: 4px 10px;
        border-radius: 12px;
        margin-bottom: 5px;
        pointer-events: none;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        border: 1px solid rgba(233, 69, 96, 0.4);
    }

    .organ-img {
        width: 80px;
        height: 80px;
        object-fit: contain;
        user-select: none;
        pointer-events: none;
        filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4));
    }

    .organ.clicked {
        transform: scale(1.2) !important;
    }

    /* Floating Point Animation */
    .floating-cell {
        position: absolute;
        color: #4caf50;
        font-size: 1.2em;
        font-weight: bold;
        pointer-events: none;
        animation: floatUp 1s ease-out forwards;
        z-index: 50;
        text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    @keyframes floatUp {
        0% { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
    }

    /* Modals */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7); z-index: 100;
        display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px);
    }
    
    .modal {
        background: rgba(22, 33, 62, 0.9); 
        backdrop-filter: blur(16px); 
        -webkit-backdrop-filter: blur(16px);
        border-radius: 25px; 
        color: white; padding: 30px; 
        max-width: 800px; width: 90%; max-height: 85vh; overflow-y: auto; text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.7), inset 0 0 30px rgba(233, 69, 96, 0.1);
        border: 2px solid rgba(233, 69, 96, 0.3);
    }
    
    .modal::-webkit-scrollbar { width: 8px; }
    .modal::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
    .modal::-webkit-scrollbar-thumb { background: rgba(233, 69, 96, 0.5); border-radius: 10px; }

    .modal h2 { 
        margin-top: -10px; padding-top: 10px; color: #e94560; font-size: 2.2em; 
        position: sticky; top: 0; 
        background: transparent; 
        padding-bottom: 15px; z-index: 2; 
        border-bottom: 2px solid rgba(233, 69, 96, 0.3);
        box-shadow: 0 10px 15px -10px rgba(0,0,0,0.5);
    }
    
    /* Catalog Grid */
    #collection-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; padding-top: 15px;
    }
    .collection-item {
        background: rgba(15, 52, 96, 0.4); padding: 15px; border-radius: 15px;
        display: flex; flex-direction: column; align-items: center; 
        border: 1px solid rgba(233, 69, 96, 0.2);
        transition: transform 0.2s, background 0.2s;
    }
    .collection-item:hover {
        background: rgba(15, 52, 96, 0.8);
        transform: translateY(-3px);
    }
    .collection-item.locked .organ-img {
        filter: grayscale(100%) brightness(0.3); 
    }
    .collection-item .name-tag { font-weight: bold; margin-bottom: 10px; font-size: 0.95em; height: 35px; display: flex; align-items: center; text-align: center; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8);}
    .collection-item .count-badge { color: #4caf50; font-size: 0.9em; margin-left: 5px; }
    
    .btn-group {
        display: flex; gap: 5px; width: 100%; margin-top: auto;
    }
    .buy-btn {
        background: linear-gradient(180deg, #4caf50, #388e3c); color: white; border: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; font-size: 0.85em; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3); transition: transform 0.1s;
    }
    .buy-btn:active { transform: scale(0.95); }
    .buy-btn:disabled { background: rgba(255,255,255,0.1); color: #718093; cursor: not-allowed; box-shadow: none; border: 1px solid rgba(255,255,255,0.1); }
    
    .remove-btn {
        background: linear-gradient(180deg, #ff4757, #ff6b81); color: white; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85em; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3); transition: transform 0.1s; flex: 0.3;
    }
    .remove-btn:active { transform: scale(0.95); }
    .remove-btn:hover { filter: brightness(1.1); }

    .close-btn { background: rgba(233, 69, 96, 0.4); color: white; border: none; padding: 10px 30px; border-radius: 10px; cursor: pointer; font-size: 1.2em; font-weight: bold; transition: transform 0.2s; margin-top: 10px;}
    .close-btn:hover { transform: scale(1.05); }

    /* Popups */
    #unlock-popup, #auto-popup { z-index: 300; }
    #popup-visual .organ-img { margin: 20px 0; width: 120px; height: 120px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    #auto-popup .modal { max-width: 500px; }
    .gear-icon { font-size: 5em; margin: 15px 0; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));}

    @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<div id="start-screen">
    <h1>🧬 Organ Tycoon</h1>
    <p>Build your biological empire. Tap & Drag organs for Cells.</p>
    <button id="start-btn">Enter Body</button>
</div>

<div id="ui-layer" style="display: none;">
    <div class="hud-column">
        <div class="hud-box">🦠 <span id="cell-count">10</span> Cells</div>
        <div class="hud-box" id="auto-harvest-box">⚙️ Auto: +<span id="auto-rate">0</span>/s</div>
    </div>
    <div class="btn-column">
        <button id="collection-btn" class="hud-box">📖 Organ Catalog</button>
        <button id="sound-btn" class="hud-box">🔊 Speech/Sound</button>
        <button id="reset-btn" class="hud-box">⚠️ Reset</button>
    </div>
</div>

<div id="body-canvas"></div>

<!-- Catalog Modal -->
<div id="collection-modal" class="modal-overlay">
    <div class="modal">
        <h2>Organ Catalog</h2>
        <div id="collection-grid"></div>
        <button class="close-btn" onclick="document.getElementById('collection-modal').style.display='none'">Close</button>
    </div>
</div>

<!-- Unlock Popup Modal -->
<div id="unlock-popup" class="modal-overlay">
    <div class="modal" style="overflow: hidden; max-height: 450px;">
        <h2 style="position: relative; background: transparent; border: none; box-shadow: none; margin-bottom: 0;">New Organ Discovered!</h2>
        <div id="popup-visual"></div>
        <h3 id="popup-name" style="margin-top: 0; font-size: 1.8em; color: white;">Mouth</h3>
        <button class="close-btn" onclick="closeUnlockPopup()">Awesome!</button>
    </div>
</div>

<!-- Auto-Harvest Unlocked Popup -->
<div id="auto-popup" class="modal-overlay">
    <div class="modal" style="overflow: hidden; max-height: 400px;">
        <h2 style="position: relative; background: transparent; border: none; box-shadow: none; margin-bottom: 0; color: #4caf50;">System Thriving!</h2>
        <div class="gear-icon">🦠</div>
        <h3 style="margin-top: 0; font-size: 1.5em; color: white;">Passive Cell Generation Activated</h3>
        <p style="font-size: 1.1em; color: #d1d8e0; margin-bottom: 20px;">Your connected organ network is now producing cells automatically every second!</p>
        <button class="close-btn" onclick="document.getElementById('auto-popup').style.display='none'">Keep Growing</button>
    </div>
</div>

<script>
    let isMuted = false;

    // Text-to-Speech function
    function speakText(text) {
        if (isMuted) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    // --- Organ Database ---
    const organData = [
        { id: 'mouth', name: 'Mouth', img: 'mouth.png', cost: 10, cellsPerClick: 1 },
        { id: 'pharyx', name: 'Pharynx', img: 'pharyx.png', cost: 20, cellsPerClick: 2 },
        { id: 'esophagus', name: 'Esophagus', img: 'esophagus.png', cost: 35, cellsPerClick: 3 },
        { id: 'gallbladder', name: 'Gallbladder', img: 'gallbladder.png', cost: 50, cellsPerClick: 4 },
        { id: 'pancreas', name: 'Pancreas', img: 'pancreas.png', cost: 75, cellsPerClick: 5 },
        { id: 'liver', name: 'Liver', img: 'liver.png', cost: 100, cellsPerClick: 6 },
        { id: 'small-intestine', name: 'Small Intestine', img: 'small-intestine.png', cost: 150, cellsPerClick: 8 },
        { id: 'large-intestine', name: 'Large Intestine', img: 'large-intestine.png', cost: 250, cellsPerClick: 12 },
        { id: 'appendix', name: 'Appendix', img: 'appendix.png', cost: 400, cellsPerClick: 15 },
        { id: 'anus', name: 'Anus', img: 'anus.png', cost: 600, cellsPerClick: 20 }
    ];

    let cells = 10;
    let unlockedIds = [];
    let everUnlockedIds = []; 
    let activeOrgans = [];
    let pendingAutoPopup = false; 

    // --- Local Storage ---
    function saveProgress() {
        localStorage.setItem("organTycoonCells", cells);
        localStorage.setItem("organTycoonUnlocks", JSON.stringify(unlockedIds));
        localStorage.setItem("organTycoonEverUnlocks", JSON.stringify(everUnlockedIds));
        
        const organStates = activeOrgans.map(org => ({
            id: org.id, x: org.x, y: org.y
        }));
        localStorage.setItem("organTycoonStates", JSON.stringify(organStates));
    }

    function loadProgress() {
        const savedCells = localStorage.getItem("organTycoonCells");
        const savedUnlocks = localStorage.getItem("organTycoonUnlocks");
        const savedEverUnlocks = localStorage.getItem("organTycoonEverUnlocks");
        
        if (savedCells !== null) cells = parseInt(savedCells, 10);
        if (savedUnlocks !== null) unlockedIds = JSON.parse(savedUnlocks);
        if (savedEverUnlocks !== null) everUnlockedIds = JSON.parse(savedEverUnlocks);
        
        updateUI();
    }

    // --- Game Logic ---
    function updateUI() {
        document.getElementById('cell-count').innerText = cells.toLocaleString();
        
        const autoBox = document.getElementById('auto-harvest-box');
        if (activeOrgans.length >= 4) {
            autoBox.style.display = 'block';
            let cellsPerSecond = activeOrgans.reduce((sum, org) => sum + org.cellsPerClick, 0);
            document.getElementById('auto-rate').innerText = cellsPerSecond.toLocaleString();
        } else {
            autoBox.style.display = 'none';
        }
    }

    function spawnOrgan(organDef, savedState = null) {
        const canvas = document.getElementById('body-canvas');
        const el = document.createElement('div');
        el.className = 'organ';
        
        el.innerHTML = `
            <div class="organ-name">${organDef.name}</div>
            <img class="organ-img" src="${organDef.img}" alt="${organDef.name}">
        `;
        
        let x, y;
        
        if (savedState) {
            x = savedState.x; y = savedState.y;
        } else {
            x = Math.random() * (window.innerWidth - 100);
            y = Math.random() * (window.innerHeight - 130);
        }

        el.style.left = x + 'px'; el.style.top = y + 'px';

        el.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            cells += organDef.cellsPerClick;
            updateUI();
            saveProgress();
            speakText(organDef.name);

            el.classList.add('clicked');
            setTimeout(() => el.classList.remove('clicked'), 200);

            const floatCell = document.createElement('div');
            floatCell.className = 'floating-cell';
            floatCell.innerText = `+${organDef.cellsPerClick} 🦠`;
            floatCell.style.left = e.clientX + 'px';
            floatCell.style.top = (e.clientY - 5) + 'px';
            canvas.appendChild(floatCell);
            setTimeout(() => floatCell.remove(), 1000);

            let orgObj = activeOrgans.find(o => o.el === el);
            if (orgObj) {
                orgObj.isDragging = true;
                el.setPointerCapture(e.pointerId);
                orgObj.offsetX = e.clientX - orgObj.x;
                orgObj.offsetY = e.clientY - orgObj.y;
            }
        });

        el.addEventListener('pointermove', (e) => {
            let orgObj = activeOrgans.find(o => o.el === el);
            if (orgObj && orgObj.isDragging) {
                orgObj.x = e.clientX - orgObj.offsetX;
                orgObj.y = e.clientY - orgObj.offsetY;
                el.style.left = orgObj.x + 'px';
                el.style.top = orgObj.y + 'px';
            }
        });

        const endDrag = (e) => {
            let orgObj = activeOrgans.find(o => o.el === el);
            if (orgObj) {
                orgObj.isDragging = false;
                el.releasePointerCapture(e.pointerId);
                saveProgress();
            }
        };

        el.addEventListener('pointerup', endDrag);
        el.addEventListener('pointercancel', endDrag);

        canvas.appendChild(el);
        
        activeOrgans.push({ 
            id: organDef.id, el, x, y, 
            isDragging: false, cellsPerClick: organDef.cellsPerClick
        });
    }

    // Auto Harvest Loop (Passive Income)
    setInterval(() => {
        if (activeOrgans.length >= 4) {
            let cellsPerSecond = 0;
            const canvas = document.getElementById('body-canvas');
            
            activeOrgans.forEach(org => {
                if (org.cellsPerClick > 0) {
                    cellsPerSecond += org.cellsPerClick;
                    const floatCell = document.createElement('div');
                    floatCell.className = 'floating-cell';
                    floatCell.innerText = `+${org.cellsPerClick} 🦠`;
                    
                    const offsetX = (Math.random() * 40) - 10;
                    floatCell.style.left = (org.x + 30 + offsetX) + 'px';
                    floatCell.style.top = (org.y + 10) + 'px';
                    
                    canvas.appendChild(floatCell);
                    setTimeout(() => floatCell.remove(), 1000);
                }
            });
            
            if (cellsPerSecond > 0) {
                cells += cellsPerSecond;
                updateUI();
            }
        }
        saveProgress();
    }, 1000);

    // --- UI Modals & Catalog ---
    function openCollection() {
        const grid = document.getElementById('collection-grid');
        grid.innerHTML = '';
        
        organData.forEach((a) => {
            const count = unlockedIds.filter(id => id === a.id).length;
            const hasBeenUnlocked = everUnlockedIds.includes(a.id);
            const isUnlocked = count > 0;
            
            const item = document.createElement('div');
            item.className = `collection-item ${hasBeenUnlocked ? '' : 'locked'}`;
            
            const canAfford = cells >= a.cost;
            const removeBtnHTML = isUnlocked ? `<button class="remove-btn" onclick="removeOrgan('${a.id}')">X</button>` : '';

            const btnHTML = `
                <div class="btn-group">
                    <button class="buy-btn" ${canAfford ? '' : 'disabled'} onclick="unlockOrgan('${a.id}')">
                        Buy<br>(${a.cost.toLocaleString()} 🦠)
                    </button>
                    ${removeBtnHTML}
                </div>
            `;

            const countBadge = isUnlocked ? `<span class="count-badge">(x${count})</span>` : '';

            item.innerHTML = `
                <img class="organ-img" src="${a.img}" style="width: 50px; height: 50px; margin-bottom: 10px;" alt="${hasBeenUnlocked ? a.name : '???'}">
                <div class="name-tag">${hasBeenUnlocked ? a.name : '???'} ${countBadge}</div>
                ${btnHTML}
            `;
            grid.appendChild(item);
        });
        document.getElementById('collection-modal').style.display = 'flex';
    }

    window.unlockOrgan = function(id) {
        const organ = organData.find(a => a.id === id);
        
        if (cells >= organ.cost) {
            const isFirstTimeEver = !everUnlockedIds.includes(id);
            const wasBelowThreshold = activeOrgans.length < 4;
            
            cells -= organ.cost;
            unlockedIds.push(id);
            if (isFirstTimeEver) everUnlockedIds.push(id);
            
            spawnOrgan(organ);
            updateUI();
            saveProgress();
            speakText(organ.name);
            
            if (wasBelowThreshold && activeOrgans.length >= 4) {
                pendingAutoPopup = true;
            }

            if (isFirstTimeEver) {
                document.getElementById('collection-modal').style.display = 'none';
                document.getElementById('popup-visual').innerHTML = `<img class="organ-img" src="${organ.img}" style="width: 120px; height: 120px;">`;
                document.getElementById('popup-name').innerText = organ.name;
                document.getElementById('unlock-popup').style.display = 'flex';
            } 
            else if (pendingAutoPopup) {
                document.getElementById('collection-modal').style.display = 'none';
                document.getElementById('auto-popup').style.display = 'flex';
                pendingAutoPopup = false; 
            } 
            else {
                openCollection(); 
            }
        }
    };

    window.removeOrgan = function(id) {
        const unlockIndex = unlockedIds.indexOf(id);
        if (unlockIndex > -1) unlockedIds.splice(unlockIndex, 1);
        
        const activeIndex = activeOrgans.findIndex(a => a.id === id);
        if (activeIndex > -1) {
            activeOrgans[activeIndex].el.remove();
            activeOrgans.splice(activeIndex, 1);
        }

        updateUI();
        saveProgress();
        openCollection(); 
    };

    window.closeUnlockPopup = function() {
        document.getElementById('unlock-popup').style.display = 'none';
        if (pendingAutoPopup) {
            document.getElementById('auto-popup').style.display = 'flex';
            pendingAutoPopup = false;
        }
    };

    // Modal Background Click-to-Close Listeners
    ['collection-modal', 'unlock-popup', 'auto-popup'].forEach(id => {
        document.getElementById(id).addEventListener('click', (e) => {
            if (e.target.id === id) e.target.style.display = 'none';
        });
    });

    // Sound / TTS Mute Toggle
    document.getElementById('sound-btn').addEventListener('click', () => {
        isMuted = !isMuted; 
        const btn = document.getElementById('sound-btn');
        if (isMuted) {
            btn.innerText = '🔇 Muted';
            btn.style.borderColor = 'rgba(255, 165, 0, 0.5)';
            btn.style.background = 'rgba(255, 165, 0, 0.2)';
            window.speechSynthesis.cancel();
        } else {
            btn.innerText = '🔊 Speech/Sound';
            btn.style.borderColor = 'rgba(76, 175, 80, 0.6)';
            btn.style.background = 'rgba(76, 175, 80, 0.3)';
        }
    });

    // Reset Button Logic
    document.getElementById('reset-btn').addEventListener('click', () => {
        if (confirm("Are you sure you want to reset all progress? Your biological body network will be cleared.")) {
            localStorage.removeItem("organTycoonCells");
            localStorage.removeItem("organTycoonUnlocks");
            localStorage.removeItem("organTycoonEverUnlocks");
            localStorage.removeItem("organTycoonStates");
            location.reload(); 
        }
    });

    // --- Init ---
    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'flex';
        
        loadProgress();
        
        if (unlockedIds.length === 0) {
            unlockedIds.push('mouth');
            everUnlockedIds.push('mouth');
        }

        const savedStatesJSON = localStorage.getItem("organTycoonStates");
        let loadedFromState = false;
        
        if (savedStatesJSON) {
            const savedStates = JSON.parse(savedStatesJSON);
            if (savedStates.length === unlockedIds.length) {
                savedStates.forEach(state => {
                    const organ = organData.find(a => a.id === state.id);
                    if(organ) spawnOrgan(organ, state);
                });
                loadedFromState = true;
            }
        }
        
        if (!loadedFromState) {
            unlockedIds.forEach(id => {
                const organ = organData.find(a => a.id === id);
                if(organ) spawnOrgan(organ);
            });
        }

        updateUI();
    });

    document.getElementById('collection-btn').addEventListener('click', openCollection);

</script>
</body>
</html>
