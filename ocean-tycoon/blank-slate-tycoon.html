<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8 Bit Matrix Tycoon</title>
<style>
    body {
        margin: 0;
        overflow: hidden; /* Fluid layout, no scrollbars */
        font-family: 'Courier New', Courier, monospace; /* Retro font */
        background-color: #0f182b; 
        user-select: none;
    }

    /* 8-Bit Grid Background */
    #ocean {
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 100vw; 
        height: 100vh;
        background-color: #09101f;
        background-image: 
            linear-gradient(rgba(0, 202, 233, 0.15) 2px, transparent 2px),
            linear-gradient(90deg, rgba(0, 202, 233, 0.15) 2px, transparent 2px);
        background-size: 40px 40px; /* Big retro grid */
        z-index: 1; 
        overflow: hidden; 
    }

    /* Start Screen */
    #start-screen {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        
        /* Applied Grid Background to Start Screen */
        background-color: #09101f;
        background-image: 
            linear-gradient(rgba(0, 202, 233, 0.15) 2px, transparent 2px),
            linear-gradient(90deg, rgba(0, 202, 233, 0.15) 2px, transparent 2px);
        background-size: 40px 40px;
        
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        color: #00d2ff;
        text-shadow: 2px 2px 0px #000;
    }
    #start-screen h1 { font-size: 3em; margin-bottom: 10px; text-align: center; }
    #start-screen p { color: white; font-size: 1.2em; text-align: center; max-width: 80%; background: rgba(0,0,0,0.6); padding: 15px; border: 2px solid #00d2ff;}
    #start-btn {
        margin-top: 20px;
        padding: 15px 40px; font-size: 1.5em; font-weight: bold; font-family: inherit;
        background: #00d2ff; color: #0f2027; border: 4px solid white; border-radius: 0;
        cursor: pointer; box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        transition: transform 0.1s;
    }
    #start-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px rgba(0,0,0,0.5); }

    /* UI Overlay */
    #ui-layer {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 10; padding: 20px; box-sizing: border-box;
        display: flex; justify-content: space-between; align-items: flex-start;
    }
    
    .hud-column {
        display: flex; flex-direction: column; gap: 10px;
    }

    .hud-box {
        background: rgba(0, 0, 0, 0.6); 
        padding: 15px 25px; border: 3px solid #00d2ff;
        color: white; font-weight: bold; font-size: 1.5em; pointer-events: auto;
        box-shadow: 3px 3px 0px rgba(0,210,255,0.3);
    }
    
    #auto-harvest-box {
        font-size: 1em; padding: 10px 20px; border-color: #2ed573; color: #2ed573;
        display: none;
    }

    .action-btn {
        cursor: pointer; transition: transform 0.1s; font-family: inherit; text-transform: uppercase;
    }
    .action-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px rgba(0,210,255,0.3); }

    /* Marine Animals */
    .animal {
        position: absolute;
        cursor: grab;
        display: flex; 
        flex-direction: column;
        justify-content: flex-end; 
        align-items: center;
        touch-action: none;
    }
    .animal:active { cursor: grabbing; }
    
    .animal-name {
        font-size: 10px;
        font-weight: bold;
        color: #fff;
        background: #000;
        padding: 2px 6px;
        margin-bottom: 5px;
        pointer-events: none;
        white-space: nowrap;
        border: 2px solid white;
    }

    /* Squishy Sprite Styling */
    .sprite-canvas {
        --facing: 1; /* Determines left/right orientation dynamically via JS */
        width: 64px; 
        height: 64px;
        pointer-events: none; 
        user-select: none;
        image-rendering: pixelated; 
        transform-origin: bottom center; /* Squish from the bottom like a real physical object */
        animation: squish 0.5s ease-in-out infinite alternate;
    }
    
    @keyframes squish {
        0% { transform: scaleX(var(--facing)) scaleY(1); }
        100% { transform: scaleX(calc(var(--facing) * 1.1)) scaleY(0.9); }
    }

    .animal.clicked { transform: scale(1.4) !important; }

    /* Floating Heart Animation */
    .floating-heart {
        position: absolute;
        color: #ff4757;
        font-size: 1em;
        font-weight: bold;
        pointer-events: none;
        animation: floatUp 1s ease-out forwards;
        z-index: 50;
        text-shadow: 2px 2px 0px #000;
    }
    @keyframes floatUp {
        0% { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
    }

    /* Modals (8-Bit Theme) */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 100;
        display: none; justify-content: center; align-items: center;
    }
    
    .modal {
        background: #0f182b; 
        border: 4px solid #00d2ff;
        color: white; padding: 20px; 
        max-width: 800px; width: 90%; max-height: 85vh; overflow-y: auto; text-align: center;
        box-shadow: 8px 8px 0px rgba(0,0,0,1);
    }
    
    .modal::-webkit-scrollbar { width: 12px; }
    .modal::-webkit-scrollbar-track { background: #000; border-left: 2px solid #00d2ff; }
    .modal::-webkit-scrollbar-thumb { background: #00d2ff; }

    .modal h2 { 
        margin-top: -5px; color: #00d2ff; font-size: 2em; 
        position: sticky; top: 0; 
        background: #0f182b; 
        padding: 10px 0; z-index: 2; 
        border-bottom: 2px dashed #00d2ff;
        text-shadow: 2px 2px 0px #000;
    }
    
    /* Collection Grid */
    #collection-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; padding-top: 15px; margin-bottom: 20px;
    }
    .collection-item {
        background: #09101f; padding: 15px; border: 2px solid #00d2ff;
        display: flex; flex-direction: column; align-items: center; 
    }
    .collection-item.locked .visual canvas { filter: brightness(0) opacity(0.3); animation: none; transform: scaleX(1); }
    .collection-item .visual { margin-bottom: 10px; display: flex; align-items: flex-end; height: 64px; }
    .collection-item .visual canvas { width: 64px; height: 64px; } 
    .collection-item .name-tag { font-weight: bold; margin-bottom: 10px; font-size: 0.9em; height: 35px; display: flex; align-items: center; text-align: center; color: #fff;}
    .collection-item .count-badge { color: #2ed573; font-size: 0.9em; margin-left: 5px; }
    
    .btn-group {
        display: flex; flex-direction: column; gap: 5px; width: 100%; align-items: stretch;
    }
    .btn-row { display: flex; gap: 5px; }

    .pixel-btn {
        background: #2ed573; color: black; border: 2px solid white; padding: 6px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 0.8em; text-transform: uppercase;
        flex-grow: 1;
    }
    .pixel-btn:active { transform: translate(2px,2px); }
    .pixel-btn:disabled { background: #555; color: #888; border-color: #444; cursor: not-allowed; }
    
    .remove-btn { background: #ff4757; color: white; border: 2px solid white; width: 30px; font-family: inherit; cursor: pointer;}
    .edit-btn { background: #eccc68; color: black; border: 2px solid white; font-family: inherit; padding: 5px; cursor: pointer; margin-top: 5px;}

    .close-btn { background: #000; color: #00d2ff; border: 2px solid #00d2ff; padding: 10px 30px; cursor: pointer; font-size: 1.2em; font-family: inherit; margin-top: 10px;}
    .close-btn:hover { background: #00d2ff; color: #000; }

    /* Pixel Editor */
    #pixel-editor-modal { z-index: 400; }
    .editor-layout { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .palette { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; max-width: 320px; }
    .color-swatch { width: 30px; height: 30px; border: 2px solid white; cursor: pointer; }
    .color-swatch.selected { border: 4px solid #00d2ff; transform: scale(1.1); }
    
    #editor-name-input {
        margin-top: 10px; font-family: inherit; font-weight: bold; font-size: 0.8em; 
        padding: 8px; text-align: center; background: #000; color: #fff; 
        border: 2px solid #00d2ff; width: 80%; outline: none;
    }
    #editor-name-input:focus { border-color: #eccc68; }

    .speed-control {
        display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; margin-bottom: -5px;
    }
    .speed-control input[type=range] { width: 60%; cursor: pointer;}

    #editor-grid {
        display: grid; grid-template-columns: repeat(16, 1fr);
        width: 320px; height: 320px;
        background: rgba(255,255,255,0.1); border: 2px solid white;
        touch-action: none; /* Prevent scroll while painting on mobile */
    }
    .pixel-cell { border: 1px solid rgba(255,255,255,0.05); cursor: crosshair; }

    /* Popups */
    #unlock-popup, #auto-popup { z-index: 300; }
    .visual canvas { width: 100px; height: 100px; margin: 20px 0; image-rendering: pixelated;}
    .gear-icon { font-size: 5em; margin: 15px 0; animation: popIn 0.5s; }

    @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
</style>
</head>

<div id="start-screen">
    <h1>👾 8 Bit Matrix Tycoon</h1>
    <p>All organisms are identified by numbers.<br>Create, name, and harvest your own species.</p>
    <button id="start-btn">INSERT COIN</button>
</div>

<div id="ui-layer">

    </div>
    
    <div class="hud-column" style="align-items: flex-end;">
        <button id="bgm-btn" class="hud-box action-btn" style="font-size: 1em; padding: 10px 20px; width: 100%;">🔊 BGM</button>
        <button id="collection-btn" class="hud-box action-btn" style="width: 100%;">📖 DEX</button>
        <button id="save-btn" class="hud-box action-btn" style="font-size: 1em; padding: 10px 20px; width: 100%;">💾 SAVE</button>
        <button id="reset-btn" class="hud-box action-btn" style="font-size: 1em; padding: 10px 20px; border-color: #ff4757; color: #ff4757; width: 100%;">⚠️ RESET</button>
    </div>
</div>

<div id="ocean"></div>

<!-- Collection Modal -->
<div id="collection-modal" class="modal-overlay">
    <div class="modal">
        <h2>Matrix Database</h2>
        <div id="collection-grid"></div>
        <button class="close-btn" onclick="document.getElementById('collection-modal').style.display='none'">CLOSE</button>
    </div>
</div>

<!-- Pixel Editor Modal -->
<div id="pixel-editor-modal" class="modal-overlay">
    <div class="modal" style="max-width: 400px;">
        <h2 style="font-size: 1.5em; border:none; display: flex; flex-direction: column; align-items: center;">
            ART STUDIO
            <input type="text" id="editor-name-input" placeholder="Name your monster..." maxlength="18">
        </h2>
        <div class="editor-layout">
            <!-- Speed Control Slider -->
            <div class="speed-control">
                <span style="font-weight: bold; font-size: 0.9em; color: #00d2ff;">SPEED:</span>
                <input type="range" id="editor-speed-input" min="0" max="3" step="0.1" value="1.0">
                <span id="editor-speed-display" style="font-weight: bold; font-size: 0.9em; width: 30px; text-align: left;">1.0</span>
            </div>

            <div class="palette" id="color-palette"></div>
            <div id="editor-grid"></div>
            <div class="btn-row" style="width: 100%; justify-content: space-between;">
                <button class="pixel-btn" onclick="clearEditor()" style="background: #ff4757;">CLEAR</button>
                <button class="pixel-btn" onclick="saveSprite()" style="background: #00d2ff;">SAVE & DEPLOY</button>
            </div>
            <button class="close-btn" onclick="closePixelEditor(false)" style="width:100%">CANCEL</button>
        </div>
    </div>
</div>

<!-- Unlock Popup Modal -->
<div id="unlock-popup" class="modal-overlay">
    <div class="modal" style="overflow: hidden; max-height: 400px;">
        <h2 style="border: none; margin-bottom: 0;">NEW DISCOVERY!</h2>
        <div id="popup-visual" class="visual"></div>
        <h3 id="popup-name" style="margin-top: 0; font-size: 1.5em; color: white;">001</h3>
        <button class="close-btn" onclick="closeUnlockPopup()">AWESOME!</button>
    </div>
</div>

<!-- Auto-Harvest Unlocked Popup -->
<div id="auto-popup" class="modal-overlay">
    <div class="modal" style="overflow: hidden; max-height: 400px;">
        <h2 style="border: none; margin-bottom: 0; color: #2ed573;">SYSTEM UPGRADE!</h2>
        <div class="gear-icon">⚙️</div>
        <h3 style="margin-top: 0; font-size: 1.5em; color: white;">AUTO-HARVEST ONLINE</h3>
        <p style="font-size: 1.1em; color: #d1d8e0; margin-bottom: 20px;">Your thriving matrix collects hearts automatically!</p>
        <button class="close-btn" onclick="document.getElementById('auto-popup').style.display='none'">KEEP GROWING</button>
    </div>
</div>

<script>
    // --- Audio Context & Synth ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSynth(freq, type, duration, vol=0.2) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const sfx = {
        bubble: () => playSynth(600 + Math.random()*200, 'square', 0.1, 0.1), 
        unlock: () => {
            playSynth(440, 'square', 0.2, 0.15);
            setTimeout(() => playSynth(554, 'square', 0.2, 0.15), 150);
            setTimeout(() => playSynth(659, 'square', 0.4, 0.15), 300);
        },
        arpeggio: () => {
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                setTimeout(() => playSynth(freq, 'square', 0.08, 0.15), i * 80);
            });
        }
    };

    // --- 8-Bit Cute Sequencer (BGM) ---
    let isBgmEnabled = true;
    
    // An upbeat, cute, arpeggiated waltz melody
    const bgmMelody = [
        523.25, 659.25, 783.99, 0,       // C5, E5, G5, Rest
        1046.50, 0,     783.99, 0,       // C6, Rest, G5, Rest
        880.00, 1046.50, 880.00, 0,      // A5, C6, A5, Rest
        783.99, 0,      0,      0,       // G5, Rest...
        698.46, 880.00, 698.46, 0,       // F5, A5, F5, Rest
        659.25, 783.99, 659.25, 0,       // E5, G5, E5, Rest
        587.33, 698.46, 587.33, 0,       // D5, F5, D5, Rest
        523.25, 0,      0,      0,       // C5, Rest...
        
        523.25, 659.25, 783.99, 0,       
        1046.50, 0,     783.99, 0,       
        880.00, 1046.50, 880.00, 0,      
        783.99, 0,      0,      0,       
        698.46, 880.00, 698.46, 0,       
        659.25, 783.99, 659.25, 0,       
        587.33, 0,      783.99, 0,       // D5, Rest, G5, Rest
        1046.50, 0,     0,      0        // C6!
    ];

    let bgmStep = 0;
    setInterval(() => {
        if (isBgmEnabled && audioCtx.state === 'running') {
            const freq = bgmMelody[bgmStep];
            if (freq > 0) {
                // Triangle wave is softer for background music
                playSynth(freq, 'triangle', 0.12, 0.04); 
            }
            bgmStep = (bgmStep + 1) % bgmMelody.length;
        }
    }, 150); // Tempo

    document.getElementById('bgm-btn').addEventListener('click', () => {
        isBgmEnabled = !isBgmEnabled;
        document.getElementById('bgm-btn').innerText = isBgmEnabled ? "🔊 BGM" : "🔇 BGM";
        sfx.bubble();
        if (audioCtx.state === 'suspended' && isBgmEnabled) {
            audioCtx.resume();
        }
    });

    // --- Popup Flow Management ---
    let pendingEditId = null;
    let pendingAutoHarvestPopup = false;

    window.closeUnlockPopup = function() {
        document.getElementById('unlock-popup').style.display = 'none';
        if (pendingEditId) {
            sfx.arpeggio();
            openPixelEditor(pendingEditId);
            pendingEditId = null;
        }
    };

    window.closePixelEditor = function(saved = false) {
        document.getElementById('pixel-editor-modal').style.display = 'none';
        
        if (pendingAutoHarvestPopup) {
            setTimeout(() => {
                document.getElementById('auto-popup').style.display = 'flex';
                sfx.unlock();
            }, 300);
            pendingAutoHarvestPopup = false;
        }
    };

    // --- Sprite & Canvas Logic ---
    function generateDefaultSprite(baseColor) {
        let pixels = new Array(256).fill('');
        for(let y=4; y<12; y++){
            for(let x=4; x<12; x++){
                pixels[y*16 + x] = baseColor;
            }
        }
        pixels[6*16 + 6] = '#000000';
        pixels[6*16 + 9] = '#000000';
        return pixels;
    }

    const defaultColors = ['#ff4757', '#ffa502', '#eccc68', '#7bed9f', '#70a1ff', '#5352ed', '#ff6b81', '#a4b0be'];
    let customSprites = {}; 
    let customNames = {}; 
    let customSpeeds = {}; 

    function createAnimalCanvas(id) {
        const canvas = document.createElement('canvas');
        canvas.width = 16; 
        canvas.height = 16;
        canvas.className = 'sprite-canvas';
        
        // Give each canvas a random negative delay so they don't squish perfectly in sync!
        canvas.style.animationDelay = (-Math.random()) + 's';
        
        drawToCanvas(canvas, id);
        return canvas;
    }

    function drawToCanvas(canvas, id) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 16, 16);
        const data = customSprites[id];
        if(!data) return;

        for(let i = 0; i < 256; i++) {
            if(data[i]) {
                const x = i % 16;
                const y = Math.floor(i / 16);
                ctx.fillStyle = data[i];
                ctx.fillRect(x, y, 1, 1);
            }
        }
    }

    // --- 51-Animal Game Data ---
    const animalData = [
        { id: '1', name: '001', cost: 5, speed: 1, heartsPerClick: 1 },
        { id: '2', name: '002', cost: 10, speed: 1, heartsPerClick: 2 },
        { id: '3', name: '003', cost: 20, speed: 1, heartsPerClick: 3 },
        { id: '4', name: '004', cost: 35, speed: 1, heartsPerClick: 4 },

        { id: '10', name: '010', cost: 250, speed: 1, heartsPerClick: 15 },
        { id: '11', name: '011', cost: 350, speed: 1, heartsPerClick: 20 },
        { id: '12', name: '012', cost: 500, speed: 1, heartsPerClick: 25 },
        { id: '13', name: '013', cost: 750, speed: 1, heartsPerClick: 30 },
        { id: '14', name: '014', cost: 1000, speed: 1, heartsPerClick: 35 },
        { id: '15', name: '015', cost: 1250, speed: 1, heartsPerClick: 40 },
        { id: '16', name: '016', cost: 1500, speed: 1, heartsPerClick: 50 },
        { id: '17', name: '017', cost: 2000, speed: 1, heartsPerClick: 60 },
        { id: '18', name: '018', cost: 2500, speed: 1, heartsPerClick: 70 },
        { id: '19', name: '019', cost: 3000, speed: 1, heartsPerClick: 80 },
        { id: '20', name: '020', cost: 4000, speed: 1, heartsPerClick: 90 },
        { id: '21', name: '021', cost: 5000, speed: 1, heartsPerClick: 100 },
        { id: '22', name: '022', cost: 6500, speed: 1, heartsPerClick: 120 },
        { id: '23', name: '023', cost: 8000, speed: 1, heartsPerClick: 140 },
        { id: '24', name: '024', cost: 10000, speed: 1, heartsPerClick: 160 },
        { id: '25', name: '025', cost: 12500, speed: 1, heartsPerClick: 180 },
        { id: '26', name: '026', cost: 15000, speed: 1, heartsPerClick: 200 },
        { id: '27', name: '027', cost: 20000, speed: 1, heartsPerClick: 250 },
        { id: '28', name: '028', cost: 25000, speed: 1, heartsPerClick: 300 },
        { id: '29', name: '029', cost: 30000, speed: 1, heartsPerClick: 350 },
        { id: '30', name: '030', cost: 40000, speed: 1, heartsPerClick: 400 },
        { id: '31', name: '031', cost: 50000, speed: 1, heartsPerClick: 500 },
        { id: '32', name: '032', cost: 60000, speed: 1, heartsPerClick: 600 },
        { id: '33', name: '033', cost: 75000, speed: 1, heartsPerClick: 700 },
        { id: '34', name: '034', cost: 90000, speed: 1, heartsPerClick: 800 },
        { id: '35', name: '035', cost: 100000, speed: 1, heartsPerClick: 900 },
        { id: '36', name: '036', cost: 125000, speed: 1, heartsPerClick: 1000 },
        { id: '37', name: '037', cost: 150000, speed: 1, heartsPerClick: 1200 },
        { id: '38', name: '038', cost: 175000, speed: 1, heartsPerClick: 1400 },
        { id: '39', name: '039', cost: 200000, speed: 1, heartsPerClick: 1600 },
        { id: '40', name: '040', cost: 250000, speed: 1, heartsPerClick: 1800 },
        { id: '41', name: '041', cost: 300000, speed: 1, heartsPerClick: 2000 },
        { id: '42', name: '042', cost: 400000, speed: 1, heartsPerClick: 2500 },
        { id: '43', name: '043', cost: 500000, speed: 1, heartsPerClick: 3000 },
        { id: '44', name: '044', cost: 600000, speed: 1, heartsPerClick: 3500 },
        { id: '45', name: '045', cost: 750000, speed: 1, heartsPerClick: 4500 },
        { id: '46', name: '046', cost: 1000000, speed: 1, heartsPerClick: 6000 },
        { id: '47', name: '047', cost: 1500000, speed: 1, heartsPerClick: 8000 },
        { id: '48', name: '048', cost: 2500000, speed: 1, heartsPerClick: 12000 },
        { id: '49', name: '049', cost: 5000000, speed: 1, heartsPerClick: 25000 },
        { id: '50', name: '050', cost: 10000000, speed: 1, heartsPerClick: 50000 },
        { id: 'goldfish', name: '051', cost: 100000000, speed: 1, heartsPerClick: 100000 }
    ];

    // Initialize missing sprites
    animalData.forEach((a, i) => {
        if(!customSprites[a.id]) {
            customSprites[a.id] = generateDefaultSprite(defaultColors[i % defaultColors.length]);
        }
    });

    let hearts = 0;
    let unlockedIds = ['1']; 
    let activeAnimals = [];

    // --- Cheatcode Listener ---
    let cheatBuffer = "";
    document.addEventListener("keydown", (e) => {
        cheatBuffer += e.key.toLowerCase();
        if (cheatBuffer.length > 20) cheatBuffer = cheatBuffer.substring(cheatBuffer.length - 20);
        
        if (cheatBuffer.includes("goldfish")) {
            cheatBuffer = "";
            const goldfishDef = animalData.find(a => a.id === 'goldfish');
            if (goldfishDef && !unlockedIds.includes('goldfish')) {
                unlockedIds.push('goldfish');
                spawnAnimal(goldfishDef);
                updateUI();
                saveProgress();
                sfx.unlock();
                
                if (document.getElementById('collection-modal').style.display !== 'flex') {
                    const popupVisual = document.getElementById('popup-visual');
                    popupVisual.innerHTML = '';
                    popupVisual.appendChild(createAnimalCanvas(goldfishDef.id));
                    document.getElementById('popup-name').innerText = "Cheat Activated: " + (customNames[goldfishDef.id] || goldfishDef.name);
                    document.getElementById('unlock-popup').style.display = 'flex';
                } else {
                    openCollection();
                }
            }
        }
    });

    // --- Local Storage Management ---
    function saveProgress() {
        localStorage.setItem("oceanHearts", hearts);
        localStorage.setItem("oceanUnlocks", JSON.stringify(unlockedIds));
        localStorage.setItem("oceanSprites", JSON.stringify(customSprites));
        localStorage.setItem("oceanNames", JSON.stringify(customNames));
        localStorage.setItem("oceanSpeeds", JSON.stringify(customSpeeds)); 
        
        const animalStates = activeAnimals.map(anim => ({
            id: anim.id, x: anim.x, y: anim.y, vx: anim.vx, vy: anim.vy
        }));
        localStorage.setItem("oceanAnimalStates", JSON.stringify(animalStates));
    }

    function loadProgress() {
        const savedHearts = localStorage.getItem("oceanHearts");
        const savedUnlocks = localStorage.getItem("oceanUnlocks");
        const savedSprites = localStorage.getItem("oceanSprites");
        const savedNames = localStorage.getItem("oceanNames");
        const savedSpeeds = localStorage.getItem("oceanSpeeds"); 
        
        if (savedHearts !== null) hearts = parseInt(savedHearts, 10);
        if (savedUnlocks !== null) unlockedIds = JSON.parse(savedUnlocks);
        if (savedSprites !== null) {
            const parsedSprites = JSON.parse(savedSprites);
            for(let key in parsedSprites) customSprites[key] = parsedSprites[key];
        }
        if (savedNames !== null) {
            customNames = JSON.parse(savedNames);
        }
        if (savedSpeeds !== null) {
            customSpeeds = JSON.parse(savedSpeeds);
        }
        
        updateUI();
    }

    // --- Game Logic ---
    function updateUI() {
        document.getElementById('heart-count').innerText = hearts.toLocaleString();
        
        const autoBox = document.getElementById('auto-harvest-box');
        if (activeAnimals.length >= 6) {
            autoBox.style.display = 'block';
            let heartsPerSecond = activeAnimals.reduce((sum, anim) => sum + anim.heartsPerClick, 0);
            document.getElementById('auto-rate').innerText = heartsPerSecond.toLocaleString();
        } else {
            autoBox.style.display = 'none';
        }
    }

    function spawnAnimal(animalDef, savedState = null) {
        const ocean = document.getElementById('ocean');
        const el = document.createElement('div');
        el.className = 'animal';
        
        const displayName = customNames[animalDef.id] || animalDef.name;
        el.innerHTML = `<div class="animal-name">${displayName}</div>`;
        const canvas = createAnimalCanvas(animalDef.id);
        el.appendChild(canvas);
        
        let animalSpeed = customSpeeds[animalDef.id] !== undefined ? customSpeeds[animalDef.id] : animalDef.speed;

        let x, y, vx, vy;
        if (savedState) {
            x = savedState.x; y = savedState.y; 
            vx = (savedState.vx < 0 ? -1 : 1) * animalSpeed; 
            vy = (savedState.vy < 0 ? -1 : 1) * animalSpeed;
        } else {
            x = Math.random() * (window.innerWidth - 80);
            y = Math.random() * (window.innerHeight - 100);
            vx = animalSpeed; 
            vy = (Math.random() > 0.5 ? 1 : -1) * animalSpeed;
        }

        el.style.left = x + 'px'; el.style.top = y + 'px';

        // Apply orientation flip via Custom CSS Properties
        if (vx < 0 && animalSpeed > 0) {
            canvas.style.setProperty('--facing', '-1');
        } else {
            canvas.style.setProperty('--facing', '1');
        }

        // Click / Drag logic
        el.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            sfx.bubble();
            hearts += animalDef.heartsPerClick;
            updateUI(); saveProgress();

            el.classList.add('clicked');
            setTimeout(() => el.classList.remove('clicked'), 200);

            const floatHeart = document.createElement('div');
            floatHeart.className = 'floating-heart';
            floatHeart.innerText = `+${animalDef.heartsPerClick} ❤️`;
            floatHeart.style.left = e.clientX + 'px'; floatHeart.style.top = (e.clientY - 5) + 'px';
            ocean.appendChild(floatHeart);
            setTimeout(() => floatHeart.remove(), 1000);

            let animObj = activeAnimals.find(a => a.el === el);
            if (animObj) {
                animObj.isDragging = true;
                el.setPointerCapture(e.pointerId);
                animObj.offsetX = e.clientX - animObj.x;
                animObj.offsetY = e.clientY - animObj.y;
            }
        });

        el.addEventListener('pointermove', (e) => {
            let animObj = activeAnimals.find(a => a.el === el);
            if (animObj && animObj.isDragging) {
                animObj.x = e.clientX - animObj.offsetX;
                animObj.y = e.clientY - animObj.offsetY;
                animObj.x = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, animObj.x));
                animObj.y = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, animObj.y));
                el.style.left = animObj.x + 'px'; el.style.top = animObj.y + 'px';
            }
        });

        const endDrag = (e) => {
            let animObj = activeAnimals.find(a => a.el === el);
            if (animObj) {
                animObj.isDragging = false;
                try { el.releasePointerCapture(e.pointerId); } catch (err) {}
            }
        };

        el.addEventListener('pointerup', endDrag);
        el.addEventListener('pointercancel', endDrag);

        ocean.appendChild(el);
        activeAnimals.push({ 
            id: animalDef.id, el, x, y, vx, vy, 
            speed: animalSpeed, isDragging: false, heartsPerClick: animalDef.heartsPerClick, canvas: canvas
        });
    }

    // Auto Harvest Loop
    setInterval(() => {
        if (activeAnimals.length >= 6) {
            let heartsPerSecond = 0;
            const ocean = document.getElementById('ocean');
            
            activeAnimals.forEach(anim => {
                if (anim.heartsPerClick > 0) {
                    heartsPerSecond += anim.heartsPerClick;
                    const floatHeart = document.createElement('div');
                    floatHeart.className = 'floating-heart';
                    floatHeart.innerText = `+${anim.heartsPerClick} ❤️`;
                    const offsetX = (Math.random() * 40) - 10;
                    floatHeart.style.left = (anim.x + 30 + offsetX) + 'px';
                    floatHeart.style.top = (anim.y + 10) + 'px';
                    ocean.appendChild(floatHeart);
                    setTimeout(() => floatHeart.remove(), 1000);
                }
            });
            if (heartsPerSecond > 0) { hearts += heartsPerSecond; updateUI(); }
        }
        saveProgress();
    }, 1000);

    // Animation Loop
    function animate() {
        const maxX = window.innerWidth; const maxY = window.innerHeight;

        activeAnimals.forEach(anim => {
            if (anim.isDragging || anim.speed === 0) return; 

            const elWidth = anim.el.offsetWidth || 64;
            const elHeight = anim.el.offsetHeight || 90;

            anim.x += anim.vx; anim.y += anim.vy;

            if (anim.x <= 0) {
                anim.x = 0; anim.vx = Math.abs(anim.vx);
                anim.canvas.style.setProperty('--facing', '1');
            } else if (anim.x >= maxX - elWidth) {
                anim.x = maxX - elWidth; anim.vx = -Math.abs(anim.vx);
                anim.canvas.style.setProperty('--facing', '-1');
            }

            if (anim.y <= 0) {
                anim.y = 0; anim.vy = Math.abs(anim.vy);
            } else if (anim.y >= maxY - elHeight) {
                anim.y = maxY - elHeight; anim.vy = -Math.abs(anim.vy);
            }

            anim.el.style.left = anim.x + 'px'; anim.el.style.top = anim.y + 'px';
        });
        requestAnimationFrame(animate);
    }

    // --- Pixel Editor Logic ---
    let currentEditId = null;
    let editBuffer = new Array(256).fill('');
    let selectedColor = '#ffffff';
    let isPainting = false;

    const paletteColors = ['#000000', '#ffffff', '#ff4757', '#ffa502', '#eccc68', '#2ed573', '#1e90ff', '#5352ed', '#ff69b4', '']; 

    // Update Speed Display dynamically
    document.getElementById('editor-speed-input').addEventListener('input', (e) => {
        document.getElementById('editor-speed-display').innerText = parseFloat(e.target.value).toFixed(1);
    });

    function initEditorGrid() {
        const pal = document.getElementById('color-palette');
        pal.innerHTML = '';
        paletteColors.forEach(c => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            if(c === selectedColor) swatch.classList.add('selected');
            if(c === '') swatch.style.background = 'repeating-conic-gradient(#808080 0% 25%, transparent 0% 50%) 50% / 10px 10px';
            else swatch.style.backgroundColor = c;
            
            swatch.onclick = () => {
                selectedColor = c;
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
            };
            pal.appendChild(swatch);
        });

        const grid = document.getElementById('editor-grid');
        grid.innerHTML = '';
        for(let i=0; i<256; i++) {
            let cell = document.createElement('div');
            cell.className = 'pixel-cell';
            cell.dataset.index = i;
            
            const paint = (e) => {
                e.preventDefault();
                editBuffer[i] = selectedColor;
                cell.style.backgroundColor = selectedColor || 'transparent';
            };

            cell.addEventListener('pointerdown', (e) => { isPainting = true; paint(e); });
            cell.addEventListener('pointerenter', (e) => { if(isPainting) paint(e); });
            grid.appendChild(cell);
        }

        window.addEventListener('pointerup', () => isPainting = false);
    }
    initEditorGrid();

    window.openPixelEditor = function(id) {
        currentEditId = id;
        const animalDef = animalData.find(a => a.id === id);
        document.getElementById('editor-name-input').value = customNames[id] || animalDef.name;
        
        // Setup Speed slider
        let currentSpeed = customSpeeds[id] !== undefined ? customSpeeds[id] : animalDef.speed;
        document.getElementById('editor-speed-input').value = currentSpeed;
        document.getElementById('editor-speed-display').innerText = Number(currentSpeed).toFixed(1);

        editBuffer = [...(customSprites[id] || new Array(256).fill(''))];
        
        const cells = document.getElementById('editor-grid').children;
        for(let i=0; i<256; i++) {
            cells[i].style.backgroundColor = editBuffer[i] || 'transparent';
        }
        
        document.getElementById('pixel-editor-modal').style.display = 'flex';
    };

    window.clearEditor = function() {
        editBuffer = new Array(256).fill('');
        const cells = document.getElementById('editor-grid').children;
        for(let i=0; i<256; i++) cells[i].style.backgroundColor = 'transparent';
    };

    window.saveSprite = function() {
        if(!currentEditId) return;
        
        // Save Name, Sprite, and Speed
        const inputName = document.getElementById('editor-name-input').value.trim();
        customNames[currentEditId] = inputName || animalData.find(a => a.id === currentEditId).name;
        customSprites[currentEditId] = [...editBuffer];
        
        const newSpeed = parseFloat(document.getElementById('editor-speed-input').value);
        customSpeeds[currentEditId] = newSpeed;

        saveProgress();
        
        // Update live canvas elements immediately
        activeAnimals.forEach(a => {
            if(a.id === currentEditId) {
                drawToCanvas(a.canvas, currentEditId);
                a.el.querySelector('.animal-name').innerText = customNames[currentEditId];
                a.speed = newSpeed;
                a.vx = (a.vx < 0 ? -1 : 1) * newSpeed;
                a.vy = (a.vy < 0 ? -1 : 1) * newSpeed;
                a.canvas.style.setProperty('--facing', a.vx < 0 && newSpeed > 0 ? '-1' : '1');
            }
        });
        
        if (document.getElementById('collection-modal').style.display === 'flex') {
            openCollection(); 
        }
        
        sfx.bubble();
        closePixelEditor(true);
    };

    // --- UI Modals ---
    window.openCollection = function() {
        const grid = document.getElementById('collection-grid');
        grid.innerHTML = '';
        
        animalData.forEach((a) => {
            if (a.id === 'goldfish' && !unlockedIds.includes('goldfish')) return;

            const count = unlockedIds.filter(id => id === a.id).length;
            const isUnlocked = count > 0;
            
            const item = document.createElement('div');
            item.className = `collection-item ${isUnlocked ? '' : 'locked'}`;
            
            const canAfford = hearts >= a.cost;
            
            const buyBtnHTML = `<button class="pixel-btn" ${canAfford ? '' : 'disabled'} onclick="recruit('${a.id}')">
                                ${isUnlocked ? 'RECRUIT' : 'UNLOCK'}<br>(${a.cost.toLocaleString()} ❤️)
                             </button>`;
                             
            const removeBtnHTML = isUnlocked ? `<button class="remove-btn" title="Remove one" onclick="removeAnimal('${a.id}')">✖</button>` : '';
            const editBtnHTML = isUnlocked ? `<button class="edit-btn" onclick="openPixelEditor('${a.id}')">✏️ EDIT</button>` : '';

            const countBadge = isUnlocked ? `<span class="count-badge">(x${count})</span>` : '';
            const displayName = customNames[a.id] || a.name;

            item.innerHTML = `
                <div class="visual"></div>
                <div class="name-tag">${isUnlocked ? displayName : '???'} ${countBadge}</div>
                <div class="btn-group">
                    <div class="btn-row">
                        ${buyBtnHTML}
                        ${removeBtnHTML}
                    </div>
                    ${editBtnHTML}
                </div>
            `;
            item.querySelector('.visual').appendChild(createAnimalCanvas(a.id));
            grid.appendChild(item);
        });
        document.getElementById('collection-modal').style.display = 'flex';
    }

    window.recruit = function(id) {
        const animal = animalData.find(a => a.id === id);
        
        if (hearts >= animal.cost) {
            const isFirstTime = !unlockedIds.includes(id);
            const wasBelowThreshold = activeAnimals.length < 6;
            
            hearts -= animal.cost;
            unlockedIds.push(id);
            
            spawnAnimal(animal);
            updateUI();
            saveProgress();
            
            const reachedThreshold = wasBelowThreshold && activeAnimals.length >= 6;
            
            if (isFirstTime) {
                document.getElementById('collection-modal').style.display = 'none';
                const popupVisual = document.getElementById('popup-visual');
                popupVisual.innerHTML = '';
                popupVisual.appendChild(createAnimalCanvas(animal.id));
                document.getElementById('popup-name').innerText = customNames[animal.id] || animal.name;
                document.getElementById('unlock-popup').style.display = 'flex';
                sfx.unlock();
                
                // Prompt user to customize their new unlock when they close the modal
                pendingEditId = animal.id;
                if (reachedThreshold) pendingAutoHarvestPopup = true;
            } 
            else {
                openCollection();
                if (reachedThreshold) {
                    document.getElementById('collection-modal').style.display = 'none';
                    document.getElementById('auto-popup').style.display = 'flex';
                    sfx.unlock();
                } else {
                    sfx.bubble();
                }
            }
        }
    };

    window.removeAnimal = function(id) {
        const unlockIndex = unlockedIds.indexOf(id);
        if (unlockIndex > -1) unlockedIds.splice(unlockIndex, 1);

        const activeIndex = activeAnimals.findIndex(a => a.id === id);
        if (activeIndex > -1) {
            const anim = activeAnimals[activeIndex];
            anim.el.remove(); 
            activeAnimals.splice(activeIndex, 1); 
        }

        sfx.bubble();
        updateUI(); saveProgress(); openCollection(); 
    };

    // --- Core UI Listeners ---
    document.getElementById('collection-btn').addEventListener('click', openCollection);

    document.getElementById('save-btn').addEventListener('click', () => {
        saveProgress();
        const btn = document.getElementById('save-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = "✅ SAVED!";
        sfx.bubble();
        setTimeout(() => { btn.innerHTML = originalText; }, 1500);
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
        if (confirm("Are you sure you want to reset all progress, custom art, speeds, and names? This cannot be undone.")) {
            localStorage.removeItem("oceanHearts");
            localStorage.removeItem("oceanUnlocks");
            localStorage.removeItem("oceanAnimalStates");
            localStorage.removeItem("oceanSprites");
            localStorage.removeItem("oceanNames");
            localStorage.removeItem("oceanSpeeds");

            hearts = 0; unlockedIds = ['1'];
            customSprites = {}; 
            customNames = {};
            customSpeeds = {};
            
            animalData.forEach((a, i) => {
                customSprites[a.id] = generateDefaultSprite(defaultColors[i % defaultColors.length]);
            });

            activeAnimals.forEach(a => a.el.remove());
            activeAnimals = [];

            const starter = animalData.find(a => a.id === '1');
            spawnAnimal(starter);

            updateUI(); saveProgress(); sfx.bubble();
            
            // Pop the discovery again for the reset starter
            const popupVisual = document.getElementById('popup-visual');
            popupVisual.innerHTML = '';
            popupVisual.appendChild(createAnimalCanvas(starter.id));
            document.getElementById('popup-name').innerText = customNames[starter.id] || starter.name;
            document.getElementById('unlock-popup').style.display = 'flex';
            sfx.unlock();
            
            pendingEditId = starter.id;
        }
    });

    // Close Modals on outside click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                // Route the popup background clicks to proper closures
                if (e.target.id === 'unlock-popup') {
                    closeUnlockPopup();
                } else if (e.target.id === 'pixel-editor-modal') {
                    closePixelEditor(false);
                } else {
                    e.target.style.display = 'none';
                }
            }
        });
    });

    // --- Init ---
    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'flex';
        
        if(audioCtx.state === 'suspended') audioCtx.resume();

        loadProgress();
        
        const savedStatesJSON = localStorage.getItem("oceanAnimalStates");
        let loadedFromState = false;
        
        if (savedStatesJSON) {
            const savedStates = JSON.parse(savedStatesJSON);
            if (savedStates.length === unlockedIds.length) {
                savedStates.forEach(state => {
                    const animal = animalData.find(a => a.id === state.id);
                    if(animal) spawnAnimal(animal, state);
                });
                loadedFromState = true;
            }
        }
        
        if (!loadedFromState) {
            unlockedIds.forEach(id => {
                const animal = animalData.find(a => a.id === id);
                if(animal) spawnAnimal(animal);
            });
        }
        
        if (activeAnimals.length === 0) {
            const starter = animalData.find(a => a.id === '1');
            if (starter) spawnAnimal(starter);
        }

        updateUI();
        requestAnimationFrame(animate);

        // Feature: ALWAYS pop up monster 001 discovery when the game starts, 
        // which will subsequently trigger the pixel editor when "AWESOME!" is clicked.
        const starter = animalData[0];
        const popupVisual = document.getElementById('popup-visual');
        popupVisual.innerHTML = '';
        popupVisual.appendChild(createAnimalCanvas(starter.id));
        document.getElementById('popup-name').innerText = customNames[starter.id] || starter.name;
        document.getElementById('unlock-popup').style.display = 'flex';
        sfx.unlock();
        
        pendingEditId = starter.id;
    });
</script>
</body>
</html>
