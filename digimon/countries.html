<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Countries: Cantonese to English Quiz with Analytics</title>
    <style>
        :root {
            --primary: #2980b9;
            --primary-hover: #2471a3;
            --secondary: #27ae60;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #fdfefe;
            --white: #ffffff;
            --gray: #bdc3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ecf0f1;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--white);
            max-width: 850px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .quiz-header {
            background-color: var(--primary);
            color: var(--white);
            padding: 25px 20px;
            text-align: center;
            position: relative;
        }

        .quiz-header h2 {
            margin-bottom: 10px;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .settings-bar {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: inline-block;
            margin-top: 10px;
        }

        .settings-bar label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-container {
            width: 100%;
            background-color: rgba(255,255,255,0.3);
            height: 6px;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-body {
            padding: 40px 30px;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #7f8c8d;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .vocab-display {
            text-align: center;
            margin-bottom: 40px;
        }

        .country-word {
            font-size: 4.5rem;
            font-weight: bold;
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .hint-text {
            font-size: 1.2rem;
            color: #d35400;
            font-weight: bold;
            background: #fdf2e9;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #edbb99;
        }

        .tts-btn-large {
            background: none;
            border: 2px solid var(--gray);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tts-btn-large:hover {
            background: var(--light);
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .country-word { font-size: 3rem; }
        }

        .option-btn {
            background-color: var(--light);
            border: 2px solid var(--gray);
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #ebf5fb;
            border-color: var(--primary);
        }

        .option-btn.correct {
            background-color: var(--success);
            border-color: var(--success);
            color: var(--white);
        }

        .option-btn.incorrect {
            background-color: var(--danger);
            border-color: var(--danger);
            color: var(--white);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .tts-btn-small {
            background: rgba(0,0,0,0.05);
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn.correct .tts-btn-small,
        .option-btn.incorrect .tts-btn-small {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .tts-btn-small:hover {
            background: rgba(0,0,0,0.15);
            transform: scale(1.1);
        }

        .feedback {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 25px;
            min-height: 30px;
        }

        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--danger); }

        .quiz-footer {
            padding: 20px 30px;
            background-color: var(--light);
            text-align: right;
            border-top: 1px solid #eee;
        }

        .next-btn, .start-btn {
            background-color: var(--secondary);
            color: var(--white);
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .next-btn { display: none; }
        .next-btn:hover, .start-btn:hover { background-color: #219a52; }

        #start-screen {
            text-align: center;
            padding: 60px 30px;
        }

        #start-screen p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #555;
        }

        .results-container {
            text-align: center;
            padding: 40px 30px;
            display: none;
        }

        .results-score {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }

        .analytics-container {
            background-color: #f4f6f7;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid var(--gray);
        }

        .analytics-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 1rem;
        }

        .analytics-table th, .analytics-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .analytics-table th {
            background-color: var(--dark);
            color: white;
            position: sticky;
            top: 0;
        }

        .correct-row { color: var(--success); font-weight: bold; }
        .incorrect-row { color: var(--danger); font-weight: bold; }

        .stats-summary {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>

    <div class="quiz-container">
        
        <!-- Start Screen -->
        <div id="start-screen">

            <h2>Traditional Chinese &rarr; English</h2>
            <p>Can you identify all 197 countries by their Chinese names? Your speed and accuracy will be tracked!</p>
            <button class="start-btn" onclick="startQuiz()">Start the Global Tour</button>
        </div>

        <!-- Interactive Quiz Area -->
        <div id="quiz-area" style="display: none;">
            <div class="quiz-header">
                <h2>Global Geography Challenge</h2>
                <div class="settings-bar">
                    <label>
                        <input type="checkbox" id="auto-tts" checked>
                        Auto-play Cantonese word on new question
                    </label>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>

            <div class="quiz-body">
                <div class="question-meta">
                    <span id="question-counter">Question 1 of 197</span>
                    <span id="score-counter">Score: 0</span>
                </div>
                
                <div class="vocab-display">
                    <div class="country-word">
                        <span id="target-country">載入中...</span>
                        <button class="tts-btn-large" id="main-tts-btn" title="Listen to Cantonese">🔊</button>
                    </div>
                    <div class="hint-text" id="target-hint">Hint: Loading...</div>
                </div>

                <div class="options-grid" id="options-grid">
                    <!-- Buttons injected via JS -->
                </div>

                <div class="feedback" id="feedback"></div>
            </div>

            <div class="quiz-footer">
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Country &rarr;</button>
            </div>
        </div>

        <!-- Results Area -->
        <div class="results-container" id="results-area">
            <h2 style="font-size: 2.5rem;">Global Tour Complete!</h2>
            <div class="results-score" id="final-score">0 / 197</div>
            <p style="font-size: 1.2rem; color: #555;" id="final-msg">Analytics Report:</p>
            
            <div id="analytics-area"></div>

            <button class="start-btn" onclick="location.reload()">Restart Global Tour</button>
        </div>

    </div>

            { c: "Uganda", zh: "烏干達", h: "Landlocked country in Africa" },
            { c: "Ukraine", zh: "烏克蘭", h: "Coastal country in Europe" },
            { c: "United Arab Emirates", zh: "阿拉伯聯合酋長國", h: "Coastal country in Asia" },
            { c: "United Kingdom", zh: "英國", h: "Island nation in Europe" },
            { c: "United States", zh: "美國", h: "Coastal country in North America" },
            { c: "Uruguay", zh: "烏拉圭", h: "Coastal country in South America" },
            { c: "Uzbekistan", zh: "烏茲別克斯坦", h: "Landlocked country in Asia" },
            { c: "Vanuatu", zh: "瓦努阿圖", h: "Island nation in Oceania" },
            { c: "Vatican City", zh: "梵蒂岡", h: "Landlocked country in Europe" },
            { c: "Venezuela", zh: "委內瑞拉", h: "Coastal country in South America" },
            { c: "Vietnam", zh: "越南", h: "Coastal country in Asia" },
            { c: "Yemen", zh: "也門", h: "Coastal country in Asia" },
            { c: "Zambia", zh: "贊比亞", h: "Landlocked country in Africa" },
            { c: "Zimbabwe", zh: "津巴布韋", h: "Landlocked country in Africa" }
        ];

        let quizSequence = [];
        let currentIndex = 0;
        let currentScore = 0;
        let questionStartTime = 0;
        let analyticsData = [];

        const targetCountryEl = document.getElementById('target-country');
        const targetHintEl = document.getElementById('target-hint');
        const mainTtsBtn = document.getElementById('main-tts-btn');
        const optionsGridEl = document.getElementById('options-grid');
        const nextBtnEl = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');
        const questionCounterEl = document.getElementById('question-counter');
        const scoreCounterEl = document.getElementById('score-counter');
        const progressBarEl = document.getElementById('progress-bar');
        const autoTtsCheckbox = document.getElementById('auto-tts');

        const synth = window.speechSynthesis;

        function speak(text, lang = 'zh-HK') {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.95; 
            synth.speak(utterance);
        }

        function shuffle(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function generateOptions(correctAnswer) {
            let allCountries = countryList.map(v => v.c);
            let incorrectPool = allCountries.filter(c => c !== correctAnswer);
            shuffle(incorrectPool);
            
            let options = [correctAnswer, incorrectPool[0], incorrectPool[1], incorrectPool[2]];
            return shuffle(options);
        }

        function startQuiz() {
            speak("", "en-US"); // Unlock Audio Context
            quizSequence = shuffle([...countryList]);
            analyticsData = []; // Reset analytics
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            feedbackEl.innerText = "";
            feedbackEl.className = "feedback";
            nextBtnEl.style.display = "none";
            optionsGridEl.innerHTML = "";

            const qData = quizSequence[currentIndex];
            
            targetCountryEl.innerText = qData.zh;
            targetHintEl.innerText = `Hint: ${qData.h}`;
            
            mainTtsBtn.onclick = () => speak(qData.zh, 'zh-HK');

            if (autoTtsCheckbox.checked) {
                speak(qData.zh, 'zh-HK');
            }

            questionCounterEl.innerText = `Question ${currentIndex + 1} of ${quizSequence.length}`;
            scoreCounterEl.innerText = `Score: ${currentScore}`;
            progressBarEl.style.width = `${(currentIndex / quizSequence.length) * 100}%`;

            const currentOptions = generateOptions(qData.c);

            currentOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                const textSpan = document.createElement('span');
                textSpan.innerText = opt;
                btn.appendChild(textSpan);

                const ttsSmallBtn = document.createElement('button');
                ttsSmallBtn.className = 'tts-btn-small';
                ttsSmallBtn.innerText = '🔊';
                ttsSmallBtn.title = "Listen to Country";
                ttsSmallBtn.onclick = (e) => {
                    e.stopPropagation();
                    speak(opt, 'en-US');
                };
                btn.appendChild(ttsSmallBtn);

                btn.onclick = () => selectOption(opt, btn, qData.c);
                optionsGridEl.appendChild(btn);
            });

            // Start timer for this question
            questionStartTime = Date.now();
        }

        function selectOption(selected, btnEl, correct) {
            // Calculate time taken
            const timeTaken = (Date.now() - questionStartTime) / 1000;
            const qData = quizSequence[currentIndex];
            
            const isCorrect = (selected === correct);

            // Record Analytics
            analyticsData.push({
                zh: qData.zh,
                en: qData.c,
                time: timeTaken,
                isCorrect: isCorrect
            });

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                btnEl.classList.add('correct');
                feedbackEl.innerText = `Correct! (正確) - ${timeTaken.toFixed(1)}s`;
                feedbackEl.className = "feedback success";
                currentScore++;
            } else {
                btnEl.classList.add('incorrect');
                feedbackEl.innerText = `Incorrect. The correct country is: ${correct}`;
                feedbackEl.className = "feedback error";
                
                allBtns.forEach(btn => {
                    if (btn.querySelector('span').innerText === correct) {
                        btn.classList.add('correct');
                    }
                });
            }

            scoreCounterEl.innerText = `Score: ${currentScore}`;
            
            if (currentIndex === quizSequence.length - 1) {
                nextBtnEl.innerHTML = "See Final Results &rarr;";
            } else {
                nextBtnEl.innerHTML = "Next Country &rarr;";
            }
            
            nextBtnEl.style.display = "inline-block";
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < quizSequence.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('results-area').style.display = 'block';
            document.getElementById('final-score').innerText = `${currentScore} / ${quizSequence.length}`;
            
            // Calculate Percentages
            const percentageCorrect = (currentScore / quizSequence.length) * 100;
            const percentageWrong = 100 - percentageCorrect;
            
            // Build Analytics Table
            // Sort by time taken (shortest to longest)
            analyticsData.sort((a, b) => a.time - b.time);

            let analyticsHTML = `
                <div class="stats-summary">
                    <div style="color: var(--success); font-size: 1.5rem; font-weight: bold;">Correct: ${percentageCorrect.toFixed(1)}%</div>
                    <div style="color: var(--danger); font-size: 1.5rem; font-weight: bold;">Wrong: ${percentageWrong.toFixed(1)}%</div>
                </div>
                <div class="analytics-container">
                    <table class="analytics-table">
                        <thead>
                            <tr>
                                <th>Country (Chinese)</th>
                                <th>Country (English)</th>
                                <th>Time Taken</th>
                                <th>Result</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            analyticsData.forEach(item => {
                const rowClass = item.isCorrect ? 'correct-row' : 'incorrect-row';
                const resultText = item.isCorrect ? '✓ Correct' : '✗ Wrong';
                
                analyticsHTML += `
                    <tr class="${rowClass}">
                        <td>${item.zh}</td>
                        <td>${item.en}</td>
                        <td>${item.time.toFixed(2)} s</td>
                        <td>${resultText}</td>
                    </tr>
                `;
            });

            analyticsHTML += `</tbody></table></div>`;
            document.getElementById('analytics-area').innerHTML = analyticsHTML;
        }
    </script>
