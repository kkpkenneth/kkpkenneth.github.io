            color: #555;
            padding: 10px 20px;
            font-size: 13px;
            border-radius: 4px;

            letter-spacing: 1px;
            white-space: nowrap;

    const visitedPlacesAmericas = [
        "🇨🇦 Canada", "🇺🇸 United States", "🇲🇽 Mexico", "🇨🇺 Cuba", "🇧🇸 Bahamas", 
        "🇯🇲 Jamaica", "🇭🇹 Haiti", "🇩🇴 Dominican Republic", "🇪🇨 Ecuador", "🇵🇪 Peru", 
        "🇧🇴 Bolivia", "🇵🇾 Paraguay", "🇨🇱 Chile", "🇦🇷 Argentina", "🇺🇾 Uruguay", 
        "🇧🇷 Brazil", "🇨🇴 Colombia", "🇻🇪 Venezuela", "🇸🇷 Suriname", "🇬🇾 Guyana", 
        "🇬🇩 Grenada", "🇹🇹 Trinidad and Tobago", "🇧🇧 Barbados", "🇧🇿 Belize", "🇬🇹 Guatemala", 
        "🇸🇻 El Salvador", "🇭🇳 Honduras", "🇳🇮 Nicaragua", "🇨🇷 Costa Rica", "🇵🇦 Panama",

        "🇩🇲 Dominica", "🇰🇳 Saint Kitts and Nevis", "🇬🇵 Guadeloupe", "🇲🇶 Martinique"
    ];

    function buildLayout() {
        const shuffled = [...destinationsAmericas].sort(() => 0.5 - Math.random());
        const fullSection = document.getElementById('full-section');
        const splitSection = document.getElementById('split-section');

        // Build 3 Full Covers
        shuffled.slice(0, 3).forEach(item => {
            const block = document.createElement('a');
            block.className = 'cover-block full-height';
            block.href = item.link;
            block.style.backgroundImage = `url('${item.image}')`;
            block.innerHTML = `
                <div class="text-box">
                    <h1 style="color: ${item.color}">${item.title}</h1>
                    <h3 style="color: ${item.color}">${item.caption}</h3>
                    <p style="color: ${item.color}">Read more ></p>
                </div>
            `;
            fullSection.appendChild(block);
        });

        // Build up to 6 Split Covers
        shuffled.slice(3, 9).forEach(item => {
            const block = document.createElement('a');
            block.className = 'cover-block split-height';
            block.href = item.link;
            block.style.backgroundImage = `url('${item.image}')`;
            block.innerHTML = `
                <div class="text-box">
                    <h2 style="color: ${item.color}">${item.title}</h2>
                    <p style="color: ${item.color}">${item.caption}</p>
                    <p style="color: ${item.color}; font-size: 12px;">Read more ></p>
                </div>
            `;
            splitSection.appendChild(block);
        });

        // Generate the American Archive Buttons dynamically 
        const placesGrid = document.getElementById('placesGrid');
        
        visitedPlacesAmericas.forEach(place => {
            // Regex automatically strips out the emoji and spaces to form clean links
            const fileBase = place.toLowerCase().replace(/[^a-z0-9]/g, '');
            const link = document.createElement('a');
            link.href = "Countries/" + fileBase + ".html";
            link.className = 'place-tag';
            link.innerText = place;
            placesGrid.appendChild(link);
        });
    }

    window.onload = buildLayout;
</script>
