<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Prevents double-tap zooming on mobile devices -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobile Touch Piano</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #2c3e50;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    font-family: sans-serif;
  }
  .piano-container {
    background: #111;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    /* Allow swiping left/right on smaller screens */
    max-width: 95vw;
    overflow-x: auto; 
    -webkit-overflow-scrolling: touch;
  }
  .piano {
    display: flex;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }
  .key {
    width: 40px; 
    height: 200px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 0 0 5px 5px;
    margin: 0 1px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 15px;
    box-sizing: border-box;
    font-weight: bold;
    color: #555;
    font-size: 0.9em;
    /* Prevents the browser from trying to scroll when dragging a finger on a key */
    touch-action: none; 
  }
  .key:active, .key.active {
    background: #e0e0e0;
    box-shadow: 0 2px 4px inset rgba(0,0,0,0.3);
  }
  .black-key {
    width: 26px;
    height: 120px;
    background: #222;
    position: absolute;
    top: 0;
    z-index: 2;
    border-radius: 0 0 5px 5px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
    box-sizing: border-box;
    color: #fff;
    font-size: 0.7em;
    font-weight: bold;
    touch-action: none;
  }
  .black-key:active, .black-key.active {
    background: #444;
    box-shadow: 0 2px 4px inset rgba(0,0,0,0.5);
  }
  .hint {
    text-align: center;
    color: #888;
    margin-top: 15px;
    font-size: 0.9em;
  }

  /* Toggle Button */
  .toggle-btn {
    background: #3498db;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
    margin-top: 25px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: background 0.2s;
  }
  .toggle-btn:hover {
    background: #2980b9;
  }

  /* Guide Styles (Keyboard Layout) */
  .guide-container {
    background: #111;
    margin-top: 15px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    max-width: 95vw;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
    /* Default visible */
    display: block; 
  }
  .guide-title {
    text-align: center;
    color: #fff;
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 1.1em;
  }
  .kb-row {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 6px;
  }
  .kb-key {
    background: #333;
    border: 2px solid #555;
    border-radius: 5px;
    width: 42px;
    height: 42px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-right: 6px;
    color: #fff;
    font-size: 0.85em;
    box-sizing: border-box;
  }
  .kb-key.black-note {
    background: #222;
    border-color: #444;
  }
  .kb-key.white-note {
    background: #ddd;
    border-color: #999;
    color: #222;
  }
  .kb-letter {
    font-weight: bold;
    color: #4CAF50;
    font-size: 1.1em;
  }
  .kb-note {
    font-size: 0.75em;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="piano-container">
  <div class="piano" id="piano"></div>
  <div class="hint">Tap, hold, or use keyboard keys to play</div>
</div>

<button class="toggle-btn" id="toggle-btn" onclick="toggleMap()">Hide Keyboard Map</button>

<div class="guide-container" id="guide-container">
  <h3 class="guide-title">Keyboard Map</h3>
  <!-- Rows will be injected here via JS to simulate physical keyboard layout -->
  <div id="guide-grid"></div>
</div>

<script>
  const notes = [
    // --- Lower Octave ---
    { note: 'C3',  freq: 130.81, isBlack: false, key: 'z' },
    { note: 'C#3', freq: 138.59, isBlack: true,  key: 's' },
    { note: 'D3',  freq: 146.83, isBlack: false, key: 'x' },
    { note: 'D#3', freq: 155.56, isBlack: true,  key: 'd' },
    { note: 'E3',  freq: 164.81, isBlack: false, key: 'c' },
    { note: 'F3',  freq: 174.61, isBlack: false, key: 'v' },
    { note: 'F#3', freq: 185.00, isBlack: true,  key: 'g' },
    { note: 'G3',  freq: 196.00, isBlack: false, key: 'b' },
    { note: 'G#3', freq: 207.65, isBlack: true,  key: 'h' },
    { note: 'A3',  freq: 220.00, isBlack: false, key: 'n' },
    { note: 'A#3', freq: 233.08, isBlack: true,  key: 'j' },
    { note: 'B3',  freq: 246.94, isBlack: false, key: 'm' },
    // --- Upper Octave ---
    { note: 'C4',  freq: 261.63, isBlack: false, key: 'q' },
    { note: 'C#4', freq: 277.18, isBlack: true,  key: '2' },
    { note: 'D4',  freq: 293.66, isBlack: false, key: 'w' },
    { note: 'D#4', freq: 311.13, isBlack: true,  key: '3' },
    { note: 'E4',  freq: 329.63, isBlack: false, key: 'e' },
    { note: 'F4',  freq: 349.23, isBlack: false, key: 'r' },
    { note: 'F#4', freq: 369.99, isBlack: true,  key: '5' },
    { note: 'G4',  freq: 392.00, isBlack: false, key: 't' },
    { note: 'G#4', freq: 415.30, isBlack: true,  key: '6' },
    { note: 'A4',  freq: 440.00, isBlack: false, key: 'y' },
    { note: 'A#4', freq: 466.16, isBlack: true,  key: '7' },
    { note: 'B4',  freq: 493.88, isBlack: false, key: 'u' },
    { note: 'C5',  freq: 523.25, isBlack: false, key: 'i' }
  ];

  const piano = document.getElementById('piano');
  const guideGrid = document.getElementById('guide-grid');
  let audioCtx = null;
  const activeOscillators = {}; 
  const keyElements = {}; 

  // Toggle Functionality
  function toggleMap() {
    const container = document.getElementById('guide-container');
    const btn = document.getElementById('toggle-btn');
    if (container.style.display === 'none') {
      container.style.display = 'block';
      btn.innerText = 'Hide Keyboard Map';
    } else {
      container.style.display = 'none';
      btn.innerText = 'Show Keyboard Map';
    }
  }

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playNoteStart(frequency, keyId) {
    initAudio();
    if (activeOscillators[keyId]) return;

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.type = 'triangle';
    oscillator.frequency.value = frequency;
    
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.start();
    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05);

    activeOscillators[keyId] = { oscillator, gainNode };
  }

  function playNoteStop(keyId) {
    const node = activeOscillators[keyId];
    if (node) {
      node.gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      node.oscillator.stop(audioCtx.currentTime + 0.1);
      delete activeOscillators[keyId];
    }
  }

  // --- 1. Build Piano ---
  let whiteKeyIndex = 0;
  const whiteKeyStride = 42; // 40px width + 2px margin

  notes.forEach((n) => {
    const key = document.createElement('div');
    key.innerText = n.note; 
    
    if (n.isBlack) {
      key.className = 'black-key';
      key.style.left = `${(whiteKeyIndex * whiteKeyStride) - 13}px`; 
    } else {
      key.className = 'key';
      whiteKeyIndex++;
    }

    keyElements[n.key] = key;

    // Support for touch/mouse
    key.addEventListener('pointerdown', (e) => {
      e.preventDefault(); 
      key.setPointerCapture(e.pointerId); 
      playNoteStart(n.freq, n.key);
      key.classList.add('active');
    });

    const stopInteraction = (e) => {
      e.preventDefault();
      playNoteStop(n.key);
      key.classList.remove('active');
    };

    key.addEventListener('pointerup', stopInteraction);
    key.addEventListener('pointerleave', stopInteraction);
    key.addEventListener('pointercancel', stopInteraction);

    piano.appendChild(key);
  });

  // --- 2. Build Keyboard Guide Map ---
  // Physical arrangement of rows (indentation measured in pixels for staggering)
  const kbLayout = [
    [ { k: '2', m: 35 }, { k: '3', m: 0 }, { k: '5', m: 48 }, { k: '6', m: 0 }, { k: '7', m: 0 } ],
    [ { k: 'q', m: 10 }, { k: 'w', m: 0 }, { k: 'e', m: 0 }, { k: 'r', m: 0 }, { k: 't', m: 0 }, { k: 'y', m: 0 }, { k: 'u', m: 0 }, { k: 'i', m: 0 } ],
    [ { k: 's', m: 45 }, { k: 'd', m: 0 }, { k: 'g', m: 48 }, { k: 'h', m: 0 }, { k: 'j', m: 0 } ],
    [ { k: 'z', m: 32 }, { k: 'x', m: 0 }, { k: 'c', m: 0 }, { k: 'v', m: 0 }, { k: 'b', m: 0 }, { k: 'n', m: 0 }, { k: 'm', m: 0 } ]
  ];

  kbLayout.forEach(rowInfo => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'kb-row';
    
    rowInfo.forEach(item => {
      const noteData = notes.find(n => n.key === item.k);
      const keyDiv = document.createElement('div');
      
      keyDiv.className = `kb-key ${noteData.isBlack ? 'black-note' : 'white-note'}`;
      if (item.m) keyDiv.style.marginLeft = `${item.m}px`;

      keyDiv.innerHTML = `
        <span class="kb-letter">${item.k.toUpperCase()}</span>
        <span class="kb-note">${noteData.note}</span>
      `;
      rowDiv.appendChild(keyDiv);
    });
    
    guideGrid.appendChild(rowDiv);
  });

  // --- 3. Keyboard Events ---
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return; 
    const keyChar = e.key.toLowerCase();
    const noteData = notes.find(n => n.key === keyChar);
    
    if (noteData) {
      playNoteStart(noteData.freq, keyChar);
      keyElements[keyChar].classList.add('active');
    }
  });

  window.addEventListener('keyup', (e) => {
    const keyChar = e.key.toLowerCase();
    const noteData = notes.find(n => n.key === keyChar);
    
    if (noteData) {
      playNoteStop(keyChar);
      keyElements[keyChar].classList.remove('active');
    }
  });
</script>

</body>
</html>
