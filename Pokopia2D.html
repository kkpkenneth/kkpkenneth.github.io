<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokopia: Celebration Edition</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #1a1a1a; color: #eee; font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column;
            height: 100vh; width: 100vw; touch-action: none;
        }
        #ui-overlay {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 20px;
            font-weight: bold; font-size: 14px; border: 1px solid #444; pointer-events: none;
            display: flex; gap: 15px; color: #00d2ff;
        }
        #game-container {
            flex: 1; position: relative; width: 100%; background: #2d4f1e;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        canvas { 
            background: #5a8f3c; image-rendering: pixelated; 
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        /* Celebration Popup */
        #popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: #333; border: 5px solid #ffcb05; border-radius: 20px;
            padding: 20px; text-align: center; z-index: 500; min-width: 250px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; visibility: hidden;
        }
        #popup.show { transform: translate(-50%, -50%) scale(1); visibility: visible; }
        #popup h1 { color: #ffcb05; margin: 0; font-size: 1.5em; text-shadow: 2px 2px #3b4cca; }
        #popup p { margin: 10px 0; font-weight: bold; font-size: 1.1em; }
        #popup img { width: 120px; height: 120px; }

        #build-btn {
            position: absolute; right: 20px; bottom: 20px;
            width: 70px; height: 70px; background: #ffcb05; 
            border: 4px solid #3b4cca; border-radius: 50%;
            color: #3b4cca; font-weight: bold; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 110;
        }
        #sidebar { 
            height: 140px; background: #222; border-top: 3px solid #444;
            overflow-x: auto; overflow-y: hidden; white-space: nowrap; padding: 10px;
            display: flex; align-items: center; gap: 10px;
        }
        .habitat-tag { 
            display: inline-flex; flex-direction: column; align-items: center;
            background: #333; padding: 8px; border-radius: 10px; min-width: 110px;
            font-size: 11px; text-align: center; border-bottom: 3px solid transparent;
        }
        .unlocked { border-bottom-color: #00ff00; background: #2d3d2d; }
        .locked { opacity: 0.3; }
        .dex-img { width: 40px; height: 40px; }

        @media (min-width: 900px) {
            body { flex-direction: row; }
            #sidebar { height: 100%; width: 280px; flex-direction: column; overflow-y: auto; overflow-x: hidden; white-space: normal; }
            .habitat-tag { width: 100%; flex-direction: row; text-align: left; gap: 10px; }
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <span>💎 <span id="res-val">0</span></span>
        <span>🏠 <span id="lvl-val">0</span>/31</span>
    </div>

    <div id="popup">
        <h1>New Discovery!</h1>
        <img id="pop-img" src="" alt="pkmn">
        <p id="pop-text"></p>
        <div style="font-size: 0.8em; color: #aaa;">Added to your Pokopia!</div>
    </div>

    <div id="game-container">
        <canvas id="pokopiaCanvas"></canvas>
        <div id="build-btn">BUILD</div>
    </div>

    <div id="sidebar"></div>

    <audio id="bgMusic" loop><source src="pokopia.mp3" type="audio/mpeg"></audio>

<script>
    const canvas = document.getElementById('pokopiaCanvas');
    const ctx = canvas.getContext('2d');
    const bgMusic = document.getElementById('bgMusic');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    const WORLD_W = 900, WORLD_H = 1200, GRID_SIZE = 60; 
    canvas.width = WORLD_W; canvas.height = WORLD_H;

    let materials = 0, musicStarted = false, isTouching = false;

    const player = { 
        x: 450, y: 600, targetX: 450, targetY: 600, 
        lerpSpeed: 0.12, lastWander: Date.now(), wanderInterval: 2000
    };

    const resources = [];
    const activeHabitats = [];
    const resourceEmojis = ["🌱", "🍎", "⚡", "💎", "🪵", "💧", "🐚", "🍄", "🏮", "❄️"];

    const dittoImg = new Image();
    dittoImg.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/132.png";

    const habitatData = [
        { name: "Tall Grass", color: "#2e7d32", pk: "Bulbasaur", id: 1 },
        { name: "Campsite", color: "#d84315", pk: "Charmander", id: 4 },
        { name: "Quiet Pond", color: "#0277bd", pk: "Squirtle", id: 7 },
        { name: "Forest Edge", color: "#1b5e20", pk: "Caterpie", id: 10 },
        { name: "Berry Orchard", color: "#9e9d24", pk: "Pidgey", id: 16 },
        { name: "Electric Field", color: "#fbc02d", pk: "Pikachu", id: 25 },
        { name: "Desert Path", color: "#c5b358", pk: "Sandshrew", id: 27 },
        { name: "Moonlit Hill", color: "#3f51b5", pk: "Clefairy", id: 35 },
        { name: "Volcano Base", color: "#bf360c", pk: "Vulpix", id: 37 },
        { name: "Zen Garden", color: "#8d6e63", pk: "Psyduck", id: 54 },
        { name: "Fighting Dojo", color: "#d32f2f", pk: "Mankey", id: 56 },
        { name: "Flower Field", color: "#f06292", pk: "Growlithe", id: 58 },
        { name: "Mountain Peak", color: "#616161", pk: "Geodude", id: 74 },
        { name: "Power Plant", color: "#ffeb3b", pk: "Magnemite", id: 81 },
        { name: "Mystic Cave", color: "#4527a0", pk: "Gastly", id: 92 },
        { name: "Crystal Mine", color: "#7b1fa2", pk: "Onix", id: 95 },
        { name: "Urban Alley", color: "#424242", pk: "Koffing", id: 109 },
        { name: "Sandy Shore", color: "#ef6c00", pk: "Krabby", id: 98 },
        { name: "Exercise Spot", color: "#4e342e", pk: "Hitmonlee", id: 106 },
        { name: "Park Bench", color: "#8bc34a", pk: "Eevee", id: 133 },
        { name: "Coral Reef", color: "#00bcd4", pk: "Vaporeon", id: 134 },
        { name: "Hot Springs", color: "#f44336", pk: "Flareon", id: 136 },
        { name: "Prehistoric Cave", color: "#795548", pk: "Aerodactyl", id: 142 },
        { name: "Dragon Den", color: "#311b92", pk: "Dratini", id: 147 },
        { name: "Spooky Woods", color: "#212121", pk: "Gengar", id: 94 },
        { name: "Ancient Ruins", color: "#a1887f", pk: "Togepi", id: 175 },
        { name: "Sheep Pasture", color: "#fff9c4", pk: "Mareep", id: 179 },
        { name: "Icy Tundra", color: "#e1f5fe", pk: "Swinub", id: 220 },
        { name: "Dark Forest", color: "#1a237e", pk: "Lucario", id: 448 },
        { name: "Meteor Crater", color: "#37474f", pk: "Rayquaza", id: 384 },
        { name: "Sacred Shrine", color: "#ff8f00", pk: "Ho-Oh", id: 250 }
    ];

    function playSfx(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        if(type === 'collect') { osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); }
        else if(type === 'success') { 
            // Celebration Chime
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.3); // C6
        }
        else { osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.2); }
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (clientX - rect.left) * (WORLD_W / rect.width), y: (clientY - rect.top) * (WORLD_H / rect.height) };
    }

    const startInput = (e) => {
        isTouching = true; const p = getPos(e); player.targetX = p.x; player.targetY = p.y;
        activeHabitats.forEach((h, i) => {
            if (p.x >= h.x + 90 && p.x <= h.x + 120 && p.y >= h.y && p.y <= h.y + 40) {
                activeHabitats.splice(i, 1); materials += 25; playSfx('recycle'); updateUI();
            }
        });
        if (!musicStarted) { bgMusic.play(); musicStarted = true; }
    };

    const moveInput = (e) => { if (isTouching) { const p = getPos(e); player.targetX = p.x; player.targetY = p.y; } };
    const endInput = () => { isTouching = false; player.targetX = Math.round(player.targetX / GRID_SIZE) * GRID_SIZE; player.targetY = Math.round(player.targetY / GRID_SIZE) * GRID_SIZE; player.lastWander = Date.now(); };

    canvas.addEventListener('touchstart', startInput, {passive: false});
    canvas.addEventListener('touchmove', moveInput, {passive: false});
    canvas.addEventListener('touchend', endInput);
    canvas.addEventListener('mousedown', startInput);
    window.addEventListener('mousemove', moveInput);
    window.addEventListener('mouseup', endInput);

    document.getElementById('build-btn').addEventListener('click', tryBuild);

    function tryBuild() {
        let tid = -1;
        for(let i=0; i<habitatData.length; i++) { if(!activeHabitats.some(ah => ah.idx === i)) { tid = i; break; } }
        if (materials >= 50 && tid !== -1) {
            materials -= 50;
            const d = habitatData[tid];
            const pUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${d.id}.png`;
            const img = new Image(); img.src = pUrl;
            activeHabitats.push({ x: player.x-60, y: player.y-60, px: 25, py: 25, img, color: d.color, name: d.name, pk: d.pk, idx: tid, last: Date.now() });
            
            // Celebration!
            showPopup(d.pk, pUrl);
            playSfx('success'); 
            updateUI();
        }
    }

    function showPopup(name, url) {
        const p = document.getElementById('popup');
        document.getElementById('pop-img').src = url;
        document.getElementById('pop-text').innerText = name + " has arrived!";
        p.classList.add('show');
        setTimeout(() => { p.classList.remove('show'); }, 3000);
    }

    function updateUI() {
        document.getElementById('res-val').innerText = materials;
        document.getElementById('lvl-val').innerText = activeHabitats.length;
        document.getElementById('sidebar').innerHTML = habitatData.map((h, i) => {
            const u = activeHabitats.some(ah => ah.idx === i);
            return `<div class="habitat-tag ${u ? 'unlocked' : 'locked'}">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${h.id}.png" class="dex-img" style="filter:${u?'none':'brightness(0)'}">
                <div><b>${u ? h.pk : 'Locked'}</b><br><span style="color:#aaa;font-size:9px">${h.name}</span></div></div>`;
        }).join('');
    }

    function loop() {
        const now = Date.now();
        if (!isTouching && now - player.lastWander > player.wanderInterval) {
            const wDirs = [[-GRID_SIZE, 0], [GRID_SIZE, 0], [0, -GRID_SIZE], [0, GRID_SIZE]];
            const pk = wDirs[Math.floor(Math.random() * wDirs.length)];
            let nx = player.targetX + pk[0], ny = player.targetY + pk[1];
            if (nx > 50 && nx < WORLD_W - 50 && ny > 50 && ny < WORLD_H - 50) { player.targetX = nx; player.targetY = ny; }
            player.lastWander = now; player.wanderInterval = 1500 + Math.random() * 2000;
        }

        player.x += (player.targetX - player.x) * player.lerpSpeed;
        player.y += (player.targetY - player.y) * player.lerpSpeed;

        ctx.clearRect(0, 0, WORLD_W, WORLD_H);
        activeHabitats.forEach(h => {
            ctx.fillStyle = h.color; ctx.beginPath(); ctx.roundRect(h.x, h.y, 120, 120, 15); ctx.fill();
            ctx.fillStyle = "#ff4444"; ctx.beginPath(); ctx.roundRect(h.x + 95, h.y + 5, 20, 20, 4); ctx.fill();
            ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.fillText("X", h.x + 100, h.y + 20);
            ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.roundRect(h.x + 5, h.y + 5, 80, 18, 5); ctx.fill();
            ctx.fillStyle = "white"; ctx.font = "bold 11px sans-serif"; ctx.fillText(h.name, h.x + 10, h.y + 18);
            if (now - h.last > 1500) { h.px = 15+Math.random()*40; h.py = 25+Math.random()*40; h.last = now; }
            ctx.drawImage(h.img, h.x + h.px, h.y + h.py, 70, 70); 
        });

        if(Math.random() < 0.03 && resources.length < 15) {
            resources.push({x: 50+Math.random()*800, y: 50+Math.random()*1100, e: resourceEmojis[Math.floor(Math.random()*resourceEmojis.length)]});
        }
        for(let i=resources.length-1; i>=0; i--){
            let r = resources[i]; ctx.font = "40px Arial"; ctx.fillText(r.e, r.x, r.y);
            if(Math.hypot(player.x - r.x, player.y - r.y) < 65) { resources.splice(i,1); materials += 10; playSfx('collect'); updateUI(); }
        }
        ctx.drawImage(dittoImg, player.x - 50, player.y - 50, 100, 100);
        requestAnimationFrame(loop);
    }
    updateUI(); loop();
</script>
</body>
</html>
