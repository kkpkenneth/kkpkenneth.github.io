<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自然煉金術 (200種生物與元素)</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 {
            color: #2ecc71;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }
        p.subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }
        
        .workspace {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            border: 2px dashed #444;
            min-height: 120px;
            width: 100%;
            max-width: 600px;
        }
        .slot {
            width: 90px;
            height: 90px;
            background-color: #2c3e50;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            border: 2px solid transparent;
        }
        .slot.drag-over {
            border-color: #2ecc71;
            background-color: #34495e;
            transform: scale(1.05);
        }
        .slot:hover {
            transform: scale(1.05);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 15px rgba(255,255,255,0.1);
        }
        .slot .element-name {
            font-size: 13px;
            margin-top: 5px;
            font-weight: bold;
            color: #ddd;
        }
        .slot .placeholder {
            font-size: 14px;
            color: #7f8c8d;
        }
        .plus-sign {
            font-size: 32px;
            color: #666;
            font-weight: bold;
        }
        
        .inventory-container {
            width: 100%;
            max-width: 900px;
        }
        .inventory-title {
            font-size: 18px;
            color: #2ecc71;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .inventory {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }
        /* Scrollbar styles */
        .inventory::-webkit-scrollbar { width: 8px; }
        .inventory::-webkit-scrollbar-track { background: #1e1e1e; border-radius: 4px; }
        .inventory::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        
        .element-btn {
            background-color: #272727;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: grab;
            transition: all 0.2s;
            width: 70px;
        }
        .element-btn:active { cursor: grabbing; }
        .element-btn:hover {
            background-color: #333;
            border-color: #2ecc71;
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        .element-btn .emoji { font-size: 28px; margin-bottom: 5px; pointer-events: none; }
        .element-btn .name { font-size: 14px; font-weight: bold; color: #ddd; pointer-events: none; text-align: center; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.3s ease-in-out; border-color: #e74c3c !important; }
        
        @keyframes flash {
            0% { box-shadow: 0 0 0px #2ecc71; background-color: #2ecc71; }
            100% { box-shadow: 0 0 30px rgba(46, 204, 113, 0); background-color: #1e1e1e; }
        }
        .success-flash { animation: flash 0.8s ease-out; }

        #notification {
            position: fixed;
            top: 20px;
            background-color: #2ecc71;
            color: #121212;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transform: translateY(-100px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #notification.show { transform: translateY(0); }
        .notif-emoji { font-size: 24px; }
    </style>
</head>

        let unlockedElements = new Set(['water', 'fire', 'earth', 'air']);
        let slot1Item = null;
        let slot2Item = null;
        let isProcessing = false;

        function init() { renderInventory(); }

        function renderInventory() {
            const inventoryDiv = document.getElementById('inventory');
            inventoryDiv.innerHTML = '';
            
            unlockedElements.forEach(id => {
                const el = elementsDB[id];
                const btn = document.createElement('div');
                btn.className = 'element-btn';
                btn.draggable = true;
                btn.dataset.id = id;
                btn.ondragstart = dragStart;
                
                btn.innerHTML = `<div class="emoji">${el.emoji}</div><div class="name">${el.name}</div>`;
                inventoryDiv.appendChild(btn);
            });
            document.getElementById('count').innerText = unlockedElements.size;
        }

        function dragStart(ev) {
            ev.dataTransfer.setData("id", ev.target.dataset.id);
            ev.dataTransfer.effectAllowed = "copy";
        }

        function allowDrop(ev) {
            ev.preventDefault();
            if(!isProcessing) ev.currentTarget.classList.add('drag-over');
        }

        function dragLeave(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drop(ev, slotNum) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            if (isProcessing) return;

            const id = ev.dataTransfer.getData("id");
            if (!id) return;

            if (slotNum === 1) slot1Item = id;
            if (slotNum === 2) slot2Item = id;
            
            updateSlots();

            if (slot1Item && slot2Item) {
                processCombination();
            }
        }

        function clearSlot(slotNum) {
            if (isProcessing) return;
            if (slotNum === 1) slot1Item = null;
            if (slotNum === 2) slot2Item = null;
            updateSlots();
        }

        function updateSlots() {
            const s1 = document.getElementById('slot1');
            const s2 = document.getElementById('slot2');
            
            s1.innerHTML = slot1Item ? `<div class="emoji">${elementsDB[slot1Item].emoji}</div><div class="element-name">${elementsDB[slot1Item].name}</div>` : '<span class="placeholder">拖曳至此</span>';
            s2.innerHTML = slot2Item ? `<div class="emoji">${elementsDB[slot2Item].emoji}</div><div class="element-name">${elementsDB[slot2Item].name}</div>` : '<span class="placeholder">拖曳至此</span>';
        }

        function processCombination() {
            isProcessing = true;
            const attemptKey = [slot1Item, slot2Item].sort().join(',');
            
            setTimeout(() => {
                if (recipes[attemptKey]) {
                    const newId = recipes[attemptKey];
                    const ws = document.getElementById('workspace');
                    
                    ws.classList.add('success-flash');
                    setTimeout(() => ws.classList.remove('success-flash'), 800);

                    if (!unlockedElements.has(newId)) {
                        unlockedElements.add(newId);
                        showNotification(`解鎖新生命：${elementsDB[newId].name}！`, elementsDB[newId].emoji);
                        renderInventory();
                    }
                } else {
                    document.getElementById('workspace').classList.add('shake');
                    setTimeout(() => document.getElementById('workspace').classList.remove('shake'), 300);
                }
                
                slot1Item = null;
                slot2Item = null;
                updateSlots();
                isProcessing = false;
                
            }, 400); 
        }

        function showNotification(text, emoji) {
            const notif = document.getElementById('notification');
            document.getElementById('notif-text').innerText = text;
            document.getElementById('notif-emoji').innerText = emoji;
            
            notif.classList.add('show');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 3500);
        }

        init();
    </script>
