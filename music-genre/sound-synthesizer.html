<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Audio SFX Generator</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #2c3e50;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        margin: 0;
    }
    #synth-panel {
        background: #34495e;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: 100%;
        max-width: 500px;
    }
    h1 {
        margin-top: 0;
        text-align: center;
        color: #ecf0f1;
    }
    .control-group {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
    }
    label {
        font-weight: bold;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        color: #bdc3c7;
    }
    input[type="range"] {
        width: 100%;
        cursor: pointer;
    }
    select {
        width: 100%;
        padding: 10px;
        background: #ecf0f1;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        color: #2c3e50;
        cursor: pointer;
    }
    button {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background-color: #e74c3c;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 10px;
    }
    button:hover { background-color: #c0392b; }
    button:active { transform: scale(0.98); }
    
    .code-box {
        margin-top: 25px;
        background: #1a252f;
        padding: 15px;
        border-radius: 6px;
        font-family: monospace;
        color: #2ecc71;
        font-size: 1.1em;
        text-align: center;
        user-select: all;
    }
    .hint {
        text-align: center;
        font-size: 0.85em;
        color: #95a5a6;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div id="synth-panel">
    <h1>🎛️ SFX Generator</h1>
    
    <div class="control-group">
        <label>Waveform Type</label>
        <select id="wave-type">
            <option value="sine">Sine (Smooth, pure, like a whistle)</option>
            <option value="triangle" selected>Triangle (Soft, similar to a flute)</option>
            <option value="square">Square (Harsh, retro 8-bit sound)</option>
            <option value="sawtooth">Sawtooth (Buzzy, sharp, like a synth lead)</option>
        </select>
    </div>

    <div class="control-group">
        <label>Frequency (Pitch) <span id="freq-val">400 Hz</span></label>
        <input type="range" id="freq" min="50" max="2000" step="10" value="400">
    </div>

    <div class="control-group">
        <label>Duration <span id="dur-val">0.15s</span></label>
        <input type="range" id="dur" min="0.05" max="1.5" step="0.05" value="0.15">
    </div>

    <div class="control-group">
        <label>Volume <span id="vol-val">0.05</span></label>
        <input type="range" id="vol" min="0.01" max="0.3" step="0.01" value="0.05">
    </div>

    <button id="play-btn">Play Tone</button>

    <div class="code-box" id="code-output">
        playTone(400, 'triangle', 0.15, 0.05);
    </div>
    <div class="hint">Copy this line into your game's sounds dictionary.</div>
</div>

<script>
    // Audio Context Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // The same playTone function from your game
    function playTone(freq, type, duration, vol=0.1) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // DOM Elements
    const waveType = document.getElementById('wave-type');
    const freqInput = document.getElementById('freq');
    const durInput = document.getElementById('dur');
    const volInput = document.getElementById('vol');
    
    const freqVal = document.getElementById('freq-val');
    const durVal = document.getElementById('dur-val');
    const volVal = document.getElementById('vol-val');
    
    const playBtn = document.getElementById('play-btn');
    const codeOutput = document.getElementById('code-output');

    // Update UI labels and generated code
    function updateUI() {
        const type = waveType.value;
        const freq = freqInput.value;
        const dur = durInput.value;
        const vol = volInput.value;

        freqVal.textContent = `${freq} Hz`;
        durVal.textContent = `${dur}s`;
        volVal.textContent = vol;

        codeOutput.textContent = `playTone(${freq}, '${type}', ${dur}, ${vol});`;
    }

    // Listeners for sliders to update text in real-time
    waveType.addEventListener('change', updateUI);
    freqInput.addEventListener('input', updateUI);
    durInput.addEventListener('input', updateUI);
    volInput.addEventListener('input', updateUI);

    // Play button triggers the sound
    playBtn.addEventListener('click', () => {
        const type = waveType.value;
        const freq = parseFloat(freqInput.value);
        const dur = parseFloat(durInput.value);
        const vol = parseFloat(volInput.value);
        
        playTone(freq, type, dur, vol);
    });

    // Initialize UI on load
    updateUI();
</script>
</body>
</html>
