<!DOCTYPE html>
<html>
<head>
    <title>Advanced Graph Plotter</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f8f9fa; }
        canvas { border: 2px solid #333; background: #fff; margin: 10px; cursor: crosshair; }
        .controls { display: grid; grid-template-columns: auto auto auto; gap: 10px; padding: 20px; background: #eee; border-radius: 8px; }
        .row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        input[type="number"] { width: 60px; }
    </style>
</head>
<body>

    <h2>Interactive Grapher</h2>
    <canvas id="graphCanvas" width="700" height="500"></canvas>

    <div class="controls">
        <div class="row"><strong>y = </strong></div>
        <div class="row">
            <input type="number" id="aNum" value="1" step="0.1">
            <input type="range" id="aRange" min="-50" max="50" step="0.1" value="1">x²
        </div>
        <div class="row">
            <input type="number" id="bNum" value="0" step="0.1">
            <input type="range" id="bRange" min="-50" max="50" step="0.1" value="0">x
        </div>
        <div class="row">
            <input type="number" id="cNum" value="0" step="0.1">
            <input type="range" id="cRange" min="-50" max="50" step="0.1" value="0">+ c
        </div>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const scale = 15; 

        function syncInput(numId, rangeId, isNumToRange) {
            const num = document.getElementById(numId);
            const range = document.getElementById(rangeId);
            if (isNumToRange) range.value = num.value;
            else num.value = range.value;
            draw();
        }

        // Setup listeners
        ['a', 'b', 'c'].forEach(char => {
            document.getElementById(char + 'Num').oninput = () => syncInput(char + 'Num', char + 'Range', true);
            document.getElementById(char + 'Range').oninput = () => syncInput(char + 'Num', char + 'Range', false);
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const W = canvas.width, H = canvas.height;
            
            // Draw Axes
            ctx.strokeStyle = '#ccc';
            ctx.beginPath();
            ctx.moveTo(0, H/2); ctx.lineTo(W, H/2);
            ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H);
            ctx.stroke();

            // Plot
            const a = parseFloat(document.getElementById('aNum').value);
            const b = parseFloat(document.getElementById('bNum').value);
            const c = parseFloat(document.getElementById('cNum').value);

            ctx.strokeStyle = 'blue';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let px = 0; px < W; px++) {
                let x = (px - W/2) / scale;
                let y = a*x*x + b*x + c;
                let py = H/2 - (y * scale);
                if (px === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
        }

        draw();
    </script>
</body>
</html>
