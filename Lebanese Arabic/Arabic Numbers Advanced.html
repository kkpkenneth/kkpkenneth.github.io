<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arabic Numbers 1–1000 Quiz</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #fff8e6, #e0f7ff);
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 { text-align: center; margin: 20px 0; color: #2c3e50; }
  .card { background: white; padding: 20px 30px; margin: 15px 0; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); width: 90%; max-width: 800px; }
  #quiz-number { font-size: 80px; margin: 20px 0; color: #e67e22; font-weight: bold; }
  #choices button {
    background-color: #1abc9c; color: white; border: none; border-radius: 10px; padding: 12px 18px; margin: 8px; font-size: 16px; cursor: pointer; transition: all 0.2s ease-in-out;
  }
  #choices button:hover { background-color: #16a085; transform: scale(1.05); }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 16px; }
  .row:last-child { border-bottom: none; }
  .arabic-number { font-size: 20px; font-weight: bold; color: #34495e; }
  .western-number { font-size: 16px; color: #2c3e50; }
  @media (max-width: 500px) {
    #quiz-number { font-size: 60px; }
    .row { font-size: 14px; }
    #choices button { font-size: 14px; padding: 10px 14px; }
  }
</style>
</head>
<body>

<h1>Arabic Numbers 1–1000 Quiz</h1>

<div class="card" style="text-align:center;">
  <h2>Guess the Number</h2>
  <div id="quiz-number">١</div>
  <div id="choices"></div>
</div>

<div class="card">
  <h2>Reference Table</h2>
  <div id="reference"></div>
</div>

<script>
// Convert Western digits to Arabic digits
function toArabic(num) {
  return num.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
}

// Generate romanized Lebanese pronunciation for 1–1000
function pronounce(num) {
  const ones = ["", "wahed","etneen","talata","arba’a","khamsa","sitta","sab’a","thamaniya","tis’a"];
  const tens = ["", "ashra","ishreen","talateen","arba’een","khamsin","sittin","sab’een","thamaneen","tis’in"];
  const hundreds = ["", "miya","miytein","thalath miya","arba’ miya","khams miya","sitt miya","sab’ miya","thaman miya","tis’ miya"];

  if(num === 0) return "sifr";
  if(num === 1000) return "alf";

  let h = Math.floor(num / 100);
  let t = Math.floor((num % 100) / 10);
  let o = num % 10;
  let parts = [];

  if(h > 0) parts.push(hundreds[h]);
  if(t > 0) parts.push(tens[t]);
  if(o > 0) parts.push(ones[o]);

  return parts.join(' ');
}

// Generate numbers array 1–1000
const numbers = [];
for(let i=0;i<=1000;i++){
  numbers.push({arabic: toArabic(i), digit: i, p: pronounce(i)});
}

// Populate reference table (only show every 10 for brevity)
const refDiv = document.getElementById('reference');
numbers.forEach((n,i)=>{
  if(i%10===0 || i===1 || i===1000){ // show first, multiples of 10, last
    const row = document.createElement('div');
    row.className='row';
    row.innerHTML=`<span class="arabic-number">${n.arabic}</span> <span class="western-number">${n.digit} — ${n.p}</span>`;
    refDiv.appendChild(row);
  }
});

let correctAnswer = null;

function newQuestion() {
  const qIndex = Math.floor(Math.random()*numbers.length);
  correctAnswer = numbers[qIndex];

  let options = [correctAnswer];
  while(options.length<4){
    let r = numbers[Math.floor(Math.random()*numbers.length)];
    if(!options.includes(r)) options.push(r);
  }
  options.sort(()=>Math.random()-0.5);

  document.getElementById('quiz-number').innerHTML = correctAnswer.arabic;
  const box = document.getElementById('choices');
  box.innerHTML='';
  options.forEach(opt=>{
    let btn=document.createElement('button');
    btn.innerHTML=`${opt.digit} (${opt.p})`;
    btn.onclick=()=> {
      if(opt===correctAnswer){
        alert('✅ Correct!');
      } else {
        alert(`❌ Wrong! Correct answer: ${correctAnswer.digit} (${correctAnswer.p})`);
      }
      newQuestion();
    };
    box.appendChild(btn);
  });
}

window.onload=newQuestion;
</script>

</body>
</html>
