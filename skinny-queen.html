<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互動字卡 - 皇后與國王</title>
    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            background-color: #fdf6e3;
            color: #2d3436;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* Start Page */
        #start-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            background-color: #ffeaa7;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 20;
        }

        #start-page h1 {
            font-size: 2.2rem;
            color: #d63031;
            margin-bottom: 10px;
        }

        #start-page p {
            font-size: 1.2rem;
            color: #636e72;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .instructions {
            font-size: 1rem !important;
            color: #b2bec3 !important;
            margin-bottom: 40px !important;
        }

        .primary-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #0984e3;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .primary-btn:active {
            transform: scale(0.95);
        }

        /* Flash Card Page */
        #story-page {
            display: none;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* Flashcard Area */
        #flashcard-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        #flashcard {
            font-size: clamp(8rem, 40vw, 15rem);
            font-weight: bold;
            color: #d63031;
            text-align: center;
            text-shadow: 2px 4px 12px rgba(0,0,0,0.1);
        }

        /* Touch Zones (kept for swiping) */
        #zone-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 30%;
            height: 80%;
            z-index: 5;
        }

        #zone-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 70%;
            height: 80%;
            z-index: 5;
        }

        /* Bottom Control Bar */
        #bottom-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(to top, #fdf6e3 60%, transparent);
            z-index: 15;
        }

        .control-btn {
            background-color: #ffffff;
            color: #2d3436;
            border: 2px solid #dfe6e9;
            padding: 12px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            background-color: #dfe6e9;
            transform: scale(0.95);
        }

        #progress {
            font-size: 1.2rem;
            color: #636e72;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Starting Page -->
    <div id="start-page">
        <h1>🃏 互動字卡</h1>
        <p>使用下方按鈕、左右滑動<br>或鍵盤的 ⬅️ ➡️ 方向鍵切換</p>
        <p class="instructions">（字卡會自動發音）</p>
        <button id="btn-start" class="primary-btn">開始</button>
    </div>

    <!-- Flash Card Page -->
    <div id="story-page">
        <!-- Touch zones for swiping -->
        <div id="zone-left"></div>
        <div id="zone-right"></div>
        
        <div id="flashcard-container">
            <div id="flashcard"></div>
        </div>
        
        <!-- Bottom Controls -->
        <div id="bottom-bar">
            <button id="btn-prev" class="control-btn">⬅️ 上一個</button>
            <div id="progress">1 / 100</div>
            <button id="btn-next" class="control-btn">下一個 ➡️</button>
        </div>
    </div>

    <script>
        const rawText = 
        `從前有一個皇后
        她很瘦
        皇后本來沒有那麼瘦的但是因為胖國王太胖了讓皇后非常的擔心
        她擔心國王到處找東西吃就把食物都藏起來
        皇后也擔心國王瘦不下來所以每天陪著國王做運動一二一二一二
        她覺得好累好累喔
        她天天緊緊張張又忙又累很多時候一點也不想吃東西有時候只吃一小口蛋糕就上床睡覺了日子久了連好吃的東西也不想吃了
        大家都說我們的皇后太瘦了不對不對是太瘦太瘦了
        皇后愈吃愈少愈來愈瘦有一天居然昏倒了快找醫生來國王急著下命令
        醫生說皇后的身體不健康這樣下去不得了國王很擔心的說大家快想想辦法呀
        廚師說皇后平常只吃自己喜歡的食物有些食物碰都不碰而且最近吃得太少了
        醫生說每種食物都要吃營養均衡才會健康而且皇后的心情要放輕鬆累的時候要休息
        奶製品類主食類魚肉蛋奶類油脂類青菜水果 
        公主說好久都沒有聽到媽咪唱歌了媽咪說過唱歌和種花的時候心情最輕鬆
        國王說都是我讓皇后擔心以後我不會再亂吃東西我少吃皇后多吃一點
        大家覺得這些方法都很好國王決定馬上就照著去做
        廚師做了美味又營養的食物給國王和皇后吃
        公主和皇后一起唱歌種花
        皇后累了就去休息
        大臣陪著國王做運動皇后在旁邊看有時候幫忙喊加油加油
        國王拿出口袋裡藏的零食不再讓皇后擔心
        有時候皇后和國王手牽著手散步看天邊的夕陽
        皇后不再緊緊張張又忙又累加上天天吃營養均衡的食物終於開始胖了起來
        從此以後大家都說我們的皇后又美麗又健康`;

        // Strip punctuation and split into an array
        const characters = rawText.replace(/[\s，。！：「」、]/g, '').split('');
        
        const flashcard = document.getElementById('flashcard');
        const progress = document.getElementById('progress');
        const startPage = document.getElementById('start-page');
        const storyPage = document.getElementById('story-page');
        
        let currentIndex = 0;

        // TTS function (Cantonese)
        function speakCharacter(char) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(char);
            utterance.lang = 'zh-HK'; // Changed to Cantonese
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }

        // Update UI and Speak
        function updateCard() {
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= characters.length) currentIndex = characters.length - 1;
            
            const char = characters[currentIndex];
            flashcard.innerText = char;
            
            // Fixed string interpolation syntax
            progress.innerText = `${currentIndex + 1} / ${characters.length}`;
            
            speakCharacter(char);
        }

        // Navigation logic
        function nextWord() {
            if (currentIndex < characters.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        // --- Event Listeners ---

        // Start Button
        document.getElementById('btn-start').addEventListener('click', () => {
            startPage.style.display = 'none';
            storyPage.style.display = 'flex';
            updateCard(); 
        });

        // Bottom Bar Buttons
        document.getElementById('btn-next').addEventListener('click', nextWord);
        document.getElementById('btn-prev').addEventListener('click', prevWord);

        // Invisible Click/Tap Zones
        document.getElementById('zone-right').addEventListener('click', nextWord);
        document.getElementById('zone-left').addEventListener('click', prevWord);

        // Keyboard Arrow Controls
        document.addEventListener('keydown', (event) => {
            if (storyPage.style.display === 'flex') { // Only if flashcards are active
                if (event.key === 'ArrowRight') {
                    nextWord();
                } else if (event.key === 'ArrowLeft') {
                    prevWord();
                }
            }
        });

        // Swipe Controls Logic
        let touchstartX = 0;
        let touchendX = 0;
        let touchstartY = 0;
        let touchendY = 0;

        function handleSwipe() {
            const diffX = touchstartX - touchendX;
            const diffY = Math.abs(touchstartY - touchendY);

            if (diffY < 60 && Math.abs(diffX) > 40) {
                if (diffX > 0) nextWord();  // Swipe Left
                else prevWord();            // Swipe Right
            }
        }

        storyPage.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        }, { passive: true });

        storyPage.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: true });

    </script>
</body>
</html>
