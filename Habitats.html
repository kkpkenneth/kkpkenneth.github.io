<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IUCN Habitat Alchemist</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --text: #c9d1d9;
            --accent: #58a6ff;
            --success: #238636;
        }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--text); text-align: center; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        
        /* Game Board */
        .game-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; margin-top: 20px; }
        
        .shelf { background: var(--card); padding: 15px; border: 2px solid #30363d; border-radius: 8px; }
        .shelf h3 { color: var(--accent); margin-top: 0; font-size: 14px; }
        
        .ingredient-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        
        button { 
            background: #21262d; border: 1px solid #30363d; color: var(--text); padding: 8px; 
            cursor: pointer; font-size: 11px; transition: 0.2s;
        }
        button:hover { background: #30363d; border-color: var(--accent); }
        button.selected { background: var(--accent); color: white; border-color: white; }

        /* The Pot / Crafting Area */
        .pot { 
            background: #000; border: 4px double var(--accent); padding: 20px; 
            display: flex; flex-direction: column; gap: 10px; min-height: 250px; justify-content: center;
        }
        .slot { border: 1px dashed #444; padding: 10px; font-size: 12px; color: #666; }
        .slot.filled { color: var(--accent); border-style: solid; }

        .target-box { background: #23863622; border: 1px solid var(--success); padding: 10px; margin-bottom: 20px; }
        #message { height: 20px; margin: 10px 0; font-weight: bold; }
        
        .score-board { font-size: 18px; color: var(--accent); margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>HABITAT ALCHEMIST</h1>
    <div class="score-board">HABITATS RESTORED: <span id="count">0</span> / 12</div>
    
    <div class="target-box">
        CURRENT MISSION: <span id="target-name" style="font-weight:bold; color:var(--accent);">Loading...</span>
    </div>

    <div id="message"></div>

    <div class="game-grid">
        <div class="shelf">
            <h3>INGREDIENTS BINS</h3>
            <div class="ingredient-grid" id="bins"></div>
        </div>

        <div class="pot">
            <div class="slot" id="slot-0">EMPTY FOUNDATION</div>
            <div class="slot" id="slot-1">EMPTY SUBSTRATE</div>
            <div class="slot" id="slot-2">EMPTY MATRIX</div>
            <div class="slot" id="slot-3">EMPTY FEATURE</div>
            <button onclick="checkRecipe()" style="margin-top:20px; background:var(--success); color:white; font-size:16px;">COOK HABITAT</button>
            <button onclick="clearPot()" style="background:#da3633; color:white;">DUMP SCRAP</button>
        </div>
    </div>

<script>
    // Audio Synth
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(f, t, d) {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        o.connect(g); g.connect(audioCtx.destination);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    const habitats = [
        { name: "Boreal Forest", recipe: ["Bedrock", "Podzol", "Coniferous", "Lichen"] },
        { name: "Tropical Rainforest", recipe: ["Latosol", "Humus", "Broadleaf", "Epiphyte"] },
        { name: "Hot Desert", recipe: ["Sandstone", "Sand", "Pebble", "Succulent"] },
        { name: "Arctic Tundra", recipe: ["Permafrost", "Cryosol", "Dwarf Shrub", "Sedge"] },
        { name: "Coral Reef", recipe: ["Aragonite", "Coral Sand", "Polyp", "Algae"] },
        { name: "Savanna", recipe: ["Laterite", "Silt", "Grass", "Acacia"] },
        { name: "Freshwater Bog", recipe: ["Clay", "Peat", "Sphagnum", "Reed"] },
        { name: "Deep Sea", recipe: ["Basalt", "Ooze", "Deep Clay", "Hydrothermal Vent"] },
        { name: "Salt Marsh", recipe: ["Estuarine Silt", "Anaerobic Mud", "Halophyte Grass", "Tidal Pulse"] },
        { name: "Mountain Peak", recipe: ["Granite", "Scree", "Ice", "Alpine Moss"] },
        { name: "Inland Cave", recipe: ["Limestone", "Guano", "Speleothem", "Fungi"] },
        { name: "Mangrove", recipe: ["Saline Silt", "Prop Root", "Pneumatophore", "Crustacean"] }
    ];

    const ingredients = {
        0: ["Bedrock", "Latosol", "Sandstone", "Permafrost", "Aragonite", "Laterite", "Clay", "Basalt", "Estuarine Silt", "Granite", "Limestone", "Saline Silt"],
        1: ["Podzol", "Humus", "Sand", "Cryosol", "Coral Sand", "Silt", "Peat", "Ooze", "Anaerobic Mud", "Scree", "Guano", "Prop Root"],
        2: ["Coniferous", "Broadleaf", "Pebble", "Dwarf Shrub", "Polyp", "Grass", "Sphagnum", "Deep Clay", "Halophyte Grass", "Ice", "Speleothem", "Pneumatophore"],
        3: ["Lichen", "Epiphyte", "Succulent", "Sedge", "Algae", "Acacia", "Reed", "Hydrothermal Vent", "Tidal Pulse", "Alpine Moss", "Fungi", "Crustacean"]
    };

    let currentHabitatIndex = 0;
    let pot = [null, null, null, null];
    let score = 0;

    function initGame() {
        const bins = document.getElementById('bins');
        bins.innerHTML = "";
        // Create buttons for all ingredient categories
        for(let cat=0; cat<4; cat++) {
            ingredients[cat].forEach(ing => {
                const btn = document.createElement('button');
                btn.innerText = ing;
                btn.onclick = () => addToPot(ing, cat);
                bins.appendChild(btn);
            });
        }
        updateTarget();
    }

    function updateTarget() {
        document.getElementById('target-name').innerText = habitats[currentHabitatIndex].name;
        document.getElementById('count').innerText = score;
    }

    function addToPot(ing, cat) {
        playSound(200 + (cat * 100), 'triangle', 0.1);
        pot[cat] = ing;
        const slot = document.getElementById(`slot-${cat}`);
        slot.innerText = ing;
        slot.classList.add('filled');
    }

    function clearPot() {
        playSound(100, 'sawtooth', 0.2);
        pot = [null, null, null, null];
        for(let i=0; i<4; i++) {
            const slot = document.getElementById(`slot-${i}`);
            slot.innerText = `EMPTY ${["FOUNDATION", "SUBSTRATE", "MATRIX", "FEATURE"][i]}`;
            slot.classList.remove('filled');
        }
    }

    function checkRecipe() {
        const target = habitats[currentHabitatIndex];
        const isCorrect = target.recipe.every((ing, i) => ing === pot[i]);

        if (isCorrect) {
            playSound(880, 'square', 0.3);
            setTimeout(() => playSound(1318, 'square', 0.4), 100);
            document.getElementById('message').innerText = "SUCCESS! HABITAT STABILIZED.";
            document.getElementById('message').style.color = "var(--success)";
            score++;
            currentHabitatIndex = (currentHabitatIndex + 1) % habitats.length;
            clearPot();
            updateTarget();
        } else {
            playSound(150, 'sawtooth', 0.5);
            document.getElementById('message').innerText = "ERROR: BIOME COLLAPSE. WRONG INGREDIENTS.";
            document.getElementById('message').style.color = "#da3633";
        }
    }

    initGame();
</script>
</body>
</html>
