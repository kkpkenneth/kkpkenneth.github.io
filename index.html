    <style>
        /* SMOOTH SCROLLING FOR DONATION LINK */
        html { scroll-behavior: smooth; }

        body { margin: 0; padding: 0; font-family: helvetica; background-color: white; overflow-x: hidden; }

        /* MENU STYLES */
        .menuspace { height: 50px; background-color: rgb(50,50,50); }
        .menu { 
            background-color: rgba(50, 50, 50, 0.95); 
            backdrop-filter: blur(10px);              
            width: 100%; position: fixed; top: 0; z-index: 2000; 
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s ease;
        }
        .menu-list { margin: 0; padding: 0; display: flex; list-style: none; }
        .menu-list li { position: relative; }
        .menu-list a { 
            color: rgb(194, 194, 194); text-decoration: none; display: block;
            padding: 15px 25px; font-size: 13px; text-transform: uppercase;
            letter-spacing: 1.5px; transition: color 0.3s ease;
        }
        .menu-toggle { display: none; color: white; font-size: 20px; padding: 15px; cursor: pointer; }

        @media only screen and (max-width: 900px) {
            .menu { justify-content: space-between; }
            .menu-toggle { display: block; }
            .menu-list {
                display: none; flex-direction: column; position: absolute;
                top: 100%; left: 0; width: 100%; background-color: rgb(50,50,50);
                border-top: 1px solid #444;
            }
            .menu-list.active { display: flex; }
        }

        /* NOTICE BARS */
        .notice { overflow: hidden; background-color: rgb(43,115,220); width: 100%; text-align: center; height: 45px; position: relative; }
        .notice p { color: white; font-size: 13px; word-spacing: 5px; margin-top: 15px; margin-bottom: 0; }
        .notice a { color: white; text-decoration: none; padding: 10px; }
        
        .notice2 { overflow: hidden; background-color: white; width: 100%; text-align: center; height: 45px; position: relative; border-bottom: 1px solid #eee; }
        .notice2 p { color: gray; font-size: 13px; word-spacing: 3px; margin-top: 15px; margin-bottom: 0; }
        .notice2 a { color: gray; text-decoration: none; padding: 10px; }
        .notice2 p:hover a { text-decoration: underline; }

        .closebtn { color: gray; font-weight: bold; font-size: 16px; cursor: pointer; position: absolute; right: 20px; top: 12px; transition: 0.3s; }
        .notice .closebtn { color: white; }
        .closebtn:hover { color: black; }

        /* LAYOUT */
        .full-container, .split-grid { display: grid; width: 100vw; gap: 20px; margin-bottom: 20px; }
        .full-container { grid-template-columns: 1fr; }
        .split-grid { grid-template-columns: 1fr 1fr; }

        /* COVER BLOCKS */
        .cover-block {
            overflow: hidden; background-position: center; background-size: cover;
            text-align: center; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-decoration: none; transition: opacity 0.3s;
        }
        .full-height { height: 600px; }
        .split-height { height: 450px; }

        /* Text Background Box */
        .text-box {
            background-color: rgba(0, 0, 0, 0.5); 
            padding: 20px 40px;
            border-radius: 2px;
            backdrop-filter: blur(5px); 
            max-width: 80%;
        }

        .cover-block h1 { font-size: 55px; margin: 5px; }
        .cover-block h2 { font-size: 35px; margin: 5px; }
        .cover-block h3 { font-size: 25px; font-weight: 1; margin: 5px; }
        .cover-block p { font-size: 15px; margin: 5px; }

        @media only screen and (max-width: 900px) {
            .split-grid { grid-template-columns: 1fr; gap: 10px; }
            .cover-block h1 { font-size: 35px; }
            .text-box { padding: 15px 20px; }
        }

        /* PLACES VISITED SCROLLER (UPDATED FOR LINKS) */
        .places-wrap {
            background-color: #f4f4f4;
            padding: 60px 20px;
            text-align: center;
        }
        .places-wrap h2 {
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #333;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .places-grid {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            height: 300px; /* Extended slightly to fit more buttons nicely */
            overflow-y: auto;
            padding: 15px;
        }
        .place-tag {
            background-color: white;
            color: #555;
            padding: 10px 20px;
            font-size: 13px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            text-decoration: none; /* Removes the link underline */
            transition: all 0.3s ease; /* Smooth hover transition */
            cursor: pointer;
        }
        
        /* HOVER EFFECT FOR BUTTONS */
        .place-tag:hover {
            background-color: rgb(43,115,220);
            color: white;
            box-shadow: 0 4px 10px rgba(43,115,220,0.3);
            transform: translateY(-2px);
        }

        /* Custom scrollbar for the places grid to keep it neat */
        .places-grid::-webkit-scrollbar { width: 6px; }
        .places-grid::-webkit-scrollbar-track { background: #e0e0e0; border-radius: 10px; }
        .places-grid::-webkit-scrollbar-thumb { background: #aaa; border-radius: 10px; }
        .places-grid::-webkit-scrollbar-thumb:hover { background: #888; }

        /* FOOTER */
        footer {
            background-color: gray; text-align: center;
            padding: 60px 20px; width: 100%; color: white;
            box-sizing: border-box;
        }
        .legal { margin-top: 30px; }
        .legal a { color: white; text-decoration: none; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; padding: 0 15px; opacity: 0.7; }
    </style>
</head>

<div class="menuspace"></div>

<!-- NOTICE BARS -->
<div class="notice">

</div>

    <p><a href="#support">Support my journey with your donation.</a><span class="closebtn" onclick="this.parentElement.parentElement.style.display='none';">&times;</span></p>

<div id="full-section" class="full-container"></div>

        <a href="about.html">About</a>

<script>
    function toggleMenu() {
        document.getElementById('menuList').classList.toggle('active');
    }

    const destinations = [
        { title: "Myanmar", caption: "Where sunrise lights up your soul", image: "Images/Myanmar.jpg", link: "myanmar.html", color: "white" },
        { title: "Canada", caption: "Living in Ice Age", image: "Images/Canada.jpg", link: "canada.html", color: "white" },
        { title: "Australia", caption: "Peering into the Wild", image: "Images/Australia.jpg", link: "australia.html", color: "white" },
        { title: "Maldives", caption: "Chill Like a Boss", image: "Images/Maldives.jpg", link: "maldives.html", color: "white" },
        { title: "Cuba", caption: "Travel Back in Time", image: "Images/Cuba.jpg", link: "cuba.html", color: "white" },
        { title: "Portugal", caption: "Into the Unknown", image: "Images/Portugal.jpg", link: "portugal.html", color: "white" },
        { title: "Indonesia", caption: "The Jungle Rook", image: "Images/Indonesia.jpg", link: "indonesia.html", color: "white" },
        { title: "Tunisia", caption: "The Gem of Africa", image: "Images/Tunisia.jpg", link: "tunisia.html", color: "white" },
        { title: "Fiji", caption: "Garden of the Sea", image: "Images/Fiji.jpg", link: "fiji.html", color: "white" },
        { title: "Nepal", caption: "Roof of the World", image: "Images/Nepal.jpg", link: "nepal.html", color: "white" },
        { title: "Azerbaijan", caption: "Fire and Silk", image: "Images/Azerbaijan.jpg", link: "azerbaijan.html", color: "white" }
    ];

    function buildLayout() {
        const shuffled = [...destinations].sort(() => 0.5 - Math.random());
        const fullSection = document.getElementById('full-section');
        const splitSection = document.getElementById('split-section');

        // Build 3 Full Covers
        shuffled.slice(0, 3).forEach(item => {
            const block = document.createElement('a');
            block.className = 'cover-block full-height';
            block.href = item.link;
            block.style.backgroundImage = `url('${item.image}')`;
            block.innerHTML = `
                <div class="text-box">
                    <h1 style="color: ${item.color}">${item.title}</h1>
                    <h3 style="color: ${item.color}">${item.caption}</h3>
                    <p style="color: ${item.color}">Read more ></p>
                </div>
            `;
            fullSection.appendChild(block);
        });

        // Build 6 Split Covers
        shuffled.slice(3, 9).forEach(item => {
            const block = document.createElement('a');
            block.className = 'cover-block split-height';
            block.href = item.link;
            block.style.backgroundImage = `url('${item.image}')`;
            block.innerHTML = `
                <div class="text-box">
                    <h2 style="color: ${item.color}">${item.title}</h2>
                    <p style="color: ${item.color}">${item.caption}</p>
                    <p style="color: ${item.color}; font-size: 12px;">Read more ></p>
                </div>
            `;
            splitSection.appendChild(block);
        });
        
        // --- NEW: Generate the 163 Archive Buttons dynamically ---
        const visitedPlaces = [
            "Hong Kong", "Taiwan", "Japan", "South Korea", "Mongolia", "China", "Macau", "United Kingdom", "France", "Spain", "Portugal", "Netherlands", "Belgium", "Germany", "Ireland", "Canada", "United States", "Mexico", "Cuba", "Bahamas", "Jamaica", "Haiti", "Dominican Republic", "South Africa", "Lesotho", "Eswatini", "Mozambique", "Zimbabwe", "Zambia", "Botswana", "Namibia", "Australia", "New Zealand", "Tuvalu", "Samoa", "Fiji", "Tonga", "Vanuatu", "Solomon Islands", "Ecuador", "Peru", "Bolivia", "Paraguay", "Chile", "Argentina", "Uruguay", "Antarctica", "Jordan", "United Arab Emirates", "Qatar", "Kuwait", "Bahrain", "Saudi Arabia", "Yemen", "Oman", "Iceland", "Denmark", "Norway", "Sweden", "Finland", "Estonia", "Latvia", "Lithuania", "Morocco", "Tunisia", "Egypt", "South Sudan", "Philippines", "Papua New Guinea", "Palau", "Micronesia", "Marshall Islands", "Kiribati", "Nauru", "India", "Pakistan", "Sri Lanka", "Maldives", "Bangladesh", "Nepal", "Bhutan", "Myanmar", "Russia", "Ukraine", "Belarus", "Poland", "Czech Republic", "Slovenia", "Slovakia", "Hungary", "Brazil", "Colombia", "Venezuela", "Suriname", "Guyana", "Grenada", "Trinidad and Tobago", "Barbados", "Ethiopia", "Kenya", "Uganda", "Rwanda", "Burundi", "Thailand", "Vietnam", "Laos", "Cambodia", "Malaysia", "Singapore", "Brunei", "Indonesia", "Greece", "Albania", "Montenegro", "Serbia", "Romania", "Bulgaria", "North Macedonia", "Bosnia and Herzegovina", "Belize", "Guatemala", "El Salvador", "Honduras", "Nicaragua", "Costa Rica", "Panama", "Democratic Republic of Congo", "Kazakhstan", "Kyrgyzstan", "Tajikistan", "Uzbekistan", "Turkmenistan", "Azerbaijan", "Georgia", "Armenia", "Italy", "Vatican City", "San Marino", "Malta", "Cyprus", "Austria", "Switzerland", "Croatia", "Saint Vincent and Grenadines", "Saint Lucia", "Antigua and Barbuda", "Dominica", "Saint Kitts and Nevis", "Turkey", "Andorra", "Moldova", "Monaco", "Liechtenstein", "Luxembourg", "Kosovo", "Timor-Leste", "Seychelles", "Tanzania", "Malawi", "Comoros", "Madagascar", "Mauritius", "Afghanistan", "Iran", "Iraq", "Syria", "Lebanon", "Israel", "Palestine", "Guadeloupe", "Guam", "Faroe Islands", "Martinique"
        ];
        
        const placesGrid = document.getElementById('placesGrid');
        
        visitedPlaces.forEach(place => {
            // Converts "Hong Kong" into "hongkong.html" matching the ZIP generator
            const fileBase = place.toLowerCase().replace(/[^a-z0-9]/g, '');
            const link = document.createElement('a');
            link.href = fileBase + ".html";
            link.className = 'place-tag';
            link.innerText = place;
            placesGrid.appendChild(link);
        });
    }

    window.onload = buildLayout;
</script>

</body>
</html>
