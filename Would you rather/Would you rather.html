    <style>
        :root { --primary: #2563eb; --secondary: #db2777; --bg: #0a0c10; }
        
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: radial-gradient(circle at center, #1e293b 0%, #0a0c10 100%); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; color: #f1f5f9; 
            overflow: hidden;
        }

        /* Start Screen Overlay */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease;
        }

        #start-btn {
            padding: 18px 48px; font-size: 1.25rem; font-weight: 800;
            background: var(--primary); color: white; border: none;
            border-radius: 50px; cursor: pointer; letter-spacing: 1px;
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(37, 99, 235, 0.6); }

        /* Game Card */
        .card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 95%; max-width: 550px; padding: 2.5rem; 
            border-radius: 28px; text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative; 
        }
        
        .sound-toggle { 
            position: absolute; top: 20px; right: 20px; 
            background: rgba(255, 255, 255, 0.1); border: none; 
            border-radius: 50%; width: 44px; height: 44px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            transition: 0.2s; color: white;
        }
        .sound-toggle:hover { background: var(--primary); }

        .options-container { display: flex; flex-direction: column; gap: 1.25rem; }
        
        .choice-btn { 
            position: relative; overflow: hidden; padding: 1.5rem; 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; 
            background: rgba(255, 255, 255, 0.05); cursor: pointer; 
            font-size: 1.15rem; font-weight: 600; color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .choice-btn:hover:not(:disabled) { 
            border-color: var(--primary); transform: translateY(-3px); 
            background: rgba(255, 255, 255, 0.08);
        }

        .stats-bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--primary); opacity: 0.3; width: 0%; transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); z-index: 0; }
        .btn-text { position: relative; z-index: 1; display: flex; justify-content: space-between; width: 100%; }
        .percent-tag { font-weight: 800; color: var(--primary); opacity: 0; transition: opacity 0.5s; }
        .show-percent { opacity: 1; }

        .loader { border: 4px solid #334155; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; visibility: hidden; }
        
        #next-btn { margin-top: 30px; padding: 16px; border: none; border-radius: 14px; background: var(--primary); color: white; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.2s; width: 100%; }
        #next-btn:hover { filter: brightness(1.1); transform: scale(1.02); }
    </style>
</head>

    let currentIdx = 0;
    let globalData = {};

    async function init() {
        // RANDOM START: Set a random index before showing the first question
        currentIdx = Math.floor(Math.random() * questions.length);
        
        try {
            const response = await fetch(API_URL);
            globalData = response.ok ? await response.json() : {};
            showQuestion();
        } catch (e) { showQuestion(); }
    }

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('question-text').innerText = "Would you rather visit...";
        document.getElementById('textA').innerText = q.a;
        document.getElementById('textB').innerText = q.b;
        document.getElementById('barA').style.width = '0%';
        document.getElementById('barB').style.width = '0%';
        document.getElementById('percentA').classList.remove('show-percent');
        document.getElementById('percentB').classList.remove('show-percent');
        document.getElementById('total-votes').innerText = "";
        document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false);
    }

    async function handleVote(choice) {
        playSfx('vote');
        const qId = questions[currentIdx].id;
        document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

        if (!globalData[qId]) globalData[qId] = { a: 0, b: 0 };
        globalData[qId][choice]++;

        const total = globalData[qId].a + globalData[qId].b;
        const pA = Math.round((globalData[qId].a / total) * 100);
        const pB = 100 - pA;

        document.getElementById('barA').style.width = pA + '%';
        document.getElementById('barB').style.width = pB + '%';
        document.getElementById('percentA').innerText = pA + '%';
        document.getElementById('percentB').innerText = pB + '%';
        document.getElementById('percentA').classList.add('show-percent');
        document.getElementById('percentB').classList.add('show-percent');
        
        document.getElementById('total-votes').innerText = `Worldwide: ${total.toLocaleString()} votes`;
        document.getElementById('next-btn').classList.remove('hidden');

        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(globalData)
        }).catch(() => {});
    }

    function nextQuestion() {
        playSfx('next');
        // Jumps to another random index that isn't the current one
        let nextIdx;
        do {
            nextIdx = Math.floor(Math.random() * questions.length);
        } while (nextIdx === currentIdx);
        
        currentIdx = nextIdx;
        showQuestion();
    }
