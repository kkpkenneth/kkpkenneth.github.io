<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Country Showdown</title>
    <style>
        :root { --primary: #2563eb; --secondary: #db2777; --bg: #0a0c10; --accent: #fbbf24; }
        
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: radial-gradient(circle at center, #1e293b 0%, #0a0c10 100%); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; color: #f1f5f9; 
            overflow: hidden;
        }

        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease;
        }

        #start-btn {
            padding: 18px 48px; font-size: 1.25rem; font-weight: 800;
            background: var(--primary); color: white; border: none;
            border-radius: 50px; cursor: pointer; letter-spacing: 1px;
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(37, 99, 235, 0.6); }

        .card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 95%; max-width: 550px; padding: 2.5rem; 
            border-radius: 28px; text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative; 
        }
        
        .sound-toggle { 
            position: absolute; top: 20px; right: 20px; 
            background: rgba(255, 255, 255, 0.1); border: none; 
            border-radius: 50%; width: 44px; height: 44px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            transition: 0.2s; color: white; z-index: 10;
        }

        .options-container { display: flex; flex-direction: column; gap: 1.25rem; margin-top: 2rem; }
        
        .choice-btn { 
            position: relative; overflow: hidden; padding: 1.5rem; 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; 
            background: rgba(255, 255, 255, 0.05); cursor: pointer; 
            font-size: 1.15rem; font-weight: 600; color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .choice-btn:hover:not(:disabled) { 
            border-color: var(--primary); transform: translateY(-3px); 
            background: rgba(255, 255, 255, 0.08);
        }

        .stats-bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--primary); opacity: 0.3; width: 0%; transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); z-index: 0; }
        .btn-text { position: relative; z-index: 1; display: flex; justify-content: space-between; width: 100%; }
        .percent-tag { font-weight: 800; color: #60a5fa; opacity: 0; transition: opacity 0.5s; }
        .show-percent { opacity: 1; }

        .hidden { display: none; }
        #next-btn { margin-top: 30px; padding: 16px; border: none; border-radius: 14px; background: var(--primary); color: white; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.2s; width: 100%; }
        #next-btn:hover { filter: brightness(1.1); transform: scale(1.02); }

        #tie-alert { color: #10b981; font-weight: 800; font-size: 0.8rem; margin-top: 5px; height: 1rem; }
    </style>
</head>
<body>

<div id="start-overlay">
    <h1 style="margin-bottom: 0.5rem;">Would you rather visit...</h1>
    <div id="top-three-container" style="margin-bottom: 2.5rem; color: #94a3b8; font-size: 0.9rem;">
        <p id="top-three-text">Syncing with global rankings...</p>
    </div>
    <button id="start-btn" onclick="startGame()">START GAME</button>
</div>

<div class="card">
    <button class="sound-toggle" onclick="toggleMute()" id="muteBtn">
        <svg id="speakerIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
    </button>
    
    <div id="game-content">
        <h2 id="category-text" style="color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;">Battle of Nations</h2>
        <h1 id="question-text">Would you rather visit...</h1>
        <div class="options-container">
            <button class="choice-btn" id="btnA" onclick="handleVote('a')">
                <div id="barA" class="stats-bar"></div>
                <div class="btn-text">
                    <span id="textA">...</span>
                    <span id="percentA" class="percent-tag">0%</span>
                </div>
            </button>
            <button class="choice-btn" id="btnB" onclick="handleVote('b')">
                <div id="barB" class="stats-bar"></div>
                <div class="btn-text">
                    <span id="textB">...</span>
                    <span id="percentB" class="percent-tag">0%</span>
                </div>
            </button>
        </div>
        <div id="tie-alert"></div>
        <p id="total-votes" style="margin-top: 15px; font-size: 0.85rem; color: #64748b;"></p>
        <button id="next-btn" onclick="nextQuestion()" class="hidden">Next Matchup →</button>
    </div>
</div>

<script>
    const PANTRY_ID = "c91611d3-d56e-45ee-bd65-d2fb7fbc4a54"; 
    const BASKET_NAME = "global_country_rankings_final";
    const API_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/${BASKET_NAME}`;

    const sfx = {
        vote: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
        next: new Audio('https://assets.mixkit.co/active_storage/sfx/2579/2579-preview.mp3')
    };
    
    const bgMusic = new Audio('bgm.mp3');
    bgMusic.loop = true;

    let isMuted = false;
    let currentIdx = 0;
    let globalData = {}; 

    const questions = [
        { q: "Live in...", a: "Switzerland", b: "Vietnam" },
        { q: "Career in...", a: "Japan", b: "Germany" },
        { q: "Daily Food...", a: "Italy", b: "Mexico" },
        { q: "Education...", a: "Finland", b: "Singapore" },
        { q: "Geography...", a: "Canada", b: "Australia" },
        { q: "Social Life...", a: "Brazil", b: "Iceland" },
        { q: "History...", a: "Greece", b: "Egypt" },
        { q: "Vibes...", a: "USA", b: "France" },
        { q: "Nature...", a: "New Zealand", b: "South Africa" },
        { q: "Innovation...", a: "South Korea", b: "Israel" },
        { q: "Environment...", a: "Costa Rica", b: "Netherlands" },
        { q: "Culture...", a: "India", b: "United Kingdom" },
        { q: "Architecture...", a: "UAE", b: "Spain" },
        { q: "Island Life...", a: "Maldives", b: "Philippines" },
        { q: "Winter...", a: "Sweden", b: "Austria" },
        { q: "Growth...", a: "China", b: "Thailand" },
        { q: "Street Food...", a: "Taiwan", b: "Thailand" },
        { q: "Modernity...", a: "Singapore", b: "Estonia" },
        { q: "Ancient Ruins...", a: "Jordan", b: "Cambodia" },
        { q: "Skyscrapers...", a: "Hong Kong", b: "USA" },
        { q: "Coffee...", a: "Colombia", b: "Ethiopia" },
        { q: "Fashion...", a: "Italy", b: "Japan" },
        { q: "Nightlife...", a: "Germany", b: "USA" },
        { q: "Safari...", a: "Tanzania", b: "Kenya" },
        { q: "Wine Country...", a: "France", b: "Chile" },
        { q: "Rainforests...", a: "Brazil", b: "Indonesia" },
        { q: "Cyberpunk...", a: "Hong Kong", b: "South Korea" },
        { q: "Castle Tours...", a: "United Kingdom", b: "Germany" },
        { q: "Modern Design...", a: "Denmark", b: "Singapore" },
        { q: "Ancient Gods...", a: "Greece", b: "Mexico" },
        { q: "Adventure...", a: "Peru", b: "Kenya" },
        { q: "Volcanoes...", a: "Indonesia", b: "Guatemala" },
        { q: "High Altitudes...", a: "Bolivia", b: "Nepal" },
        { q: "Steppe Life...", a: "Mongolia", b: "Kazakhstan" },
        { q: "Islands...", a: "Seychelles", b: "Fiji" },
        { q: "Northern Lights...", a: "Iceland", b: "Norway" },
        { q: "Canyons...", a: "USA", b: "Argentina" },
        { q: "Traditional Crafts...", a: "Uzbekistan", b: "Peru" },
        { q: "Tech Cities...", a: "Taiwan", b: "South Korea" },
        { q: "Wellness...", a: "Indonesia", b: "Iceland" },
        { q: "Gastronomy...", a: "Spain", b: "Japan" },
        { q: "Desert Magic...", a: "Oman", b: "Namibia" },
        { q: "Viking Heritage...", a: "Denmark", b: "Sweden" },
        { q: "Folklore...", a: "Ireland", b: "Romania" },
        { q: "Modern Luxury...", a: "Qatar", b: "Monaco" },
        { q: "Rainforest Hikes...", a: "Costa Rica", b: "Malaysia" },
        { q: "Deep Diving...", a: "Egypt", b: "Philippines" },
        { q: "Canals...", a: "Netherlands", b: "Italy" },
        { q: "Opera & Arts...", a: "Austria", b: "Russia" },
        { q: "Surf Culture...", a: "Australia", b: "Portugal" }
    ];

    async function startGame() {
        document.getElementById('start-overlay').style.opacity = '0';
        setTimeout(() => document.getElementById('start-overlay').style.display = 'none', 600);
        bgMusic.play().catch(() => {});
        init();
    }

    async function init() {
        currentIdx = Math.floor(Math.random() * questions.length);
        try {
            const response = await fetch(API_URL);
            globalData = response.ok ? await response.json() : {};
            updateTopThree();
            showQuestion();
        } catch (e) { showQuestion(); }
    }

    function updateTopThree() {
        const sorted = Object.keys(globalData).sort((a, b) => globalData[b] - globalData[a]);
        if (sorted.length >= 3) {
            document.getElementById('top-three-text').innerHTML = `
                <span style="color: #ffd700">🥇 ${sorted[0]}</span> &nbsp; 
                <span style="color: #c0c0c0">🥈 ${sorted[1]}</span> &nbsp; 
                <span style="color: #cd7f32">🥉 ${sorted[2]}</span>
            `;
        } else {
            document.getElementById('top-three-text').innerText = "Establishing world rankings...";
        }
    }

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('tie-alert').innerText = "";
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('textA').innerText = q.a;
        document.getElementById('textB').innerText = q.b;
        
        document.getElementById('barA').style.width = '0%';
        document.getElementById('barB').style.width = '0%';
        document.getElementById('percentA').classList.remove('show-percent');
        document.getElementById('percentB').classList.remove('show-percent');
        document.getElementById('total-votes').innerText = "";
        document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false);
    }

    async function handleVote(choice) {
        if (!isMuted) sfx.vote.play();
        const q = questions[currentIdx];
        const winnerName = (choice === 'a') ? q.a : q.b;

        document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

        // 1. Update Cloud Score
        globalData[winnerName] = (globalData[winnerName] || 0) + 1;

        // 2. Tie-Aware Competition Ranking
        const scoreEntries = Object.entries(globalData).sort((a, b) => b[1] - a[1]);
        const getRank = (name) => {
            let rank = 1;
            for (let entry of scoreEntries) {
                if (entry[1] > (globalData[name] || 0)) rank++;
                else break;
            }
            return rank;
        };

        const rankA = getRank(q.a);
        const rankB = getRank(q.b);
        const scoreA = globalData[q.a] || 0;
        const scoreB = globalData[q.b] || 0;
        const total = scoreA + scoreB;

        // Check for Tie Alert
        if (rankA === rankB && total > 2) {
            document.getElementById('tie-alert').innerText = "BATTLE TIED! BOTH NATIONS SHARING RANK #" + rankA;
        }


        // 3. Update UI Percentages
        let pA = 50, pB = 50;
        if (total > 0) {
            pA = Math.round((scoreA / total) * 100);
            pB = 100 - pA;
        }

        document.getElementById('barA').style.width = pA + '%';
        document.getElementById('barB').style.width = pB + '%';
        document.getElementById('percentA').innerText = pA + '%';
        document.getElementById('percentB').innerText = pB + '%';
        document.getElementById('percentA').classList.add('show-percent');
        document.getElementById('percentB').classList.add('show-percent');
        
        document.getElementById('total-votes').innerHTML = `
            <span style="color: #60a5fa; font-weight:700">${q.a}</span> ${scoreA} pts <small>(#${rankA})</small> 
            &nbsp; | &nbsp; 
            <span style="color: #f472b6; font-weight:700">${q.b}</span> ${scoreB} pts <small>(#${rankB})</small>
        `;
        
        document.getElementById('next-btn').classList.remove('hidden');

        // Sync with Pantry
        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(globalData)
        }).catch(() => {});
    }

    function nextQuestion() {
        if (!isMuted) sfx.next.play();
        let nextIdx;
        do { nextIdx = Math.floor(Math.random() * questions.length); } while (nextIdx === currentIdx);
        currentIdx = nextIdx;
        showQuestion();
    }

    function toggleMute() {
        isMuted = !isMuted;
        const icon = document.getElementById('speakerIcon');
        if (isMuted) {
            bgMusic.pause();
            icon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.37.28-.78.52-1.25.68v2.06c1.02-.22 1.94-.66 2.74-1.25L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
        } else {
            bgMusic.play();
            icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
        }
    }
</script>
</body>
</html>
