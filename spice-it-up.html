<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spice-It-Up: Gradient Edition</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            /* Beautiful green gradient background */
            background: linear-gradient(135deg, #a8e063 0%, #2e7d32 100%); 
            margin: 0; padding: 15px; 
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Start Screen Overlay */
        #startScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(46, 125, 50, 0.95); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; backdrop-filter: blur(5px);
        }
        .start-btn {
            background: white; color: #2e7d32; padding: 20px 40px;
            font-size: 1.5rem; border-radius: 50px; border: none; cursor: pointer;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-top: 20px; transition: transform 0.1s;
        }
        .start-btn:active { transform: scale(0.95); }

        .card { 
            background: #ffffff; padding: 25px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 50, 0, 0.3); 
            width: 100%; max-width: 400px; border-top: 8px solid #1b5e20;
            position: relative; box-sizing: border-box;
        }
        h1 { font-size: 1.4rem; color: #1b5e20; margin-top: 0; display: flex; align-items: center; gap: 8px; }
        #question { font-size: 1.1rem; margin-bottom: 25px; line-height: 1.4; color: #2e7d32; font-weight: 500;}
        
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        
        button { 
            padding: 18px; cursor: pointer; border: none; border-radius: 12px; 
            background: #2e7d32; color: white; font-size: 1rem; font-weight: bold;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active { transform: scale(0.98); background: #1b5e20; box-shadow: 0 2px 3px rgba(0,0,0,0.1); }
        
        .cat-btn { background: #1b5e20; padding: 12px; font-size: 0.85rem; margin-bottom: 20px; width: 100%; border-radius: 8px; }
        
        /* Slide-out Drawer */
        #drawer {
            position: fixed; top: 0; right: -320px; width: 280px; height: 100%;
            background: #f1f8e9; box-shadow: -4px 0 15px rgba(0,0,0,0.3);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px; 
            overflow-y: auto; z-index: 20; box-sizing: border-box; border-left: 4px solid #1b5e20;
        }
        #drawer h3 { color: #1b5e20; margin-top: 0; border-bottom: 2px solid #c8e6c9; padding-bottom: 10px; }
        .spice-list { list-style: none; padding: 0; margin: 0 0 20px 0; text-align: left; }
        
        /* Expandable Tooltip Styles for the Catalogue */
        .spice-item { 
            display: flex; flex-direction: column; padding: 12px 0; 
            border-bottom: 1px solid #c8e6c9; cursor: pointer; 
        }
        .spice-header { display: flex; gap: 10px; font-size: 0.95rem; color: #2e7d32; font-weight: bold; }
        .spice-desc { 
            font-size: 0.8rem; color: #43a047; max-height: 0; overflow: hidden; 
            transition: all 0.3s ease; opacity: 0; margin-top: 0; font-style: italic;
        }
        /* Hover for Desktop, Active/Focus for Mobile */
        .spice-item:hover .spice-desc, .spice-item:active .spice-desc { 
            max-height: 50px; opacity: 1; margin-top: 6px; 
        }
        
        /* Overlay for drawer */
        #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 15; backdrop-filter: blur(2px); }

        /* Popup */
        #popup { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 30, 0, 0.85); z-index: 30;
            align-items: center; justify-content: center; backdrop-filter: blur(3px);
        }
        .modal { 
            background: #ffffff; padding: 25px; border-radius: 15px; 
            width: 85%; max-width: 350px; text-align: center; border: 4px solid #2e7d32; box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
    </style>
</head>

    <button class="start-btn" onclick="startApp()">START COOKING</button>
</div>

<audio id="bgMusic" loop>

// Populate Drawer
const list = document.getElementById('spiceList');
spices.forEach(s => {

function toggleDrawer() {

// --- GAME LOGIC ---
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

let shuffledDb = shuffle([...db]);
let currentIdx = 0;
let audioCtx;

// Starts the app from the start screen
function startApp() {
    // Attempt to start music
    const music = document.getElementById('bgMusic');
    music.volume = 0.3; 
    music.play().catch(e => console.log("Audio playback prevented by browser policies.", e));
    
    // Hide start screen and initialize game
    document.getElementById('startScreen').style.display = 'none';
    load();
}

// Ensures AudioContext is active for sound effects
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function load() {
    const d = shuffledDb[currentIdx];
    document.getElementById('question').innerHTML = `The traditional <strong>${d.name}</strong> is missing its signature spice. Guess which one:`;
    const optDiv = document.getElementById('options');
    optDiv.innerHTML = '';
    
    let currentOptions = shuffle([...d.options]);
    currentOptions.forEach(opt => {
        const b = document.createElement('button');
        b.innerText = opt;
        b.onclick = () => {
            initAudio();
            reveal(opt);
        };
        optDiv.appendChild(b);
    });
}

function reveal(choice) {
    const d = shuffledDb[currentIdx];
    const correct = choice === d.missing;
    
    document.getElementById('resTitle').innerText = correct ? "🎉 Correct!" : "❌ Wrong!";
    document.getElementById('resTitle').style.color = correct ? "#2e7d32" : "#c62828";
    document.getElementById('resExpl').innerText = d.explain;
    
    const popup = document.getElementById('popup');
    popup.style.display = 'flex';
    
    // Play sound effect
    if (audioCtx) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (correct) {
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        } else {
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
        }
        
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.2);
    }
}

function next() {
    document.getElementById('popup').style.display = 'none';
    currentIdx = (currentIdx + 1) % shuffledDb.length;
    
    if (currentIdx === 0) {
        shuffledDb = shuffle([...db]);
    }
    
    load();
}

// Do not call load() automatically anymore, startApp() will handle it!
</script>
