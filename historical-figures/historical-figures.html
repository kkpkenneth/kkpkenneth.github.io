<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Figures Curator</title>
    <style>
        body { font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f2ef; color: #333; margin: 0; }
        .card { background: #ffffff; padding: 40px; width: 90%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; border: 1px solid #e0e0e0; position: relative; }
        h1 { font-weight: normal; letter-spacing: 2px; text-transform: uppercase; font-size: 1.5rem; margin-bottom: 30px; }
        
        #catalogue-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .cat-thumb { cursor: pointer; transition: transform 0.2s; border: 1px solid #ddd; padding: 5px; }
        .cat-thumb:hover { transform: scale(1.05); }
        .cat-thumb img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
        
        #detail-view { display: none; padding: 20px; }
        .detail-img { width: 100%; max-width: 200px; aspect-ratio: 1 / 1; object-fit: cover; margin-bottom: 15px; border: 4px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        #question-image { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border: 8px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin-bottom: 30px; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #333; background: transparent; cursor: pointer; font-family: 'Georgia', serif; font-size: 16px; transition: all 0.3s; }
        button:hover { background: #333; color: #fff; }
        #explanation { margin: 20px 0; padding: 20px; display: none; background: #f9f9f9; border-left: 4px solid #333; text-align: left; }
        
        #quiz-content, #catalogue-screen, #result-screen { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div id="start-screen" style="display:block;">
            <h1>Historical Curator</h1>
            <button onclick="startGame()">ENTER GALLERY</button>
            <button onclick="showCatalogue()">CATALOGUE</button>
        </div>

        <div id="quiz-content">
            <p>SCORE: <span id="score">0</span></p>
            <img id="question-image" src="" alt="Historical Figure">
            <div id="choices"></div>
            <div id="explanation"></div>
            <button id="next-btn" style="display:none;" onclick="loadQuestion()">NEXT EXHIBIT</button>
        </div>

        <div id="result-screen">
            <h1>Tour Complete</h1>
            <p id="final-score-text" style="font-size: 20px;"></p>
            <button onclick="location.reload()">BACK TO HOME SCREEN</button>
        </div>

        <div id="catalogue-screen">
            <h1>The Collection</h1>
            <div id="catalogue-grid"></div>
            <div id="detail-view">
                <img id="detail-img" class="detail-img">
                <h2 id="detail-name"></h2>
                <p id="detail-vibe"></p>
                <button onclick="closeDetail()">BACK TO COLLECTION</button>
            </div>
            <button id="cat-back" onclick="location.reload()">BACK TO MENU</button>
        </div>
    </div>

    <audio id="bgm-audio" src="historical-figures-bgm.mp3" loop></audio>
    <audio id="question-audio" src="historical-figures.mp3"></audio>
    <audio id="click-audio" src="https://freesound.org/data/previews/320/320655_5260888-lq.mp3"></audio>
    <audio id="correct-audio" src="https://freesound.org/data/previews/320/320655_5260872-lq.mp3"></audio>
    <audio id="wrong-audio" src="https://freesound.org/data/previews/320/320655_5260897-lq.mp3"></audio>

    <script>
        const fullData = [
            {name: "Abraham Lincoln", vibe: "16th U.S. President, instrumental in ending slavery.", img: "abraham-lincoln.jpeg"},
            {name: "Adolf Hitler", vibe: "Dictator of Germany, central figure in WWII.", img: "adolf-hitler.jpeg"},
            {name: "Albert Einstein", vibe: "Theoretical physicist who revolutionized our view of space and time.", img: "albert-einstein.jpeg"},
            {name: "Alexander the Great", vibe: "King of Macedon who created a vast transcontinental empire.", img: "alexander-the-great.jpeg"},
            {name: "Anne Frank", vibe: "Jewish diarist whose writing became a symbol of the Holocaust.", img: "anne-frank.jpeg"},
            {name: "Aristotle", vibe: "Ancient Greek philosopher whose work shaped Western thought.", img: "aristotle.jpeg"},
            {name: "Barack Obama", vibe: "44th U.S. President, first African American to hold the office.", img: "barrack-obama.jpeg"},
            {name: "Bill Gates", vibe: "Co-founder of Microsoft and influential technology philanthropist.", img: "bill-gates.jpeg"},
            {name: "Charles Darwin", vibe: "Naturalist who established the theory of evolution.", img: "charles-darwin.jpeg"},
            {name: "Cleopatra", vibe: "Last active pharaoh of Ptolemaic Egypt.", img: "cleopatra.jpeg"},
            {name: "Confucius", vibe: "Chinese philosopher whose teachings emphasize morality and social order.", img: "confucius.jpeg"},
            {name: "Dalai Lama", vibe: "The spiritual leader of Tibet and Nobel Peace Prize laureate.", img: "dalai-lama.jpeg"},
            {name: "Franklin D. Roosevelt", vibe: "U.S. President who led through the Great Depression and WWII.", img: "franklin-d-roosevelt.jpeg"},
            {name: "Galileo Galilei", vibe: "Astronomer and physicist who championed heliocentrism.", img: "galileo-galilei.jpeg"},
            {name: "George Washington", vibe: "First U.S. President and leader of the Continental Army.", img: "george-washington.jpeg"},
            {name: "Ghengis Khan", vibe: "Founder and first Great Khan of the Mongol Empire.", img: "ghengis-khan.jpeg"},
            {name: "Isaac Newton", vibe: "Mathematician and physicist who formulated the laws of motion.", img: "issac-newton.jpeg"},
            {name: "Julius Caesar", vibe: "Roman general who played a key role in the fall of the Republic.", img: "julius-cesar.jpeg"},
            {name: "Leonardo da Vinci", vibe: "High Renaissance polymath, painter of the Mona Lisa.", img: "leonardo-da-vinci.jpeg"},
            {name: "Ludwig van Beethoven", vibe: "Composer who bridged the Classical and Romantic eras.", img: "ludwig-van-beethoven.jpeg"},
            {name: "Mahatma Gandhi", vibe: "Leader of India's non-violent independence movement.", img: "mahatma-gandhi.jpeg"},
            {name: "Marie Curie", vibe: "Physicist and chemist who pioneered research on radioactivity.", img: "marie-curie.jpeg"},
            {name: "Martin Luther King Jr.", vibe: "Leader of the U.S. Civil Rights Movement.", img: "martin-luther-king-jr.jpeg"},
            {name: "Mother Teresa", vibe: "Missionary known for her dedication to the poor.", img: "mother-teresa.jpeg"},
            {name: "Napoleon Bonaparte", vibe: "French leader who rose to prominence during the French Revolution.", img: "napoleon-bonaparte.jpeg"},
            {name: "Neil Armstrong", vibe: "Astronaut, the first human to walk on the moon.", img: "neil-armstrong.jpeg"},
            {name: "Nelson Mandela", vibe: "Anti-apartheid revolutionary and South African President.", img: "nelson-mandela.jpeg"},
            {name: "Pablo Picasso", vibe: "Influential artist and co-founder of the Cubist movement.", img: "pablo-picasso.jpeg"},
            {name: "Stephen Hawking", vibe: "Cosmologist known for his work on black holes.", img: "stephen-hawking.jpeg"},
            {name: "Steve Jobs", vibe: "Entrepreneur and co-founder of Apple Inc.", img: "steve-jobs.jpeg"},
            {name: "William Shakespeare", vibe: "English playwright and poet, arguably the greatest writer in history.", img: "william-shakespeare.jpeg"},
            {name: "Winston Churchill", vibe: "British Prime Minister who led the UK during WWII.", img: "winston-churchill.jpeg"}
        ];

        let score = 0, currentIndex = 0, shuffledData = [];

        function startGame() {
            document.getElementById('click-audio').play();
            let bgm = document.getElementById('bgm-audio'); bgm.volume = 0.3; bgm.play();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-content').style.display = 'block';
            shuffledData = [...fullData].sort(() => Math.random() - 0.5);
            loadQuestion();
        }

        function showCatalogue() {
            document.getElementById('click-audio').play();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('catalogue-screen').style.display = 'block';
            let grid = document.getElementById('catalogue-grid');
            fullData.forEach(item => {
                let div = document.createElement('div');
                div.className = 'cat-thumb';
                div.innerHTML = `<img src="${item.img}" alt="${item.name}">`;
                div.onclick = () => showDetail(item);
                grid.appendChild(div);
            });
        }

        function showDetail(item) {
            document.getElementById('click-audio').play();
            document.getElementById('catalogue-grid').style.display = 'none';
            document.getElementById('cat-back').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('detail-img').src = item.img;
            document.getElementById('detail-name').innerText = item.name;
            document.getElementById('detail-vibe').innerText = item.vibe;
        }

        function closeDetail() {
            document.getElementById('click-audio').play();
            document.getElementById('catalogue-grid').style.display = 'grid';
            document.getElementById('cat-back').style.display = 'block';
            document.getElementById('detail-view').style.display = 'none';
        }

        function loadQuestion() {
            document.getElementById('click-audio').play();
            let qAudio = document.getElementById('question-audio');
            qAudio.currentTime = 0; qAudio.play();

            if (currentIndex >= shuffledData.length) {
                document.getElementById('quiz-content').style.display = 'none';
                document.getElementById('result-screen').style.display = 'block';
                document.getElementById('final-score-text').innerText = "Score: " + score + "/" + shuffledData.length;
                return; 
            }
            let item = shuffledData[currentIndex];
            document.getElementById('question-image').src = item.img;
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            let choicesDiv = document.getElementById('choices'); choicesDiv.innerHTML = '';
            let options = [item.name];
            while(options.length < 4) {
                let rand = fullData[Math.floor(Math.random()*fullData.length)].name;
                if(!options.includes(rand)) options.push(rand);
            }
            options.sort(() => Math.random() - 0.5);
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                choicesDiv.appendChild(btn);
            });
        }

        function checkAnswer(ans) {
            let item = shuffledData[currentIndex];
            let correct = (ans === item.name);
            correct ? document.getElementById('correct-audio').play() : document.getElementById('wrong-audio').play();
            if (correct) score++;
            document.getElementById('score').innerText = score;
            document.getElementById('explanation').innerHTML = `<strong>${correct ? "Correct!" : "Incorrect"}</strong><br>${item.name}: ${item.vibe}`;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
            Array.from(document.getElementById('choices').children).forEach(b => b.disabled = true);
            currentIndex++;
        }
    </script>
</body>
</html>
