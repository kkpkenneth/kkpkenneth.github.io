<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-COLOR HACK</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body { 
            background: #050505; 
            color: #00ffcc; 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            text-transform: uppercase;
        }

        /* --- START SCREEN STYLES --- */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 500px;
            background: rgba(0, 255, 204, 0.05);
            border: 2px dashed #00ffcc;
            padding: 30px 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }

        .title {
            font-size: 2rem;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            letter-spacing: 2px;
        }

        .rules {
            text-align: left;
            margin: 20px 0;
            color: #fff;
            font-size: 0.9rem;
            line-height: 1.6;
            list-style-type: square;
            padding-left: 20px;
        }

        .rules li span {
            color: #00ffcc;
            font-weight: bold;
        }

        /* --- GAME UI STYLES --- */
        #game-ui {
            display: none; /* Hidden until start */
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #stats-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #score-board { 
            text-shadow: 0 0 10px #00ffcc; 
        }

        #timer-board {
            text-shadow: 0 0 10px #00ffcc;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .warning {
            color: #ff003c !important;
            text-shadow: 0 0 15px #ff003c !important;
            animation: flash 1s infinite alternate;
        }

        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        #hud { 
            border: 2px solid #00ffcc; 
            padding: 20px; 
            box-shadow: 0 0 15px #00ffcc; 
            text-align: center; 
            width: 100%; 
            max-width: 500px; 
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
        }

        #palette { 
            width: 120px; 
            height: 120px; 
            border: 4px solid #fff; 
            box-shadow: 0 0 30px #fff; 
            margin: 15px auto; 
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .options { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 12px; 
            margin-top: 20px; 
        }

        button { 
            background: rgba(0, 255, 204, 0.1); 
            border: 2px solid #00ffcc; 
            color: #00ffcc;
            padding: 15px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            border-radius: 5px;
            transition: all 0.1s;
            touch-action: manipulation; 
            width: 100%;
        }

        button.start-btn {
            background: #00ffcc;
            color: #050505;
            font-size: 1.2rem;
            box-shadow: 0 0 15px #00ffcc;
            margin-top: 10px;
        }

        button:active { 
            background: #00ffcc; 
            color: #000; 
            box-shadow: 0 0 20px #00ffcc; 
            transform: scale(0.96);
        }

        @media (hover: hover) {
            button:hover { 
                background: #00ffcc; 
                color: #000; 
                box-shadow: 0 0 20px #00ffcc; 
            }
        }

        @media (min-width: 480px) {
            .title { font-size: 2.5rem; }
            #stats-panel { font-size: 1.5rem; }
            h2 { font-size: 1.5rem; }
            #palette { width: 180px; height: 180px; margin: 20px auto; }
            .options { grid-template-columns: 1fr 1fr; gap: 15px; } 
        }
    </style>
</head>
<body>

    <!-- START SCREEN -->
    <div id="start-screen">
        <h1 class="title">CYBER-COLOR HACK</h1>
        <p>BREACH THE MAINFRAME BY IDENTIFYING DATA FRAGMENTS (COLORS).</p>
        
        <ul class="rules">
            <li>MATCH THE COLOR TO ITS TRUE NAME.</li>
            <li><span>+100 PTS</span> FOR A SUCCESSFUL HACK.</li>
            <li><span style="color: #ff003c;">-50 PTS</span> FOR A FAILED ATTEMPT.</li>
            <li>YOU HAVE <span>5 MINUTES</span> BEFORE THE SYSTEM LOCKS YOU OUT.</li>
        </ul>

        <button class="start-btn" onclick="initGame()">INITIATE HACK SEQUENCE</button>
    </div>

    <!-- GAME UI -->
    <div id="game-ui">
        <div id="stats-panel">
            <div id="score-board">SCORE: <span id="score">0</span></div>
            <div id="timer-board">T-<span id="timer">05:00</span></div>
        </div>
        
        <div id="hud">
            <h2 id="hud-title">IDENTIFY TARGET DATA</h2>
            <div id="palette"></div>
            <div class="options" id="options"></div>
        </div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 300; // 5 minutes in seconds
        let gameActive = false;
        let audioCtx;

        const colors = [
            // CYBER & NEON
            { name: "Neon Cyan", hex: "#00ffff" }, { name: "Laser Red", hex: "#ff003c" }, { name: "Acid Green", hex: "#7fff00" }, { name: "Void Purple", hex: "#8a2be2" }, { name: "Data Gold", hex: "#ffd700" }, { name: "Plasma Pink", hex: "#ff00ff" }, { name: "Reactor Orange", hex: "#ff4500" }, { name: "Grid Blue", hex: "#00bfff" }, { name: "Signal Lime", hex: "#32cd32" }, { name: "Glitch Magenta", hex: "#ff0090" },
    
            // BLUES & TEALS
            { name: "Navy Blue", hex: "#000080" }, { name: "Royal Blue", hex: "#4169e1" }, { name: "Sky Blue", hex: "#87ceeb" }, { name: "Steel Blue", hex: "#4682b4" }, { name: "Teal", hex: "#008080" }, { name: "Aquamarine", hex: "#7fffd4" }, { name: "Turquoise", hex: "#40e0d0" }, { name: "Midnight Blue", hex: "#191970" }, { name: "Cobalt", hex: "#0047ab" }, { name: "Cerulean", hex: "#007ba7" },

            // REDS & PINKS
            { name: "Brick Red", hex: "#b22222" }, { name: "Crimson", hex: "#dc143c" }, { name: "Firebrick", hex: "#b22222" }, { name: "Indian Red", hex: "#cd5c5c" }, { name: "Maroon", hex: "#800000" }, { name: "Hot Pink", hex: "#ff69b4" }, { name: "Deep Pink", hex: "#ff1493" }, { name: "Salmon", hex: "#fa8072" }, { name: "Coral", hex: "#ff7f50" }, { name: "Tomato", hex: "#ff6347" },

            // GREENS
            { name: "Forest Green", hex: "#228b22" }, { name: "Olive", hex: "#808000" }, { name: "Sea Green", hex: "#2e8b57" }, { name: "Spring Green", hex: "#00ff7f" }, { name: "Chartreuse", hex: "#7fff00" }, { name: "Lime", hex: "#00ff00" }, { name: "Dark Green", hex: "#006400" }, { name: "Sage", hex: "#bcca8b" }, { name: "Mint", hex: "#98ff98" }, { name: "Emerald", hex: "#50c878" },

            // YELLOWS & ORANGES
            { name: "Goldenrod", hex: "#daa520" }, { name: "Gold", hex: "#ffd700" }, { name: "Dark Orange", hex: "#ff8c00" }, { name: "Orange", hex: "#ffa500" }, { name: "Khaki", hex: "#f0e68c" }, { name: "Lemon", hex: "#fff700" }, { name: "Amber", hex: "#ffbf00" }, { name: "Peach", hex: "#ffdab9" }, { name: "Wheat", hex: "#f5deb3" }, { name: "Tan", hex: "#d2b48c" },

            // PURPLES & VIOLETS
            { name: "Indigo", hex: "#4b0082" }, { name: "Lavender", hex: "#e6e6fa" }, { name: "Plum", hex: "#dda0dd" }, { name: "Dark Violet", hex: "#9400d3" }, { name: "Orchid", hex: "#da70d6" }, { name: "Thistle", hex: "#d8bfd8" }, { name: "Amethyst", hex: "#9966cc" }, { name: "Mulberry", hex: "#c54b8c" }, { name: "Mauve", hex: "#e0b0ff" }, { name: "Eggplant", hex: "#614051" },

            // BROWNS & NEUTRALS
            { name: "Chocolate", hex: "#d2691e" }, { name: "Saddle Brown", hex: "#8b4513" }, { name: "Sienna", hex: "#a0522d" }, { name: "Rosy Brown", hex: "#bc8f8f" }, { name: "Beige", hex: "#f5f5dc" }, { name: "Slate Gray", hex: "#708090" }, { name: "Dim Gray", hex: "#696969" }, { name: "Black", hex: "#000000" }, { name: "White", hex: "#ffffff" }, { name: "Silver", hex: "#c0c0c0" },

            // MISC
            { name: "Light Cyan", hex: "#e0ffff" }, { name: "Dark Slate Blue", hex: "#483d8b" }, { name: "Medium Sea Green", hex: "#3cb371" },
            { name: "Light Coral", hex: "#f08080" }, { name: "Pale Goldenrod", hex: "#eee8aa" }, { name: "Medium Slate Blue", hex: "#7b68ee" },
        ];

        // Initialize audio context safely after user gesture
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(freq, duration, type = 'sine') {
            try {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.value = freq;
                
                // Add tiny fade out to prevent clicking sounds
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(); 
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio playback failed.");
            }
        }

        function initGame() {
            // Setup Audio
            initAudio();
            playSound(800, 0.3, 'square'); // Boot up sound
            
            // Switch UI
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            
            // Start Game Logic
            gameActive = true;
            nextQuestion();
            startTimer();
        }

        function updateScore(points) {
            if (!gameActive) return;
            score += points;
            document.getElementById('score').innerText = score;
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer() {
            const timerDisplay = document.getElementById('timer');
            const timerBoard = document.getElementById('timer-board');
            
            const countdown = setInterval(() => {
                if (!gameActive) {
                    clearInterval(countdown);
                    return;
                }

                timeLeft--;
                timerDisplay.innerText = formatTime(timeLeft);

                // Warning state at 30 seconds
                if (timeLeft <= 30 && timeLeft > 0) {
                    timerBoard.classList.add('warning');
                    if(timeLeft <= 5) playSound(800, 0.1, 'square'); // Beep for last 5 seconds
                }

                // Time's up
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            playSound(100, 1, 'sawtooth'); // Game over sound
            
            document.getElementById('timer').innerText = "00:00";
            document.getElementById('hud-title').innerText = "SYSTEM LOCKOUT";
            document.getElementById('hud-title').style.color = "#ff003c";
            
            const hud = document.getElementById('hud');
            hud.style.borderColor = "#ff003c";
            hud.style.boxShadow = "0 0 20px #ff003c";

            const palette = document.getElementById('palette');
            palette.style.backgroundColor = "#050505";
            palette.style.borderColor = "#ff003c";
            palette.style.boxShadow = "0 0 30px #ff003c inset";

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = `
                <button onclick="location.reload()" style="grid-column: 1 / -1; border-color: #ff003c; color: #ff003c; background: rgba(255,0,60,0.1);">
                    REBOOT SYSTEM (PLAY AGAIN)
                </button>
            `;
        }

        function nextQuestion() {
            if (!gameActive) return;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";
            const correct = colors[Math.floor(Math.random() * colors.length)];
            
            const palette = document.getElementById('palette');
            palette.style.backgroundColor = correct.hex;
            palette.style.boxShadow = `0 0 50px ${correct.hex}`;

            let pool = [correct];
            while (pool.length < 4) {
                let random = colors[Math.floor(Math.random() * colors.length)];
                if (!pool.includes(random)) pool.push(random);
            }
            pool.sort(() => Math.random() - 0.5);

            pool.forEach(c => {
                const btn = document.createElement('button');
                btn.innerText = c.name;
                btn.onclick = () => {
                    if (!gameActive) return;
                    
                    if (c.name === correct.name) {
                        playSound(600, 0.2);
                        updateScore(100);
                        nextQuestion();
                    } else {
                        playSound(150, 0.3, 'sawtooth');
                        updateScore(-50);
                    }
                };
                optionsDiv.appendChild(btn);
            });
        }
    </script>
</body>
</html>
