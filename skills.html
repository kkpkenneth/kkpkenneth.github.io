<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Developmental Skills Checklist</title>
    <style>
        /* Base styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.5;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px; /* Space for the sticky score bar */
        }
        
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 12px;
            margin-bottom: 25px;
            font-size: 1.6rem;
        }

        h2 {
            color: #2980b9;
            margin-top: 30px;
            border-left: 4px solid #3498db;
            padding-left: 12px;
            font-size: 1.3rem;
        }

        /* Mobile-friendly checklist items */
        .checklist-group {
            margin-bottom: 25px;
        }

        .checklist-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
            background-color: #fafbfc;
            border: 1px solid #eaedf0;
            transition: background-color 0.2s, border-color 0.2s;
            /* Enhance touch targets */
            touch-action: manipulation;
        }

        .checklist-item:active {
            background-color: #e6f2ff;
        }

        /* Style checked items */
        .checklist-item.checked {
            background-color: #e8f8f5;
            border-color: #2ecc71;
        }

        input[type="checkbox"] {
            margin-top: 4px;
            margin-right: 15px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            flex-shrink: 0; /* Prevents checkbox from squishing */
        }

        label {
            cursor: pointer;
            flex: 1;
            display: block;
        }

        .item-title {
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
            font-size: 1.05rem;
            color: #2c3e50;
        }

        .item-desc {
            font-size: 0.9rem;
            color: #5c6a79;
        }

        /* Sticky Score Bar */
        #score-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.15);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-text {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .progress-container {
            width: 100%;
            max-width: 400px;
            background-color: #4a5c6f;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #2ecc71;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Tablet & Desktop adjustments */
        @media (min-width: 600px) {
            body { padding: 30px; padding-bottom: 100px; }
            .container { padding: 40px; }
            h1 { font-size: 2.2rem; }
            h2 { font-size: 1.6rem; }
            .checklist-item:hover { background-color: #f0f8ff; }
            #score-bar { flex-direction: row; gap: 20px; justify-content: center; }
            .score-text { margin-bottom: 0; }
            .progress-container { flex: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Developmental Skills Checklist</h1>

        <h2>Gross Motor Skills (Large Muscle Movements)</h2>
        <div class="checklist-group">
            <div class="checklist-item">
                <input type="checkbox" id="gm1" class="skill-checkbox">
                <label for="gm1">
                    <span class="item-title">Locomotion (Walking & Running)</span>
                    <span class="item-desc">Moving smoothly and safely with varied speeds and the ability to stop quickly.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="gm2" class="skill-checkbox">
                <label for="gm2">
                    <span class="item-title">Jumping and Hopping</span>
                    <span class="item-desc">Jumping with two feet together, hopping on one foot, and jumping over small obstacles.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="gm3" class="skill-checkbox">
                <label for="gm3">
                    <span class="item-title">Balance and Coordination</span>
                    <span class="item-desc">Standing on one foot, walking on a balance beam or a straight line without falling.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="gm4" class="skill-checkbox">
                <label for="gm4">
                    <span class="item-title">Ball Skills (Catching & Throwing)</span>
                    <span class="item-desc">Throwing a ball overhand/underhand with aim, and catching a bouncing or tossed ball.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="gm5" class="skill-checkbox">
                <label for="gm5">
                    <span class="item-title">Postural Control & Core Strength</span>
                    <span class="item-desc">Maintaining an upright posture while sitting at a desk or standing without slouching.</span>
                </label>
            </div>
        </div>

        <h2>Fine Motor Skills (Small Muscle Movements)</h2>
        <div class="checklist-group">
            <div class="checklist-item">
                <input type="checkbox" id="fm1" class="skill-checkbox">
                <label for="fm1">
                    <span class="item-title">Pinching and Pincer Grasp</span>
                    <span class="item-desc">Picking up tiny items using just the thumb and index finger.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="fm2" class="skill-checkbox">
                <label for="fm2">
                    <span class="item-title">Gripping and Squeezing</span>
                    <span class="item-desc">Grasping handles, squeezing sponges, or holding objects tightly.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="fm3" class="skill-checkbox">
                <label for="fm3">
                    <span class="item-title">Finger Isolation</span>
                    <span class="item-desc">Moving one finger independently, like pointing, typing, or pressing a button.</span>
                </label>
            </div>
             <div class="checklist-item">
                <input type="checkbox" id="fm4" class="skill-checkbox">
                <label for="fm4">
                    <span class="item-title">In-Hand Manipulation</span>
                    <span class="item-desc">Adjusting grip, turning objects, or moving small objects from palm to fingertips using only one hand.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="fm5" class="skill-checkbox">
                <label for="fm5">
                    <span class="item-title">Bilateral Coordination</span>
                    <span class="item-desc">Using both hands together cooperatively, like holding a jar steady with one hand while the other twists the lid.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="fm6" class="skill-checkbox">
                <label for="fm6">
                    <span class="item-title">Tool and Utensil Control</span>
                    <span class="item-desc">Maneuvering silverware, opening/closing scissors, using tweezers, or operating a hole punch.</span>
                </label>
            </div>
             <div class="checklist-item">
                <input type="checkbox" id="fm7" class="skill-checkbox">
                <label for="fm7">
                    <span class="item-title">Pre-writing & Handwriting</span>
                    <span class="item-desc">Holding a pencil with a proper grip, coloring within lines, copying shapes, and forming legible letters.</span>
                </label>
            </div>
        </div>

        <h2>Cognitive Skills (Thinking & Learning)</h2>
        <div class="checklist-group">
            <div class="checklist-item">
                <input type="checkbox" id="cog1" class="skill-checkbox">
                <label for="cog1">
                    <span class="item-title">Cause and Effect</span>
                    <span class="item-desc">Recognizing that an action produces a specific result (e.g., pushing a button makes a sound).</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="cog2" class="skill-checkbox">
                <label for="cog2">
                    <span class="item-title">Object Permanence</span>
                    <span class="item-desc">Understanding that objects continue to exist even when they cannot be seen or heard.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="cog3" class="skill-checkbox">
                <label for="cog3">
                    <span class="item-title">Problem Solving</span>
                    <span class="item-desc">Using trial and error or past experiences to overcome obstacles (e.g., figuring out a shape sorter).</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="cog4" class="skill-checkbox">
                <label for="cog4">
                    <span class="item-title">Attention and Focus</span>
                    <span class="item-desc">Sustaining engagement on a single task or activity for an age-appropriate duration.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="cog5" class="skill-checkbox">
                <label for="cog5">
                    <span class="item-title">Imitation and Symbolic Play</span>
                    <span class="item-desc">Copying actions or using objects to represent something else (e.g., pretending a block is a phone).</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="cog6" class="skill-checkbox">
                <label for="cog6">
                    <span class="item-title">Sorting and Matching</span>
                    <span class="item-desc">Categorizing and grouping objects by attributes like shape, color, size, or function.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="cog7" class="skill-checkbox">
                <label for="cog7">
                    <span class="item-title">Following Instructions</span>
                    <span class="item-desc">Understanding and executing single or multi-step directions accurately.</span>
                </label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="cog8" class="skill-checkbox">
                <label for="cog8">
                    <span class="item-title">Sequencing</span>
                    <span class="item-desc">Understanding the logical order of events or steps needed to complete a task.</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Sticky Score Bar -->
    <div id="score-bar">
        <div class="score-text">Score: <span id="current-score">0</span> / <span id="total-score">20</span> (<span id="percentage">0</span>%)</div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-fill"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('.skill-checkbox');
            const currentScoreEl = document.getElementById('current-score');
            const totalScoreEl = document.getElementById('total-score');
            const percentageEl = document.getElementById('percentage');
            const progressFill = document.getElementById('progress-fill');
            
            const totalItems = checkboxes.length;
            totalScoreEl.textContent = totalItems;

            function updateScore() {
                let checkedCount = 0;
                
                checkboxes.forEach(cb => {
                    // Toggle highlighting on the parent container
                    const parentItem = cb.closest('.checklist-item');
                    if (cb.checked) {
                        checkedCount++;
                        parentItem.classList.add('checked');
                    } else {
                        parentItem.classList.remove('checked');
                    }
                });

                // Update text
                currentScoreEl.textContent = checkedCount;
                
                // Update percentage and progress bar
                const percentage = Math.round((checkedCount / totalItems) * 100);
                percentageEl.textContent = percentage;
                progressFill.style.width = percentage + '%';
            }

            // Add event listeners to all checkboxes
            checkboxes.forEach(cb => {
                cb.addEventListener('change', updateScore);
            });

            // Initialize score on load
            updateScore();
        });
    </script>
</body>
</html>
