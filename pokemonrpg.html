<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Engine - Mobile & Scrolling</title>
    <style>
        body { 
            background-color: #2c3e50; 
            margin: 0; 
            overflow: hidden; 
            touch-action: none; /* Prevents browser pull-to-refresh */
            font-family: sans-serif;
        }
        canvas { 
            display: block;
        }
        /* On-Screen Virtual D-Pad */
        #dpad {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 5px;
            opacity: 0.6;
        }
        .dpad-btn {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
        }
        .dpad-btn:active { background: rgba(255, 255, 255, 1); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="dpad">
        <div id="btn-up" class="dpad-btn" data-dir="up">↑</div>
        <div id="btn-left" class="dpad-btn" data-dir="left">←</div>
        <div id="btn-right" class="dpad-btn" data-dir="right">→</div>
        <div id="btn-down" class="dpad-btn" data-dir="down">↓</div>
    </div>

    <script>
        class GameEngine {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.lastTime = 0;
                
                // Make canvas full screen
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                
                // Map Dimensions
                this.mapWidth = 2000;
                this.mapHeight = 2000;

                this.player = {
                    x: this.mapWidth / 2,
                    y: this.mapHeight / 2,
                    size: 30,
                    speed: 250 // Faster for a larger map
                };
                
                this.camera = { x: 0, y: 0 };
                this.keys = { up: false, down: false, left: false, right: false };
            }

            init() {
                this.bindInputs();
                requestAnimationFrame((timestamp) => this.loop(timestamp));
            }

            bindInputs() {
                // Keyboard
                window.addEventListener('keydown', (e) => this.setKey(e.key, true));
                window.addEventListener('keyup', (e) => this.setKey(e.key, false));

                // Mobile D-Pad Touch Events
                const buttons = document.querySelectorAll('.dpad-btn');
                buttons.forEach(btn => {
                    const dir = btn.getAttribute('data-dir');
                    // touchstart/end for mobile, mousedown/up for mouse testing
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[dir] = true; });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[dir] = false; });
                    btn.addEventListener('mousedown', () => this.keys[dir] = true);
                    btn.addEventListener('mouseup', () => this.keys[dir] = false);
                    btn.addEventListener('mouseleave', () => this.keys[dir] = false);
                });

                // Resize canvas gracefully
                window.addEventListener('resize', () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                });
            }

            setKey(key, isPressed) {
                if (key === 'ArrowUp' || key === 'w') this.keys.up = isPressed;
                if (key === 'ArrowDown' || key === 's') this.keys.down = isPressed;
                if (key === 'ArrowLeft' || key === 'a') this.keys.left = isPressed;
                if (key === 'ArrowRight' || key === 'd') this.keys.right = isPressed;
            }

            loop(timestamp) {
                const dt = (timestamp - this.lastTime) / 1000;
                this.lastTime = timestamp;

                this.update(dt);
                this.render();

                requestAnimationFrame((timestamp) => this.loop(timestamp));
            }

            update(dt) {
                // Movement
                if (this.keys.up) this.player.y -= this.player.speed * dt;
                if (this.keys.down) this.player.y += this.player.speed * dt;
                if (this.keys.left) this.player.x -= this.player.speed * dt;
                if (this.keys.right) this.player.x += this.player.speed * dt;

                // Map Boundaries
                this.player.x = Math.max(this.player.size/2, Math.min(this.mapWidth - this.player.size/2, this.player.x));
                this.player.y = Math.max(this.player.size/2, Math.min(this.mapHeight - this.player.size/2, this.player.y));

                // Update Camera to follow player, keeping them in the center of the screen
                this.camera.x = this.player.x - this.canvas.width / 2;
                this.camera.y = this.player.y - this.canvas.height / 2;

                // Clamp camera to map edges (optional, remove if you want black borders)
                this.camera.x = Math.max(0, Math.min(this.mapWidth - this.canvas.width, this.camera.x));
                this.camera.y = Math.max(0, Math.min(this.mapHeight - this.canvas.height, this.camera.y));
            }

            render() {
                // Clear screen
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Save context before applying camera translation
                this.ctx.save();
                this.ctx.translate(-this.camera.x, -this.camera.y);

                // Draw Background
                this.ctx.fillStyle = '#2ecc71'; 
                this.ctx.fillRect(0, 0, this.mapWidth, this.mapHeight);

                // Draw World Grid/Decorations to make movement visible
                this.ctx.fillStyle = '#27ae60';
                for(let i = 0; i < this.mapWidth; i += 200) {
                    for(let j = 0; j < this.mapHeight; j += 200) {
                        this.ctx.fillRect(i + 50, j + 50, 100, 100);
                    }
                }

                // Draw Player
                this.ctx.fillStyle = '#e74c3c';
                this.ctx.beginPath();
                this.ctx.arc(this.player.x, this.player.y, this.player.size / 2, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.strokeStyle = '#c0392b';
                this.ctx.lineWidth = 3;
                this.ctx.stroke();

                // Restore context back to screen coordinates
                this.ctx.restore();
            }
        }

        window.onload = () => {
            const game = new GameEngine('gameCanvas');
            game.init();
        };
    </script>
</body>
</html>
