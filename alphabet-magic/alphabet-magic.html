<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spellcaster: A-Z Mythical Beasts</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@400;700&display=swap');

    body {
        margin: 0;
        padding: 0;
        background: #0f0c29;
        background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
        color: white;
        font-family: 'Nunito', sans-serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        touch-action: none;
    }

    #game-container {
        position: relative;
        width: 100%;
        max-width: 900px;
        height: 100%;
        max-height: 600px;
        background: rgba(0, 0, 0, 0.4);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        border: 2px solid #5a4b81;
        border-radius: 12px;
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    .overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(15, 12, 41, 0.9);
        z-index: 10;
        text-align: center;
        transition: opacity 0.3s;
    }

    .hidden {
        display: none !important;
    }

    h1 {
        font-family: 'Cinzel', serif;
        font-size: 3rem;
        margin-bottom: 10px;
        color: #e0c3fc;
        text-shadow: 0 0 10px #8ec5fc;
    }

    h2 {
        font-family: 'Cinzel', serif;
        color: #ffb75e;
    }

    .btn-container {
        display: flex;
        gap: 20px;
        margin-top: 30px;
    }

    button {
        background: linear-gradient(to right, #8e2de2, #4a00e0);
        border: 2px solid #c9a5ff;
        color: white;
        font-size: 1.5rem;
        padding: 15px 30px;
        border-radius: 8px;
        cursor: pointer;
        font-family: 'Nunito', sans-serif;
        font-weight: 700;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px #c9a5ff;
    }

    #ui-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
    }

    .health-bar-container {
        position: absolute;
        top: 20px;
        width: 250px;
        background: rgba(0,0,0,0.6);
        border: 2px solid #555;
        border-radius: 10px;
        padding: 5px;
    }

    #player-ui { left: 20px; }
    #monster-ui { right: 20px; text-align: right; }

    .health-bar-fill {
        height: 20px;
        border-radius: 5px;
        transition: width 0.2s;
    }

    #player-hp { background: #4facfe; width: 100%; }
    #monster-hp { background: #ff0844; width: 100%; }

    .name-tag {
        font-family: 'Cinzel', serif;
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 5px;
        text-shadow: 1px 1px 2px black;
    }

    #level-display {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Cinzel', serif;
        font-size: 1.5rem;
        color: gold;
        text-shadow: 0 0 5px orange;
    }
</style>
</head>
<body>

<audio id="bg-music" loop>
    <source src="perky-goth.mp3" type="audio/mpeg">
</audio>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="hidden">
        <div class="health-bar-container" id="player-ui">
            <div class="name-tag" id="player-name">Sorcerer</div>
            <div style="background: #333; border-radius: 5px;">
                <div class="health-bar-fill" id="player-hp"></div>
            </div>
        </div>
        
        <div id="level-display">Level: A</div>

        <div class="health-bar-container" id="monster-ui">
            <div class="name-tag" id="monster-name">Arachne</div>
            <div style="background: #333; border-radius: 5px; display: flex; justify-content: flex-end;">
                <div class="health-bar-fill" id="monster-hp"></div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1>Spellcaster</h1>
        <p style="font-size: 1.2rem; max-width: 600px;">Trace the magic letter to attack the mythical beasts from A to Z! Faster traces deal stronger magical damage.</p>
        <div class="btn-container">
            <button onclick="startGame('M')">🧙‍♂️ Sorcerer</button>
            <button onclick="startGame('F')">🧙‍♀️ Witch</button>
        </div>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: #ff4b4b;">Defeated</h1>
        <p>The beasts overwhelmed your magic.</p>
        <button onclick="location.reload()" style="margin-top: 20px;">Try Again</button>
    </div>

    <div id="victory-screen" class="overlay hidden">
        <h1 style="color: #56ab2f;">Victory!</h1>
        <p>You have conquered all 26 Mythical Beasts.</p>
        <button onclick="location.reload()" style="margin-top: 20px;">Play Again</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const victoryScreen = document.getElementById('victory-screen');
    const uiLayer = document.getElementById('ui-layer');
    const playerHpBar = document.getElementById('player-hp');
    const monsterHpBar = document.getElementById('monster-hp');
    const playerNameTxt = document.getElementById('player-name');
    const monsterNameTxt = document.getElementById('monster-name');
    const levelDisplay = document.getElementById('level-display');
    const bgMusic = document.getElementById('bg-music');

    // Web Audio API Sound Effects Synthesizer
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type, duration, vol=0.1) {
        if (!audioCtx) return null;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
        return osc;
    }

    function playSoundEffect(effect) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        
        if (effect === 'playerShoot') {
            const osc = playTone(400, 'sine', 0.4, 0.2);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        } else if (effect === 'monsterShoot') {
            const osc = playTone(150, 'sawtooth', 0.4, 0.2);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
        } else if (effect === 'hit') {
            const osc = playTone(100, 'square', 0.2, 0.2);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.1);
        } else if (effect === 'levelUp') {
            playTone(440, 'sine', 0.3, 0.1); // A4
            setTimeout(() => playTone(554.37, 'sine', 0.3, 0.1), 100); // C#5
            setTimeout(() => playTone(659.25, 'sine', 0.6, 0.1), 200); // E5
        } else if (effect === 'error') {
            playTone(120, 'sawtooth', 0.3, 0.2);
        } else if (effect === 'gameOver') {
            playTone(200, 'sawtooth', 1.0, 0.3);
            setTimeout(() => playTone(150, 'sawtooth', 1.5, 0.3), 300);
        }
    }

    // Canvas sizing
    let width, height;
    function resize() {
        width = canvas.width = canvas.offsetWidth;
        height = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Data: 5x5 Grid paths for letters (0 to 4)
    const letterPaths = {
        'A': [[0,4], [2,0], [4,4], [3,2], [1,2]],
        'B': [[0,0], [0,4], [0,0], [3,0], [4,1], [3,2], [0,2], [3,2], [4,3], [3,4], [0,4]],
        'C': [[4,0], [1,0], [0,1], [0,3], [1,4], [4,4]],
        'D': [[0,0], [0,4], [0,0], [3,0], [4,2], [3,4], [0,4]],
        'E': [[4,0], [0,0], [0,2], [3,2], [0,2], [0,4], [4,4]],
        'F': [[4,0], [0,0], [0,4], [0,2], [3,2]],
        'G': [[4,0], [1,0], [0,1], [0,3], [1,4], [4,4], [4,2], [2,2]],
        'H': [[0,0], [0,4], [0,2], [4,2], [4,0], [4,4]],
        'I': [[1,0], [3,0], [2,0], [2,4], [1,4], [3,4]],
        'J': [[0,0], [4,0], [2,0], [2,4], [0,2]],
        'K': [[0,0], [0,4], [0,2], [4,0], [0,2], [4,4]],
        'L': [[0,0], [0,4], [4,4]],
        'M': [[0,4], [0,0], [2,2], [4,0], [4,4]],
        'N': [[0,4], [0,0], [4,4], [4,0]],
        'O': [[2,0], [0,1], [0,3], [2,4], [4,3], [4,1], [2,0]],
        'P': [[0,4], [0,0], [3,0], [4,1], [3,2], [0,2]],
        'Q': [[2,0], [0,1], [0,3], [2,4], [4,3], [4,1], [2,0], [2,2], [4,4]],
        'R': [[0,4], [0,0], [3,0], [4,1], [3,2], [0,2], [4,4]],
        'S': [[4,0], [1,0], [0,1], [1,2], [3,2], [4,3], [3,4], [0,4]],
        'T': [[0,0], [4,0], [2,0], [2,4]],
        'U': [[0,0], [0,3], [1,4], [3,4], [4,3], [4,0]],
        'V': [[0,0], [2,4], [4,0]],
        'W': [[0,0], [1,4], [2,2], [3,4], [4,0]],
        'X': [[0,0], [4,4], [2,2], [4,0], [0,4]],
        'Y': [[0,0], [2,2], [4,0], [2,2], [2,4]],
        'Z': [[0,0], [4,0], [0,4], [4,4]]
    };

    const monsters = [
        { letter: 'A', name: 'Arachne', icon: '🕷️' },
        { letter: 'B', name: 'Basilisk', icon: '🦎' },
        { letter: 'C', name: 'Chimera', icon: '🦁' },
        { letter: 'D', name: 'Dragon', icon: '🐉' },
        { letter: 'E', name: 'Echidna', icon: '🦅' },
        { letter: 'F', name: 'Fenrir', icon: '🐺' },
        { letter: 'G', name: 'Golem', icon: '🪨' },
        { letter: 'H', name: 'Hydra', icon: '🐍' },
        { letter: 'I', name: 'Ifrit', icon: '🔥' },
        { letter: 'J', name: 'Jörmungandr', icon: '🐲' },
        { letter: 'K', name: 'Kraken', icon: '🦑' },
        { letter: 'L', name: 'Leviathan', icon: '🐋' },
        { letter: 'M', name: 'Minotaur', icon: '🐂' },
        { letter: 'N', name: 'Naga', icon: '🐍' },
        { letter: 'O', name: 'Ogre', icon: '👹' },
        { letter: 'P', name: 'Pegasus', icon: '🦄' },
        { letter: 'Q', name: 'Quetzalcoatl', icon: '🪶' },
        { letter: 'R', name: 'Roc', icon: '🦅' },
        { letter: 'S', name: 'Sphinx', icon: '🐈' },
        { letter: 'T', name: 'Troll', icon: '🧌' },
        { letter: 'U', name: 'Unicorn', icon: '🦄' },
        { letter: 'V', name: 'Vampire', icon: '🧛' },
        { letter: 'W', name: 'Wendigo', icon: '🦌' },
        { letter: 'X', name: 'Xiezhi', icon: '🐐' },
        { letter: 'Y', name: 'Yeti', icon: '🦍' },
        { letter: 'Z', name: 'Zombie', icon: '🧟' }
    ];

    // Game State
    let gameState = 'START'; 
    let level = 0;
    let player = { type: 'M', icon: '🧙‍♂️', hp: 300, maxHp: 300, baseDamage: 40, x: 100, y: 300 };
    let monster = { ...monsters[0], hp: 100, maxHp: 100, attackTimer: 3000, maxTimer: 3000, x: 700, y: 300 };
    let lastTime = 0;
    
    // Tracing System
    let tracePoints = []; 
    let currentTargetPoint = 0;
    let isTracing = false;
    let playerTraceLine = [];
    let traceStartTime = 0;
    const TRACE_BOX_SIZE = 250;
    const TOLERANCE = 45; 

    // Entities
    let projectiles = [];
    let floatTexts = [];
    let particles = [];

    function startGame(charType) {
        initAudio(); // Initialize SFX context
        
        player.type = charType;
        player.icon = charType === 'M' ? '🧙‍♂️' : '🧙‍♀️';
        playerNameTxt.innerText = charType === 'M' ? 'Sorcerer' : 'Witch';
        startScreen.classList.add('hidden');
        uiLayer.classList.remove('hidden');
        
        // Start Audio Playback
        bgMusic.volume = 0.5;
        bgMusic.play().catch(e => console.log("Audio play failed:", e));

        level = 0;
        player.maxHp = 300;
        player.hp = player.maxHp;
        
        loadLevel(0);
        gameState = 'PLAYING';
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function loadLevel(lvl) {
        if (lvl >= monsters.length) {
            gameState = 'END';
            uiLayer.classList.add('hidden');
            victoryScreen.classList.remove('hidden');
            playSoundEffect('levelUp');
            return;
        }
        
        const mBase = monsters[lvl];
        monster.letter = mBase.letter;
        monster.name = mBase.name;
        monster.icon = mBase.icon;
        
        monster.maxHp = Math.floor(100 * Math.pow(1.15, lvl));
        monster.hp = monster.maxHp;
        monster.maxTimer = Math.max(1500, 3500 - (lvl * 50));
        monster.attackTimer = monster.maxTimer;

        monsterNameTxt.innerText = monster.name;
        levelDisplay.innerText = `Level: ${monster.letter}`;
        
        updateHealthBars();
        buildTracePoints(monster.letter);
    }

    function buildTracePoints(letter) {
        const path = letterPaths[letter] || letterPaths['A'];
        tracePoints = [];
        const boxX = (width / 2) - (TRACE_BOX_SIZE / 2);
        const boxY = (height / 2) - (TRACE_BOX_SIZE / 2) + 20;

        for (let pt of path) {
            tracePoints.push({
                x: boxX + (pt[0] / 4) * TRACE_BOX_SIZE,
                y: boxY + (pt[1] / 4) * TRACE_BOX_SIZE
            });
        }
        resetTrace();
    }

    function resetTrace() {
        isTracing = false;
        currentTargetPoint = 0;
        playerTraceLine = [];
        traceStartTime = 0;
    }

    function updateHealthBars() {
        playerHpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
        monsterHpBar.style.width = Math.max(0, (monster.hp / monster.maxHp) * 100) + '%';
    }

    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function handlePointerDown(e) {
        if (gameState !== 'PLAYING') return;
        const pos = getPointerPos(e);
        checkTraceProgress(pos, true);
    }

    function handlePointerMove(e) {
        if (!isTracing || gameState !== 'PLAYING') return;
        e.preventDefault();
        const pos = getPointerPos(e);
        playerTraceLine.push(pos);
        checkTraceProgress(pos, false);
    }

    function handlePointerUp(e) {
        if (!isTracing || gameState !== 'PLAYING') return;
        resetTrace();
        playSoundEffect('error'); // Play broken trace sound
        addFloatingText("Trace Broken", width/2, height/2 - 100, '#ff4b4b');
    }

    function checkTraceProgress(pos, isStart) {
        if (currentTargetPoint >= tracePoints.length) return;
        
        const target = tracePoints[currentTargetPoint];
        const dist = Math.hypot(pos.x - target.x, pos.y - target.y);
        
        if (dist < TOLERANCE) {
            if (currentTargetPoint === 0 && isStart) {
                isTracing = true;
                traceStartTime = performance.now();
                playerTraceLine = [pos];
            }
            
            if (isTracing) {
                currentTargetPoint++;
                if (currentTargetPoint >= tracePoints.length) {
                    finishTrace();
                }
            }
        }
    }

    function finishTrace() {
        const timeTaken = performance.now() - traceStartTime;
        const idealTime = tracePoints.length * 200 + 200; 
        
        let multiplier = idealTime / timeTaken;
        multiplier = Math.max(0.5, Math.min(multiplier, 2.5)); 
        
        const damage = Math.floor(player.baseDamage * multiplier);
        
        let rating = "GOOD!";
        let color = "#e0c3fc";
        if (multiplier >= 2.0) { rating = "PERFECT!"; color = "#f6d365"; }
        else if (multiplier <= 0.8) { rating = "SLOW..."; color = "#ffb347"; }

        addFloatingText(rating, width/2, height/2 - 50, color);
        
        playSoundEffect('playerShoot'); // Play player attack sound

        projectiles.push({
            x: player.x + 40, y: player.y, 
            targetX: monster.x, targetY: monster.y,
            speed: 800,
            damage: damage,
            isPlayer: true,
            color: '#4facfe'
        });

        resetTrace();
    }

    function addFloatingText(text, x, y, color) {
        floatTexts.push({ text, x, y, color, life: 1.0, dy: -30 });
    }

    function spawnParticles(x, y, color) {
        for(let i=0; i<15; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 300,
                vy: (Math.random() - 0.5) * 300,
                life: 0.5 + Math.random() * 0.5,
                color: color
            });
        }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
    canvas.addEventListener('touchmove', handlePointerMove, {passive: false});
    window.addEventListener('touchend', handlePointerUp);

    function gameLoop(timestamp) {
        if (gameState !== 'PLAYING') return;
        
        const dt = (timestamp - lastTime) / 1000; 
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        monster.attackTimer -= dt * 1000;
        if (monster.attackTimer <= 0) {
            monster.attackTimer = monster.maxTimer;
            
            playSoundEffect('monsterShoot'); // Play monster attack sound

            const mDamage = Math.floor(10 + (level * 3));
            projectiles.push({
                x: monster.x - 40, y: monster.y, 
                targetX: player.x, targetY: player.y,
                speed: 600,
                damage: mDamage,
                isPlayer: false,
                color: '#ff0844'
            });
        }

        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            const dx = p.targetX - p.x;
            const dy = p.targetY - p.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist < p.speed * dt) {
                spawnParticles(p.targetX, p.targetY, p.color);
                addFloatingText("-" + p.damage, p.targetX, p.targetY - 50, p.color);
                playSoundEffect('hit'); // Play hit sound
                
                if (p.isPlayer) {
                    monster.hp -= p.damage;
                    if (monster.hp <= 0) {
                        levelUp();
                    }
                } else {
                    player.hp -= p.damage;
                    if (player.hp <= 0) {
                        player.hp = 0;
                        gameState = 'END';
                        uiLayer.classList.add('hidden');
                        gameOverScreen.classList.remove('hidden');
                        playSoundEffect('gameOver'); // Play game over sound
                    }
                }
                updateHealthBars();
                projectiles.splice(i, 1);
            } else {
                p.x += (dx / dist) * p.speed * dt;
                p.y += (dy / dist) * p.speed * dt;
            }
        }

        for (let i = floatTexts.length - 1; i >= 0; i--) {
            floatTexts[i].life -= dt;
            floatTexts[i].y += floatTexts[i].dy * dt;
            if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].life -= dt * 2;
            particles[i].x += particles[i].vx * dt;
            particles[i].y += particles[i].vy * dt;
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
        
        player.x = width * 0.15;
        player.y = height * 0.55;
        monster.x = width * 0.85;
        monster.y = height * 0.55;
    }

    function levelUp() {
        level++;
        player.hp = Math.min(player.maxHp, player.hp + (player.maxHp * 0.3)); 
        playSoundEffect('levelUp'); // Play level up sound
        loadLevel(level);
        addFloatingText("LEVEL CLEAR!", width/2, height/2 - 120, '#56ab2f');
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        ctx.font = "80px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const pScale = 1 + Math.sin(performance.now() / 300) * 0.03;
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.scale(pScale, pScale);
        ctx.fillText(player.icon, 0, 0);
        ctx.restore();

        const mScale = 1 + Math.sin(performance.now() / 400 + 1) * 0.05;
        ctx.save();
        ctx.translate(monster.x, monster.y);
        ctx.scale(mScale, mScale);
        ctx.fillText(monster.icon, 0, 0);
        ctx.restore();

        drawTracingArea();

        for (let p of projectiles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.shadowBlur = 15;
            ctx.shadowColor = p.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        for (let p of particles) {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        ctx.font = "bold 24px 'Nunito', sans-serif";
        for (let ft of floatTexts) {
            ctx.globalAlpha = Math.max(0, ft.life);
            ctx.fillStyle = ft.color;
            ctx.shadowBlur = 4;
            ctx.shadowColor = "black";
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }
    }

    function drawTracingArea() {
        const boxX = (width / 2) - (TRACE_BOX_SIZE / 2);
        const boxY = (height / 2) - (TRACE_BOX_SIZE / 2) + 20;

        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.strokeStyle = "#5a4b81";
        ctx.lineWidth = 2;
        ctx.fillRect(boxX, boxY, TRACE_BOX_SIZE, TRACE_BOX_SIZE);
        ctx.strokeRect(boxX, boxY, TRACE_BOX_SIZE, TRACE_BOX_SIZE);

        if (tracePoints.length === 0) return;

        ctx.beginPath();
        ctx.moveTo(tracePoints[0].x, tracePoints[0].y);
        for (let i = 1; i < tracePoints.length; i++) {
            ctx.lineTo(tracePoints[i].x, tracePoints[i].y);
        }
        ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
        ctx.lineWidth = 15;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.stroke();

        if (playerTraceLine.length > 1) {
            ctx.beginPath();
            ctx.moveTo(playerTraceLine[0].x, playerTraceLine[0].y);
            for (let i = 1; i < playerTraceLine.length; i++) {
                ctx.lineTo(playerTraceLine[i].x, playerTraceLine[i].y);
            }
            ctx.strokeStyle = "#c9a5ff";
            ctx.lineWidth = 6;
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#8e2de2";
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        for (let i = 0; i < tracePoints.length; i++) {
            ctx.beginPath();
            ctx.arc(tracePoints[i].x, tracePoints[i].y, 10, 0, Math.PI * 2);
            
            if (i < currentTargetPoint) {
                ctx.fillStyle = "#56ab2f"; 
            } else if (i === currentTargetPoint) {
                ctx.fillStyle = "#ffb75e";
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ffb75e";
            } else {
                ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            }
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
</script>
