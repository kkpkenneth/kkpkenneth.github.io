<!DOCTYPE html>

    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg: #fffbeb;
            --card-bg: #ffffff;
            --text: #78350f;
            --success: #15803d;
            --error: #b91c1c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(120, 53, 15, 0.1);
            border: 2px solid #fde68a;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
            font-size: 2rem;
        }

        p {
            color: #92400e;
            margin-bottom: 1.5rem;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-bottom: 0.75rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none !important;
        }

        .question-box {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 1.2rem 0;
            color: var(--text);
            line-height: 1.4;
        }

        .tts-btn {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            color: #92400e;
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: transform 0.1s;
        }

        .tts-btn:hover {
            transform: scale(1.05);
            background: #fde68a;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .option-btn {
            background-color: #fef3c7;
            color: var(--text);
            border: 2px solid #fde68a;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #fde68a;
            border-color: var(--primary);
        }

        .option-btn.correct {
            background-color: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .option-btn.incorrect {
            background-color: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-weight: 600;
            color: #92400e;
            font-size: 0.9rem;
        }

            margin-top: 1rem;
            min-height: 4rem;
        }

            font-weight: 600;
            margin-bottom: 0.4rem;
        }

            font-size: 0.88rem;

            line-height: 1.35;
        }

            background-color: #78350f;
        }

        }

        // Web Audio API Sound Effects
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            if (type === 'correct') {
                playTone(523.25, 0.1, 0);     // C5
                playTone(659.25, 0.15, 0.1);  // E5
            } else if (type === 'incorrect') {
                playTone(200, 0.2, 0, 'sawtooth');
                playTone(150, 0.2, 0.1, 'sawtooth');
            } else if (type === 'complete') {
                playTone(523.25, 0.1, 0);     // C5
                playTone(659.25, 0.1, 0.1);   // E5
                playTone(783.99, 0.1, 0.2);   // G5
                playTone(1046.50, 0.3, 0.3);  // C6
            }
        }

        function playTone(freq, duration, delay, waveType = 'sine') {
            setTimeout(() => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = waveType;
                osc.frequency.value = freq;

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, delay * 1000);
        }

        // Text-to-Speech Helper for Cantonese (zh-HK) - Pronounce word once

            if ('speechSynthesis' in window && currentQuestionData) {
                window.speechSynthesis.cancel();
                const textToSpeak = currentQuestionData.chinese;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        let currentQuestionIndex = 0;
        let score = 0;
        let currentQuestionData = null;

        function startQuiz() {
            initAudio();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            currentQuestionIndex = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= ingredientDatabase.length) {
                endQuiz();
                return;
            }

            currentQuestionData = ingredientDatabase[currentQuestionIndex];
            document.getElementById('question-box').innerText = `What is this Cantonese ingredient?\n(${currentQuestionData.chinese} — ${currentQuestionData.jyutping})`;
            document.getElementById('question-counter').innerText = `Question ${currentQuestionIndex + 1}/${ingredientDatabase.length}`;
            document.getElementById('score-counter').innerText = `Score: ${score}`;
            document.getElementById('feedback').innerText = '';
            document.getElementById('explanation').innerText = '';
            document.getElementById('next-btn').classList.add('hidden');

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            optionsContainer.style.pointerEvents = "auto";

            // Generate 3 wrong options + 1 correct option
            let wrongOptions = ingredientDatabase
                .filter(item => item.name !== currentQuestionData.name)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(item => item.name);

            let options = [...wrongOptions, currentQuestionData.name].sort(() => Math.random() - 0.5);

            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectAnswer(btn, option, currentQuestionData.name, currentQuestionData.desc);
                optionsContainer.appendChild(btn);
            });

            setTimeout(speakCantonese, 300);
        }

        function selectAnswer(button, selected, correct, description) {
            const optionsContainer = document.getElementById('options-container');
            const buttons = optionsContainer.getElementsByTagName('button');
            
            optionsContainer.style.pointerEvents = "none";

            for (let btn of buttons) {
                if (btn.innerText === correct) {
                    btn.classList.add('correct');
                }
            }

            const feedbackEl = document.getElementById('feedback');
            const explanationEl = document.getElementById('explanation');

            if (selected === correct) {
                score++;
                button.classList.add('correct');
                playSound('correct');
                feedbackEl.innerText = "Correct! 🥢 Excellent!";
                feedbackEl.style.color = "var(--success)";
            } else {
                button.classList.add('incorrect');
                playSound('incorrect');
                feedbackEl.innerText = `Incorrect. The correct answer is: ${correct}`;
                feedbackEl.style.color = "var(--error)";
            }

            explanationEl.innerText = description;
            document.getElementById('score-counter').innerText = `Score: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function loadNextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function endQuiz() {
            playSound('complete');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score-text').innerText = `Amazing work! You completed all 100 ingredients with a total score of ${score}.`;
        }
