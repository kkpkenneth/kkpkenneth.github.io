<!DOCTYPE html>
<html lang="en">
<head>
<style>
  /* 1. Square */
  .square {
    width: 100px;
    height: 100px;
    background-color: currentColor;
  }

  /* 2. Circle */
  .circle {
    width: 100px;
    height: 100px;
    background-color: currentColor;
    border-radius: 50%;
  }

  /* 3. Triangle (CSS Border Trick) */
  .triangle {
    width: 0;
    height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 100px solid currentColor;
  }

  /* 4. Rectangle */
  .rectangle {
    width: 150px;
    height: 80px;
    background-color: currentColor;
  }
</style>
</head>
<body>
  <div class="square"></div>
  <div class="circle"></div>
  <div class="triangle"></div>
  <div class="rectangle"></div>
</body>
</html>
