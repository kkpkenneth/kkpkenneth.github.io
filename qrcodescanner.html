<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick QR Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        #reader { width: 400px; border: 10px solid #333; border-radius: 8px; overflow: hidden; background: white; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; background: #e0ffe0; color: #006600; display: none; font-weight: bold; }
        h1 { color: #333; }
    </style>
</head>
<body>

    <h1>QR Code Scanner</h1>
    
    <div id="reader"></div>
    
    <div id="result"></div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // Handle the scanned code
            const resultElement = document.getElementById('result');
            resultElement.style.display = 'block';
            resultElement.innerText = `Scanned Result: ${decodedText}`;
            
            // Optional: Stop scanning after one success
            // html5QrcodeScanner.clear();
        }

        function onScanFailure(error) {
            // This fires every frame if no QR is found. 
            // Usually best to leave empty to avoid console spam.
        }

        // 4. Initialize the Scanner
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: {width: 250, height: 250} }, 
            /* verbose= */ false
        );
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
