<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        :root {
            --success: #27ae60;

        body {

            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 700px;
            padding: 40px 30px;
            text-align: center;
            overflow: hidden;
            min-height: 600px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        #start-screen {
            padding: 20px 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #start-screen h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: #2c3e50;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            letter-spacing: 1px;
        }
        #start-screen h2 {
            font-size: 1.4rem;
            font-weight: 300;
            margin-bottom: 40px;
            color: #556;
        }
        
        .primary-action-btn {
            background: #34495e;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 15px 50px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #2c3e50;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        .primary-action-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: #2c3e50;
        }
        .primary-action-btn:active {
            transform: translateY(1px);
        }

        h2#question-text {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: #2c3e50;
        }

        .flag-container {
            width: 100%;
            aspect-ratio: 16 / 9; 
            background-color: rgba(0, 0, 0, 0.05);
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .flag-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .btn {
            background-color: #34495e; 
            color: #ffffff; 
            border: 1px solid #2c3e50;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover:not(:disabled) {
            background-color: #2c3e50;
            border-color: #1a252f;
        }
        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }
        .btn.correct { 
            background-color: var(--success) !important; 
            color: white !important;
            border-color: var(--success) !important;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.3);
        }
        .btn.wrong { 
            background-color: var(--danger) !important; 
            color: white !important;
            border-color: var(--danger) !important;
        }
        
        #quiz-screen {
            display: none;
            width: 100%;
            flex-direction: column;
        }
        
        .fact-box {
            background: rgba(230, 230, 230, 0.5);
            border-left: 5px solid var(--hint);
            padding: 18px;
            margin: 20px 0;
            text-align: left;
            border-radius: 0 8px 8px 0;
            display: none; 
            font-size: 1rem;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: #34495e;
        }
        .fact-box h3 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 8px;
            color: #2c3e50;
        }
        .fact-item {
            margin-bottom: 10px;
        }
        .fact-item strong {
            color: #e67e22;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        #next-btn-container {
            display: none;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px 0;
                align-items: center; 
            }
            .container {
                width: 95%;
                padding: 25px 15px;
                min-height: 85vh; 
                justify-content: center;
                align-items: center;
            }
            #start-screen h1 {
                font-size: 2.2rem;
            }
            #start-screen h2 {
                font-size: 1.1rem;
            }
            h2#question-text {
                font-size: 1.3rem;
                margin-bottom: 15px;
            }
            .flag-container {
                aspect-ratio: 16 / 9; 
                margin-bottom: 15px;

                grid-template-columns: 1fr;
                gap: 10px;
                margin-bottom: 15px;

                padding: 12px 15px;
                font-size: 1rem;

            .fact-box {
                font-size: 0.9rem;
                padding: 12px;
                margin: 10px 0;

                font-size: 1.1rem;
            }
        }
    </style>
</head>

    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function startBackgroundMusic() {
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.2; 
        bgMusic.play().catch(error => {
            console.log("Autoplay prevented by browser:", error);
        });
    }

    function playSound(type) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'start') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'correct') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

    function speakAnswer(enText, zhText) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            
            const utteranceEn = new SpeechSynthesisUtterance(enText);
            utteranceEn.lang = 'en-US';
            utteranceEn.rate = 1.0;
            
            const utteranceZh = new SpeechSynthesisUtterance(zhText);
            utteranceZh.lang = 'zh-HK'; 
            utteranceZh.rate = 1.0;

            window.speechSynthesis.speak(utteranceEn);
            window.speechSynthesis.speak(utteranceZh);
        }
    }

        initAudio();

        startBackgroundMusic();

        document.getElementById('quiz-screen').style.display = 'flex';

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function loadNextQuestion() {
        document.getElementById('next-btn-container').style.display = 'none';
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        if (questionsPool.length === 0) {
            questionsPool = [...countryData];
        }
        const qIndex = Math.floor(Math.random() * questionsPool.length);
        currentQuestion = questionsPool.splice(qIndex, 1)[0];

        document.getElementById('flag-img').src = currentQuestion.img;
        document.getElementById('flag-img').onerror = function() {
            this.src = 'https://via.placeholder.com/640x360?text=Image+Missing+(' + currentQuestion.img + ')';

        let shuffledDistractors = shuffleArray([...allCountryNames.filter(c => c.en !== currentQuestion.en)]);

            options.push({ en: shuffledDistractors[i].en, zh: shuffledDistractors[i].zh, isCorrect: false });
        }

        options = shuffleArray(options);

            btn.innerHTML = `${opt.en}<br>${opt.zh}`;
            btn.onclick = () => checkAnswer(btn, opt.isCorrect);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(clickedBtn, isCorrect) {
        playSound(isCorrect ? 'correct' : 'wrong');
        
        speakAnswer(currentQuestion.en, currentQuestion.zh);

        const buttons = document.getElementById('options-container').querySelectorAll('.btn');
        
        buttons.forEach(btn => {

        });

            clickedBtn.classList.add('wrong');
