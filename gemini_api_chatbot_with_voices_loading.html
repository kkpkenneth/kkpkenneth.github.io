<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini API Chatbot</title>
<style>
  :root {
    --primary: #10a37f;
    --bg-color: #f4f7f6;
    --panel-bg: #ffffff;
    --text-color: #2d3748;
    --bot-msg-bg: #e2e8f0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }

  .app-container {
    width: 100%;
    max-width: 400px;
    background: var(--panel-bg);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- Visualization Panel --- */
  .face-panel {
    background: var(--primary);
    padding: 30px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .avatar {
    width: 100px;
    height: 100px;
    background: #fbd38d;
    border-radius: 50%;
    position: relative;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.2);
    transition: filter 0.3s ease;
  }

  .eye {
    width: 14px;
    height: 14px;
    background: #2d3748;
    border-radius: 50%;
    position: absolute;
    top: 35%;
  }

  .eye.left { left: 25%; }
  .eye.right { right: 25%; }

  .mouth {
    width: 36px;
    height: 6px;
    background: #9b2c2c;
    position: absolute;
    bottom: 25%;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 3px 3px 15px 15px;
    transition: all 0.1s ease;
  }

  .talking .mouth {
    animation: chatter 0.2s infinite alternate;
  }

  @keyframes chatter {
    0% { height: 6px; border-radius: 3px 3px 15px 15px; }
    100% { height: 24px; border-radius: 12px 12px 24px 24px; }
  }

  /* --- Controls Panel --- */
  .controls {
    padding: 10px 15px;
    background: #f8fafc;
    border-bottom: 1px solid #edf2f7;
    display: flex;
    align-items: center;
    font-size: 13px;
  }

  .controls label {
    font-weight: bold;
    margin-right: 10px;
  }

  .controls select {
    flex: 1;
    padding: 6px;
    border-radius: 5px;
    border: 1px solid #cbd5e0;
    outline: none;
  }

  /* --- Chat Interface --- */
  .chat-window {
    height: 300px;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    max-width: 85%;
    padding: 10px 15px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.4;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .user-msg {
    background: var(--primary);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }

  .bot-msg {
    background: var(--bot-msg-bg);
    color: var(--text-color);
    align-self: flex-start;
    border-bottom-left-radius: 2px;
  }

  /* --- Loading Animation --- */
  .loading-msg {
    display: none; /* Hidden by default */
    align-items: center;
    gap: 5px;
    padding: 12px 15px;
    height: 20px;
    box-sizing: content-box;
  }

  .dot {
    width: 8px;
    height: 8px;
    background-color: #718096;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }

  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* --- Input Area --- */
  .input-area {
    display: flex;
    padding: 15px;
    background: var(--panel-bg);
    border-top: 1px solid #edf2f7;
  }

  .input-area input {
    flex: 1;
    padding: 12px;
    border: 1px solid #cbd5e0;
    border-radius: 20px;
    outline: none;
    font-size: 14px;
  }

  .input-area button {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 20px;
    margin-left: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }

  .input-area button:hover {
    background: #0d8a6a;
  }
</style>
</head>
<body>

<div class="app-container">
  
  <div class="face-panel">
    <div class="avatar" id="avatarFace">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth" id="avatarMouth"></div>
    </div>
  </div>

  <div class="controls">
    <label for="voiceSelect">Voice:</label>
    <select id="voiceSelect"></select>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="message bot-msg">Hello! I am connected to the Gemini API. Ask me anything!</div>
    
    <!-- Loading Indicator -->
    <div class="message bot-msg loading-msg" id="loadingIndicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask me something..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()" id="sendBtn">Send</button>
  </div>

</div>

<script>
  // The execution environment will inject the API key automatically at runtime.
  const apiKey = ""; 
  const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

  const chatWindow = document.getElementById('chatWindow');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const avatarFace = document.getElementById('avatarFace');
  const loadingIndicator = document.getElementById('loadingIndicator');
  
  // TTS & Voice Setup
  const synth = window.speechSynthesis;
  const voiceSelect = document.getElementById('voiceSelect');
  let voices = [];

  function populateVoices() {
    voices = synth.getVoices();
    voiceSelect.innerHTML = '';
    voices.forEach((voice, index) => {
      const option = document.createElement('option');
      option.textContent = `${voice.name} (${voice.lang})`;
      option.value = index;
      if (voice.default) option.selected = true;
      voiceSelect.appendChild(option);
    });
  }

  populateVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = populateVoices;
  }

  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      sendMessage();
    }
  }

  const delay = ms => new Promise(res => setTimeout(res, ms));

  // API Call with Exponential Backoff
  async function fetchGeminiResponse(prompt) {
    const retries = [1000, 2000, 4000, 8000, 16000];
    const payload = {
      contents: [{ parts: [{ text: prompt }] }]
    };

    for (let i = 0; i <= retries.length; i++) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I generated an empty response.";

      } catch (error) {
        if (i === retries.length) {
          console.error("API Error after all retries:", error);
          return "Sorry, I lost my connection to the server after multiple attempts.";
        }
        await delay(retries[i]);
      }
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (text === '') return;

    if (synth.speaking) synth.cancel();

    // 1. Post User Message
    appendMessage(text, 'user-msg');
    userInput.value = '';
    userInput.disabled = true;
    sendBtn.disabled = true;

    // 2. Show Visual "Thinking" State & Loading indicator
    avatarFace.style.filter = 'brightness(0.8)';
    
    // Move loading indicator to the bottom and show it
    chatWindow.appendChild(loadingIndicator);
    loadingIndicator.style.display = 'flex';
    chatWindow.scrollTop = chatWindow.scrollHeight;

    // 3. Call the API
    const replyText = await fetchGeminiResponse(text);

    // 4. Hide Loading, Restore Visual State, Post Reply
    loadingIndicator.style.display = 'none';
    avatarFace.style.filter = 'brightness(1)';
    userInput.disabled = false;
    sendBtn.disabled = false;
    userInput.focus();
    
    appendMessage(replyText, 'bot-msg');
    speakText(replyText);
  }

  function appendMessage(text, className) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', className);
    msgDiv.textContent = text;
    
    // Ensure the new message goes BEFORE the loading indicator if it happens to be visible
    chatWindow.insertBefore(msgDiv, loadingIndicator);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function speakText(text) {
    if (synth.speaking) return;

    // Clean up Markdown formatting (like **bold**) so the TTS doesn't read the asterisks
    const cleanText = text.replace(/[*#]/g, '');
    
    const utterThis = new SpeechSynthesisUtterance(cleanText);
    
    // Apply selected voice
    const selectedVoice = voices[voiceSelect.value];
    if (selectedVoice) {
      utterThis.voice = selectedVoice;
    }
    
    utterThis.onstart = () => avatarFace.classList.add('talking');
    utterThis.onend = () => avatarFace.classList.remove('talking');
    utterThis.onerror = () => avatarFace.classList.remove('talking');

    synth.speak(utterThis);
  }
</script>

</body>
</html>
