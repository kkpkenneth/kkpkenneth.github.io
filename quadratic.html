<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Master Quiz</title>
    <style>
        :root { --bg-color: #f4f7f6; --card-bg: #ffffff; --text-color: #2c3e50; --primary-color: #3498db; --accent-color: #9b59b6; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; justify-content: center; min-height: 100vh; font-family: sans-serif; }
        .quiz-container { background: var(--card-bg); border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; padding: 25px; }
        .equation { font-size: 1.5rem; text-align: center; color: var(--accent-color); margin: 20px 0; font-style: italic; }
        .option-btn { display: block; width: 100%; background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; text-align: left; }
        .steps-box { margin-top: 15px; padding: 15px; background: #fff3cd; border-left: 4px solid #ffc107; display: none; font-size: 0.9rem; }
        .action-btn { display: none; width: 100%; background: var(--primary-color); color: white; border: none; border-radius: 8px; padding: 12px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="category-badge" style="font-weight:bold; color:var(--primary-color);">Factoring</div>
    <div class="equation" id="equation-text"></div>
    <div id="options-container"></div>
    <div id="steps" class="steps-box"></div>
    <button id="next-btn" class="action-btn" onclick="nextQuestion()">Next Question &rarr;</button>
</div>

<script>
const questions = [
    // FACTORING (Easy/Medium)
    { equation: "x² + 5x + 6 = 0", options: ["x = -2, -3", "x = 2, 3", "x = 1, 6"], correct: 0, category: "Factoring", method: "1. Find factors of 6 that add to 5 (2 and 3). 2. Write (x+2)(x+3)=0. 3. Result: x = -2 or -3." },
    { equation: "x² - 9 = 0", options: ["x = 3", "x = ±3", "x = 9"], correct: 1, category: "Factoring", method: "1. Difference of squares: x² - 3² = 0. 2. (x-3)(x+3)=0. 3. Result: x = 3 or -3." },
    { equation: "x² - 8x + 16 = 0", options: ["x = 4 (double)", "x = -4", "x = 2, 8"], correct: 0, category: "Factoring", method: "1. Perfect square: (x-4)² = 0. 2. Result: x = 4." },
    { equation: "x² + 2x - 15 = 0", options: ["x = 3, -5", "x = -3, 5", "x = 1, -15"], correct: 0, category: "Factoring", method: "1. Factors of -15 that add to 2 are 5 and -3. 2. (x+5)(x-3)=0. 3. Result: x = -5 or 3." },
    { equation: "2x² + 5x + 2 = 0", options: ["x = -1/2, -2", "x = 1/2, 2", "x = -1, -2"], correct: 0, category: "Factoring", method: "1. AC=4, b=5. Factors are 4 and 1. 2. 2x²+4x+x+2=0. 3. 2x(x+2)+1(x+2)=0. 4. Result: x = -1/2, -2." },

    // COMPLETING THE SQUARE (Medium)
    { equation: "x² + 4x - 5 = 0", options: ["x = 1, -5", "x = -1, 5", "x = 2, -2"], correct: 0, category: "Completing the Square", method: "1. x²+4x=5. 2. Add (4/2)²=4 to both sides: x²+4x+4=9. 3. (x+2)²=9. 4. x+2=±3. 5. Result: x=1, -5." },
    { equation: "x² - 6x - 7 = 0", options: ["x = 7, -1", "x = -7, 1", "x = 3, -4"], correct: 0, category: "Completing the Square", method: "1. x²-6x=7. 2. Add (-6/2)²=9: x²-6x+9=16. 3. (x-3)²=16. 4. x-3=±4. 5. Result: x=7, -1." },
    { equation: "x² + 10x + 21 = 0", options: ["x = -3, -7", "x = 3, 7", "x = -1, -21"], correct: 0, category: "Completing the Square", method: "1. x²+10x=-21. 2. Add (10/2)²=25: x²+10x+25=4. 3. (x+5)²=4. 4. x+5=±2. 5. Result: x=-3, -7." },
    { equation: "x² - 2x - 24 = 0", options: ["x = 6, -4", "x = -6, 4", "x = 8, -3"], correct: 0, category: "Completing the Square", method: "1. x²-2x=24. 2. Add (-2/2)²=1: x²-2x+1=25. 3. (x-1)²=25. 4. x-1=±5. 5. Result: x=6, -4." },
    { equation: "x² + 8x + 12 = 0", options: ["x = -2, -6", "x = 2, 6", "x = 1, 12"], correct: 0, category: "Completing the Square", method: "1. x²+8x=-12. 2. Add (8/2)²=16: x²+8x+16=4. 3. (x+4)²=4. 4. x+4=±2. 5. Result: x=-2, -6." },

    // QUADRATIC FORMULA (Medium/Hard)
    { equation: "x² - 4x + 1 = 0", options: ["x = 2±√3", "x = 4±√3", "x = 2±√5"], correct: 0, category: "Quadratic Formula", method: "1. a=1, b=-4, c=1. 2. Δ=(-4)²-4(1)(1)=12. 3. x=(4±√12)/2=2±√3." },
    { equation: "x² + 2x - 4 = 0", options: ["x = -1±√5", "x = 1±√5", "x = -2±√5"], correct: 0, category: "Quadratic Formula", method: "1. a=1, b=2, c=-4. 2. Δ=2²-4(1)(-4)=20. 3. x=(-2±√20)/2=-1±√5." },
    { equation: "2x² - 6x + 3 = 0", options: ["x = (3±√3)/2", "x = (6±√3)/4", "x = 3±√3"], correct: 0, category: "Quadratic Formula", method: "1. a=2, b=-6, c=3. 2. Δ=(-6)²-4(2)(3)=12. 3. x=(6±√12)/4=(3±√3)/2." },
    { equation: "x² - 3x - 1 = 0", options: ["x = (3±√13)/2", "x = (-3±√13)/2", "x = 3±√13"], correct: 0, category: "Quadratic Formula", method: "1. a=1, b=-3, c=-1. 2. Δ=(-3)²-4(1)(-1)=13. 3. x=(3±√13)/2." },
    { equation: "3x² + 5x - 2 = 0", options: ["x = 1/3, -2", "x = -1/3, 2", "x = 1, -2"], correct: 0, category: "Quadratic Formula", method: "1. a=3, b=5, c=-2. 2. Δ=5²-4(3)(-2)=49. 3. x=(-5±7)/6. 4. Result: x=1/3, -2." },

    // COMPLEX ROOTS (Hard)
    { equation: "x² + 4 = 0", options: ["x = ±2i", "x = ±2", "x = 4i"], correct: 0, category: "Complex Roots", method: "1. x² = -4. 2. x = √-4. 3. Result: ±2i." },
    { equation: "x² + 2x + 2 = 0", options: ["x = -1±i", "x = 1±i", "x = -1±2i"], correct: 0, category: "Complex Roots", method: "1. a=1, b=2, c=2. 2. Δ=4-8=-4. 3. x=(-2±2i)/2=-1±i." },
    { equation: "x² - 2x + 5 = 0", options: ["x = 1±2i", "x = -1±2i", "x = 1±4i"], correct: 0, category: "Complex Roots", method: "1. a=1, b=-2, c=5. 2. Δ=4-20=-16. 3. x=(2±4i)/2=1±2i." },
    { equation: "x² + 9 = 0", options: ["x = ±3i", "x = ±3", "x = 9i"], correct: 0, category: "Complex Roots", method: "1. x² = -9. 2. x = √-9. 3. Result: ±3i." },
    { equation: "x² - 6x + 10 = 0", options: ["x = 3±i", "x = -3±i", "x = 3±2i"], correct: 0, category: "Complex Roots", method: "1. a=1, b=-6, c=10. 2. Δ=36-40=-4. 3. x=(6±2i)/2=3±i." }
];

let currentIndex = 0;
let answered = false;

function load() {
    answered = false;
    let q = questions[currentIndex % questions.length];
    document.getElementById('category-badge').innerText = q.category;
    document.getElementById('equation-text').innerText = q.equation;
    document.getElementById('steps').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => reveal(i, q);
        container.appendChild(btn);
    });
}

function reveal(i, q) {
    if (answered) return;
    answered = true;
    const steps = document.getElementById('steps');
    steps.innerHTML = q.method;
    steps.style.display = 'block';
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentIndex++;
    load();
}

window.onload = load;
</script>
</body>
</html>
