<script>
    function toggleMenu() { document.getElementById('menuList').classList.toggle('active'); }

    const destinationsAfrica = [
    { title: "South Africa", caption: "The Cape of Good Hope", image: "Images/Countries/025-south-africa.jpg", link: "Countries/southafrica.html", color: "white" },
    { title: "Lesotho", caption: "The Kingdom in the Sky", image: "Images/Countries/026-lesotho.jpg", link: "Countries/lesotho.html", color: "white" },
    { title: "Eswatini", caption: "Traditions of the Valley", image: "Images/Countries/027-eswatini.jpg", link: "Countries/eswatini.html", color: "white" },
    { title: "Mozambique", caption: "Indian Ocean Untamed", image: "Images/Countries/028-mozambique.jpg", link: "Countries/mozambique.html", color: "white" },
    { title: "Zimbabwe", caption: "Smoke That Thunders", image: "Images/Countries/029-zimbabwe.jpg", link: "Countries/zimbabwe.html", color: "white" },
    { title: "Zambia", caption: "Heart of the Zambezi", image: "Images/Countries/030-zambia.jpg", link: "Countries/zambia.html", color: "white" },
    { title: "Botswana", caption: "Okavango Delta", image: "Images/Countries/031-botswana.jpg", link: "Countries/botswana.html", color: "white" },
    { title: "Namibia", caption: "Dunes of Sossusvlei", image: "Images/Countries/032-namibia.jpg", link: "Countries/namibia.html", color: "white" },
    { title: "Morocco", caption: "Medinas and Magic", image: "Images/Countries/065-morocco.jpg", link: "Countries/morocco.html", color: "white" },
    { title: "Tunisia", caption: "The Gem of Africa", image: "Images/Countries/067-tunisia.jpg", link: "Countries/tunisia.html", color: "white" },
    { title: "Egypt", caption: "Pyramids and Pharaohs", image: "Images/Countries/069-egypt.jpg", link: "Countries/egypt.html", color: "white" },
    { title: "South Sudan", caption: "The Youngest Nation", image: "Images/Countries/071-south-sudan.jpg", link: "Countries/southsudan.html", color: "white" },
    { title: "Ethiopia", caption: "Cradle of Humanity", image: "Images/Countries/105-ethiopia.jpg", link: "Countries/ethiopia.html", color: "white" },
    { title: "Kenya", caption: "The Great Migration", image: "Images/Countries/109-kenya.jpg", link: "Countries/kenya.html", color: "white" },
    { title: "Uganda", caption: "Pearl of Africa", image: "Images/Countries/110-uganda.jpg", link: "Countries/uganda.html", color: "white" },
    { title: "Rwanda", caption: "Land of a Thousand Hills", image: "Images/Countries/111-rwanda.jpg", link: "Countries/rwanda.html", color: "white" },
    { title: "Burundi", caption: "Heart of Africa", image: "Images/Countries/112-burundi.jpg", link: "Countries/burundi.html", color: "white" },
    { title: "Democratic Republic of Congo", caption: "Heart of Darkness", image: "Images/Countries/138-democratic-republic-of-congo.jpg", link: "Countries/democraticrepublicofcongo.html", color: "white" },
    { title: "Seychelles", caption: "Granite and Turquoise", image: "Images/Countries/193-seychelles.jpg", link: "Countries/seychelles.html", color: "white" },
    { title: "Tanzania", caption: "Serengeti Stars", image: "Images/Countries/194-tanzania.jpg", link: "Countries/tanzania.html", color: "white" },
    { title: "Malawi", caption: "The Warm Heart of Africa", image: "Images/Countries/195-malawi.jpg", link: "Countries/malawi.html", color: "white" },
    { title: "Comoros", caption: "Perfume Isles", image: "Images/Countries/196-comoros.jpg", link: "Countries/comoros.html", color: "white" },
    { title: "Madagascar", caption: "Baobabs and Lemurs", image: "Images/Countries/197-madagascar.jpg", link: "Countries/madagascar.html", color: "white" },
    { title: "Mauritius", caption: "Island of Sugar", image: "Images/Countries/198-mauritius.jpg", link: "Countries/mauritius.html", color: "white" }
    ];

    const visitedPlacesAfrica = [
        "🇿🇦 South Africa", "🇱🇸 Lesotho", "🇸🇿 Eswatini", "🇲🇿 Mozambique", "🇿🇼 Zimbabwe", 
        "🇿🇲 Zambia", "🇧🇼 Botswana", "🇳🇦 Namibia", "🇲🇦 Morocco", "🇹🇳 Tunisia", 
        "🇪🇬 Egypt", "🇸🇸 South Sudan", "🇪🇹 Ethiopia", "🇰🇪 Kenya", "🇺🇬 Uganda", 
        "🇷🇼 Rwanda", "🇧🇮 Burundi", "🇨🇩 Democratic Republic of Congo", "🇸🇨 Seychelles", 
        "🇹🇿 Tanzania", "🇲🇼 Malawi", "🇰🇲 Comoros", "🇲🇬 Madagascar", "🇲🇺 Mauritius"
    ];

    function buildLayout() {
        const shuffled = [...destinationsAfrica].sort(() => 0.5 - Math.random());
        const fullSection = document.getElementById('full-section');
        const splitSection = document.getElementById('split-section');

        shuffled.slice(0, 3).forEach(item => {
            const block = document.createElement('a');
            block.className = 'cover-block full-height';
            block.href = item.link;
            block.style.backgroundImage = `url('${item.image}')`;
            block.innerHTML = `
                <div class="text-box">
                    <h1 style="color: ${item.color}">${item.title}</h1>
                    <h3 style="color: ${item.color}">${item.caption}</h3>
                    <p style="color: ${item.color}">Read more ></p>
                </div>
            `;
            fullSection.appendChild(block);
        });

        shuffled.slice(3, 9).forEach(item => {
            const block = document.createElement('a');
            block.className = 'cover-block split-height';
            block.href = item.link;
            block.style.backgroundImage = `url('${item.image}')`;
            block.innerHTML = `
                <div class="text-box">
                    <h2 style="color: ${item.color}">${item.title}</h2>
                    <p style="color: ${item.color}">${item.caption}</p>
                    <p style="color: ${item.color}; font-size: 12px;">Read more ></p>
                </div>
            `;
            splitSection.appendChild(block);
        });

        const placesGrid = document.getElementById('placesGrid');
        
        visitedPlacesAfrica.forEach(place => {
            const fileBase = place.toLowerCase().replace(/[^a-z0-9]/g, '');
            const link = document.createElement('a');
            link.href = "Countries/" + fileBase + ".html";
            link.className = 'place-tag';
            link.innerText = place;
            placesGrid.appendChild(link);
        });
    }

    window.onload = buildLayout;
</script>
