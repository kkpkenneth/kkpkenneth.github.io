<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini API Chatbot</title>
<style>
  :root {
    --primary: #10a37f; 
    --bg-color: #f4f7f6;
    --panel-bg: #ffffff;
    --text-color: #2d3748;
    --bot-msg-bg: #e2e8f0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }

  .app-container {
    width: 100%;
    max-width: 400px;
    background: var(--panel-bg);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- Security Config Panel --- */
  .config-panel {
    background: #2d3748;
    padding: 10px 15px;
    display: flex;
    gap: 10px;
  }

  .config-panel input {
    flex: 1;
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    font-size: 12px;
    outline: none;
    background: #edf2f7;
  }

  /* --- Visualization Panel --- */
  .face-panel {
    background: var(--primary);
    padding: 30px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .avatar {
    width: 100px;
    height: 100px;
    background: #fbd38d;
    border-radius: 50%;
    position: relative;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }

  .eye {
    width: 14px;
    height: 14px;
    background: #2d3748;
    border-radius: 50%;
    position: absolute;
    top: 35%;
  }

  .eye.left { left: 25%; }
  .eye.right { right: 25%; }

  .mouth {
    width: 36px;
    height: 6px;
    background: #9b2c2c;
    position: absolute;
    bottom: 25%;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 3px 3px 15px 15px;
    transition: all 0.1s ease;
  }

  /* Talking Animation */
  .talking .mouth {
    animation: chatter 0.2s infinite alternate;
  }

  @keyframes chatter {
    0% { height: 6px; border-radius: 3px 3px 15px 15px; }
    100% { height: 24px; border-radius: 12px 12px 24px 24px; }
  }

  /* Thinking Animation */
  .thinking {
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: inset -5px -5px 15px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.2); }
    50% { transform: scale(1.05); box-shadow: inset -5px -5px 15px rgba(0,0,0,0.15), 0 0 25px rgba(255, 255, 255, 0.8); }
    100% { transform: scale(1); box-shadow: inset -5px -5px 15px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.2); }
  }

  /* --- Chat Interface --- */
  .chat-window {
    height: 350px;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    max-width: 85%;
    padding: 10px 15px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.4;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .user-msg {
    background: var(--primary);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }

  .bot-msg {
    background: var(--bot-msg-bg);
    color: var(--text-color);
    align-self: flex-start;
    border-bottom-left-radius: 2px;
  }
  
  .typing-indicator {
    font-style: italic;
    color: #718096;
    background: transparent;
    padding: 5px 15px;
  }

  /* --- Controls --- */
  .voice-controls {
    padding: 10px 15px;
    background: var(--panel-bg);
    border-top: 1px solid #edf2f7;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  
  .voice-controls select {
    flex: 1;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid #cbd5e0;
    outline: none;
    font-size: 13px;
    background: var(--bg-color);
  }

  .input-area {
    display: flex;
    padding: 15px;
    background: var(--panel-bg);
    border-top: 1px solid #edf2f7;
  }

  .input-area input {
    flex: 1;
    padding: 12px;
    border: 1px solid #cbd5e0;
    border-radius: 20px;
    outline: none;
    font-size: 14px;
  }

  .input-area button {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 20px;
    margin-left: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }

  .input-area button:hover {
    background: #0d8a6a;
  }
</style>
</head>
<body>

<div class="app-container">
  
  <div class="config-panel">
    <input type="password" id="apiKeyInput" placeholder="Paste your Gemini API Key here...">
  </div>

  <div class="face-panel">
    <div class="avatar" id="avatarFace">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth" id="avatarMouth"></div>
    </div>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="message bot-msg">Hello! Paste your API key at the top, then ask me anything!</div>
  </div>

  <div class="voice-controls">
    <label for="voiceSelect" style="font-size: 13px; font-weight: bold;">Voice:</label>
    <select id="voiceSelect">
      <option>Loading voices...</option>
    </select>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask me something..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
  const chatWindow = document.getElementById('chatWindow');
  const userInput = document.getElementById('userInput');
  const avatarFace = document.getElementById('avatarFace');
  const voiceSelect = document.getElementById('voiceSelect');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const synth = window.speechSynthesis;
  let voices = [];

  // --- Voice Loading Logic ---
  function populateVoiceList() {
    voices = synth.getVoices();
    voiceSelect.innerHTML = '';
    
    if (voices.length === 0) {
      voiceSelect.innerHTML = '<option>No voices available</option>';
      return;
    }

    voices.forEach((voice, i) => {
      const option = document.createElement('option');
      option.textContent = `${voice.name} (${voice.lang})`;
      option.value = i;
      
      if (voice.default) {
        option.selected = true;
      }
      
      voiceSelect.appendChild(option);
    });
  }

  populateVoiceList();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = populateVoiceList;
  }

  // --- Chat Logic ---
  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      sendMessage();
    }
  }

  async function fetchGeminiResponse(prompt) {
    // Dynamically grab the key from the input field
    const currentKey = apiKeyInput.value.trim();
    
    if (!currentKey) {
      return "⚠️ Please paste your Gemini API Key into the dark box at the top of the screen before sending a message.";
    }

    // Updated to standard 1.5-flash endpoint
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`;

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();
      return data.candidates[0].content.parts[0].text; 

    } catch (error) {
      console.error("API Error:", error);
      return "Sorry, there was an error connecting to the API. Double-check your API key and ensure you are running this on a local server.";
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (text === '') return;

    if (synth.speaking) synth.cancel();

    // 1. Post User Message
    appendMessage(text, 'user-msg');
    userInput.value = '';

    // 2. Visual "Thinking" State
    avatarFace.classList.add('thinking');
    const typingId = 'typing-' + Date.now();
    appendMessage('...', 'message typing-indicator', typingId);

    // 3. Call the API
    const replyText = await fetchGeminiResponse(text);

    // 4. Restore Visual State and Reply
    avatarFace.classList.remove('thinking');
    const typingElement = document.getElementById(typingId);
    if (typingElement) typingElement.remove();

    appendMessage(replyText, 'bot-msg');
    speakText(replyText);
  }

  function appendMessage(text, className, id = null) {
    const msgDiv = document.createElement('div');
    msgDiv.className = className.includes('message') ? className : `message ${className}`;
    if (id) msgDiv.id = id;
    msgDiv.textContent = text;
    chatWindow.appendChild(msgDiv);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function speakText(text) {
    if (synth.speaking) return;

    const cleanText = text.replace(/[*#]/g, '');
    const utterThis = new SpeechSynthesisUtterance(cleanText);
    
    const selectedVoiceIndex = voiceSelect.value;
    if (voices[selectedVoiceIndex]) {
      utterThis.voice = voices[selectedVoiceIndex];
    }
    
    utterThis.onstart = () => avatarFace.classList.add('talking');
    utterThis.onend = () => avatarFace.classList.remove('talking');
    utterThis.onerror = () => avatarFace.classList.remove('talking');

    synth.speak(utterThis);
  }
</script>

</body>
</html>
