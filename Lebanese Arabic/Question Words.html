<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WH Words & Phrases Quiz - Lebanese Arabic</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #fff8f0, #e0f0ff);
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    margin: 20px 0;
    color: #2c3e50;
  }
  .card {
    background: white;
    padding: 20px 30px;
    margin: 15px 0;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    width: 90%;
    max-width: 700px;
    text-align: center;
  }
  #quiz-wh {
    font-size: 45px;
    margin: 20px 0;
    color: #e67e22;
    font-weight: bold;
  }
  #choices button {
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    margin: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
  }
  #choices button:hover {
    background-color: #2980b9;
    transform: scale(1.05);
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    font-size: 18px;
  }
  .row:last-child { border-bottom: none; }
  .roman { font-size: 22px; font-weight: bold; color: #34495e; }
  .english { font-size: 16px; color: #2c3e50; }
  @media (max-width: 500px) {
    #quiz-wh { font-size: 35px; }
    .row { font-size: 16px; }
    #choices button { font-size: 14px; padding: 10px 14px; }
  }
</style>
</head>
<body>

<h1>WH Words & Phrases Quiz - Lebanese Arabic</h1>

<div class="card">
  <h2>Guess the Meaning</h2>
  <div id="quiz-wh">wīn</div>
  <div id="choices"></div>
</div>

<div class="card">
  <h2>WH Words & Phrases Reference</h2>
  <div class="row"><span class="roman">wīn</span> <span class="english">Where</span></div>
  <div class="row"><span class="roman">shū</span> <span class="english">What</span></div>
  <div class="row"><span class="roman">miin</span> <span class="english">Who</span></div>
  <div class="row"><span class="roman">kēf</span> <span class="english">How</span></div>
  <div class="row"><span class="roman">emta</span> <span class="english">When</span></div>
  <div class="row"><span class="roman">leš</span> <span class="english">Why</span></div>
  <div class="row"><span class="roman">shu-fri?</span> <span class="english">What’s up?/How are you?</span></div>
  <div class="row"><span class="roman">wīn el-maktab?</span> <span class="english">Where is the office?</span></div>
  <div class="row"><span class="roman">miin hayda?</span> <span class="english">Who is this?</span></div>
  <div class="row"><span class="roman">kēf hal-shaghle?</span> <span class="english">How’s the work?</span></div>
</div>

<script>
const whPhrases = [
  { roman: "wīn", meaning: "Where" },
  { roman: "shū", meaning: "What" },
  { roman: "miin", meaning: "Who" },
  { roman: "kēf", meaning: "How" },
  { roman: "emta", meaning: "When" },
  { roman: "leš", meaning: "Why" },
  { roman: "shu-fri?", meaning: "What’s up?/How are you?" },
  { roman: "wīn el-maktab?", meaning: "Where is the office?" },
  { roman: "miin hayda?", meaning: "Who is this?" },
  { roman: "kēf hal-shaghle?", meaning: "How’s the work?" }
];

let correctAnswer = null;

function newQuestion() {
  const qIndex = Math.floor(Math.random() * whPhrases.length);
  correctAnswer = whPhrases[qIndex];

  let options = [correctAnswer];
  while (options.length < 4) {
    let r = whPhrases[Math.floor(Math.random() * whPhrases.length)];
    if (!options.includes(r)) options.push(r);
  }

  options.sort(() => Math.random() - 0.5);

  document.getElementById("quiz-wh").innerHTML = correctAnswer.roman;
  const box = document.getElementById("choices");
  box.innerHTML = "";

  options.forEach(opt => {
    let btn = document.createElement("button");
    btn.innerHTML = `${opt.meaning}`;
    btn.onclick = () => {
      if(opt === correctAnswer){
        alert("✅ Correct!");
      } else {
        alert(`❌ Wrong! Correct answer: ${correctAnswer.meaning}`);
      }
      newQuestion();
    };
    box.appendChild(btn);
  });
}

window.onload = newQuestion;
</script>

</body>
</html>
