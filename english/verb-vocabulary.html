<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Verbs: Cantonese to English Quiz</title>
    <style>
        :root {
            --primary: #c0392b;
            --primary-hover: #e74c3c;
            --secondary: #f39c12;
            --success: #27ae60;
            --danger: #c0392b;
            --dark: #2c3e50;
            --light: #fdfefe;
            --white: #ffffff;
            --gray: #bdc3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--white);
            max-width: 800px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .quiz-header {
            background-color: var(--primary);
            color: var(--white);
            padding: 25px 20px;
            text-align: center;
            position: relative;
        }

        .quiz-header h2 {
            margin-bottom: 10px;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .settings-bar {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: inline-block;
            margin-top: 10px;
        }

        .settings-bar label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-container {
            width: 100%;
            background-color: rgba(255,255,255,0.3);
            height: 6px;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-body {
            padding: 40px 30px;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #7f8c8d;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .vocab-display {
            text-align: center;
            margin-bottom: 40px;
        }

        .chinese-word {
            font-size: 5rem;
            font-weight: bold;
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .tts-btn-large {
            background: none;
            border: 2px solid var(--gray);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tts-btn-large:hover {
            background: var(--light);
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .chinese-word { font-size: 4rem; }
        }

        .option-btn {
            background-color: var(--light);
            border: 2px solid var(--gray);
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #fdedec;
            border-color: var(--primary);
        }

        .option-btn.correct {
            background-color: var(--success);
            border-color: var(--success);
            color: var(--white);
        }

        .option-btn.incorrect {
            background-color: var(--danger);
            border-color: var(--danger);
            color: var(--white);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .tts-btn-small {
            background: rgba(0,0,0,0.05);
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn.correct .tts-btn-small,
        .option-btn.incorrect .tts-btn-small {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .tts-btn-small:hover {
            background: rgba(0,0,0,0.15);
            transform: scale(1.1);
        }

        .feedback {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 25px;
            min-height: 30px;
        }

        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--danger); }

        .quiz-footer {
            padding: 20px 30px;
            background-color: var(--light);
            text-align: right;
            border-top: 1px solid #eee;
        }

        .next-btn, .start-btn {
            background-color: var(--secondary);
            color: var(--white);
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .next-btn { display: none; }
        .next-btn:hover, .start-btn:hover { background-color: #e67e22; }

        #start-screen {
            text-align: center;
            padding: 60px 30px;
        }

        #start-screen p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #555;
        }

        .results-container {
            text-align: center;
            padding: 50px 30px;
            display: none;
        }

        .results-score {
            font-size: 4.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        
        <!-- Start Screen (To require user gesture for Audio API) -->
        <div id="start-screen">
            <h1 style="color: var(--primary); font-size: 2.5rem; margin-bottom: 15px;">100 Essential Verbs</h1>
            <h2>Cantonese &rarr; English</h2>
            <p>Master 100 of the most common verbs. Click the speaker icons to hear pronunciations.</p>
            <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
        </div>

        <!-- Interactive Quiz Area -->
        <div id="quiz-area" style="display: none;">
            <div class="quiz-header">
                <h2>Vocabulary Quiz</h2>
                <div class="settings-bar">
                    <label>
                        <input type="checkbox" id="auto-tts" checked>
                        Auto-play Cantonese word on new question
                    </label>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>

            <div class="quiz-body">
                <div class="question-meta">
                    <span id="question-counter">Question 1 of 100</span>
                    <span id="score-counter">Score: 0</span>
                </div>
                
                <div class="vocab-display">
                    <div class="chinese-word">
                        <span id="target-word">載入中...</span>
                        <button class="tts-btn-large" id="main-tts-btn" title="Listen to Cantonese">🔊</button>
                    </div>
                </div>

                <div class="options-grid" id="options-grid">
                    <!-- Buttons injected via JS -->
                </div>

                <div class="feedback" id="feedback"></div>
            </div>

            <div class="quiz-footer">
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Word &rarr;</button>
            </div>
        </div>

        <!-- Results Area -->
        <div class="results-container" id="results-area">
            <h2 style="font-size: 2.5rem;">Quiz Complete!</h2>
            <div class="results-score" id="final-score">0 / 100</div>
            <p style="font-size: 1.2rem; margin-bottom: 30px; color: #555;" id="final-msg">Great effort!</p>
            <button class="start-btn" onclick="location.reload()">Restart Quiz</button>
        </div>

    </div>

    <script>
        // 100 Common Verb Vocabulary List (Traditional Chinese characters)
        const vocabList = [
            { zh: "吃", en: "Eat" }, { zh: "喝", en: "Drink" }, { zh: "跑", en: "Run" }, { zh: "走", en: "Walk" }, { zh: "睡", en: "Sleep" },
            { zh: "讀", en: "Read" }, { zh: "寫", en: "Write" }, { zh: "聽", en: "Listen" }, { zh: "說", en: "Speak" }, { zh: "看", en: "See" },
            { zh: "買", en: "Buy" }, { zh: "賣", en: "Sell" }, { zh: "穿", en: "Wear" }, { zh: "開", en: "Open" }, { zh: "關", en: "Close" },
            { zh: "來", en: "Come" }, { zh: "去", en: "Go" }, { zh: "做", en: "Do" }, { zh: "想", en: "Think" }, { zh: "知道", en: "Know" },
            { zh: "愛", en: "Love" }, { zh: "喜歡", en: "Like" }, { zh: "討厭", en: "Hate" }, { zh: "幫忙", en: "Help" }, { zh: "問", en: "Ask" },
            { zh: "回答", en: "Answer" }, { zh: "給", en: "Give" }, { zh: "拿", en: "Take" }, { zh: "找", en: "Find" }, { zh: "失去", en: "Lose" },
            { zh: "學習", en: "Learn" }, { zh: "教", en: "Teach" }, { zh: "工作", en: "Work" }, { zh: "玩", en: "Play" }, { zh: "唱", en: "Sing" },
            { zh: "跳舞", en: "Dance" }, { zh: "洗", en: "Wash" }, { zh: "打掃", en: "Clean" }, { zh: "煮", en: "Cook" }, { zh: "等", en: "Wait" },
            { zh: "站", en: "Stand" }, { zh: "坐", en: "Sit" }, { zh: "飛", en: "Fly" }, { zh: "游泳", en: "Swim" }, { zh: "停", en: "Stop" },
            { zh: "開始", en: "Start" }, { zh: "結束", en: "Finish" }, { zh: "嘗試", en: "Try" }, { zh: "用", en: "Use" }, { zh: "保持", en: "Keep" },
            { zh: "改變", en: "Change" }, { zh: "移動", en: "Move" }, { zh: "住", en: "Live" }, { zh: "死", en: "Die" }, { zh: "需要", en: "Need" },
            { zh: "想要", en: "Want" }, { zh: "希望", en: "Hope" }, { zh: "相信", en: "Believe" }, { zh: "忘記", en: "Forget" }, { zh: "記得", en: "Remember" },
            { zh: "叫", en: "Call" }, { zh: "發送", en: "Send" }, { zh: "收到", en: "Receive" }, { zh: "付款", en: "Pay" }, { zh: "花費", en: "Cost" },
            { zh: "建築", en: "Build" }, { zh: "破壞", en: "Destroy" }, { zh: "剪", en: "Cut" }, { zh: "打破", en: "Break" }, { zh: "修理", en: "Fix" },
            { zh: "畫", en: "Draw" }, { zh: "塗", en: "Paint" }, { zh: "微笑", en: "Smile" }, { zh: "笑", en: "Laugh" }, { zh: "哭", en: "Cry" },
            { zh: "喊", en: "Shout" }, { zh: "耳語", en: "Whisper" }, { zh: "推", en: "Push" }, { zh: "拉", en: "Pull" }, { zh: "扔", en: "Throw" },
            { zh: "抓", en: "Catch" }, { zh: "掉", en: "Fall" }, { zh: "丟", en: "Drop" }, { zh: "握", en: "Hold" }, { zh: "攜帶", en: "Carry" },
            { zh: "帶來", en: "Bring" }, { zh: "展示", en: "Show" }, { zh: "隱藏", en: "Hide" }, { zh: "觸摸", en: "Touch" }, { zh: "感覺", en: "Feel" },
            { zh: "聞", en: "Smell" }, { zh: "嚐", en: "Taste" }, { zh: "咬", en: "Bite" }, { zh: "嚼", en: "Chew" }, { zh: "吞", en: "Swallow" },
            { zh: "擁抱", en: "Hug" }, { zh: "親吻", en: "Kiss" }, { zh: "踢", en: "Kick" }, { zh: "打", en: "Hit" }, { zh: "打架", en: "Fight" }
        ];

        let quizSequence = [];
        let currentIndex = 0;
        let currentScore = 0;

        const targetWordEl = document.getElementById('target-word');
        const mainTtsBtn = document.getElementById('main-tts-btn');
        const optionsGridEl = document.getElementById('options-grid');
        const nextBtnEl = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');
        const questionCounterEl = document.getElementById('question-counter');
        const scoreCounterEl = document.getElementById('score-counter');
        const progressBarEl = document.getElementById('progress-bar');
        const autoTtsCheckbox = document.getElementById('auto-tts');

        // Text-to-Speech Engine
        const synth = window.speechSynthesis;

        function speak(text, lang) {
            // Cancel any ongoing speech to avoid overlapping
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang; // 'zh-HK' for Cantonese, 'en-US' for English
            utterance.rate = 0.9;  // Slightly slower for learning
            synth.speak(utterance);
        }

        function shuffle(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // Generate exactly 4 options (1 correct, 3 random incorrect)
        function generateOptions(correctAnswer) {
            let allEnglishWords = vocabList.map(v => v.en);
            let incorrectPool = allEnglishWords.filter(en => en !== correctAnswer);
            shuffle(incorrectPool);
            
            let options = [correctAnswer, incorrectPool[0], incorrectPool[1], incorrectPool[2]];
            return shuffle(options);
        }

        function startQuiz() {
            // Unlock audio context on first user click
            speak("", "en-US");

            // Prepare the 100 questions sequence (shuffled)
            quizSequence = shuffle([...vocabList]);
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            
            loadQuestion();
        }

        function loadQuestion() {
            // Reset UI
            feedbackEl.innerText = "";
            feedbackEl.className = "feedback";
            nextBtnEl.style.display = "none";
            optionsGridEl.innerHTML = "";

            const qData = quizSequence[currentIndex];
            
            // Set Chinese Word
            targetWordEl.innerText = qData.zh;
            // Using zh-HK ensures the TTS uses a Cantonese voice profile
            mainTtsBtn.onclick = () => speak(qData.zh, 'zh-HK');

            // Auto-play Cantonese Audio if checked
            if (autoTtsCheckbox.checked) {
                speak(qData.zh, 'zh-HK');
            }

            // Update Meta info
            questionCounterEl.innerText = `Question ${currentIndex + 1} of ${quizSequence.length}`;
            scoreCounterEl.innerText = `Score: ${currentScore}`;
            progressBarEl.style.width = `${(currentIndex / quizSequence.length) * 100}%`;

            // Generate & Render English Buttons
            const currentOptions = generateOptions(qData.en);

            currentOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                // Add Word Text
                const textSpan = document.createElement('span');
                textSpan.innerText = opt;
                btn.appendChild(textSpan);

                // Add TTS Speaker icon for the english word
                const ttsSmallBtn = document.createElement('button');
                ttsSmallBtn.className = 'tts-btn-small';
                ttsSmallBtn.innerText = '🔊';
                ttsSmallBtn.title = "Listen to English";
                ttsSmallBtn.onclick = (e) => {
                    e.stopPropagation(); // Prevent the main button click event
                    speak(opt, 'en-US');
                };
                btn.appendChild(ttsSmallBtn);

                // Handle Answer Selection
                btn.onclick = () => selectOption(opt, btn, qData.en);
                
                optionsGridEl.appendChild(btn);
            });
        }

        function selectOption(selected, btnEl, correct) {
            const allBtns = document.querySelectorAll('.option-btn');
            
            // Disable all buttons immediately after selection
            allBtns.forEach(btn => btn.disabled = true);

            if (selected === correct) {
                btnEl.classList.add('correct');
                feedbackEl.innerText = "Correct! (正確)";
                feedbackEl.className = "feedback success";
                currentScore++;
            } else {
                btnEl.classList.add('incorrect');
                feedbackEl.innerText = `Incorrect. The correct answer is: ${correct}`;
                feedbackEl.className = "feedback error";
                
                // Highlight the correct answer
                allBtns.forEach(btn => {
                    if (btn.querySelector('span').innerText === correct) {
                        btn.classList.add('correct');
                    }
                });
            }

            scoreCounterEl.innerText = `Score: ${currentScore}`;
            
            if (currentIndex === quizSequence.length - 1) {
                nextBtnEl.innerHTML = "See Results &rarr;";
            } else {
                nextBtnEl.innerHTML = "Next Word &rarr;";
            }
            
            nextBtnEl.style.display = "inline-block";
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < quizSequence.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('results-area').style.display = 'block';
            
            document.getElementById('final-score').innerText = `${currentScore} / ${quizSequence.length}`;
            
            const msgEl = document.getElementById('final-msg');
            const percentage = (currentScore / quizSequence.length) * 100;
            
            if (percentage >= 90) {
                msgEl.innerText = "Outstanding! You have mastered these Cantonese verbs!";
            } else if (percentage >= 70) {
                msgEl.innerText = "Great job! Your vocabulary is very strong.";
            } else if (percentage >= 50) {
                msgEl.innerText = "Good effort. Keep practicing to memorize the tricky ones.";
            } else {
                msgEl.innerText = "Keep studying! Use the audio buttons to help you memorize the meanings.";
            }
        }
    </script>
</body>
</html>
