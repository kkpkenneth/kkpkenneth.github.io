<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Species Quiz</title>
    <style>
        :root {
            --primary: #ffcb05;
            --secondary: #3b4cca;
            --background: #f0f0f0;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --locked: #cccccc;
            --success: #4caf50;
            --danger: #f44336;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            min-height: 80vh;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Screens */
        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s ease-in-out;
        }
        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 {
            color: var(--secondary);
            margin-bottom: 1.5rem;
        }

        button {
            background-color: var(--primary);
            color: var(--secondary);
            border: 2px solid var(--secondary);
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0.5rem;
            width: 100%;
            max-width: 300px;
        }
        button:hover {
            transform: scale(1.05);
            background-color: #ffde59;
        }
        button:disabled {
            background-color: var(--locked);
            border-color: #999;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        /* Level Selection Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            width: 100%;
        }
        .level-btn {
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Quiz UI */
        .pokemon-number {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--secondary);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .sprite-container {
            width: 200px;
            height: 200px;
            background-color: #e0e0e0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            border: 5px solid var(--secondary);
        }
        .sprite-container img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }
        
        /* Pokemon Types */
        .types-container {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .type-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Official Pokemon Type Colors */
        .type-normal { background-color: #A8A77A; }
        .type-fire { background-color: #EE8130; }
        .type-water { background-color: #6390F0; }
        .type-electric { background-color: #F7D02C; }
        .type-grass { background-color: #7AC74C; }
        .type-ice { background-color: #96D9D6; }
        .type-fighting { background-color: #C22E28; }
        .type-poison { background-color: #A33EA1; }
        .type-ground { background-color: #E2BF65; }
        .type-flying { background-color: #A98FF3; }
        .type-psychic { background-color: #F95587; }
        .type-bug { background-color: #A6B91A; }
        .type-rock { background-color: #B6A136; }
        .type-ghost { background-color: #735797; }
        .type-dragon { background-color: #6F35FC; }
        .type-dark { background-color: #705746; }
        .type-steel { background-color: #B7B7CE; }
        .type-fairy { background-color: #D685AD; }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
        }
        
        .options-grid button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .options-grid button small {
            font-size: 0.85rem;
            font-weight: normal;
        }

        .progress {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-weight: bold;
            color: var(--secondary);
        }

        /* Loader */
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid var(--secondary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<audio id="bgm" src="pokemon-bgm.mp3" loop></audio>

<div class="container">
    
    <div id="start-screen" class="screen active">
        <h1>Pokémon Species Quiz</h1>
        <p style="margin-bottom: 2rem;">Test your knowledge! Can you guess the true species category for all 1025 Pokémon?</p>
        <button onclick="goToLevels()">Start Game</button>
    </div>

    <div id="level-screen" class="screen">
        <h2>Select Generation</h2>
        <div class="grid" id="level-grid"></div>
        <button onclick="showScreen('start-screen')" style="margin-top: 2rem; max-width: 200px;">Back</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="progress" id="quiz-progress">1 / 10</div>
        
        <div id="loading-indicator" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 300px;">
            <div class="loader"></div>

        </div>

        <div id="quiz-content" style="display: flex; flex-direction: column; align-items: center; width: 100%;">

            <div class="sprite-container">

            </div>
            <div id="pokemon-types" class="types-container"></div>
            <div class="question-text" id="question-text">What Pokemon is Pikachu?</div>
            <div class="options-grid" id="options-grid"></div>
        </div>
    </div>

    <div id="result-screen" class="screen">

        <p id="result-message" style="margin-bottom: 2rem;"></p>

    function init() {
        loadSaveData();
    }

    function loadSaveData() {
        const saved = localStorage.getItem('pokeQuizSave');
        if (saved) {
            unlockedGens = JSON.parse(saved).unlockedGens;
        }
    }

    function saveProgress(genCompleted) {
        if (genCompleted >= unlockedGens && genCompleted < 9) {
            unlockedGens = genCompleted + 1;
            localStorage.setItem('pokeQuizSave', JSON.stringify({ unlockedGens: unlockedGens }));
        }
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.speechSynthesis.cancel(); 
    }

    function goToLevels() {
        const bgm = document.getElementById('bgm');
        if (bgm.paused) {
            bgm.volume = 0.25; 
            bgm.play().catch(e => console.log("Audio play blocked by browser:", e));
        }

        const grid = document.getElementById('level-grid');
        grid.innerHTML = '';

        GENERATIONS.forEach(g => {
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            const isUnlocked = g.gen <= unlockedGens;
            
            btn.innerHTML = `Gen ${g.gen}<br><small>${g.name}</small>`;
            btn.disabled = !isUnlocked;
            
            if (isUnlocked) {
                btn.onclick = () => startQuiz(g.gen);
            }
            grid.appendChild(btn);
        });

        showScreen('level-screen');
    }

    function startQuiz(gen) {
        currentGen = gen;
        score = 0;
        currentQuestionIndex = 0;
        
        const genData = GENERATIONS.find(g => g.gen === gen);
        
        let pool = [];
        for(let i = genData.start; i <= genData.end; i++) pool.push(i);
        pool = shuffleArray(pool).slice(0, QUESTIONS_PER_LEVEL);
        
        quizQueue = pool;
        showScreen('quiz-screen');
        loadNextQuestion();
    }

    async function loadNextQuestion() {
        if (currentQuestionIndex >= quizQueue.length) {
            endQuiz();
            return;
        }

        document.getElementById('quiz-progress').innerText = `${currentQuestionIndex + 1} / ${QUESTIONS_PER_LEVEL}`;
        
        document.getElementById('quiz-content').style.display = 'none';
        document.getElementById('loading-indicator').style.display = 'flex';

        const pokemonId = quizQueue[currentQuestionIndex];

        try {
            const displayId = pokemonId.toString().padStart(3, '0');
            document.getElementById('pokemon-number').innerText = `#${displayId}`;

            const speciesResponse = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${pokemonId}`);
            const speciesData = await speciesResponse.json();

            const pokemonResponse = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
            const pokemonData = await pokemonResponse.json();

            const typesContainer = document.getElementById('pokemon-types');
            typesContainer.innerHTML = '';
            pokemonData.types.forEach(t => {
                const typeName = t.type.name;
                const typeSpan = document.createElement('span');
                typeSpan.innerText = typeName;
                typeSpan.className = `type-badge type-${typeName}`;
                typesContainer.appendChild(typeSpan);
            });

            const nameEntryEn = speciesData.names.find(n => n.language.name === 'en');
            const nameEn = nameEntryEn ? nameEntryEn.name : speciesData.name;

            const nameEntryZh = speciesData.names.find(n => n.language.name === 'zh-Hant') || speciesData.names.find(n => n.language.name === 'zh-Hans');
            const nameZh = nameEntryZh ? nameEntryZh.name : "";
            const displayQuestionName = nameZh ? `${nameEn} (${nameZh})` : nameEn;

            // PULL FROM OFFLINE ID DICTIONARY
            let dictEntry = GENUS_DICT_BY_ID[pokemonId];
            
            // Setup English
            let finalEn = "";
            if (dictEntry && dictEntry.en && dictEntry.en.trim() !== "") {
                finalEn = dictEntry.en;
            } else {
                const genusEntryEn = speciesData.genera.find(g => g.language.name === 'en');
                finalEn = genusEntryEn ? genusEntryEn.genus.replace(/ Pok[eé]mon/i, '').trim() : "Unknown";
            }

            // Setup Chinese
            let finalZh = "";
            if (dictEntry && dictEntry.zh && dictEntry.zh.trim() !== "") {
                finalZh = dictEntry.zh;
            } else {
                finalZh = `未定義 (${finalEn})`; // Warning text if you forgot to add the translation
            }

            currentCorrectAnswer = { en: finalEn, zh: finalZh };

            const spriteUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemonId}.png`;

            let options = generateOptions(currentCorrectAnswer);

            document.getElementById('pokemon-sprite').src = spriteUrl;
            document.getElementById('question-text').innerHTML = `What Pokemon is <strong>${displayQuestionName}</strong>?`;
            
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerHTML = `<span>${opt.en}</span><small>${opt.zh}</small>`;
                btn.onclick = () => handleAnswer(opt.en === currentCorrectAnswer.en, nameEn);
                optionsGrid.appendChild(btn);
            });

            document.getElementById('loading-indicator').style.display = 'none';
            document.getElementById('quiz-content').style.display = 'flex';

            if (SPEECH_ENABLED) {
                speakText(`What Pokemon is ${nameEn}?`);
            }

        } catch (error) {
            console.error("Failed to load Pokémon data", error);
            document.getElementById('question-text').innerText = "Error loading data. Retrying...";
            setTimeout(loadNextQuestion, 2000);
        }
    }

    function generateOptions(correctAnswer) {
        let optionsMap = new Map();
        optionsMap.set(correctAnswer.en, correctAnswer);
        
        while(optionsMap.size < 4) {
            let randomWrong = FALLBACK_GENERA[Math.floor(Math.random() * FALLBACK_GENERA.length)];
            if(!optionsMap.has(randomWrong.en)) {
                optionsMap.set(randomWrong.en, randomWrong);
            }
        }
        return shuffleArray(Array.from(optionsMap.values()));
    }

    function handleAnswer(isCorrect, pokemonName) {
        window.speechSynthesis.cancel();

        if (isCorrect) {
            score++;
            speakText(`Correct! ${pokemonName} is a ${currentCorrectAnswer.en} Pokemon.`);
        } else {
            speakText(`Incorrect. ${pokemonName} is actually a ${currentCorrectAnswer.en} Pokemon.`);
        }

        currentQuestionIndex++;
        
        setTimeout(loadNextQuestion, 1500); 
    }

    function endQuiz() {
        showScreen('result-screen');
        const passed = score >= PASSING_SCORE;
        
        document.getElementById('result-title').innerText = passed ? "Level Cleared!" : "Level Failed!";
        document.getElementById('result-title').style.color = passed ? "var(--success)" : "var(--danger)";
        document.getElementById('result-score').innerText = `Score: ${score} / ${QUESTIONS_PER_LEVEL}`;
        
        const msgEl = document.getElementById('result-message');
        if (passed) {
            msgEl.innerText = currentGen < 9 ? "Great job! The next generation has been unlocked." : "You are a Pokémon Master! All generations cleared!";
            saveProgress(currentGen);
        } else {
            msgEl.innerText = `You need at least ${PASSING_SCORE} points to unlock the next generation. Try again!`;
        }
        
        speakText(document.getElementById('result-title').innerText + " You scored " + score + " out of " + QUESTIONS_PER_LEVEL);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
    }

    window.onload = init;

</script>
</body>
