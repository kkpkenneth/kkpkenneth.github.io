<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Geometry Centers Explorer</title>
<style>
    :root {
        --bg-color: #0f172a;
        --panel-bg: #1e293b;
        --text-color: #f8fafc;
        --accent-color: #38bdf8;
        --vertex-color: #facc15;
        --centroid-color: #10b981;
        --circumcenter-color: #a855f7;
        --orthocenter-color: #f43f5e;
        --incenter-color: #f97316;
        --euler-color: #ffffff;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        max-width: 1150px;
        width: 100%;
        justify-content: center;
        align-items: flex-start;
    }

    canvas {
        background-color: #0b1120;
        border: 2px solid #334155;
        border-radius: 12px;
        cursor: grab;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    
    canvas:active {
        cursor: grabbing;
    }

    .side-panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex: 1;
        min-width: 300px;
    }

    .panel-box {
        background-color: var(--panel-bg);
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    h2 {
        margin-top: 0;
        color: var(--accent-color);
        border-bottom: 2px solid #334155;
        padding-bottom: 10px;
        font-size: 1.4rem;
        margin-bottom: 20px;
    }

    .legend-item {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        font-size: 1.05rem;
    }

    .dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        margin-right: 15px;
        display: inline-block;
        flex-shrink: 0;
    }

    /* Toggle Switches */
    .toggle-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .toggle-label {
        display: flex;
        align-items: center;
        cursor: pointer;
        font-size: 1.05rem;
        user-select: none;
    }

    .toggle-label input {
        margin-right: 12px;
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--accent-color);
    }

    /* Preset Buttons */
    .preset-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .preset-btn {
        background-color: #334155;
        color: var(--text-color);
        border: 2px solid transparent;
        padding: 10px;
        font-size: 0.95rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .preset-btn:hover {
        background-color: #475569;
    }

    .preset-btn.active {
        background-color: #0f172a;
        border-color: var(--accent-color);
    }

</style>
</head>
<body>

<div class="container">
    <canvas id="geometryCanvas" width="600" height="550"></canvas>
    
    <div class="side-panel">
        
        <!-- SHAPE PRESETS -->
        <div class="panel-box">
            <h2>Shape Presets</h2>
            <div class="preset-group">
                <button class="preset-btn active" id="btn-freeform" onclick="setPreset('freeform')">Freeform</button>
                <button class="preset-btn" id="btn-isosceles" onclick="setPreset('isosceles')">Isosceles</button>
                <button class="preset-btn" id="btn-equilateral" onclick="setPreset('equilateral')">Equilateral</button>
                <button class="preset-btn" id="btn-right" onclick="setPreset('right')">Right-Angled</button>
            </div>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 15px;">
                <em>Note: You can always drag the vertices after selecting a preset to freely modify the shape.</em>
            </p>
        </div>

        <!-- CONSTRUCTION LINES -->
        <div class="panel-box">
            <h2>Construction Lines</h2>
            <div class="toggle-group" id="toggles-container">
                <label class="toggle-label" style="color: var(--euler-color);">
                    <input type="checkbox" id="toggle-euler" checked> Show Euler Line
                </label>
                <label class="toggle-label" style="color: var(--centroid-color);">
                    <input type="checkbox" id="toggle-medians"> Show Medians
                </label>
                <label class="toggle-label" style="color: var(--circumcenter-color);">
                    <input type="checkbox" id="toggle-perpendicular"> Show Perpendicular Bisectors
                </label>
                <label class="toggle-label" style="color: var(--orthocenter-color);">
                    <input type="checkbox" id="toggle-altitudes"> Show Altitudes
                </label>
                <label class="toggle-label" style="color: var(--incenter-color);">
                    <input type="checkbox" id="toggle-angle-bisectors"> Show Angle Bisectors
                </label>
            </div>
        </div>

        <!-- POINTS KEY -->
        <div class="panel-box">
            <h2>Points Key</h2>
            <div class="legend-item">
                <span class="dot" style="background-color: var(--vertex-color);"></span>
                <span>Vertices (Drag Me!)</span>
            </div>
            <div class="legend-item">
                <span class="dot" style="background-color: var(--centroid-color);"></span>
                <span><strong>G:</strong> Centroid</span>
            </div>
            <div class="legend-item" id="key-circumcenter">
                <span class="dot" style="background-color: var(--circumcenter-color);"></span>
                <span><strong>O:</strong> Circumcenter</span>
            </div>
            <div class="legend-item" id="key-orthocenter">
                <span class="dot" style="background-color: var(--orthocenter-color);"></span>
                <span><strong>H:</strong> Orthocenter</span>
            </div>
            <div class="legend-item" id="key-incenter">
                <span class="dot" style="background-color: var(--incenter-color);"></span>
                <span><strong>I:</strong> Incenter</span>
            </div>
        </div>

    </div>
</div>

<script>
    const canvas = document.getElementById('geometryCanvas');
    const ctx = canvas.getContext('2d');

    // Toggles State
    const toggles = {
        euler: true,
        medians: false,
        perpendicular: false,
        altitudes: false,
        angleBisectors: false
    };

    // Bind checkboxes to state
    document.getElementById('toggle-euler').addEventListener('change', (e) => { toggles.euler = e.target.checked; render(); });
    document.getElementById('toggle-medians').addEventListener('change', (e) => { toggles.medians = e.target.checked; render(); });
    document.getElementById('toggle-perpendicular').addEventListener('change', (e) => { toggles.perpendicular = e.target.checked; render(); });
    document.getElementById('toggle-altitudes').addEventListener('change', (e) => { toggles.altitudes = e.target.checked; render(); });
    document.getElementById('toggle-angle-bisectors').addEventListener('change', (e) => { toggles.angleBisectors = e.target.checked; render(); });

    // Vertices Array
    let vertices = [];
    let draggingVertex = null;
    const vertexRadius = 8;

    // Set Shape Presets
    function setPreset(type) {
        // Reset active button styling
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${type}`).classList.add('active');

        // Define coordinates based on the preset
        if (type === 'freeform') {
            vertices = [
                { x: 150, y: 400 },
                { x: 450, y: 400 },
                { x: 250, y: 150 }
            ];
        } else if (type === 'isosceles') {
            vertices = [
                { x: 150, y: 400 },
                { x: 450, y: 400 },
                { x: 300, y: 150 } // Apex exactly centered
            ];
        } else if (type === 'equilateral') {
            // Base = 300. Height = 300 * sqrt(3)/2 ≈ 259.8
            vertices = [
                { x: 150, y: 400 },
                { x: 450, y: 400 },
                { x: 300, y: 400 - 259.8 } 
            ];
        } else if (type === 'right') {
            vertices = [
                { x: 150, y: 400 },
                { x: 450, y: 400 },
                { x: 150, y: 150 } // 90-degree corner at bottom left
            ];
        }

        render();
    }

    // --- Math Calculations ---
    function getDistance(p1, p2) {
        return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function getMidpoint(p1, p2) {
        return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    }

    function projectPointOnLine(P, A, B) {
        const dx = B.x - A.x;
        const dy = B.y - A.y;
        const t = ((P.x - A.x) * dx + (P.y - A.y) * dy) / (dx * dx + dy * dy);
        return { x: A.x + t * dx, y: A.y + t * dy };
    }

    function getPolygonCentroid(verts) {
        let xSum = 0; let ySum = 0;
        for (let i = 0; i < verts.length; i++) {
            xSum += verts[i].x;
            ySum += verts[i].y;
        }
        return { x: xSum / verts.length, y: ySum / verts.length };
    }

    function getCircumcenter(A, B, C) {
        const D = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
        if (Math.abs(D) < 0.0001) return null; 
        const Ux = ((A.x**2 + A.y**2) * (B.y - C.y) + (B.x**2 + B.y**2) * (C.y - A.y) + (C.x**2 + C.y**2) * (A.y - B.y)) / D;
        const Uy = ((A.x**2 + A.y**2) * (C.x - B.x) + (B.x**2 + B.y**2) * (A.x - C.x) + (C.x**2 + C.y**2) * (B.x - A.x)) / D;
        return { x: Ux, y: Uy };
    }

    function getOrthocenter(G, O) {
        if (!O) return null;
        return { x: 3 * G.x - 2 * O.x, y: 3 * G.y - 2 * O.y };
    }

    function getIncenter(A, B, C) {
        const a = getDistance(B, C);
        const b = getDistance(A, C);
        const c = getDistance(A, B);
        const perimeter = a + b + c;
        return {
            x: (a * A.x + b * B.x + c * C.x) / perimeter,
            y: (a * A.y + b * B.y + c * C.y) / perimeter
        };
    }

    function getAngleBisectorFoot(A, B, C) {
        const c = getDistance(A, B);
        const b = getDistance(A, C);
        return {
            x: (b * B.x + c * C.x) / (b + c),
            y: (b * B.y + c * C.y) / (b + c)
        };
    }

    // --- Drawing Functions ---
    function drawLine(p1, p2, color, width = 2, dash = []) {
        if(!p1 || !p2) return;
        ctx.beginPath();
        ctx.setLineDash(dash);
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawInfiniteLineThroughPointWithNormal(P, A, B, color) {
        let nx = -(B.y - A.y);
        let ny = (B.x - A.x);
        const len = Math.hypot(nx, ny);
        nx /= len; ny /= len;
        const p1 = { x: P.x - nx * 2000, y: P.y - ny * 2000 };
        const p2 = { x: P.x + nx * 2000, y: P.y + ny * 2000 };
        drawLine(p1, p2, color, 1.5, [4, 4]);
    }

    function drawInfiniteLine(p1, p2, color) {
        if (!p1 || !p2) return;
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;

        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]); 

        if (Math.abs(dx) < 0.0001) {
            ctx.moveTo(p1.x, 0);
            ctx.lineTo(p1.x, canvas.height);
        } else {
            const m = dy / dx;
            const b = p1.y - m * p1.x;
            ctx.moveTo(0, b);
            ctx.lineTo(canvas.width, m * canvas.width + b);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawPoint(p, color, label, labelOffset = {x: 12, y: 12}) {
        if (!p) return;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.font = 'bold 16px "Segoe UI"';
        ctx.fillText(label, p.x + labelOffset.x, p.y + labelOffset.y);
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Triangle
        ctx.beginPath();
        ctx.moveTo(vertices[0].x, vertices[0].y);
        for (let i = 1; i < vertices.length; i++) {
            ctx.lineTo(vertices[i].x, vertices[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.1)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Calculate Centers
        const [A, B, C] = vertices;
        const G = getPolygonCentroid(vertices);
        const O = getCircumcenter(A, B, C);
        const H = getOrthocenter(G, O);
        const I = getIncenter(A, B, C);

        const M_BC = getMidpoint(B, C);
        const M_AC = getMidpoint(A, C);
        const M_AB = getMidpoint(A, B);

        // --- Draw Construction Lines based on Toggles ---
        if (toggles.medians) {
            const color = 'rgba(16, 185, 129, 0.6)';
            drawLine(A, M_BC, color, 1.5, [4, 4]);
            drawLine(B, M_AC, color, 1.5, [4, 4]);
            drawLine(C, M_AB, color, 1.5, [4, 4]);
        }

        if (toggles.perpendicular) {
            const color = 'rgba(168, 85, 247, 0.6)';
            drawInfiniteLineThroughPointWithNormal(M_BC, B, C, color);
            drawInfiniteLineThroughPointWithNormal(M_AC, A, C, color);
            drawInfiniteLineThroughPointWithNormal(M_AB, A, B, color);
        }

        if (toggles.altitudes) {
            const color = 'rgba(244, 63, 94, 0.6)';
            drawLine(A, projectPointOnLine(A, B, C), color, 1.5, [4, 4]);
            drawLine(B, projectPointOnLine(B, A, C), color, 1.5, [4, 4]);
            drawLine(C, projectPointOnLine(C, A, B), color, 1.5, [4, 4]);
        }

        if (toggles.angleBisectors) {
            const color = 'rgba(249, 115, 22, 0.6)';
            drawLine(A, getAngleBisectorFoot(A, B, C), color, 1.5, [4, 4]);
            drawLine(B, getAngleBisectorFoot(B, A, C), color, 1.5, [4, 4]);
            drawLine(C, getAngleBisectorFoot(C, A, B), color, 1.5, [4, 4]);
        }

        if (toggles.euler && O && H) {
            drawInfiniteLine(O, H, 'rgba(255, 255, 255, 0.7)');
        }

        // --- Draw Center Points ---
        drawPoint(O, '#a855f7', 'O', {x: 10, y: -10}); 
        drawPoint(G, '#10b981', 'G', {x: 10, y: 15});  
        drawPoint(H, '#f43f5e', 'H', {x: -25, y: -10});
        drawPoint(I, '#f97316', 'I', {x: -20, y: 20});

        // --- Draw Interactive Vertices ---
        vertices.forEach((v) => {
            ctx.beginPath();
            ctx.arc(v.x, v.y, vertexRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#facc15';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    }

    // --- Interaction Logic ---
    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
        const mousePos = getMousePos(e);
        for (let i = 0; i < vertices.length; i++) {
            const v = vertices[i];
            const dist = getDistance(mousePos, v);
            if (dist < vertexRadius * 2.5) { 
                draggingVertex = v;
                // Deactivate preset styling since user is freely editing
                document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
                break;
            }
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (draggingVertex) {
            const mousePos = getMousePos(e);
            draggingVertex.x = mousePos.x;
            draggingVertex.y = mousePos.y;
            render();
        }
    });

    canvas.addEventListener('mouseup', () => { draggingVertex = null; });
    canvas.addEventListener('mouseleave', () => { draggingVertex = null; });

    // Initialization
    setPreset('freeform');
</script>
</body>
</html>
