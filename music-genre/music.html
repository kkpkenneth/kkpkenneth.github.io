<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Genre Explorer</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Buttons */
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        button.outline {
            background-color: transparent;
            border: 2px solid var(--primary);
        }

        button.outline:hover {
            background-color: var(--primary);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* View toggling */
        .view { display: none; width: 100%; }
        .view.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        /* Start Screen UI */
        #start-screen-view {
            text-align: center;
            margin: auto;
            max-width: 600px;
            padding: 4rem 2rem;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        #start-screen-view h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #start-screen-view p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        .start-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-pulse {
            animation: pulseGlow 2s infinite;
            padding: 1.2rem;
            font-size: 1.2rem;
        }

        /* Audio Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.1s linear;
            pointer-events: none;
        }

        /* Quiz UI */
        #quiz-view {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            background: var(--surface);
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .audio-controls {
            margin: 1.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
        }

        #options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .option-btn {
            background-color: #334155;
            padding: 1.5rem;
            font-size: 1.1rem;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .option-btn:hover:not(:disabled) { background-color: #475569; transform: none; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        .option-btn.correct { background-color: var(--success); }
        .option-btn.wrong { background-color: var(--danger); }

        /* Modal / Popup UI */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(15, 23, 42, 0.85); 
            align-items: center; 
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--primary);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.3s;
            text-align: left;
        }

        .modal.show .modal-content {
            transform: translateY(0);
        }

        .modal-content h3 {
            color: var(--primary); 
            border-bottom: 1px solid #334155; 
            padding-bottom: 0.5rem; 
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
        }

        .modal-content p {
            margin-bottom: 0.8rem; 
            font-size: 1.05rem;
        }

        /* Collection UI */
        #collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .genre-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        
        .genre-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .genre-card h3 {
            font-size: 1.5rem;
            text-transform: capitalize;
            color: var(--primary);
            border-bottom: 1px solid #334155;
            padding-bottom: 0.5rem;
        }

        .tag {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
            padding-top: 1rem;
        }

        .card-actions button {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.9rem;
        }

        /* Back Button Footer */
        .back-btn-container {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Start Screen View -->
        <div id="start-screen-view" class="view active">
            <h1>Music Genre Explorer</h1>
            <p>Train your ear and explore the characteristics of 50 different music genres.</p>
            
            <div class="start-actions">
                <button onclick="switchView('quiz')" class="btn-pulse">Start Speed Quiz</button>
                <button onclick="switchView('collection')" class="outline" style="padding: 1rem;">Browse Study Collection</button>
            </div>
        </div>

        <!-- Quiz View -->
        <div id="quiz-view" class="view">
            <h2>Identify the Genre</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Score: <span id="score">0</span></p>
            
            <div class="audio-controls">
                <button id="quiz-play-btn" onclick="playQuizAudio()" style="border-radius: 50%; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                    ▶
                </button>
                <div class="progress-container" onclick="seekAudio(event, this)">
                    <div class="progress-fill" id="quiz-progress"></div>
                </div>
            </div>

            <div id="options-grid"></div>
            
            <div class="back-btn-container">
                <button onclick="switchView('start-screen')" class="outline">Back</button>
            </div>
        </div>

        <!-- Collection View -->
        <div id="collection-view" class="view">
            <div id="collection-grid"></div>
            
            <div class="back-btn-container">
                <button onclick="switchView('start-screen')" class="outline">Back</button>
            </div>
        </div>
    </div>

    <!-- Explanation Modal Popup -->
    <div id="explanation-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <p id="modal-mood"></p>
            <p id="modal-instruments"></p>
            <p id="modal-scene"></p>
            <button onclick="nextQuestion()" style="width: 100%; margin-top: 1.5rem; padding: 1rem;">Next Track</button>
        </div>
    </div>

        let currentAudio = null;
        let currentFile = null;
        let currentPlayingId = null;
        let currentQuizCorrect = null;
        let score = 0;
        let isFirstQuizLoad = true;

        function switchView(view) {
            // Toggle view visibility
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`${view}-view`).classList.add('active');

            stopAudio();
            currentFile = null;
            window.speechSynthesis.cancel();
            
            // Close modal if open
            document.getElementById('explanation-modal').classList.remove('show');

            // Autoplay and manage Quiz startup
            if (view === 'quiz') {
                if (isFirstQuizLoad || !currentQuizCorrect) {
                    nextQuestion();
                    isFirstQuizLoad = false;
                } else {
                    // Autoplay the exact spot you left off at if returning to the quiz
                    playQuizAudio();
                }
            }
        }

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            updateButtonUI(null, false);
            // Reset all progress bars
            document.querySelectorAll('.progress-fill').forEach(el => el.style.width = '0%');
        }

        function updateButtonUI(trackId, isPlaying) {
            // Reset all buttons to default "Play" state
            const quizBtn = document.getElementById('quiz-play-btn');
            if (quizBtn) quizBtn.innerHTML = '▶';
            
            document.querySelectorAll('.collection-play-btn').forEach(btn => {
                btn.innerHTML = '▶ Play Track';
            });

            if (!isPlaying || !trackId) return;

            // Update active track to "Pause" state
            if (trackId === 'quiz' && quizBtn) {
                quizBtn.innerHTML = '⏸';
            } else if (trackId !== 'quiz') {
                const activeBtn = document.getElementById('play-btn-' + trackId);
                if (activeBtn) activeBtn.innerHTML = '⏸ Pause';
            }
        }

        function playTrack(file, trackId) {
            // Check if clicking the same track that is already loaded to trigger pause/play toggle
            if (currentFile === file && currentAudio) {
                if (currentAudio.paused) {
                    currentAudio.play();
                } else {
                    currentAudio.pause();
                }
                return; 
            }

            // Stop any currently playing audio but do not reset variables yet
            if (currentAudio) {
                currentAudio.pause();
            }
            
            // Reset visuals 
            document.querySelectorAll('.progress-fill').forEach(el => el.style.width = '0%');
            
            currentFile = file;
            currentPlayingId = trackId;

            currentAudio = new Audio(file);
            
            // Add listeners to automatically handle Play/Pause UI swapping
            currentAudio.addEventListener('play', () => updateButtonUI(currentPlayingId, true));
            currentAudio.addEventListener('pause', () => updateButtonUI(currentPlayingId, false));
            currentAudio.addEventListener('ended', () => updateButtonUI(currentPlayingId, false));

            // Event listener to update the progress bar as audio plays
            currentAudio.addEventListener('timeupdate', () => {
                const percent = (currentAudio.currentTime / currentAudio.duration) * 100 || 0;
                if (currentPlayingId === 'quiz') {
                    const prog = document.getElementById('quiz-progress');
                    if (prog) prog.style.width = percent + '%';
                } else {
                    const fill = document.getElementById('fill-' + currentPlayingId);
                    if (fill) fill.style.width = percent + '%';
                }
            });

            currentAudio.play().catch(e => {
                console.error("Audio playback failed.", e);
                alert("Could not play track. Make sure '" + file + "' is in the same folder as the HTML file.");
            });
        }

        function playQuizAudio() {
            if (currentQuizCorrect) playTrack(currentQuizCorrect.file, 'quiz');
        }

        function seekAudio(e, container) {
            if (!currentAudio) return;
            const rect = container.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            currentAudio.currentTime = percent * currentAudio.duration;
        }

        function readExplanation(genre) {
            const synth = window.speechSynthesis;
            synth.cancel(); 
            
            const text = `${genre.name}. Mood: ${genre.mood} Main Instruments: ${genre.instruments} Perfect Movie Scene: ${genre.scene}`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            synth.speak(utterance);
        }

        function nextQuestion() {
            // Hide Modal
            document.getElementById('explanation-modal').classList.remove('show');
            
            stopAudio();
            currentFile = null; // Reset track state
            
            let shuffled = [...genreData].sort(() => 0.5 - Math.random());
            currentQuizCorrect = shuffled[0];
            let options = shuffled.slice(0, 4).sort(() => 0.5 - Math.random());

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.name;
                btn.onclick = () => handleGuess(btn, opt);
                grid.appendChild(btn);
            });

            // Automatically play when moving to the next track
            playQuizAudio();
        }

        function handleGuess(btn, selectedObj) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true); 

            if (selectedObj.id === currentQuizCorrect.id) {
                btn.classList.add('correct');
                score++;
                document.getElementById('score').innerText = score;
            } else {
                btn.classList.add('wrong');
                buttons.forEach(b => {
                    if(b.innerText.toLowerCase() === currentQuizCorrect.name.toLowerCase()) {
                        b.classList.add('correct');
                    }
                });
            }
            
            // Populate Modal Content
            document.getElementById('modal-title').innerText = currentQuizCorrect.name;
            document.getElementById('modal-mood').innerHTML = `<strong><span style="color: var(--text-muted)">Mood:</span></strong> ${currentQuizCorrect.mood}`;
            document.getElementById('modal-instruments').innerHTML = `<strong><span style="color: var(--text-muted)">Instruments:</span></strong> ${currentQuizCorrect.instruments}`;
            document.getElementById('modal-scene').innerHTML = `<strong><span style="color: var(--text-muted)">Scene:</span></strong> ${currentQuizCorrect.scene}`;
            
            // Show Explanation Modal Popup
            const modal = document.getElementById('explanation-modal');
            modal.classList.add('show');
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            
            // Sort by numerical file prefix (1-50)
            const sorted = [...genreData].sort((a, b) => {
                const numA = parseInt(a.file.match(/^\d+/)[0]);
                const numB = parseInt(b.file.match(/^\d+/)[0]);
                return numA - numB;
            });
            
            sorted.forEach(genre => {
                const card = document.createElement('div');
                card.className = 'genre-card';
                
                // Extract the numerical prefix for display
                const trackNumber = genre.file.match(/^\d+/)[0];

                card.innerHTML = `
                    <h3>${trackNumber}. ${genre.name}</h3>
                    <div>
                        <div class="tag">Mood</div>
                        <p>${genre.mood}</p>
                    </div>
                    <div>
                        <div class="tag">Instruments</div>
                        <p>${genre.instruments}</p>
                    </div>
                    <div>
                        <div class="tag">Movie Scene</div>
                        <p>${genre.scene}</p>
                    </div>
                    
                    <div class="progress-container" onclick="seekAudio(event, this)">
                        <div class="progress-fill" id="fill-${genre.id}"></div>
                    </div>

                    <div class="card-actions">
                        <button id="play-btn-${genre.id}" class="collection-play-btn" onclick="playTrack('${genre.file}', '${genre.id}')">▶ Play Track</button>
                        <button class="outline" onclick='readExplanation(${JSON.stringify(genre).replace(/'/g, "&apos;")})'>🔊 Read Aloud</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = () => {
            renderCollection();
        };
    </script>
</body>
</html>
