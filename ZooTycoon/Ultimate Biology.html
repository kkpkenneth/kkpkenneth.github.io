<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biology Quiz - Fill in the Blanks</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font family -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        .blank-input {
            border: 2px solid #9ca3af;
            border-radius: 6px;
            padding: 4px 8px;
            text-align: center;
            font-weight: 600;
            color: #1f2937;
            transition: all 0.2s;
            width: auto;
            min-width: 120px;
            max-width: 90%;
            display: inline-block;
        }
        .correct {
            border-color: #10b981; /* Emerald Green */
            background-color: #d1fae5;
        }
        .incorrect {
            border-color: #ef4444; /* Red */
            background-color: #fee2e2;
        }
        .quiz-sentence {
            /* Ensure the text and inputs are inline and centered vertically */
            display: flex; 
            flex-wrap: wrap; 
            align-items: center; 
            line-height: 2.2rem;
        }
        .question-block-container {
            display: flex;
            align-items: flex-start; /* Align sentence and button at the top */
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex items-start justify-center">

    <div id="quiz-container" class="w-full max-w-4xl bg-white shadow-xl rounded-xl p-6 sm:p-10">

        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 tracking-tight mb-2">Cell Biology Revision (100 Questions)</h1>
            <p class="text-lg text-gray-500">Fill in the blanks and use the 'Check' button for instant feedback on each question!</p>
        </header>

        <section id="quiz-area" class="space-y-6">
            <!-- Quiz content will be generated here by JavaScript -->
        </section>

        <div class="mt-8 pt-6 border-t border-gray-200 flex flex-col sm:flex-row justify-between items-center">
            <div id="score-display" class="text-xl font-semibold text-gray-700 mb-4 sm:mb-0">Score: 0 / 100</div>

            <div class="space-x-4 flex flex-wrap justify-center sm:justify-start">
                <!-- Removed global Check button, relying on individual checks -->
                <button onclick="showAnswers()" id="showAnswersButton" class="px-6 py-3 bg-emerald-600 text-white font-bold rounded-lg shadow-md hover:bg-emerald-700 transition duration-150 ease-in-out transform hover:scale-105 mb-2 sm:mb-0">
                    Reveal All
                </button>
                <button onclick="resetQuiz()" id="resetButton" class="px-6 py-3 bg-gray-300 text-gray-800 font-bold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 ease-in-out">
                    Reset Quiz
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- QUIZ DATA (100 Questions) ---
        const quizContent = [
            { text: "The term used to describe bacterial cells is [Prokaryotic] because they lack a membrane-bound nucleus.", id: 1 },
            { text: "Cells that contain a true nucleus, such as those found in animals, plants, and fungi, are known as [Eukaryotic] cells.", id: 2 },
            { text: "Genetic material in a bacterial cell is often found in a single circular chromosome located in the [Nucleoid] region.", id: 3 },
            { text: "The protective outer layer of many plant cells, but also found in bacteria, is called the cell [Wall].", id: 4 },
            { text: "Unlike bacterial cells, animal cells possess numerous complex, membrane-bound structures, collectively known as [Organelles].", id: 5 },
            { text: "The primary site of cellular energy production (cellular [Respiration]) in eukaryotic cells is the mitochondria.", id: 6 },
            { text: "Plant cells contain large organelles called [Chloroplasts], which are responsible for converting light energy into chemical energy.", id: 7 },
            { text: "The metabolic process carried out by chloroplasts is known as [Photosynthesis].", id: 8 },
            { text: "The cell wall of plant cells is primarily composed of the structural carbohydrate [Cellulose].", id: 9 },
            { text: "The cell walls of fungal cells are chemically unique, being made of [Chitin].", id: 10 },
            { text: "Protein synthesis, or translation, occurs on small cellular machines called [Ribosomes].", id: 11 },
            { text: "The endoplasmic reticulum that is studded with ribosomes and is involved in protein modification is the [Rough] ER.", id: 12 },
            { text: "The [Golgi] apparatus is responsible for modifying, sorting, and packaging proteins and lipids before distribution.", id: 13 },
            { text: "Small, membrane-bound sacs used to transport substances into, out of, and within the cell are called [Vesicles].", id: 14 },
            { text: "The large central structure in plant cells that stores water and maintains cell rigidity is the [Vacuole].", id: 15 },
            { text: "Cell rigidity, especially in plant cells, is maintained by internal water pressure known as [Turgor].", id: 16 },
            { text: "The [Plasma] membrane is the lipid bilayer that surrounds all cells, regulating the passage of materials.", id: 17 },
            { text: "The jelly-like fluid that fills the cell and suspends the organelles is known as the [Cytoplasm].", id: 18 },
            { text: "Whip-like appendages used for cell movement, commonly found on bacteria and some eukaryotic cells, are [Flagella].", id: 19 },
            { text: "Bacterial cells reproduce quickly and asexually through a process known as [Binary Fission].", id: 20 },
            { text: "If there is a risk of E. coli contamination, people should [Boil] drinking water for at least one minute.", id: 21 },
            { text: "The structure responsible for detoxifying drugs and synthesizing lipids is the [Smooth] ER.", id: 22 },
            { text: "Lysosomes contain powerful [Enzymes] used to digest waste materials and worn-out organelles.", id: 23 },
            { text: "The cytoskeleton is composed of three main fiber types, including microtubules, microfilaments, and intermediate [Filaments].", id: 24 },
            { text: "The theory stating that mitochondria and chloroplasts originated from engulfed bacteria is the [Endosymbiotic] theory.", id: 25 },
            { text: "The movement of molecules from an area of high concentration to an area of low concentration is called [Diffusion].", id: 26 },
            { text: "The diffusion of water across a selectively permeable membrane is known as [Osmosis].", id: 27 },
            { text: "A solution with a higher solute concentration than the cell's interior is termed [Hypertonic].", id: 28 },
            { text: "The process requiring energy (ATP) to move substances against their concentration gradient is called [Active] transport.", id: 29 },
            { text: "Cell eating, where the cell engulfs large particles, is scientifically termed [Phagocytosis].", id: 30 },
            { text: "The division of the cell nucleus, resulting in two identical daughter nuclei, is called [Mitosis].", id: 31 },
            { text: "The phase of the cell cycle where DNA replication occurs is the [S] phase.", id: 32 },
            { text: "Gametes (sex cells) are produced through the process of [Meiosis].", id: 33 },
            { text: "Chromosomes align at the cell's equatorial plate during the mitotic phase known as [Metaphase].", id: 34 },
            { text: "The two identical copies of a chromosome held together by a centromere are called sister [Chromatids].", id: 35 },
            { text: "The molecule that carries genetic instructions and is double-stranded is [DNA].", id: 36 },
            { text: "The nitrogenous base found in DNA but not RNA is [Thymine].", id: 37 },
            { text: "RNA uses the nitrogenous base [Uracil] instead of Thymine.", id: 38 },
            { text: "The process of creating an mRNA strand from a DNA template is called [Transcription].", id: 39 },
            { text: "The specific sequence of three bases on mRNA that codes for a single amino acid is a [Codon].", id: 40 },
            { text: "Transfer RNA ([tRNA]) is responsible for bringing amino acids to the ribosome during protein synthesis.", id: 41 },
            { text: "The basic building block of a protein is an [Amino] acid.", id: 42 },
            { text: "Enzymes are biological [Catalysts] that speed up chemical reactions without being consumed.", id: 43 },
            { text: "The region on an enzyme where the substrate binds is called the [Active] site.", id: 44 },
            { text: "The primary energy currency of the cell is the molecule [ATP].", id: 45 },
            { text: "The first stage of cellular respiration, which occurs in the cytoplasm, is [Glycolysis].", id: 46 },
            { text: "The inner folded membrane of the mitochondria is called the [Cristae].", id: 47 },
            { text: "The final electron acceptor in aerobic respiration is [Oxygen].", id: 48 },
            { text: "Fermentation that produces lactic acid occurs when [Anaerobic] conditions are present.", id: 49 },
            { text: "The primary pigment in chloroplasts that absorbs light energy is [Chlorophyll].", id: 50 },
            { text: "The internal flattened sacs within a chloroplast where light reactions take place are called [Thylakoids].", id: 51 },
            { text: "The fluid-filled space surrounding the thylakoids in the chloroplast is the [Stroma].", id: 52 },
            { text: "The Calvin cycle, which fixes carbon dioxide into sugar, is a [Light-independent] reaction.", id: 53 },
            { text: "The four main classes of organic macromolecules are carbohydrates, lipids, proteins, and [Nucleic] acids.", id: 54 },
            { text: "Sugars, starches, and fiber are examples of [Carbohydrates].", id: 55 },
            { text: "The simplest form of carbohydrate, like glucose or fructose, is a [Monosaccharide].", id: 56 },
            { text: "Fats, oils, and waxes are categorized as [Lipids].", id: 57 },
            { text: "Lipids are largely [Hydrophobic], meaning they repel water.", id: 58 },
            { text: "The plasma membrane is described as a fluid [Mosaic] model, reflecting its dynamic composition.", id: 59 },
            { text: "In eukaryotes, the DNA is wrapped around proteins called [Histones].", id: 60 },
            { text: "A disease characterized by uncontrolled cell division is [Cancer].", id: 61 },
            { text: "The programmed cell death process that removes unnecessary or damaged cells is called [Apoptosis].", id: 62 },
            { text: "The scientific study of heredity and the variation of inherited characteristics is [Genetics].", id: 63 },
            { text: "A person's observable traits resulting from their genotype is their [Phenotype].", id: 64 },
            { text: "An individual possessing two identical alleles for a particular gene is [Homozygous].", id: 65 },
            { text: "The process of a cell becoming specialized in structure and function is [Differentiation].", id: 66 },
            { text: "Connective tissue is characterized by having cells scattered within an extracellular [Matrix].", id: 67 },
            { text: "[Epithelial] tissue covers the exterior surfaces of the body and lines internal organs.", id: 68 },
            { text: "Muscle tissue primarily consists of fibers capable of [Contraction].", id: 69 },
            { text: "The cells that transmit electrical signals in the nervous system are [Neurons].", id: 70 },
            { text: "Red blood cells, which transport oxygen, lack a [Nucleus] when mature.", id: 71 },
            { text: "Bacteria that use chemical energy (not light) to produce food are called [Chemoautotrophs].", id: 72 },
            { text: "The kingdom that includes organisms like mushrooms, yeasts, and molds is [Fungi].", id: 73 },
            { text: "Organisms whose cells lack cell walls entirely belong to the kingdom [Animalia].", id: 74 },
            { text: "The classification level immediately below Kingdom is [Phylum].", id: 75 },
            { text: "The technique used to separate cell components based on density is [Centrifugation].", id: 76 },
            { text: "A compound microscope uses two lenses, the objective lens and the [Eyepiece] (or ocular) lens.", id: 77 },
            { text: "The smallest unit of an element is the [Atom].", id: 78 },
            { text: "A chemical bond formed by the sharing of electrons between atoms is a [Covalent] bond.", id: 79 },
            { text: "The weak attraction between a partially positive hydrogen atom and a partially negative atom is a [Hydrogen] bond.", id: 80 },
            { text: "The property of water molecules sticking to other water molecules is [Cohesion].", id: 81 },
            { text: "The measure of acidity or basicity of a solution is its [pH].", id: 82 },
            { text: "Solutions with a pH less than 7 are classified as [Acids].", id: 83 },
            { text: "A substance that minimizes changes in pH in a solution is a [Buffer].", id: 84 },
            { text: "Starch is the major [Storage] carbohydrate in plants.", id: 85 },
            { text: "The protein that makes up hair, nails, and outer skin layers is [Keratin].", id: 86 },
            { text: "The primary structure of a protein is defined by its sequence of [Amino] acids.", id: 87 },
            { text: "Prions are infectious protein particles that cause disease by inducing abnormal protein [Folding].", id: 88 },
            { text: "The sugar component of the DNA backbone is [Deoxyribose].", id: 89 },
            { text: "The process by which a cell takes in molecules by engulfing them in a vesicle is [Endocytosis].", id: 90 },
            { text: "The specialized junctions that allow rapid passage of ions and small molecules between adjacent animal cells are [Gap] junctions.", id: 91 },
            { text: "The primary barrier to movement of water-soluble substances across the cell membrane is the [Lipid] bilayer.", id: 92 },
            { text: "The term for organisms that require pre-formed organic compounds for energy is [Heterotrophs].", id: 93 },
            { text: "In multicellular organisms, groups of similar cells working together form a [Tissue].", id: 94 },
            { text: "The two types of prokaryotes are bacteria and [Archaea].", id: 95 },
            { text: "An organism that only grows in the presence of oxygen is called an obligate [Aerobe].", id: 96 },
            { text: "The specialized region of DNA that determines the timing of cell division is the [Telomere].", id: 97 },
            { text: "The specialized pores in the nuclear envelope that regulate transport are called [Nuclear] pores.", id: 98 },
            { text: "The term for the complete set of genes or genetic material present in a cell or organism is the [Genome].", id: 99 },
            { text: "The complex of DNA and protein that makes up eukaryotic chromosomes is [Chromatin].", id: 100 }
        ];

        let totalBlanks = 0;
        let correctAnswersMap = new Map(); // Maps input ID to the correct answer

        /**
         * Calculates the total correct score across all inputs and updates the display.
         */
        function updateGlobalScore() {
            let correctCount = 0;
            const allInputs = document.querySelectorAll('.blank-input');
            
            allInputs.forEach(input => {
                // We only count it as correct if it has the 'correct' class, which is added when 
                // the user's attempt matches the answer. This prevents incorrect answers
                // that have been revealed from incorrectly counting towards the score.
                if (input.classList.contains('correct')) {
                    correctCount++;
                }
            });

            document.getElementById('score-display').textContent = `Score: ${correctCount} / ${totalBlanks}`;
        }


        /**
         * Checks a single input field against its correct answer, and reveals the answer if incorrect.
         * @param {HTMLElement} inputElement - The input field to check.
         */
        function checkSingleInput(inputElement) {
            const userAnswer = inputElement.value.trim().toLowerCase();
            // Get the original-cased correct answer for display
            const correctAnswerDisplay = correctAnswersMap.get(inputElement.id);
            // Get the lowercased correct answer for case-insensitive comparison
            const correctAnswerCompare = correctAnswerDisplay.toLowerCase();
            
            // Find the corresponding check button
            const questionBlock = inputElement.closest('.question-block');
            const checkButton = questionBlock ? questionBlock.querySelector('.question-block-container button') : null;

            // Remove previous feedback classes
            inputElement.classList.remove('correct', 'incorrect');
            
            if (userAnswer === correctAnswerCompare) {
                // Correct logic: Mark correct and lock
                inputElement.classList.add('correct');
                inputElement.disabled = true;
                if (checkButton) {
                    checkButton.disabled = true;
                    checkButton.classList.add('opacity-50', 'cursor-not-allowed');
                }
            } else if (userAnswer !== '') {
                // Incorrect logic: Mark incorrect, reveal the correct answer, and lock
                inputElement.classList.add('incorrect');
                inputElement.value = correctAnswerDisplay; // REVEAL THE CORRECT ANSWER
                inputElement.disabled = true;
                if (checkButton) {
                    checkButton.disabled = true;
                    checkButton.classList.add('opacity-50', 'cursor-not-allowed');
                }
            }
            // If userAnswer is empty (''), we don't apply feedback or lock.

            // After checking the single input, update the total score
            updateGlobalScore();
        }

        /**
         * Parses the quiz content, generates HTML, and initializes the quiz state.
         */
        function initializeQuiz() {
            const quizArea = document.getElementById('quiz-area');
            quizArea.innerHTML = '';
            totalBlanks = 0;
            correctAnswersMap.clear();
            let inputIdCounter = 0;

            quizContent.forEach((item, index) => {
                const questionNumber = index + 1;

                // 1. Create a wrapper for the entire question block
                const questionWrapper = document.createElement('div');
                questionWrapper.className = 'question-block bg-gray-50 p-4 rounded-xl shadow-inner mb-6'; 

                // 2. Add the question number header
                const numberHeader = document.createElement('h3');
                numberHeader.className = 'text-xl font-bold text-indigo-700 mb-3 border-b pb-2 border-indigo-200';
                numberHeader.textContent = `Question ${questionNumber}:`;
                questionWrapper.appendChild(numberHeader);
                
                // 3. Create the sentence container for the fill-in-the-blanks text
                const sentenceDiv = document.createElement('div');
                sentenceDiv.className = 'quiz-sentence text-lg text-gray-700';
                
                // Regular expression to find words enclosed in [brackets]
                const parts = item.text.split(/\[(.*?)\]/g);
                
                parts.forEach((part, partIndex) => {
                    // If the index is odd, it's the text inside the brackets (the answer)
                    if (partIndex % 2 !== 0) {
                        const correctWord = part.trim();
                        
                        // Create the input element
                        const inputElement = document.createElement('input');
                        inputElement.type = 'text';
                        inputElement.className = 'blank-input mx-1';
                        inputElement.id = `blank-${inputIdCounter}`;
                        inputElement.setAttribute('data-correct', correctWord.toLowerCase());
                        
                        // Set a visual width roughly based on the answer length
                        inputElement.style.width = `${Math.max(correctWord.length * 10, 100)}px`; 
                        
                        // Add to the map for checking and increment total count
                        correctAnswersMap.set(inputElement.id, correctWord);
                        totalBlanks++;
                        
                        sentenceDiv.appendChild(inputElement);
                        inputIdCounter++;

                    } else {
                        // Otherwise, it's regular text
                        const textNode = document.createTextNode(part.trim() + ' ');
                        sentenceDiv.appendChild(textNode);
                    }
                });

                // 4. Create the Check button for this question
                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check';
                checkButton.className = 'px-3 py-1 text-sm bg-blue-600 text-white font-bold rounded-lg shadow-md hover:bg-blue-700 transition duration-150 transform hover:scale-105 ml-4 flex-shrink-0';
                checkButton.onclick = function() {
                    // The input for this question is the first (and only) blank-input inside this questionWrapper
                    const input = questionWrapper.querySelector('.blank-input');
                    checkSingleInput(input);
                };

                // 5. Assemble the question block container (sentence + check button)
                const contentContainer = document.createElement('div');
                contentContainer.className = 'question-block-container mt-3';
                
                // Wrap the sentence div to ensure it takes up maximum available width before the button
                const sentenceWrapper = document.createElement('div');
                sentenceWrapper.className = 'flex-grow min-w-0';
                sentenceWrapper.appendChild(sentenceDiv);

                contentContainer.appendChild(sentenceWrapper);
                contentContainer.appendChild(checkButton);


                questionWrapper.appendChild(contentContainer);
                quizArea.appendChild(questionWrapper);
            });
            updateGlobalScore(); // Initial score display (0/100)
        }

        /**
         * Reveals all correct answers and disables the inputs and check buttons.
         */
        function showAnswers() {
            const allInputs = document.querySelectorAll('.blank-input');
            const allCheckButtons = document.querySelectorAll('.question-block-container button');
            
            allInputs.forEach(input => {
                const correctAnswer = correctAnswersMap.get(input.id);
                
                // Set the value to the correct answer
                input.value = correctAnswer;
                
                // Apply correct styling
                input.classList.add('correct');
                input.classList.remove('incorrect');
                
                // Disable the input
                input.disabled = true;
            });
            
            allCheckButtons.forEach(button => {
                button.disabled = true;
                button.classList.add('opacity-50', 'cursor-not-allowed');
            });

            // Disable the 'Reveal All' button
            document.getElementById('showAnswersButton').disabled = true;
            document.getElementById('showAnswersButton').classList.add('opacity-50', 'cursor-not-allowed');

            updateGlobalScore(); // Show full score (100/100 displayed if all are now correct)
        }

        /**
         * Resets the quiz by clearing inputs and feedback, and re-enabling buttons.
         */
        function resetQuiz() {
            const allInputs = document.querySelectorAll('.blank-input');
            const allCheckButtons = document.querySelectorAll('.question-block-container button');

            allInputs.forEach(input => {
                input.value = '';
                input.classList.remove('correct', 'incorrect');
                input.disabled = false; // Re-enable input
            });

            allCheckButtons.forEach(button => {
                button.disabled = false;
                button.classList.remove('opacity-50', 'cursor-not-allowed');
            });

            // Re-enable 'Reveal All' button
            document.getElementById('showAnswersButton').disabled = false;
            document.getElementById('showAnswersButton').classList.remove('opacity-50', 'cursor-not-allowed');
            
            updateGlobalScore(); // Reset score display (0/100)
        }

        // Initialize the quiz when the page loads
        window.onload = initializeQuiz;

    </script>
</body>
</html>
