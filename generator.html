    }

    async function generateZip() {
        const btn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        btn.innerText = "Generating...";
        status.innerText = "Packing 163 files...";

        const zip = new JSZip();

        visitedPlaces.forEach(country => {
            // Formats "Hong Kong" into "hongkong" for filenames
            const fileBase = country.toLowerCase().replace(/[^a-z0-9]/g, '');
            const filename = fileBase + ".html";
            const htmlContent = getTemplate(country, fileBase);
            zip.file(filename, htmlContent);
        });

        zip.generateAsync({ type: "blob" }).then(function(content) {
            saveAs(content, "TravelTurtle_CountryArchive.zip");
            btn.innerText = "Done!";
            status.innerText = "Zip downloaded successfully.";
        });
    }
</script>

</body>
