<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Pop Sound Bites Quiz</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --primary: #ec4899;
    --primary-hover: #be185d;
    --text: #f8fafc;
  }
  
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .quiz-container {
    background-color: var(--card-bg);
    padding: 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  h2 { margin-top: 0; }
  
  .hidden { display: none !important; }

  .btn {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background-color: var(--primary);
    border: none;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  .btn:hover { background-color: var(--primary-hover); }

  #audio-player {
    width: 100%;
    margin: 20px 0;
    outline: none;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    color: #94a3b8;
    margin-bottom: 15px;
    border-bottom: 1px solid #334155;
    padding-bottom: 10px;
  }
</style>
</head>
<body>

<div class="quiz-container">
  <!-- Start Screen -->
  <div id="start-screen">
    <h2>🎵 K-Pop Sound Quiz</h2>
    <p>Can you identify the group from a single sound effect?</p>
    <button class="btn" onclick="startQuiz()">Start Quiz</button>
  </div>

  <!-- Quiz Interface -->
  <div id="quiz-screen" class="hidden">
    <div class="status-bar">
      <span id="question-counter">Question: 1/20</span>
      <span>Score: <span id="score-display">0</span></span>
    </div>
    
    <audio id="audio-player" controls controlsList="nodownload"></audio>
    <div id="options-container"></div>
  </div>

  <!-- Results Screen -->
  <div id="result-screen" class="hidden">
    <h2>Quiz Complete! 🎉</h2>
    <p>Your Final Score: <span id="final-score">0</span> / 20</p>
    <button class="btn" onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>
  // Expand this array to 20 objects with your local or hosted audio files
  const quizData = [
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
      options: ["BLACKPINK", "TWICE", "Red Velvet", "aespa"],
      answer: "BLACKPINK"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
      options: ["Stray Kids", "BTS", "SEVENTEEN", "ATEEZ"],
      answer: "BTS"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
      options: ["ITZY", "NewJeans", "LE SSERAFIM", "IVE"],
      answer: "NewJeans"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
      options: ["EXO", "GOT7", "MONSTA X", "NCT 127"],
      answer: "EXO"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
      options: ["Red Velvet", "TWICE", "GFRIEND", "OH MY GIRL"],
      answer: "TWICE"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3",
      options: ["TOMORROW X TOGETHER", "ENHYPEN", "Stray Kids", "TREASURE"],
      answer: "Stray Kids"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3",
      options: ["MAMAMOO", "BLACKPINK", "Red Velvet", "EXID"],
      answer: "Red Velvet"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3",
      options: ["SEVENTEEN", "ASTRO", "The Boyz", "NCT DREAM"],
      answer: "SEVENTEEN"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3",
      options: ["NMIXX", "STAYC", "aespa", "Kep1er"],
      answer: "aespa"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3",
      options: ["Super Junior", "SHINee", "BIGBANG", "2PM"],
      answer: "BIGBANG"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3",
      options: ["LE SSERAFIM", "ILLIT", "BABYMONSTER", "KISS OF LIFE"],
      answer: "LE SSERAFIM"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3",
      options: ["WayV", "NCT 127", "PENTAGON", "SF9"],
      answer: "NCT 127"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-13.mp3",
      options: ["EVERGLOW", "woo!ah!", "ITZY", "cignature"],
      answer: "ITZY"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-14.mp3",
      options: ["ENHYPEN", "TOMORROW X TOGETHER", "BOYNEXTDOOR", "RIIZE"],
      answer: "TOMORROW X TOGETHER"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3",
      options: ["FIFTY FIFTY", "tripleS", "NiziU", "IVE"],
      answer: "IVE"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-16.mp3",
      options: ["SHINee", "INFINITE", "BTOB", "VIXX"],
      answer: "SHINee"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3",
      options: ["MAMAMOO", "(G)I-DLE", "Dreamcatcher", "WJSN"],
      answer: "(G)I-DLE"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
      options: ["ATEEZ", "ONEUS", "CRAVITY", "P1Harmony"],
      answer: "ATEEZ"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
      options: ["Apink", "Girls' Generation", "MAMAMOO", "Brown Eyed Girls"],
      answer: "MAMAMOO"
    },
    {
      audioSrc: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
      options: ["ZEROBASEONE", "TWS", "xikers", "ENHYPEN"],
      answer: "ENHYPEN"
    }
  ];

  let currentQuestionIndex = 0;
  let score = 0;

  const startScreen = document.getElementById('start-screen');
  const quizScreen = document.getElementById('quiz-screen');
  const resultScreen = document.getElementById('result-screen');
  const audioPlayer = document.getElementById('audio-player');
  const optionsContainer = document.getElementById('options-container');
  const questionCounter = document.getElementById('question-counter');
  const scoreDisplay = document.getElementById('score-display');
  const finalScore = document.getElementById('final-score');

  function startQuiz() {
    startScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');
    loadQuestion();
  }

  function loadQuestion() {
    // Clear previous options
    optionsContainer.innerHTML = '';
    
    const currentQuestion = quizData[currentQuestionIndex];
    
    // Update UI text and audio source
    questionCounter.textContent = `Question: ${currentQuestionIndex + 1}/${quizData.length}`;
    audioPlayer.src = currentQuestion.audioSrc;
    audioPlayer.play().catch(e => console.log("Audio autoplay prevented by browser"));

    // Generate option buttons
    currentQuestion.options.forEach(option => {
      const button = document.createElement('button');
      button.textContent = option;
      button.className = 'btn';
      button.onclick = () => checkAnswer(option, currentQuestion.answer);
      optionsContainer.appendChild(button);
    });
  }

  function checkAnswer(selectedOption, correctAnswer) {
    if (selectedOption === correctAnswer) {
      score++;
      scoreDisplay.textContent = score;
    }

    currentQuestionIndex++;

    if (currentQuestionIndex < quizData.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    audioPlayer.pause();
    quizScreen.classList.add('hidden');
    resultScreen.classList.remove('hidden');
    finalScore.textContent = score;
  }
</script>

</body>
</html>
