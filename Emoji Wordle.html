    <!-- Configure Tailwind for Inter font and custom colors if needed -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles for the shake animation (for incorrect guesses) */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake {
            animation: shake 0.4s;
        }
    </style>
</head>

            { emoji: '🐐', word: 'GOAT' },
            { emoji: '🐏', word: 'RAM' },
            { emoji: '🐑', word: 'EWE' },
            { emoji: '🐎', word: 'HORSE' },
            { emoji: '🐖', word: 'PIG' },
            { emoji: '🦇', word: 'BAT' },
            { emoji: '🐔', word: 'CHICKEN' },
            { emoji: '🐓', word: 'ROOSTER' },
            { emoji: '🐣', word: 'HATCHINGCHICK' },
            { emoji: '🐤', word: 'BABYCHICK' },
            { emoji: '🐦', word: 'BIRD' },
            { emoji: '🐧', word: 'PENGUIN' },
            { emoji: '🦉', word: 'OWL' },
            { emoji: '🦚', word: 'PEACOCK' },
            { emoji: '🦅', word: 'EAGLE' },
            { emoji: '🦆', word: 'DUCK' },
            { emoji: '🦢', word: 'SWAN' },
            { emoji: '🐬', word: 'DOLPHIN' },



        ];

        const KEYBOARD_ROWS = [
            ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
            ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
            ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'DEL'],
        ];

        // --- DOM Elements ---
        const gameGrid = document.getElementById('game-grid');
        const emojiClue = document.getElementById('emoji-clue');
        const gameInfo = document.getElementById('game-info');
        const scoreDisplay = document.getElementById('score-display');
        const messageArea = document.getElementById('message-area');
        const keyboardContainer = document.getElementById('keyboard-container');
        const statusModal = document.getElementById('status-modal');
        const newGameButton = document.getElementById('new-game-button');

        // --- Utility Functions ---

        /**
         * Shows a temporary message in the message area.
         * @param {string} msg 
         * @param {boolean} isError - Triggers the shake animation if true.
         */
        function showMessage(msg, isError = false) {
            messageArea.textContent = msg;
            messageArea.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-yellow-100', 'text-yellow-800');
            
            if (isError) {
                messageArea.classList.add('bg-red-100', 'text-red-800');
                gameGrid.classList.add('shake');
                setTimeout(() => gameGrid.classList.remove('shake'), 400);
            } else {
                messageArea.classList.add('bg-yellow-100', 'text-yellow-800');
            }

            // Auto-hide message after a few seconds
            setTimeout(() => {
                messageArea.classList.add('hidden');
            }, 3000);
        }

        /**
         * Updates the state of a letter on the keyboard.
         * @param {string} char 
         * @param {'green' | 'gray'} color 
         */
        function updateKeyboardState(char, color) {
            keyboardState[char] = color;
            
            // Find and update the button element
            const button = document.getElementById(`key-${char}`);
            if (button) {
                let colorClass = '';
                switch (color) {
                    case 'green': colorClass = 'bg-green-500 text-white'; break;
                    case 'gray': colorClass = 'bg-gray-700 text-white opacity-80'; break;
                }

                // Remove existing color classes
                button.classList.remove('bg-gray-200', 'hover:bg-gray-300', 'bg-green-500', 'bg-gray-700', 'text-gray-800', 'opacity-80');
                button.classList.add(...colorClass.split(' '));
                
                // Disable the key once it has been guessed (correct or incorrect)
                button.disabled = true;
            }
        }

        // --- Render Functions ---

        /** Creates a single tile element for Hangman style */
        function createTile(char) {
            const isBlank = char === '_';
            const tile = document.createElement('div');
            
            let colorStyle = isBlank 
                ? 'bg-white border-dashed border-gray-400 text-gray-400' 
                : 'bg-green-100 border-green-500 text-green-800 font-bold';
            
            tile.className = `w-12 h-12 flex items-center justify-center border-2 text-2xl font-extrabold rounded-lg transition-all duration-300 shadow-sm uppercase ${colorStyle}`;
            tile.textContent = isBlank ? '_' : char;
            return tile;
        }

        /** Renders the single row word display and updates the remaining tries info */
        function renderGameGrid() {
            gameGrid.innerHTML = '';
            
            // Render the single row (wordDisplay)
            const row = document.createElement('div');
            row.className = "flex justify-center space-x-2";

            wordDisplay.forEach(char => {
                const tile = createTile(char);
                row.appendChild(tile);
            });
            gameGrid.appendChild(row);

            // Update tries remaining display - DYNAMIC BADGE
            const remaining = MAX_INCORRECT_TRIES - incorrectTries;
            
            // Determine badge colors based on remaining tries
            let color = 'green'; // Default
            if (remaining <= 1) {
                color = 'red';
            } else if (remaining <= 3) {
                color = 'orange';
            } else {
                 color = 'green';
            }

            const bgColor = `bg-${color}-100`;
            const textColor = `text-${color}-800`;
            
            // Update the badge element's classes and content (TRIES LEFT)
            gameInfo.className = `inline-block px-3 py-1 rounded-full text-xs font-bold shadow-md ${bgColor} ${textColor}`;

            gameInfo.innerHTML = `
                ${targetWord.length}-LETTER WORD 
                <span class="mx-1 text-gray-400 font-normal">|</span> 
                <span class="uppercase">${remaining} TRIES LEFT</span>
            `;

            // Update the Score Display
            scoreDisplay.textContent = `SCORE: ${currentScore}`;
        }

        /** Renders the QWERTY keyboard buttons */
        function renderKeyboard() {
            keyboardContainer.innerHTML = '';
            const keyboardDiv = document.createElement('div');
            keyboardDiv.className = 'w-full max-w-lg mx-auto p-2 bg-gray-100 rounded-xl shadow-inner';

            KEYBOARD_ROWS.forEach((row, rowIndex) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = "flex justify-center mb-1";

                row.forEach(key => {
                    if (key === 'ENTER' || key === 'DEL') return; // Hide special keys in this mode

                    const button = document.createElement('button');
                    button.id = `key-${key}`;
                    button.textContent = key;
                    button.value = key;

                    let color = keyboardState[key] || 'default';
                    let colorClass = 'bg-gray-200 hover:bg-gray-300 text-gray-800';
                    let className = 'flex-1 p-2 m-[1px] font-bold rounded-lg shadow-sm transition-colors duration-150';
                    
                    switch (color) {
                        case 'green': colorClass = 'bg-green-500 text-white'; button.disabled = true; break;
                        case 'gray': colorClass = 'bg-gray-700 text-white opacity-80'; button.disabled = true; break;
                        default: button.disabled = false;
                    }

                    button.className = `${className} ${colorClass}`;
                    button.addEventListener('click', () => handleKeyPress(key));
                    rowDiv.appendChild(button);
                });
                keyboardDiv.appendChild(rowDiv);
            });
            keyboardContainer.appendChild(keyboardDiv);
        }

        // --- Game Logic ---

        function handleKeyPress(key) {
            if (gameStatus !== 'playing') return;

            const upperKey = key.toUpperCase();

            // Only process single letter keys
            if (upperKey.length === 1 && upperKey >= 'A' && upperKey <= 'Z') {
                
                if (guessedLetters.has(upperKey)) {
                    showMessage(`You already guessed '${upperKey}'.`, true);
                    return;
                }

                guessedLetters.add(upperKey);

                if (targetWord.includes(upperKey)) {
                    // Correct Guess: Input letter into corresponding blanks
                    let found = false;
                    for (let i = 0; i < targetWord.length; i++) {
                        if (targetWord[i] === upperKey) {
                            wordDisplay[i] = upperKey;
                            found = true;
                        }
                    }
                    updateKeyboardState(upperKey, 'green');
                    showMessage(`Correct! The letter '${upperKey}' is in the word.`);

                    // Check for win condition
                    if (!wordDisplay.includes('_')) {
                        gameStatus = 'win';
                        showGameStatusModal();
                    }
                } else {
                    // Incorrect Guess: Do not input, minus one try
                    incorrectTries++;
                    updateKeyboardState(upperKey, 'gray');
                    
                    const remaining = MAX_INCORRECT_TRIES - incorrectTries;
                    
                    showMessage(`Incorrect! '${upperKey}' is not in the word. ${remaining} tries remaining.`, true);

                    // Check for lose condition
                    if (remaining <= 0) {
                        gameStatus = 'lose';
                        showGameStatusModal();
                    }
                }
                
                renderGameGrid();
                renderKeyboard();
            }
        }

        function showGameStatusModal() {
            const isWin = gameStatus === 'win';
            let scoreUpdate = 0;
            
            const iconSvg = isWin
                ? '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-600"><polyline points="20 6 9 17 4 12"/></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-600"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
            
            const title = isWin ? 'CONGRATULATIONS!' : 'GAME OVER';
            
            if (isWin) {
                const remainingTries = MAX_INCORRECT_TRIES - incorrectTries;
                scoreUpdate = remainingTries * 1;
                currentScore += scoreUpdate;

                document.getElementById('modal-title').style.color = '#008000'; // Green for win
                document.getElementById('modal-title').style.textShadow = '1px 1px #c0f0c0';

            } else {
                // Keep the default red styling for loss
                document.getElementById('modal-title').style.color = '#cc0000'; 
                document.getElementById('modal-title').style.textShadow = '1px 1px #ffde00';
            }

            // Construct the message
            let message = isWin 
                ? `You earned <strong>${scoreUpdate} points</strong>!`
                : `You ran out of incorrect guesses. Better luck on the next emoji!`;
            
            message += ``;

            const bgColor = isWin ? 'bg-green-600' : 'bg-red-600';

            document.getElementById('modal-icon').innerHTML = iconSvg;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').innerHTML = message; // Use innerHTML since we added strong tags
            document.getElementById('modal-emoji').textContent = targetEmoji;
            document.getElementById('modal-word').textContent = targetWord;
            
            newGameButton.classList.remove('bg-green-600', 'bg-red-600', 'hover:bg-green-700', 'hover:bg-red-700');
            newGameButton.classList.add(bgColor, bgColor.replace('600', '700'));
            
            statusModal.classList.remove('hidden');
            renderGameGrid(); // Update the score in the main header
        }

        // --- Initialization ---

        function initializeGame() {
            // Pick a random word from the dictionary
            const pair = WORD_EMOJI_PAIRS[Math.floor(Math.random() * WORD_EMOJI_PAIRS.length)];
            targetEmoji = pair.emoji;
            targetWord = pair.word.toUpperCase();
            
            // Reset game state for Hangman style
            incorrectTries = 0;
            wordDisplay = Array(targetWord.length).fill('_'); 
            guessedLetters = new Set();
            keyboardState = {};
            gameStatus = 'playing';
            
            // Hide modal and message
            statusModal.classList.add('hidden');
            messageArea.classList.add('hidden');

            // Update UI elements
            emojiClue.textContent = targetEmoji;
            
            // Render initial state
            renderGameGrid();
            renderKeyboard();
            
            // console.log("Target Word:", targetWord); // Debug
        }

        // --- Event Listeners ---
        
        // Handle physical keyboard input
        window.addEventListener('keydown', (event) => {
            const key = event.key.toUpperCase();
            
            // 1. Check for ENTER key to start the next game (if modal is open)
            if (event.key === 'Enter') {
                // Only allow ENTER if the game has ended and the modal is visible
                if (!statusModal.classList.contains('hidden')) {
                    initializeGame();
                    event.preventDefault(); // Prevent default browser behavior (like submitting a form if one were active)
                    return;
                }
            }

            // 2. Check for letter guesses (if game is playing)
            // Only capture single letters
            if (key.length === 1 && key >= 'A' && key <= 'Z') {
                handleKeyPress(key);
            }
        });
        
        // Handle new game button click (Next Emoji)
        newGameButton.addEventListener('click', initializeGame);

        // Start the game when the page loads
        window.onload = initializeGame;
    </script>

</body>
</html>
