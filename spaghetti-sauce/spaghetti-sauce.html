<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spaghetti Sauce Master - Progression & Numbers</title>
<style>
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        background-color: #fff9f5; 
        padding: 20px; 
        margin: 0;
    }
    #game-header {
        text-align: center;
        margin-bottom: 20px;
        position: relative;
        width: 100%;
        max-width: 900px;
    }
    #score-board { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; color: #2c3e50; }
    
    #encyclopedia-btn {
        background-color: #9b59b6;
        margin-bottom: 20px;
        font-size: 16px;
    }

    #order-slip {
        background: #fff3cd;
        border-left: 5px solid #ffc107;
        padding: 15px 25px;
        margin-bottom: 20px;
        border-radius: 4px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        text-align: center;
        min-width: 300px;
    }
    #order-slip h2 { margin: 0 0 10px 0; color: #856404; }
    #recipe-hint { font-size: 1em; color: #555; font-weight: bold; }
    
    #game-board { 
        display: flex; 
        flex-wrap: wrap;
        gap: 40px; 
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        max-width: 1000px;
        justify-content: center;
    }
    .ingredients { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
        gap: 10px; 
        flex: 1;
        min-width: 300px;
    }
    .ingredient { 
        padding: 10px; 
        background-color: #f8f9fa; 
        border: 2px solid #dee2e6; 
        border-radius: 8px; 
        cursor: pointer; 
        text-align: center; 
        user-select: none; 
        transition: all 0.1s;
        font-weight: bold;
        font-size: 0.9em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .ingredient span { font-size: 1.5em; margin-bottom: 5px; }
    .ingredient:active { 
        transform: scale(0.92); 
        background-color: #e9ecef;
    }
    
    /* BIGGER POT STYLES */
    #pot-container { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: flex-start;
        min-width: 280px;
    }
    #pot { 
        width: 260px; 
        height: 200px; 
        background-color: #2c3e50; 
        border-radius: 15px 15px 75px 75px; 
        position: relative; 
        display: flex; 
        justify-content: center; 
        align-items: flex-end; 
        padding-bottom: 35px; 
        color: white; 
        font-weight: bold;
        border-top: 20px solid #34495e;
        margin-bottom: 25px;
        box-shadow: inset 0 -15px 20px rgba(0,0,0,0.3), 0 10px 15px rgba(0,0,0,0.1);
    }
    #pot-contents { 
        max-height: 140px; 
        overflow-y: auto; 
        font-size: 1.1em; 
        text-align: center; 
        width: 85%; 
        line-height: 1.5;
    }
    
    .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;}
    button { 
        padding: 12px 20px; 
        font-size: 16px; 
        cursor: pointer; 
        border: none; 
        border-radius: 6px; 
        color: white; 
        font-weight: bold; 
        transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    #cook-btn { background-color: #e74c3c; font-size: 18px; padding: 12px 25px;}
    #reset-btn { background-color: #7f8c8d; }
    #skip-btn { background-color: #3498db; }
    
    #message { 
        margin-top: 20px; 
        font-size: 1.3em; 
        font-weight: bold; 
        min-height: 1.5em; 
        text-align: center;
    }

    /* Modal Overlay Styles (Shared) */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        z-index: 100;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(3px);
    }
    
    /* Encyclopedia Modal */
    #encyclopedia-modal {
        background: white;
        width: 90%;
        max-width: 900px;
        max-height: 85vh;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    #modal-header {
        padding: 20px;
        background: #2c3e50;
        color: white;
        border-radius: 12px 12px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    #modal-header h2 { margin: 0; }
    #close-modal-btn {
        background: #e74c3c;
        padding: 8px 15px;
    }
    #modal-body {
        padding: 20px;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 15px;
    }
    .recipe-card {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        padding: 15px;
        border-radius: 8px;
        transition: transform 0.2s;
    }
    .recipe-card h3 { margin: 0 0 10px 0; color: #d35400; font-size: 1.2em;}
    .recipe-num { color: #7f8c8d; font-size: 0.85em; margin-right: 5px; }
    .recipe-card p { margin: 0 0 10px 0; font-size: 0.9em; color: #555; font-style: italic;}
    .recipe-card .ingredients-list { font-size: 0.95em; font-weight: bold; color: #2c3e50; }
    
    .locked-card {
        background: #e9ecef;
        border: 1px dashed #ced4da;
        color: #adb5bd;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 120px;
        font-size: 1.1em;
        font-weight: bold;
    }
    .locked-num { font-size: 0.8em; margin-bottom: 5px; color: #ced4da; }

    /* Success Modal */
    #success-modal {
        background: white;
        width: 90%;
        max-width: 450px;
        padding: 40px 30px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        border-top: 10px solid #27ae60;
    }
    #success-modal h2 { color: #27ae60; font-size: 2.2em; margin: 0 0 15px 0; }
    #success-message { font-size: 1.3em; color: #333; margin-bottom: 10px; }
    #unlock-message { font-size: 1.1em; color: #9b59b6; font-weight: bold; margin-bottom: 25px; min-height: 1.5em;}
    #next-order-btn { background: #27ae60; font-size: 1.2em; padding: 15px 30px; width: 100%; }
</style>
</head>
<body>

<div id="game-header">
    <h1>🍝 Kitchen Rush: Sauce Master</h1>
    <div id="score-board">Orders Completed: <span id="score">0</span></div>
    <button id="encyclopedia-btn">📖 Sauce Encyclopedia (<span id="unlock-count">0</span>/30)</button>
</div>

<div id="order-slip">
    <h2>Current Order: <span id="recipe-name">Loading...</span></h2>
    <div id="recipe-hint"></div>
</div>

<div id="game-board">
    <div class="ingredients" id="ingredient-list">
        <!-- Ingredients injected by JS -->
    </div>

    <div id="pot-container">
        <div id="pot">
            <div id="pot-contents">Empty</div>
        </div>
        <div class="controls">
            <button id="cook-btn">Cook Sauce!</button>
            <button id="reset-btn">Empty Pot</button>
            <button id="skip-btn">Skip Order</button>
        </div>
        <div id="message"></div>
    </div>
</div>

<!-- Encyclopedia Modal -->
<div id="modal-overlay" class="modal-overlay">
    <div id="encyclopedia-modal">
        <div id="modal-header">
            <h2>📖 The Master Recipe Book</h2>
            <button id="close-modal-btn">Close</button>
        </div>
        <div id="modal-body">
            <!-- Recipe cards injected by JS -->
        </div>
    </div>
</div>

<!-- Success Modal -->
<div id="success-overlay" class="modal-overlay">
    <div id="success-modal">
        <h2>⭐⭐⭐</h2>
        <div id="success-message">You perfected the Marinara!</div>
        <div id="unlock-message">📖 New sauce unlocked in Encyclopedia!</div>
        <button id="next-order-btn">Serve & Get Next Order</button>
    </div>
</div>

<script>
    // --- Web Audio API Synthesizer ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTone(freq, type, duration, vol=0.1) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const sounds = {
        add: () => playTone(800, 'sine', 0.1, 0.05),
        cook: () => playTone(300, 'square', 0.2, 0.05),
        openBook: () => playTone(400, 'triangle', 0.1, 0.05),
        win: () => {
            playTone(523.25, 'triangle', 0.15, 0.1); 
            setTimeout(() => playTone(659.25, 'triangle', 0.15, 0.1), 150); 
            setTimeout(() => playTone(783.99, 'triangle', 0.4, 0.1), 300); 
        },
        fail: () => {
            playTone(200, 'sawtooth', 0.3, 0.1);
            setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.1), 200);
        }
    };

    // --- Game Data ---
    const allIngredients = {
        "Tomato": "🍅", "Garlic": "🧄", "Onion": "🧅", "Basil": "🌿", 
        "Olive Oil": "🫒", "Salt": "🧂", "Black Pepper": "⚫", "Chili": "🌶️", 
        "Parmesan": "🧀", "Pecorino": "🧀", "Heavy Cream": "🥛", "Butter": "🧈", 
        "Pine Nuts": "🥜", "Ground Beef": "🥩", "Pancetta": "🥓", "Eggs": "🥚", 
        "Olives": "🫐", "Capers": "🌱", "Mushroom": "🍄", "Sausage": "🌭", "Lemon": "🍋"
    };

    const recipes = [
        { name: "Marinara", desc: "A classic Italian tomato sauce.", ind: { "Tomato": 3, "Garlic": 1, "Onion": 1, "Basil": 1, "Olive Oil": 1 } },
        { name: "Aglio e Olio", desc: "A simple, spicy garlic and olive oil sauce.", ind: { "Garlic": 3, "Olive Oil": 2, "Chili": 1, "Salt": 1 } },
        { name: "Pesto Genovese", desc: "Vibrant green basil and pine nut blend.", ind: { "Basil": 3, "Pine Nuts": 1, "Parmesan": 1, "Garlic": 1, "Olive Oil": 2 } },
        { name: "Alfredo", desc: "Rich and creamy butter and parmesan.", ind: { "Butter": 2, "Heavy Cream": 2, "Parmesan": 2 } },
        { name: "Carbonara", desc: "A Roman classic with eggs and pancetta.", ind: { "Eggs": 2, "Pancetta": 2, "Pecorino": 2, "Black Pepper": 1 } },
        { name: "Bolognese", desc: "Hearty meat-based ragù.", ind: { "Ground Beef": 2, "Tomato": 2, "Onion": 1, "Garlic": 1, "Olive Oil": 1 } },
        { name: "Arrabbiata", desc: "Spicy tomato sauce (literally 'angry').", ind: { "Tomato": 3, "Garlic": 2, "Chili": 2, "Olive Oil": 1 } },
        { name: "Puttanesca", desc: "Briny and pungent with olives and capers.", ind: { "Tomato": 2, "Olives": 2, "Capers": 1, "Garlic": 1, "Olive Oil": 1 } },
        { name: "Amatriciana", desc: "Tomato enriched with crispy pancetta.", ind: { "Tomato": 2, "Pancetta": 2, "Pecorino": 1, "Onion": 1 } },
        { name: "Cacio e Pepe", desc: "Minimalist sharp cheese and pepper.", ind: { "Pecorino": 2, "Black Pepper": 2 } },
        { name: "Pomodoro", desc: "Quick, fresh tomato and basil.", ind: { "Tomato": 4, "Basil": 2, "Olive Oil": 1, "Salt": 1 } },
        { name: "Creamy Tomato", desc: "Tangy tomatoes mixed with rich heavy cream.", ind: { "Tomato": 2, "Heavy Cream": 1, "Onion": 1, "Garlic": 1 } },
        { name: "Mushroom Cream", desc: "Earthy cream sauce loaded with mushrooms.", ind: { "Mushroom": 3, "Heavy Cream": 2, "Garlic": 1, "Butter": 1 } },
        { name: "Sausage & Pepper", desc: "Rustic, slightly spicy Italian sausage mix.", ind: { "Sausage": 2, "Tomato": 2, "Onion": 1, "Chili": 1 } },
        { name: "Lemon Butter Garlic", desc: "Bright and zesty butter sauce.", ind: { "Lemon": 1, "Butter": 2, "Garlic": 2, "Parmesan": 1 } },
        { name: "Cheesy Garlic", desc: "Indulgent garlic loaded with cheese.", ind: { "Garlic": 3, "Butter": 1, "Parmesan": 2, "Heavy Cream": 1 } },
        { name: "Spicy Sausage", desc: "Fiery tomato and sausage blend.", ind: { "Sausage": 2, "Chili": 2, "Tomato": 1, "Garlic": 1 } },
        { name: "Mushroom Bolognese", desc: "A vegetarian twist on the classic ragù.", ind: { "Mushroom": 2, "Ground Beef": 1, "Tomato": 2, "Onion": 1 } },
        { name: "Brown Butter Pine Nut", desc: "Nutty, aromatic browned butter.", ind: { "Butter": 3, "Pine Nuts": 2, "Parmesan": 1 } },
        { name: "Creamy Pesto", desc: "Rich, cream-infused traditional pesto.", ind: { "Basil": 2, "Heavy Cream": 1, "Parmesan": 1, "Pine Nuts": 1 } },
        { name: "Spicy Lemon", desc: "Bright but fiery olive oil based sauce.", ind: { "Lemon": 1, "Chili": 1, "Olive Oil": 2, "Garlic": 1 } },
        { name: "Meatball Sauce", desc: "Tomato sauce simmered with ground beef.", ind: { "Ground Beef": 2, "Tomato": 3, "Garlic": 1, "Onion": 1, "Salt": 1 } },
        { name: "Burro e Parmigiano", desc: "Ultimate comfort: butter and parmesan.", ind: { "Butter": 2, "Parmesan": 3 } },
        { name: "Olive & Caper Oil", desc: "Briny, Mediterranean oil-based sauce.", ind: { "Olives": 2, "Capers": 2, "Olive Oil": 2, "Garlic": 1 } },
        { name: "Creamy Pancetta", desc: "Luxurious cream accented with salty pork.", ind: { "Pancetta": 2, "Heavy Cream": 2, "Onion": 1, "Black Pepper": 1 } },
        { name: "Spicy Mushroom", desc: "Earthy mushrooms with a chili kick.", ind: { "Mushroom": 2, "Chili": 1, "Garlic": 1, "Olive Oil": 1 } },
        { name: "Three Cheese", desc: "Decadent melting of cheeses and cream.", ind: { "Parmesan": 2, "Pecorino": 2, "Heavy Cream": 1 } },
        { name: "Marcella's Onion Butter", desc: "Famous simple tomato and onion sauce.", ind: { "Tomato": 3, "Onion": 2, "Butter": 2 } },
        { name: "Garlic Tomato Cream", desc: "Balanced tomato with a heavy garlic punch.", ind: { "Tomato": 2, "Garlic": 2, "Heavy Cream": 1 } },
        { name: "Rustic Sausage Mushroom", desc: "Hearty mix of sausage and mushrooms.", ind: { "Sausage": 2, "Mushroom": 2, "Tomato": 1, "Olive Oil": 1 } }
    ];

    // --- State Variables ---
    let potState = {}; 
    let currentRecipe = null;
    let score = 0;
    const unlockedRecipes = new Set(); // Tracks learned recipes by name

    // --- DOM Elements ---
    const ingredientListDisplay = document.getElementById('ingredient-list');
    const potDisplay = document.getElementById('pot-contents');
    const messageDisplay = document.getElementById('message');
    const recipeNameDisplay = document.getElementById('recipe-name');
    const recipeHintDisplay = document.getElementById('recipe-hint');
    const scoreDisplay = document.getElementById('score');
    const unlockCountDisplay = document.getElementById('unlock-count');
    
    // Modals
    const modalOverlay = document.getElementById('modal-overlay');
    const modalBody = document.getElementById('modal-body');
    const successOverlay = document.getElementById('success-overlay');

    // --- Initialize Game ---
    function init() {
        // Render ingredient buttons
        for (let [name, emoji] of Object.entries(allIngredients)) {
            const btn = document.createElement('div');
            btn.className = 'ingredient';
            btn.innerHTML = `<span>${emoji}</span>${name}`;
            btn.addEventListener('click', () => {
                potState[name] = (potState[name] || 0) + 1;
                sounds.add();
                updatePot();
            });
            ingredientListDisplay.appendChild(btn);
        }
        
        renderEncyclopedia();
        loadNewOrder();
    }

    function renderEncyclopedia() {
        modalBody.innerHTML = '';
        unlockCountDisplay.textContent = unlockedRecipes.size;
        
        recipes.forEach((recipe, index) => {
            const recipeNum = index + 1;
            const card = document.createElement('div');
            
            if (unlockedRecipes.has(recipe.name)) {
                card.className = 'recipe-card';
                const ingText = Object.entries(recipe.ind)
                    .map(([item, qty]) => `${qty}x ${item}`)
                    .join(", ");
                    
                card.innerHTML = `
                    <h3><span class="recipe-num">#${recipeNum}</span>${recipe.name}</h3>
                    <p>${recipe.desc}</p>
                    <div class="ingredients-list">${ingText}</div>
                `;
            } else {
                card.className = 'locked-card';
                card.innerHTML = `<span class="locked-num">#${recipeNum}</span>🔒 Unknown Sauce`;
            }
            modalBody.appendChild(card);
        });
    }

    function loadNewOrder() {
        const randomIndex = Math.floor(Math.random() * recipes.length);
        currentRecipe = recipes[randomIndex];
        recipeNameDisplay.textContent = currentRecipe.name;
        
        // Generate hint text for the order slip
        const hintParts = Object.entries(currentRecipe.ind).map(([item, qty]) => `${qty} ${item}`);
        recipeHintDisplay.textContent = hintParts.join(", ");
        
        potState = {};
        updatePot();
        showMessage("Order up!", "#333");
    }

    function updatePot() {
        const items = Object.entries(potState).map(([key, val]) => `${key} x${val}`);
        potDisplay.innerHTML = items.length ? items.join('<br>') : 'Empty';
    }

    function showMessage(text, color) {
        messageDisplay.textContent = text;
        messageDisplay.style.color = color;
    }

    // --- Button Listeners ---
    document.getElementById('reset-btn').addEventListener('click', () => {
        potState = {};
        sounds.add();
        updatePot();
        showMessage("Pot emptied.", "#7f8c8d");
    });

    document.getElementById('skip-btn').addEventListener('click', () => {
        loadNewOrder();
    });

    // Encyclopedia Listeners
    document.getElementById('encyclopedia-btn').addEventListener('click', () => {
        sounds.openBook();
        modalOverlay.style.display = 'flex';
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
        sounds.add();
        modalOverlay.style.display = 'none';
    });

    modalOverlay.addEventListener('click', (e) => {
        if(e.target === modalOverlay) modalOverlay.style.display = 'none';
    });

    // Success Modal Listener
    document.getElementById('next-order-btn').addEventListener('click', () => {
        sounds.add();
        successOverlay.style.display = 'none';
        loadNewOrder();
    });

    // Cooking Logic
    document.getElementById('cook-btn').addEventListener('click', () => {
        sounds.cook();
        
        if (Object.keys(potState).length === 0) {
            showMessage("The pot is empty!", "#7f8c8d");
            sounds.fail();
            return;
        }

        let isPerfect = true;
        let hasExtraIngredients = false;
        
        // Check exact quantities
        for (let [item, targetAmount] of Object.entries(currentRecipe.ind)) {
            if ((potState[item] || 0) !== targetAmount) {
                isPerfect = false;
            }
        }
        // Check for extra rogue ingredients
        for (let item in potState) {
            if (!currentRecipe.ind[item]) {
                isPerfect = false;
                hasExtraIngredients = true;
            }
        }

        if (isPerfect) {
            sounds.win();
            score++;
            scoreDisplay.textContent = score;
            showMessage("", "#27ae60"); // Clear main screen message
            
            // Handle Encyclopedia Unlock
            let isNewUnlock = false;
            if (!unlockedRecipes.has(currentRecipe.name)) {
                unlockedRecipes.add(currentRecipe.name);
                isNewUnlock = true;
                renderEncyclopedia(); // Re-render to show the new card
            }
            
            // Trigger Success Popup
            document.getElementById('success-message').textContent = `You perfectly cooked the ${currentRecipe.name}!`;
            document.getElementById('unlock-message').textContent = isNewUnlock ? "📖 New sauce unlocked in the Encyclopedia!" : "";
            successOverlay.style.display = 'flex';
            
        } else if (hasExtraIngredients) {
            sounds.fail();
            showMessage("Customer complained! Weird flavor...", "#c0392b");
        } else {
            sounds.fail();
            showMessage("Not quite right. Check quantities!", "#e67e22");
        }
    });

    // Start
    init();
</script>
</body>
</html>
