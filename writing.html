<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Storytelling Mastery Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lora', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #e3dac9; margin: 0; color: #4a4a4a; }
        #quiz-card { background: #fdfaf6; padding: 40px; border-radius: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; border-top: 5px solid #556b2f; }
        h1 { font-family: 'Playfair Display', serif; color: #556b2f; }
        .option { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #cbbbb0; background: #fdfaf6; cursor: pointer; transition: 0.2s; text-align: center; }
        .option:hover { background: #e3dac9; }
        #next-btn { margin-top: 20px; padding: 10px 30px; background: #556b2f; color: #fdfaf6; border: none; cursor: pointer; display: none; }
        #stats { font-size: 0.8rem; color: #cc6633; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="quiz-card">
    <div id="screen">
        <h1>Storytelling Quiz</h1>
        <p>Test your knowledge on narrative structure and craft.</p>
        <button style="padding:10px 25px; background:#556b2f; color:#fdfaf6; border:none; cursor:pointer;" onclick="render()">Start Quiz</button>
    </div>
</div>

<script>
    const quizData = [
        { q: "What is the 'inciting incident' in a story?", a: "The event that sets the main plot in motion.", opts: ["The ending of the story.", "The event that sets the main plot in motion.", "The character's childhood backstory."] },
        { q: "What is 'Show, Don't Tell'?", a: "Using sensory details to let the reader experience the action.", opts: ["Writing shorter sentences.", "Using sensory details to let the reader experience the action.", "Telling the reader exactly how a character feels."] },
        { q: "What does 'Internal Motivation' refer to?", a: "The character's deep-seated emotional desires and needs.", opts: ["The character's physical strength.", "The character's deep-seated emotional desires and needs.", "The weather conditions in the story."] },
        { q: "What is 'Pacing' in storytelling?", a: "The speed at which the story unfolds.", opts: ["The amount of dialogue used.", "The speed at which the story unfolds.", "The complexity of the vocabulary."] },
        { q: "What is a 'Flat Character'?", a: "A character who lacks depth and stays the same throughout.", opts: ["A character who is physically short.", "A character who lacks depth and stays the same throughout.", "A character who is the protagonist."] }
    ];

    let current = 0;
    let score = 0;

    function render() {
        const data = quizData[current];
        document.getElementById('screen').innerHTML = `
            <div id="stats">Question ${current + 1} / ${quizData.length} | Score: ${score}</div>
            <h2>${data.q}</h2>
            <div id="options"></div>
            <button id="next-btn" onclick="nextQuestion()">Next &gt;&gt;</button>
        `;

        data.opts.forEach(o => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = o;
            btn.onclick = () => {
                document.querySelectorAll('.option').forEach(b => b.disabled = true);
                if(o === data.a) {
                    score++;
                    btn.style.backgroundColor = "#e3dac9";
                } else {
                    btn.style.backgroundColor = "#fdece6";
                }
                document.getElementById('next-btn').style.display = "inline-block";
            };
            document.getElementById('options').appendChild(btn);
        });
    }

    function nextQuestion() {
        current++;
        if(current < quizData.length) render();
        else document.getElementById('quiz-card').innerHTML = `<h1>Quiz Complete</h1><p>Final Score: ${score} / ${quizData.length}</p>`;
    }
</script>
</body>
</html>
