<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Country Quiz</title>
    <style>
        :root {
            --success: #27ae60;
            --danger: #c0392b;
            --hint: #d35400;
            --btn-bg: rgba(200, 200, 200, 0.3);
            --btn-hover: rgba(200, 200, 200, 0.6);
            --text-color: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0e0e0 0%, #f5f7fa 50%, #c3cfe2 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 700px;
            padding: 40px 30px;
            text-align: center;
            overflow: hidden;
            min-height: 750px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        #start-screen {
            padding: 30px 10px;
        }
        #start-screen h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: #2c3e50;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            letter-spacing: 1px;
        }
        #start-screen h2 {
            font-size: 1.4rem;
            font-weight: 300;
            margin-bottom: 40px;
            color: #556;
        }
        
        .primary-action-btn {
            background: #34495e;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 15px 50px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #2c3e50;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        .primary-action-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: #2c3e50;
        }
        .primary-action-btn:active {
            transform: translateY(1px);
        }

        h2#question-text {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: #2c3e50;
        }

        .flag-container {
            width: 100%;
            aspect-ratio: 16 / 9; 
            background-color: rgba(0, 0, 0, 0.05);
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .flag-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        /* Answer options: Darker tone with white text */
        .btn {
            background-color: #34495e; 
            color: #ffffff; 
            border: 1px solid #2c3e50;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover:not(:disabled) {
            background-color: #2c3e50;
            border-color: #1a252f;
        }
        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }
        .btn.correct { 
            background-color: var(--success) !important; 
            color: white !important;
            border-color: var(--success) !important;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.3);
        }
        .btn.wrong { 
            background-color: var(--danger) !important; 
            color: white !important;
            border-color: var(--danger) !important;
        }
        
        #quiz-screen {
            display: none;
            width: 100%;
            flex-direction: column;
        }
        
        .fact-box {
            background: rgba(230, 230, 230, 0.5);
            border-left: 5px solid var(--hint);
            padding: 18px;
            margin: 20px 0;
            text-align: left;
            border-radius: 0 8px 8px 0;
            display: none; 
            font-size: 1rem;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: #34495e;
        }
        .fact-box h3 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 8px;
            color: #2c3e50;
        }
        .fact-item {
            margin-bottom: 10px;
        }
        .fact-item strong {
            color: #e67e22;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        #next-btn-container {
            display: none;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 600px) {
            body {
                padding: 10px 0;
                align-items: center; 
            }
            .container {
                width: 95%;
                padding: 25px 15px;
                min-height: 90vh; 
                justify-content: flex-start;
            }
            #start-screen h1 {
                font-size: 2.2rem;
            }
            #start-screen h2 {
                font-size: 1.1rem;
            }
            h2#question-text {
                font-size: 1.3rem;
                margin-bottom: 15px;
            }
            .flag-container {
                aspect-ratio: 1 / 1; 
                margin-bottom: 15px;
            }
            .options-grid {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-bottom: 15px;
            }
            .btn {
                padding: 12px 15px;
                font-size: 1rem;
            }
            .fact-box {
                font-size: 0.9rem;
                padding: 12px;
                margin: 10px 0;
            }
            .primary-action-btn {
                padding: 12px 30px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<audio id="bg-music" src="global-fusion.mp3" loop></audio>

<div class="container">
    <div id="start-screen">
        <h1>Global Country Quiz</h1>
        <h2>Test your geography knowledge</h2>
        <button class="primary-action-btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <div id="quiz-screen">
        <h2 id="question-text">Which country/territory is this?</h2>
        
        <div class="flag-container">
            <img id="flag-img" src="" alt="Country Flag">
        </div>

        <div class="fact-box" id="fact-box">
            <h3 id="fact-title">Hints</h3>
            <div class="fact-item" id="fact-geo"></div>
            <div class="fact-item" id="fact-nickname"></div>
            <div class="fact-item" id="fact-most"></div>
        </div>
        
        <div id="options-container" class="options-grid">
        </div>

        <div id="next-btn-container">
            <button class="primary-action-btn" id="next-btn" onclick="loadNextQuestion()">Next Question</button>
        </div>
    </div>
</div>

    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function startBackgroundMusic() {
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.2; 
        bgMusic.play().catch(error => {
            console.log("Autoplay prevented by browser:", error);
        });
    }

    function playSound(type) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'start') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'correct') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

        {en: "Uzbekistan", zh: "烏茲別克"}, {en: "Turkmenistan", zh: "土庫曼"}, {en: "Azerbaijan", zh: "阿塞拜疆"},
        {en: "Georgia", zh: "格魯吉亞"}, {en: "Armenia", zh: "亞美尼亞"}, {en: "San Marino", zh: "聖馬力諾"},
        {en: "Malta", zh: "馬耳他"}, {en: "Cyprus", zh: "塞浦路斯"}, {en: "Austria", zh: "奧地利"},
        {en: "Croatia", zh: "克羅地亞"}, {en: "Saint Vincent and Grenadines", zh: "聖文森特和格林納丁斯"}, {en: "Saint Lucia", zh: "聖盧西亞"},
        {en: "Antigua and Barbuda", zh: "安提瓜和巴布達"}, {en: "Dominica", zh: "多米尼克"}, {en: "Saint Kitts and Nevis", zh: "聖基茨和尼維斯"},
        {en: "Andorra", zh: "安道爾"}, {en: "Moldova", zh: "摩爾多瓦"}, {en: "Monaco", zh: "摩納哥"},
        {en: "Liechtenstein", zh: "列支敦士登"}, {en: "Luxembourg", zh: "盧森堡"}, {en: "Kosovo", zh: "科索沃"},
        {en: "Timor-Leste", zh: "東帝汶"}, {en: "Seychelles", zh: "塞舌爾"}, {en: "Tanzania", zh: "坦桑尼亞"},
        {en: "Malawi", zh: "馬拉維"}, {en: "Comoros", zh: "科摩羅"}, {en: "Mauritius", zh: "毛里求斯"},
        {en: "Afghanistan", zh: "阿富汗"}, {en: "Iran", zh: "伊朗"}, {en: "Iraq", zh: "伊拉克"},
        {en: "Syria", zh: "敘利亞"}, {en: "Lebanon", zh: "黎巴嫩"}, {en: "Israel", zh: "以色列"},
        {en: "Palestine", zh: "巴勒斯坦"}, {en: "Faroe Islands", zh: "法羅群島"}
    ];

    const allCountryNames = [...distractorNames, ...countryData.map(c => ({en: c.en, zh: c.zh}))];

    let currentQuestion = null;
    let questionsPool = [...countryData];

    function startQuiz() {
        initAudio();
        playSound('start');
        startBackgroundMusic();
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'flex';
        loadNextQuestion();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function loadNextQuestion() {
        document.getElementById('next-btn-container').style.display = 'none';
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        if (questionsPool.length === 0) {
            questionsPool = [...countryData];
        }
        const qIndex = Math.floor(Math.random() * questionsPool.length);
        currentQuestion = questionsPool.splice(qIndex, 1)[0];

        document.getElementById('flag-img').src = currentQuestion.img;
        document.getElementById('flag-img').onerror = function() {
            this.src = 'https://via.placeholder.com/640x360?text=Image+Missing+(' + currentQuestion.img + ')';
        };

        document.getElementById('fact-title').innerHTML = `Hints`;
        document.getElementById('fact-geo').innerHTML = `<strong>Location:</strong><br>${currentQuestion.geoEn}`;
        document.getElementById('fact-nickname').innerHTML = `<strong>Nickname:</strong><br>${currentQuestion.nickEn}`;
        document.getElementById('fact-most').innerHTML = `<strong>"The Most":</strong><br>${currentQuestion.mostEn}`;
        
        document.getElementById('fact-box').style.borderLeftColor = 'var(--hint)';
        document.getElementById('fact-box').style.display = 'block';

        let options = [{ en: currentQuestion.en, zh: currentQuestion.zh, isCorrect: true }];
        
        let shuffledDistractors = shuffleArray([...allCountryNames.filter(c => c.en !== currentQuestion.en)]);
        for (let i = 0; i < 3; i++) {
            options.push({ en: shuffledDistractors[i].en, zh: shuffledDistractors[i].zh, isCorrect: false });
        }

        options = shuffleArray(options);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = `${opt.en}<br>${opt.zh}`;
            btn.onclick = () => checkAnswer(btn, opt.isCorrect);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(clickedBtn, isCorrect) {
        playSound(isCorrect ? 'correct' : 'wrong');
        
        speakAnswer(currentQuestion.en, currentQuestion.zh);

        const buttons = document.getElementById('options-container').querySelectorAll('.btn');
        
        buttons.forEach(btn => {
            btn.disabled = true;
            if (btn.innerHTML.includes(currentQuestion.en)) {
                btn.classList.add('correct');
            }
        });

        if (!isCorrect) {
            clickedBtn.classList.add('wrong');
        }

        const resultPrefix = isCorrect ? 'Correct: ' : 'Incorrect: ';
        document.getElementById('fact-title').innerHTML = `${resultPrefix} ${currentQuestion.en}`;
        
        document.getElementById('fact-box').style.borderLeftColor = isCorrect ? 'var(--success)' : 'var(--danger)';

        document.getElementById('next-btn-container').style.display = 'block';
    }
</script>
