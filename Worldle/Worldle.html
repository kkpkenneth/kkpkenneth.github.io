<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLDLE</title>
    <style>
        :root {
            --bg: #121213;
            --panel: #1a1a1b;
            --text: #ffffff;
            --primary: #538d4e;
            --wrong: #3a3a3c;
            --hint: #b59f3b;
            --error: #e74c3c;
        }

        body {
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .container { width: 100%; max-width: 500px; text-align: center; padding: 20px; }
        h1 { font-size: 2.8rem; letter-spacing: 0.4rem; margin: 10px 0; border-bottom: 2px solid var(--wrong); padding-bottom: 10px; }

        #hint-display {
            background: var(--panel);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 1.1rem;
            border-left: 6px solid var(--hint);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #word-display {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 0.4rem;
            margin: 30px 0;
            text-transform: uppercase;
        }

        .keyboard { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; padding: 10px; }

        .key {
            background: var(--wrong);
            color: white;
            border: none;
            padding: 15px 0;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .key:disabled { opacity: 0.3; }
        .key.correct { background: var(--primary) !important; }
        .key.incorrect { background: #000 !important; color: #555; }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-main:hover { transform: scale(1.05); }
        #next-btn { display: none; margin: 20px auto; }
        .stats { margin-top: 20px; color: #818384; font-weight: bold; }
    </style>
</head>
<body>

<div id="start-overlay">

    <button class="btn-main" onclick="startGame()">START GAME</button>

    <button class="btn-main" id="next-btn" onclick="initRound()">NEXT</button>
</div>

    let current = {}, guessed = [], lives = 6, streak = 0, pool = [...countries];

    function initRound() {
        if (pool.length === 0) pool = [...countries];
        current = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
        guessed = []; 
        lives = 6;
        
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('status').innerText = "";
        document.getElementById('lives-count').innerText = lives;
        document.getElementById('hint-display').innerText = "HINT: " + current.h;
        render();
        renderKeys();
    }

    function render() {
        // Convert the name to uppercase for comparison
        const upperName = current.n.toUpperCase();
        
        const display = upperName.split('').map((c, index) => {
            if (c === " ") return "&nbsp;";
            // Check if the character has been guessed
            return guessed.includes(c) ? current.n[index] : "_";
        }).join(" ");
        
        document.getElementById('word-display').innerHTML = display;
        
        // Check for victory by looking for remaining underscores
        if (!display.includes("_")) {
            streak++;
            document.getElementById('streak-count').innerText = streak;
            document.getElementById('status').innerText = "BINGO!";
            document.getElementById('status').style.color = "var(--primary)";
            endRound();
        }
    }

    function renderKeys() {
        const kb = document.getElementById('keyboard'); 
        kb.innerHTML = "";
        const upperName = current.n.toUpperCase(); // Pre-convert for the click check

        "QWERTYUIOPASDFGHJKLZXCVBNM".split('').forEach(k => {
            const b = document.createElement('button');
            b.innerText = k; 
            b.className = 'key';
            b.onclick = () => {
                b.disabled = true;
                // Check against the uppercase version of the name
                if (upperName.includes(k)) {
                    guessed.push(k); 
                    b.classList.add('correct'); 
                    render();
                } else {
                    lives--; 
                    b.classList.add('incorrect');
                    document.getElementById('lives-count').innerText = lives;
                    if (lives <= 0) {
                        streak = 0; 
                        document.getElementById('streak-count').innerText = streak;
                        document.getElementById('status').innerText = "LOST: " + current.n;
                        document.getElementById('status').style.color = "var(--error)";
                        endRound();
                    }
                }
            };
            kb.appendChild(b);
        });
    }

    function endRound() {
        document.querySelectorAll('.key').forEach(k => k.disabled = true);
        document.getElementById('next-btn').style.display = 'block';
    }
