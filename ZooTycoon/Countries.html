<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Guess the Country Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<script>
const disabledKeys=["u","I"];
const showAlert=e=>{
  e.preventDefault();
  alert("Hahaha, I challenge you, valiant soldier, to uproot the source codes yourself!!!");
}
document.addEventListener("contextmenu",e=>{showAlert(e);});
document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&disabledKeys.includes(e.key)||e.key==="F12"){showAlert(e);}
});
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
*{
  margin:0; padding:0; box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}
body{
  display:flex; align-items:center; justify-content:center;
  min-height:100vh;
  background:#1BB295;
}
.wrapper{
  width:430px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  overflow:hidden;
}
.wrapper h1{
  font-size:25px;
  font-weight:500;
  padding:20px 25px;
  border-bottom:1px solid #ccc;
}
.wrapper .content{
  margin:25px 25px 35px;
}
.content .inputs{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}
.inputs input{
  height:57px; width:56px; margin:4px;
  font-size:24px; font-weight:500;
  color:#1ba98c;
  text-align:center;
  border-radius:5px;
  background:none;
  pointer-events:none;
  text-transform:uppercase;
  border:1px solid #B5B5B5;
}
.typing-input{opacity:0;z-index:-999;position:absolute;pointer-events:none;}
.details{margin:20px 0 25px;}
.details p{font-size:19px;margin-bottom:10px;}
.reset-btn{
  width:100%;
  border:none;cursor:pointer;
  color:#fff;outline:none;
  padding:15px 0;
  font-size:17px;border-radius:5px;
  background:#1BB295;
  transition:all 0.3s ease;
}
.reset-btn:hover{background:#18a589;}
.country-image{
  width:100%;height:250px;
  object-fit:cover;
  border-bottom:1px solid #ccc;
}
@media screen and (max-width:460px){
  .wrapper{width:100%;}
  .wrapper h1{font-size:22px;padding:16px 20px;}
  .wrapper .content{margin:25px 20px 35px;}
  .inputs input{height:51px;width:50px;margin:3px;font-size:22px;}
  .details p{font-size:17px;}
  .content .reset-btn{padding:14px 0;font-size:16px;}
}
#next,#back{
  padding:170px 10px;
  background-color:#a7dbef;
  transform:translate(0%,-50%);
  color:#000;
  text-decoration:none;
}
#back{position:absolute;top:380px;left:0;font-size:20px;border-radius:0 15px 15px 0;}
#next{position:absolute;top:380px;right:0;font-size:20px;border-radius:15px 0 0 15px;}
@media only screen and (max-width:600px){
  #next,#back{display:none;}
}
</style>
</head>
<body>
<div class="wrapper">
  <img src="images/default.jpg" class="country-image" alt="Country Image">
  <h1>Guess the Country</h1>
  <div class="content">
    <input type="text" class="typing-input" maxlength="1">
    <div class="inputs"></div>
    <div class="details">
      <p class="hint">Hint: <span></span></p>
      <p class="guess-left">Remaining guesses: <span></span></p>
      <p class="wrong-letter">Wrong letters: <span></span></p>
    </div>
    <button class="reset-btn">Reset Game</button>
  </div>
</div>

<a id="back" href="task66.html">Back</a>
<a id="next" href="task68.html">Next</a>

<script>
let wordList = [
  {word:"japan", hint:"Pokemon Go", image:"images/japan.jpg"},
  {word:"china", hint:"Giant Pandas", image:"images/china.jpg"},
  {word:"jamaica", hint:"James Bond", image:"images/jamaica.jpg"},
  {word:"sweden", hint:"IKEA", image:"images/sweden.jpg"},
  {word:"norway", hint:"Vikings", image:"images/norway.jpg"},
  {word:"brazil", hint:"Largest Coffee Producer", image:"images/brazil.jpg"},
  {word:"italy", hint:"Battle of Oranges", image:"images/italy.jpg"},
  {word:"peru", hint:"Ceviche", image:"images/peru.jpg"},
  {word:"ireland", hint:"Colcannon", image:"images/ireland.jpg"},
  {word:"scotland", hint:"Gordon Ramsay", image:"images/scotland.jpg"},
  {word:"greece", hint:"The Olympic Games", image:"images/greece.jpg"},
  {word:"russia", hint:"Ballet", image:"images/russia.jpg"},
  {word:"mexico", hint:"Sombrero", image:"images/mexico.jpg"},
  {word:"spain", hint:"Flamenco", image:"images/spain.jpg"},
  {word:"singapore", hint:"Laksa", image:"images/singapore.jpg"},
  {word:"thailand", hint:"Tom Yum Soup", image:"images/thailand.jpg"},
  {word:"switzerland", hint:"Cheese", image:"images/switzerland.jpg"},
  {word:"france", hint:"Macaron", image:"images/france.jpg"},
  {word:"germany", hint:"Pretzels", image:"images/germany.jpg"},
  {word:"jordan", hint:"Petra", image:"images/jordan.jpg"},
  {word:"netherlands", hint:"Tulips", image:"images/netherlands.jpg"},
  {word:"denmark", hint:"Copenhagen", image:"images/denmark.jpg"},
  {word:"finland", hint:"Santa Claus", image:"images/finland.jpg"},
  {word:"austria", hint:"Classical Music", image:"images/austria.jpg"},
  {word:"madagascar", hint:"Vanilla", image:"images/madagascar.jpg"},
  {word:"kenya", hint:"Safari", image:"images/kenya.jpg"},
  {word:"vietnam", hint:"Pho", image:"images/vietnam.jpg"}
];

const inputs = document.querySelector(".inputs"),
hintTag = document.querySelector(".hint span"),
guessLeft = document.querySelector(".guess-left span"),
wrongLetter = document.querySelector(".wrong-letter span"),
resetBtn = document.querySelector(".reset-btn"),
typingInput = document.querySelector(".typing-input"),
countryImg = document.querySelector(".country-image");

let word, maxGuesses, incorrectLetters = [], correctLetters = [];

function randomWord() {
  let ranItem = wordList[Math.floor(Math.random() * wordList.length)];
  word = ranItem.word;
  maxGuesses = word.length >= 5 ? 8 : 6;
  correctLetters = []; incorrectLetters = [];
  hintTag.innerText = ranItem.hint;
  guessLeft.innerText = maxGuesses;
  wrongLetter.innerText = incorrectLetters;
  countryImg.src = ranItem.image; // update image

  let html = "";
  for (let i = 0; i < word.length; i++) {
    html += `<input type="text" disabled>`;
  }
  inputs.innerHTML = html;
}
randomWord();

function initGame(e) {
  let key = e.target.value.toLowerCase();
  if(key.match(/^[A-Za-z]+$/) && !incorrectLetters.includes(` ${key}`) && !correctLetters.includes(key)) {
    if(word.includes(key)) {
      for (let i = 0; i < word.length; i++) {
        if(word[i] == key) {
          correctLetters += key;
          inputs.querySelectorAll("input")[i].value = key;
        }
      }
    } else {
      maxGuesses--;
      incorrectLetters.push(` ${key}`);
    }
    guessLeft.innerText = maxGuesses;
    wrongLetter.innerText = incorrectLetters;
  }
  typingInput.value = "";

  setTimeout(() => {
    if(correctLetters.length === word.length) {
      alert(`Congrats! You found the word ${word.toUpperCase()}`);
      randomWord();
    } else if(maxGuesses < 1) {
      alert("Game over! You don't have remaining guesses");
      for(let i = 0; i < word.length; i++) {
        inputs.querySelectorAll("input")[i].value = word[i];
      }
    }
  }, 100);
}

resetBtn.addEventListener("click", randomWord);
typingInput.addEventListener("input", initGame);
inputs.addEventListener("click", () => typingInput.focus());
document.addEventListener("keydown", () => typingInput.focus());
</script>
</body>
</html>
