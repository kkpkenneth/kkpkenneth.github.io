        .split-height { height: 450px; }

            padding: 20px 40px;
            border-radius: 2px;
            backdrop-filter: blur(5px);

        .place-tag {
            background-color: white;
            color: #555;
            padding: 10px 20px;
            font-size: 13px;
            border-radius: 4px;

            letter-spacing: 1px;
            white-space: nowrap;
            text-decoration: none; 
            transition: all 0.3s ease;
