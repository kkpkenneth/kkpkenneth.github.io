<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Folding Sandbox</title>
    <style>
        :root {
            --bg-color: #0f0c29;
            --panel-bg: #302b63;
            --accent: #00f2fe;
            --text-color: #ffffff;
            
            /* Camera Variables */
            --cam-pitch: 20deg;
            --cam-yaw: -30deg;
            --cam-zoom: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* --- UI Sidebar --- */
        .sidebar {
            width: 350px;
            background: rgba(15, 12, 41, 0.95);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 5px 0 25px rgba(0,0,0,0.8);
            z-index: 10;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .sidebar h2 {
            font-size: 1.8rem;
            color: var(--accent);
            text-shadow: 0 2px 10px rgba(0, 242, 254, 0.4);
            margin-bottom: 5px;
        }

        .sidebar p {
            font-size: 0.9rem;
            color: #bdc3c7;
            margin-bottom: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--accent);
            color: #0f0c29;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 10px 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ecf0f1;
        }

        .val-display {
            color: var(--accent);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* --- 3D Scene --- */
        .scene {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2000px;
            overflow: hidden;
            cursor: grab;
        }

        .scene:active {
            cursor: grabbing;
        }

        .camera {
            transform-style: preserve-3d;
            transform: scale(var(--cam-zoom)) rotateX(var(--cam-pitch)) rotateY(var(--cam-yaw));
            transition: transform 0.1s linear;
        }

        /* --- Hierarchical Paper Segments --- */
        .segment {
            position: absolute;
            width: 70px;
            height: 200px;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            /* Center the first segment, others attach to the right edge */
            top: -100px;
        }

        /* The very first segment is centered in the camera */
        #paper-root > .segment {
            left: -35px;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-right: 1px solid rgba(0,0,0,0.2);
            border-left: 1px solid rgba(255,255,255,0.3);
        }

        .front {
            /* Front receives dynamic colors via JS */
            transform: translateZ(0.2px);
        }

        .back {
            background: #fdfbfb;
            transform: translateZ(-0.2px) rotateY(180deg);
        }

        /* Crease visualization */
        .crease {
            position: absolute;
            left: 0; top: 0;
            width: 2px; height: 100%;
            background: rgba(0, 0, 0, 0.15);
            transform: translateZ(0.5px);
        }

    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <h2>Free Fold Sandbox</h2>
            <p>Sculpt the 10-segment paper strip by adjusting each hinge independently.</p>
        </div>

        <div class="btn-group">
            <button onclick="applyPreset('flat')">Flatten</button>
            <button onclick="applyPreset('zigzag')">Zig-Zag</button>
            <button onclick="applyPreset('spiral')">Spiral</button>
            <button onclick="applyPreset('random')">Random</button>
        </div>

        <div class="divider"></div>

        <div class="control-group">
            <label>Camera Zoom <span class="val-display" id="val-zoom">1.0</span></label>
            <input type="range" id="camZoom" min="0.3" max="2.5" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Camera Pitch (X) <span class="val-display" id="val-pitch">20°</span></label>
            <input type="range" id="camPitch" min="-90" max="90" value="20">
        </div>
        <div class="control-group">
            <label>Camera Yaw (Y) <span class="val-display" id="val-yaw">-30°</span></label>
            <input type="range" id="camYaw" min="-180" max="180" value="-30">
        </div>

        <div class="divider"></div>
        <h3 style="font-size: 1rem; color: #bdc3c7; margin-bottom: 5px;">Hinge Controls</h3>
        
        <div id="hinge-controls">
            <!-- Dynamically generated sliders go here -->
        </div>
    </aside>

    <main class="scene" id="scene">
        <div class="camera" id="camera">
            <div id="paper-root">
                <!-- Segments generated via JS -->
            </div>
        </div>
    </main>

    <script>
        const NUM_SEGMENTS = 10;
        const paperRoot = document.getElementById('paper-root');
        const hingeControls = document.getElementById('hinge-controls');
        const segments = [];
        const sliders = [];

        // 1. Generate the Paper Segments and Sliders
        let parentNode = paperRoot;

        for (let i = 0; i < NUM_SEGMENTS; i++) {
            // Create Paper Segment
            const seg = document.createElement('div');
            seg.className = 'segment';
            
            // Nested hierarchy: Each piece attaches to the end (right side) of the previous piece
            if (i > 0) seg.style.left = '100%'; 

            const front = document.createElement('div');
            front.className = 'face front';
            // Gradient hue shift for a beautiful visual spectrum
            front.style.background = `hsl(${(i * 36) % 360}, 80%, 60%)`;

            const back = document.createElement('div');
            back.className = 'face back';

            seg.appendChild(front);
            seg.appendChild(back);
            
            // Add a crease line to the hinges
            if (i > 0) {
                const crease = document.createElement('div');
                crease.className = 'crease';
                seg.appendChild(crease);
            }

            parentNode.appendChild(seg);
            segments.push(seg);
            parentNode = seg; // Make this segment the parent for the next loop iteration

            // Create Hinge Slider (Skip the first piece as it is the base)
            if (i > 0) {
                const group = document.createElement('div');
                group.className = 'control-group';
                
                const label = document.createElement('label');
                label.innerHTML = `Hinge ${i} <span class="val-display" id="val-hinge-${i}">0°</span>`;
                
                const slider = document.createElement('input');
                slider.type = 'range';
                slider.min = '-175'; // Maxed at 175 to avoid z-fighting clipping
                slider.max = '175';
                slider.value = '0';
                
                slider.addEventListener('input', (e) => {
                    const angle = e.target.value;
                    document.getElementById(`val-hinge-${i}`).innerText = `${angle}°`;
                    // Fold along the Y axis, add microscopic Z translation to stack cleanly
                    segments[i].style.transform = `rotateY(${angle}deg) translateZ(0.1px)`;
                });

                group.appendChild(label);
                group.appendChild(slider);
                hingeControls.appendChild(group);
                sliders.push(slider);
            }
        }

        // 2. Presets Configuration
        function applyPreset(type) {
            sliders.forEach((slider, index) => {
                let angle = 0;
                if (type === 'flat') angle = 0;
                if (type === 'zigzag') angle = index % 2 === 0 ? 150 : -150;
                if (type === 'spiral') angle = 45;
                if (type === 'random') angle = Math.floor(Math.random() * 350) - 175;

                slider.value = angle;
                slider.dispatchEvent(new Event('input')); // Trigger update
            });
        }

        // 3. Camera Controls (Sliders)
        const rootVars = document.documentElement.style;
        
        document.getElementById('camZoom').addEventListener('input', (e) => {
            rootVars.setProperty('--cam-zoom', e.target.value);
            document.getElementById('val-zoom').innerText = e.target.value;
        });

        document.getElementById('camPitch').addEventListener('input', (e) => {
            rootVars.setProperty('--cam-pitch', `${e.target.value}deg`);
            document.getElementById('val-pitch').innerText = `${e.target.value}°`;
        });

        document.getElementById('camYaw').addEventListener('input', (e) => {
            rootVars.setProperty('--cam-yaw', `${e.target.value}deg`);
            document.getElementById('val-yaw').innerText = `${e.target.value}°`;
        });

        // 4. Mouse Drag Camera Rotation (for the 3D scene)
        let isDragging = false;
        let startX, startY;
        let currentYaw = -30, currentPitch = 20;

        const scene = document.getElementById('scene');
        const pitchSlider = document.getElementById('camPitch');
        const yawSlider = document.getElementById('camYaw');

        scene.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            
            currentYaw += dx * 0.5;
            currentPitch -= dy * 0.5;
            
            // Clamp Pitch
            if(currentPitch > 90) currentPitch = 90;
            if(currentPitch < -90) currentPitch = -90;

            // Update UI sliders and CSS variables
            yawSlider.value = currentYaw % 360;
            pitchSlider.value = currentPitch;
            
            yawSlider.dispatchEvent(new Event('input'));
            pitchSlider.dispatchEvent(new Event('input'));

            startX = e.clientX;
            startY = e.clientY;
        });

        // Initial default state
        applyPreset('spiral');
        setTimeout(() => applyPreset('zigzag'), 800);
        setTimeout(() => applyPreset('flat'), 1600);

    </script>
</body>
</html>
