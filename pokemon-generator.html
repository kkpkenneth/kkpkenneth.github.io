<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Dex Generator</title>

    <meta property="og:title" content="Monsters">
    <meta property="og:description" content="Generate your own monster">
    <meta property="og:image" content="https://kkpkenneth.github.io/Images/Countries/048-antarctica.jpg">
    <meta property="og:url" content="https://kkpkenneth.github.io/">
    <meta property="og:type" content="website">

    <style>
        :root { 
            --pokedex-red: #cc0000; 
            --pokedex-dark: #222; 
            --text-light: #f0f0f0; 
            --accent: #ffcb05; 
        }
        
        * { box-sizing: border-box; }

        body { 
            background-color: #333; 
            color: var(--text-light); 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            margin: 0;
            display: flex; 
            justify-content: center; 
        }

        .container { 
            max-width: 1000px; 
            width: 100%; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            background: var(--pokedex-red); 
            padding: 20px; 
            border-radius: 20px; 
            border: 8px solid #000; 
        }

        .panel { 
            background: var(--pokedex-dark); 
            padding: 20px; 
            border-radius: 10px; 
            height: 85vh; 
            overflow-y: auto; 
        }

        h1, h2 { color: var(--accent); text-transform: uppercase; margin-top: 0; }
        .control-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.75rem; color: #ccc; }
        select, textarea { width: 100%; padding: 8px; margin-top: 4px; background: #444; color: white; border: 1px solid var(--accent); border-radius: 4px; }
        button { width: 100%; padding: 12px; background: var(--accent); border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .trait-name { color: var(--accent); font-size: 0.7rem; text-transform: uppercase; }
        .trait-value { font-size: 1rem; margin-bottom: 8px; display: block; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container {
                grid-template-columns: 1fr;
                gap: 15px;
                padding: 15px;
                border-width: 4px;
                border-radius: 15px;
            }
            .panel {
                height: auto;
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="panel" id="controls">
        <h1>Dex Forge</h1>
        <div class="control-group">
            <label>Type 1</label>
            <select id="type1"></select>
        </div>
        <div class="control-group">
            <label>Type 2</label>
            <select id="type2"><option value="">None</option></select>
        </div>
    </div>

    <div class="panel">
        <h2>Entry Profile</h2>
        <div id="res-display"></div>
        <textarea id="prompt-text" rows="12"></textarea>
        <button onclick="copyPrompt()">COPY PROMPT</button>
    </div>
</div>

<script>
    const types = ["Normal", "Fire", "Water", "Grass", "Electric", "Ice", "Fighting", "Poison", "Ground", "Flying", "Psychic", "Bug", "Rock", "Ghost", "Dragon", "Dark", "Steel", "Fairy"];
    
    // Added stage to the dataset
    const data = {
        stage: ["Baby", "Basic", "Evolved", "Legendary"],
        habitat: ["Forest", "Mountain", "Ocean", "Cave", "Urban", "Volcanic", "Desert"],
        torso: ["Bipedal", "Quadrupedal", "Serpentine", "Floating", "Insectoid", "Amorphous"],
        head: ["Spiky crest", "Long snout", "Pointed ears", "Multiple eyes", "Horned", "Beak"],
        appendages: ["Scythe claws", "Webbed flippers", "Tentacles", "Prehensile vines", "Hover pods", "Heavy hooves"],
        texture: ["Glossy chitin", "Coarse fur", "Crystalline scales", "Soft rubbery skin", "Moss-covered", "Metallic plating"],
        tail: ["Bushy", "Club-tipped", "Whip-like", "Fan-shaped", "Stinger-tipped", "None"],
        colorPalette: ["Neon and Dark", "Pastel and Metallic", "Earth tones", "Camo-pattern", "High-contrast"],
        aura: ["Crackling electricity", "Steaming mist", "Floating embers", "Shimmering light", "Poisonous vapor"],
        eyes: ["Slanted", "Large circular", "Rectangular pupils", "Opaque"],
        pattern: ["Striped", "Spotted", "Chevron-patterned", "Gradient", "Bioluminescent nodes"]
    };

    function init() {
        const controls = document.getElementById('controls');
        
        document.getElementById('type1').innerHTML = types.map(t => `<option value="${t}">${t}</option>`).join('');
        document.getElementById('type2').innerHTML = `<option value="">None</option>` + types.map(t => `<option value="${t}">${t}</option>`).join('');

        Object.keys(data).forEach(key => {
            controls.innerHTML += `<div class="control-group"><label>${key.toUpperCase()}</label><select id="${key}">${data[key].map(v => `<option value="${v}">${v}</option>`).join('')}</select></div>`;
        });
        
        controls.innerHTML += `<button onclick="randomizeAll()">GENERATE NEW ENTRY</button>`;
        document.querySelectorAll('select').forEach(s => s.addEventListener('change', update));
        randomizeAll();
    }

    function update() {
        let type1Val = document.getElementById('type1').value;
        let type2Val = document.getElementById('type2').value;
        let typeString = `${type1Val}${type2Val ? '/' + type2Val : ''}`;
        
        let displayHTML = `<span class="trait-name">Types</span><span class="trait-value">${typeString}</span>`;
        
        // Gather all values into an object for easier prompt construction
        const v = {};
        Object.keys(data).forEach(key => {
            const rawValue = document.getElementById(key).value;
            v[key] = rawValue.toLowerCase();
            displayHTML += `<span class="trait-name">${key}</span><span class="trait-value">${rawValue}</span>`;
        });

        document.getElementById('res-display').innerHTML = displayHTML;

        // Build a grammatically correct paragraph
        let tailText = v.tail === 'none' ? 'no tail' : `a ${v.tail} tail`;
        
        let promptText = `Professional Pokémon character design of a ${v.stage}-stage, ${typeString}-type Pokémon native to ${v.habitat} habitats. `;
        promptText += `It features a ${v.torso} body structure covered in ${v.texture}, with a ${v.colorPalette} color scheme and a ${v.pattern} pattern. `;
        promptText += `Its head is defined by ${v.eyes} eyes and ${v.head}. `;
        promptText += `The design includes ${v.appendages} and ${tailText}. `;
        promptText += `It emits an aura of ${v.aura}. `;
        promptText += `High quality, Ken Sugimori art style, official Pokémon game aesthetic, clean background.`;

        document.getElementById('prompt-text').value = promptText;
    }

    function randomizeAll() {
        document.querySelectorAll('select').forEach(s => s.selectedIndex = Math.floor(Math.random() * s.options.length));
        update();
    }

    function copyPrompt() { 
        navigator.clipboard.writeText(document.getElementById('prompt-text').value); 
    }

    init();
</script>
</body>
</html>
