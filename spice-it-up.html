<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spice-It-Up: Gradient Edition</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(135deg, #a8e063 0%, #2e7d32 100%); 
            margin: 0; padding: 15px; 
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden;
        }
        /* Start Screen Styles */
        #startScreen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(46, 125, 50, 0.95); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        .start-btn {
            background: white; color: #2e7d32; padding: 20px 40px;
            font-size: 1.5rem; border-radius: 50px; border: none; cursor: pointer;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card { 
            background: #ffffff; padding: 25px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 50, 0, 0.3); 
            width: 100%; max-width: 400px; border-top: 8px solid #1b5e20;
            position: relative; box-sizing: border-box;
        }
        h1 { font-size: 1.4rem; color: #1b5e20; margin-top: 0; display: flex; align-items: center; gap: 8px; }
        #question { font-size: 1.1rem; margin-bottom: 25px; line-height: 1.4; color: #2e7d32; font-weight: 500;}
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        button { 
            padding: 18px; cursor: pointer; border: none; border-radius: 12px; 
            background: #2e7d32; color: white; font-size: 1rem; font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .cat-btn { background: #1b5e20; padding: 12px; font-size: 0.85rem; margin-bottom: 20px; width: 100%; border-radius: 8px; }
        #drawer { position: fixed; top: 0; right: -320px; width: 280px; height: 100%; background: #f1f8e9; transition: 0.3s; padding: 20px; z-index: 20; box-shadow: -4px 0 15px rgba(0,0,0,0.3); }
        #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 15; }
        #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 30, 0, 0.85); z-index: 30; align-items: center; justify-content: center; }
        .modal { background: #ffffff; padding: 25px; border-radius: 15px; width: 85%; max-width: 350px; text-align: center; border: 4px solid #2e7d32; }
    </style>
</head>
<body>

<div id="startScreen">
    <h1>🌿 Spice-It-Up!</h1>
    <p>Test your culinary knowledge.</p>
    <button class="start-btn" onclick="startGame()">START COOKING</button>
</div>

<audio id="bgMusic" loop>
    <source src="Music/cookingbgm.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <button class="cat-btn" onclick="toggleDrawer()">📜 VIEW SPICE CATALOGUE</button>
    <h1>🌿 Spice-It-Up!</h1>
    <p id="question">Loading...</p>
    <div id="options" class="options-grid"></div>
</div>

<div id="overlay" onclick="toggleDrawer()"></div>
<div id="drawer">
    <h3>Spice Catalogue</h3>
    <ul id="spiceList" style="list-style:none; padding:0;"></ul>
    <button onclick="toggleDrawer()" style="width:100%; background:#1b5e20;">Close</button>
</div>

<div id="popup">
    <div class="modal">
        <h2 id="resTitle">Result</h2>
        <p id="resExpl"></p>
        <button onclick="next()" style="width:100%; background:#1b5e20;">Next Challenge</button>
    </div>
</div>

<script>
const spices = [{n: "Allspice", e: "🧂", d: "Warm mix of cinnamon, nutmeg, clove."}, {n: "Amchur", e: "🥭", d: "Tart, fruity dried green mango."}]; // Truncated for brevity
const db = [{ name: "Jamaican Jerk Chicken", missing: "Allspice", options: ["Allspice", "Vanilla", "Mint"], explain: "Allspice provides the signature Caribbean warmth." }];

function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    const music = document.getElementById('bgMusic');
    music.volume = 0.3;
    music.play();
    load();
}

function load() {
    const d = db[0]; // Example logic
    document.getElementById('question').innerHTML = `The traditional <strong>${d.name}</strong> is missing its signature spice. Guess which one:`;
    const optDiv = document.getElementById('options');
    optDiv.innerHTML = '';
    d.options.forEach(opt => {
        const b = document.createElement('button');
        b.innerText = opt;
        b.onclick = () => reveal(opt);
        optDiv.appendChild(b);
    });
}

function reveal(choice) {
    document.getElementById('popup').style.display = 'flex';
    document.getElementById('resTitle').innerText = choice === "Allspice" ? "🎉 Correct!" : "❌ Wrong!";
    document.getElementById('resExpl').innerText = "Allspice provides the signature Caribbean warmth.";
}

function next() { document.getElementById('popup').style.display = 'none'; }
function toggleDrawer() { /* Same as before */ }
</script>
</body>
</html>
