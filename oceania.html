        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; font-family: helvetica; background-color: white; overflow-x: hidden; }

        .menu-list a { color: rgb(194, 194, 194); text-decoration: none; display: block; padding: 15px 25px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; transition: color 0.3s ease; }
        .menu-toggle { display: none; color: white; font-size: 20px; padding: 15px; cursor: pointer; }
        @media only screen and (max-width: 900px) { .menu { justify-content: space-between; } .menu-toggle { display: block; } .menu-list { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background-color: rgb(50,50,50); border-top: 1px solid #444; } .menu-list.active { display: flex; } }
        
        .notice { overflow: hidden; background-color: rgb(43,115,220); width: 100%; text-align: center; height: 45px; position: relative; }
        .notice p { color: white; font-size: 13px; word-spacing: 5px; margin-top: 15px; margin-bottom: 0; }
        .notice a { color: white; text-decoration: none; padding: 10px; }
        .notice2 { overflow: hidden; background-color: white; width: 100%; text-align: center; height: 45px; position: relative; border-bottom: 1px solid #eee; }
        .notice2 p { color: gray; font-size: 13px; word-spacing: 3px; margin-top: 15px; margin-bottom: 0; }
        .notice2 a { color: gray; text-decoration: none; padding: 10px; }
        .notice2 p:hover a { text-decoration: underline; }
        .closebtn { color: gray; font-weight: bold; font-size: 16px; cursor: pointer; position: absolute; right: 20px; top: 12px; transition: 0.3s; }
        .notice .closebtn { color: white; }
        .closebtn:hover { color: black; }

        .full-container, .split-grid { display: grid; width: 100vw; gap: 20px; margin-bottom: 20px; }
        .full-container { grid-template-columns: 1fr; }
        .split-grid { grid-template-columns: 1fr 1fr; }

        .cover-block { overflow: hidden; background-position: center; background-size: cover; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; transition: opacity 0.3s; }
        .full-height { height: 600px; }
        .split-height { height: 450px; }

        .text-box { background-color: rgba(0, 0, 0, 0.5); padding: 20px 40px; border-radius: 2px; backdrop-filter: blur(5px); max-width: 80%; }
        .cover-block h1 { font-size: 55px; margin: 5px; }
        .cover-block h2 { font-size: 35px; margin: 5px; }
        .cover-block h3 { font-size: 25px; font-weight: 1; margin: 5px; }
        .cover-block p { font-size: 15px; margin: 5px; }
        @media only screen and (max-width: 900px) { .split-grid { grid-template-columns: 1fr; gap: 10px; } .cover-block h1 { font-size: 35px; } .text-box { padding: 15px 20px; } }

        .places-wrap { background-color: #f4f4f4; padding: 60px 20px; text-align: center; margin-top: 20px; }
        .places-wrap h2 { font-size: 24px; letter-spacing: 2px; text-transform: uppercase; color: #333; margin-top: 0; margin-bottom: 30px; }
        .places-grid { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; height: auto; padding: 10px; }
        .place-tag { background-color: white; color: #555; padding: 10px 20px; font-size: 13px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; text-decoration: none; transition: all 0.3s ease; cursor: pointer; }
        .place-tag:hover { background-color: rgb(43,115,220); color: white; box-shadow: 0 4px 10px rgba(43,115,220,0.3); transform: translateY(-2px); }

        footer { background-color: gray; text-align: center; padding: 60px 20px; width: 100%; color: white; box-sizing: border-box; }
        .legal { margin-top: 30px; }
        .legal a { color: white; text-decoration: none; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; padding: 0 15px; opacity: 0.7; }
    </style>

<script>
    function toggleMenu() { document.getElementById('menuList').classList.toggle('active'); }

    const destinationsOceania = [
       { title: "Australia", caption: "Peering into the Wild", image: "Images/Countries/033-australia.jpg", link: "Countries/australia.html", color: "white" },
    { title: "New Zealand", caption: "Land of the Long White Cloud", image: "Images/Countries/034-new-zealand.jpg", link: "Countries/new-zealand.html", color: "white" },
    { title: "Tuvalu", caption: "Sinking Paradise", image: "Images/Countries/035-tuvalu.jpg", link: "Countries/tuvalu.html", color: "white" },
    { title: "Samoa", caption: "The Heart of Polynesia", image: "Images/Countries/036-samoa.jpg", link: "Countries/samoa.html", color: "white" },
    { title: "Fiji", caption: "Garden of the Sea", image: "Images/Countries/037-fiji.jpg", link: "Countries/fiji.html", color: "white" },
    { title: "Tonga", caption: "Swimming with Giants", image: "Images/Countries/038-tonga.jpg", link: "Countries/tonga.html", color: "white" },
    { title: "Vanuatu", caption: "Volcanoes and Reefs", image: "Images/Countries/039-vanuatu.jpg", link: "Countries/vanuatu.html", color: "white" },
    { title: "Solomon Islands", caption: "Wrecks and Rainforests", image: "Images/Countries/040-solomon-islands.jpg", link: "Countries/solomon-islands.html", color: "white" },
    { title: "Papua New Guinea", caption: "Tribes and Highlands", image: "Images/Countries/074-papua-new-guinea.jpg", link: "Countries/papua-new-guinea.html", color: "white" },
    { title: "Palau", caption: "The Rock Islands", image: "Images/Countries/075-palau.jpg", link: "Countries/palau.html", color: "white" },
    { title: "Micronesia", caption: "Ancient Ruins of Nan Madol", image: "Images/Countries/076-micronesia.jpg", link: "Countries/micronesia.html", color: "white" },
    { title: "Marshall Islands", caption: "Atolls of the Pacific", image: "Images/Countries/077-marshall-islands.jpg", link: "Countries/marshall-islands.html", color: "white" },
    { title: "Kiribati", caption: "Atolls on the Equator", image: "Images/Countries/078-kiribati.jpg", link: "Countries/kiribati.html", color: "white" },
    { title: "Nauru", caption: "The Phosphate Island", image: "Images/Countries/079-nauru.jpg", link: "Countries/nauru.html", color: "white" },
    ];

    const visitedPlacesOceania = [
        "🇦🇺 Australia", "🇳🇿 New Zealand", "🇹🇻 Tuvalu", "🇼🇸 Samoa", "🇫🇯 Fiji", 
        "🇹🇴 Tonga", "🇻🇺 Vanuatu", "🇸🇧 Solomon Islands", "🇵🇬 Papua New Guinea", 
        "🇵🇼 Palau", "🇫🇲 Micronesia", "🇲🇭 Marshall Islands", "🇰🇮 Kiribati", "🇳🇷 Nauru", 
        "🇬🇺 Guam"
    ];

    function buildLayout() {
        const shuffled = [...destinationsOceania].sort(() => 0.5 - Math.random());
        const fullSection = document.getElementById('full-section');
        const splitSection = document.getElementById('split-section');

        shuffled.slice(0, 3).forEach(item => {
            const block = document.createElement('a');
            block.className = 'cover-block full-height';
            block.href = item.link;
            block.style.backgroundImage = `url('${item.image}')`;
            block.innerHTML = `
                <div class="text-box">
                    <h1 style="color: ${item.color}">${item.title}</h1>
                    <h3 style="color: ${item.color}">${item.caption}</h3>
                    <p style="color: ${item.color}">Read more ></p>
                </div>
            `;
            fullSection.appendChild(block);
        });

        shuffled.slice(3, 9).forEach(item => {
            const block = document.createElement('a');
            block.className = 'cover-block split-height';
            block.href = item.link;
            block.style.backgroundImage = `url('${item.image}')`;
            block.innerHTML = `
                <div class="text-box">
                    <h2 style="color: ${item.color}">${item.title}</h2>
                    <p style="color: ${item.color}">${item.caption}</p>
                    <p style="color: ${item.color}; font-size: 12px;">Read more ></p>
                </div>
            `;
            splitSection.appendChild(block);
        });

        const placesGrid = document.getElementById('placesGrid');
        
        visitedPlacesOceania.forEach(place => {
            const fileBase = place.toLowerCase().replace(/[^a-z0-9]/g, '');
            const link = document.createElement('a');
            link.href = "Countries/" + fileBase + ".html";
            link.className = 'place-tag';
            link.innerText = place;
            placesGrid.appendChild(link);
        });
    }

    window.onload = buildLayout;
</script>
</body>
