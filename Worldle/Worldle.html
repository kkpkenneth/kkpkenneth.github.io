<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLDLE</title>
    <style>
        :root {
            --bg: #121213;
            --panel: #1a1a1b;
            --text: #ffffff;
            --primary: #538d4e;
            --wrong: #3a3a3c;
            --hint: #b59f3b;
            --error: #e74c3c;
        }

        body {
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Removed justify-content: center; to prevent the top from being cut off on mobile */
            min-height: 100vh;
            overflow-y: auto; /* Changed from hidden to allow vertical scrolling */
        }

        .container { 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
            padding: 20px; 
            margin: auto; /* This will perfectly center the game vertically when there is extra space */
        }

        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        h1 { font-size: 2.8rem; letter-spacing: 0.4rem; margin: 10px 0; border-bottom: 2px solid var(--wrong); padding-bottom: 10px; }

        #hint-display {
            background: var(--panel);
            padding: 20px 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 1.2rem;
            line-height: 1.5;
            border-left: 6px solid var(--hint);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #country-image {
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            /* Computer version: 16:9 */
            aspect-ratio: 16 / 9;
            display: none;
        }

        /* Phone version: 1:1 */
        @media (max-width: 767px) {
            #country-image {
                aspect-ratio: 1 / 1;
            }
        }

        #word-display {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 0.4rem;
            margin: 30px 0;
            text-transform: uppercase;
            min-height: 40px; /* Keeps the layout stable */
        }

        .keyboard { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; padding: 10px; }

        .key {
            background: var(--wrong);
            color: white;
            border: none;
            padding: 15px 0;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            touch-action: manipulation;
        }

        .key:disabled { opacity: 0.3; cursor: default; }
        .key.correct { background: var(--primary) !important; }
        .key.incorrect { background: #000 !important; color: #555; }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-main:hover { transform: scale(1.05); }
        .stats { margin-top: 20px; color: #818384; font-weight: bold; }

        /* --- POP-UP MODAL STYLES --- */
        #result-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }

        #result-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--panel);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.3s ease;
            border: 1px solid var(--wrong);
            max-width: 90%;
        }

        #result-modal.active .modal-content {
            transform: scale(1);
        }

        #modal-status {
            font-size: 3rem;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        #modal-subtext {
            font-size: 1.3rem;
            margin-bottom: 30px;
            color: #aaa;
            line-height: 1.4;
        }
    </style>
</head>

    // --- BACKGROUND MUSIC ---
    const bgMusic = new Audio('bgm.mp3');
    bgMusic.loop = true;
    bgMusic.volume = 0;

    // --- 8-BIT AUDIO SYNTHESIZER (SFX) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        osc.type = 'square'; 

        if (type === 'correct') {
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'wrong') {
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'win') {
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            osc.frequency.setValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'lose') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    function startGame() {
        document.getElementById('start-overlay').style.display = 'none';
        
        // Start BGM
        bgMusic.play().catch(e => console.log("Music play blocked: ", e));
        let fadeIn = setInterval(() => {
            if (bgMusic.volume < 0.5) {
                bgMusic.volume += 0.05;
            } else {
                clearInterval(fadeIn);
            }
        }, 200);

        // Resume Audio Context for SFX
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        initRound();
    }

    let current = {}, guessed = [], lives = 6, score = 0, pool = [...countries];
    let isRoundActive = false;

    function initRound() {
        // Hide the modal
        document.getElementById('result-modal').classList.remove('active');

        if (pool.length === 0) pool = [...countries];
        current = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
        guessed = []; 
        lives = 6;
        isRoundActive = true;
        
        document.getElementById('word-display').style.color = "var(--text)";
        document.getElementById('lives-count').innerText = lives;
        document.getElementById('hint-display').innerText = "HINT: " + current.h;

        // Apply Image if available
        const imgEl = document.getElementById('country-image');
        if (current.img) {
            imgEl.src = current.img;
            imgEl.style.display = "block";
        } else {
            imgEl.style.display = "none";
        }

        render();
        renderKeys();
    }

    function showModal(title, subtext, isWin) {
        const modal = document.getElementById('result-modal');
        const statusEl = document.getElementById('modal-status');
        const subtextEl = document.getElementById('modal-subtext');
        
        statusEl.innerText = title;
        statusEl.style.color = isWin ? "var(--primary)" : "var(--error)";
        subtextEl.innerText = subtext;
        
        modal.classList.add('active');
    }

    function render() {
        const upperName = current.n.toUpperCase();
        
        // Split the country name into distinct words
        const words = upperName.split(' ');
        
        // Map each word and wrap it in a nowrap span to prevent line breaks mid-word
        const display = words.map(word => {
            const formattedWord = word.split('').map(c => {
                // If it's a hyphen or punctuation, reveal it automatically
                if (!/[A-Z]/.test(c)) return c; 
                return guessed.includes(c) ? c : "_";
            }).join(" ");
            
            return `<span style="white-space: nowrap;">${formattedWord}</span>`;
        }).join(" &nbsp;&nbsp;&nbsp; "); // Add distinct spacing between words
        
        document.getElementById('word-display').innerHTML = display;
        
        if (!display.includes("_") && isRoundActive) {
            score++;
            document.getElementById('score-count').innerText = score;
            playSound('win');
            endRound();
            
            // Show modal after a slight delay
            setTimeout(() => {
                showModal("BINGO!", `You guessed ${current.n} correctly.`, true);
            }, 600);
        }
    }

    function renderKeys() {
        const kb = document.getElementById('keyboard'); 
        kb.innerHTML = "";
        const upperName = current.n.toUpperCase(); 

        "QWERTYUIOPASDFGHJKLZXCVBNM".split('').forEach(k => {
            const b = document.createElement('button');
            b.innerText = k; 
            b.className = 'key';
            b.setAttribute('data-key', k);
            b.onclick = () => {
                if (b.disabled || !isRoundActive) return;

                b.disabled = true;
                if (upperName.includes(k)) {
                    guessed.push(k); 
                    b.classList.add('correct'); 
                    playSound('correct');
                    render();
                } else {
                    lives--; 
                    b.classList.add('incorrect');
                    playSound('wrong');
                    document.getElementById('lives-count').innerText = lives;
                    
                    if (lives <= 0) {
                        score = 0; 
                        document.getElementById('score-count').innerText = score;
                        
                        // Reveal the word
                        const fullWord = upperName.split('').map(c => c === " " ? "&nbsp;" : c).join(" ");
                        document.getElementById('word-display').innerHTML = fullWord;
                        document.getElementById('word-display').style.color = "var(--error)";
                        
                        playSound('lose');
                        endRound();

                        // Show modal after a delay
                        setTimeout(() => {
                            showModal("LOST", `The country was ${current.n}.`, false);
                        }, 1200);
                    }
                }
            };
            kb.appendChild(b);
        });
    }

    function endRound() {
        isRoundActive = false;
        document.querySelectorAll('.key').forEach(k => k.disabled = true);
    }

    // --- PHYSICAL KEYBOARD SUPPORT ---
    document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('result-modal');
        
        // If the round is over and the modal is visible, Enter starts the next round
        if (!isRoundActive) {
            if (e.key === 'Enter' && modal.classList.contains('active')) {
                initRound();
            }
            return; 
        }
        
        if (e.repeat) return; 

        const key = e.key.toUpperCase();
        if (/^[A-Z]$/.test(key)) {
            const virtualBtn = document.querySelector(`.key[data-key="${key}"]`);
            if (virtualBtn && !virtualBtn.disabled) {
                virtualBtn.click();
            }
        }
    });
</script>
