<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atomic Bonds - 118 Elements</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');

        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(11, 12, 16, 0.95);
            --primary: #66fcf1;
            --secondary: #45a29e;
            --text-light: #c5c6c7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 900px;
            box-shadow: 0 0 40px rgba(102, 252, 241, 0.1);
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            text-shadow: 0 2px 4px #000;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #target-compound {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            margin: 0;
            color: #fff;
            text-shadow: 0 0 15px var(--primary);
            letter-spacing: 2px;
        }

        #instruction {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-top: 5px;
            text-align: center;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--panel-bg);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            box-sizing: border-box;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px var(--primary);
        }

        .overlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--primary);
        }

        .overlay p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 400px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        button {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px 24px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
            touch-action: manipulation;
            margin: 5px;
        }

        button:hover, button:active {
            background: var(--primary);
            color: #0b0c10;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.6);
            transform: scale(1.05);
        }

        button.secondary {
            border-color: var(--secondary);
            color: var(--secondary);
            box-shadow: none;
        }

        button.secondary:hover, button.secondary:active {
            background: var(--secondary);
            color: #0b0c10;
            box-shadow: 0 0 15px rgba(69, 162, 158, 0.5);
        }

        #level-indicator {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 1.1rem;
            color: var(--secondary);
            font-weight: bold;
            pointer-events: none;
        }

        #menu-open-btn {
            position: absolute;
            bottom: 10px;
            right: 15px;
            padding: 8px 15px;
            font-size: 0.9rem;
            pointer-events: auto;
        }

        /* Level Grid Styles */
        #level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 500px;
            max-height: 60vh;
            overflow-y: auto;
            margin: 20px 0;
            padding: 5px;
            box-sizing: border-box;
        }

        #level-grid::-webkit-scrollbar { width: 6px; }
        #level-grid::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        #level-grid::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }

        .lvl-btn {
            padding: 12px 5px;
            font-size: 1.2rem;
            background: rgba(102, 252, 241, 0.05);
            margin: 0;
            border-width: 1px;
        }

        .lvl-btn:disabled {
            background: rgba(255, 255, 255, 0.02);
            border-color: #333;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Info Boxes */
        .info-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            border-left: 4px solid var(--secondary);
            border-right: 4px solid var(--primary);
        }

        .info-box h4 {
            margin: 0 0 5px 0;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            font-size: 1rem;
        }
        
        .info-box p {
            font-size: 0.95rem;
            margin: 0;
            line-height: 1.4;
        }

        .reactivity-container {
            margin-top: 10px;
            margin-bottom: 15px;
        }
        
        .react-bar-bg {
            width: 100%;
            background: #222;
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
            margin-top: 4px;
        }

        #reactivity-bar {
            height: 100%;
            width: 0%;
            background: var(--secondary);
            border-radius: 4px;
            transition: width 1s ease-out;
        }
        
        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        @media (max-height: 700px) {
            .overlay h1 { font-size: 2rem; }
            #compound-formula { font-size: 2.2rem !important; margin-bottom: 5px !important; }
            #compound-name-display { font-size: 1rem !important; margin-bottom: 10px !important; }
            .info-box { padding: 10px; margin-bottom: 8px; }
            button { padding: 10px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" style="opacity: 0;">
            <h2 id="target-compound">H₂</h2>
            <p id="instruction">Drag atoms together to form valid bonds.</p>
        </div>
        
        <div id="level-indicator" style="opacity: 0;">Level 1 / 118</div>
        <button id="menu-open-btn" class="secondary" style="opacity: 0;">Levels</button>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay active">
            <h1>Atomic Bonds</h1>
            <p>Journey through the periodic table from Atomic Number 1 to 118. Hover over drifting elements to identify them. Connect them to forge essential compounds.</p>
            <button id="start-btn">Start</button>
        </div>

        <!-- Level Selector Overlay -->
        <div id="level-screen" class="overlay">
            <h2>Select Element</h2>
            <div id="level-grid"></div>
            <button id="close-levels-btn" class="secondary">Back</button>
        </div>

        <!-- Win Overlay -->
        <div id="win-overlay" class="overlay">
            <h1 id="compound-formula" style="font-size: 3rem; margin-bottom: 5px; text-shadow: 0 0 20px var(--primary);">H₂</h1>
            <h2 id="compound-name-display" style="font-size: 1rem; color: var(--secondary); margin-top: 0; margin-bottom: 15px; letter-spacing: 1px;">Molecular Hydrogen / Hydrogen Gas</h2>
            
            <div class="info-box">
                <h4 style="color: var(--secondary);"><span id="element-name-display"></span></h4>
                <p id="element-group" style="font-size: 0.85rem; color: #aaa; text-transform: uppercase; margin-bottom: 5px;"></p>
                
                <div class="reactivity-container">
                    <div style="font-size: 0.8rem; color: var(--text-light); display: flex; justify-content: space-between;">
                        <span>Reactivity</span>
                        <span id="reactivity-text">0%</span>
                    </div>
                    <div class="react-bar-bg">
                        <div id="reactivity-bar"></div>
                    </div>
                </div>

                <p id="element-desc"></p>
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">

                <p id="bond-type" style="font-size: 0.85rem; color: #aaa; text-transform: uppercase; margin-bottom: 5px;"></p>
                <p id="compound-desc"></p>
            </div>

            <div class="button-row">
                <button id="menu-back-btn" class="secondary">Menu</button>
                <button id="next-btn">Next</button>
            </div>
        </div>
    </div>

    <script>
        // Data helpers
        function getElementColor(z) {
            if ([1,6,7,8,9,15,16,17,34,35,53].includes(z)) return '#ff4757'; // Reactive Nonmetals
            if ([2,10,18,36,54,86,118].includes(z)) return '#70a1ff'; // Noble Gases
            if ([3,11,19,37,55,87].includes(z)) return '#ffa502'; // Alkali Metals
            if ([4,12,20,38,56,88].includes(z)) return '#eccc68'; // Alkaline Earth
            if ([5,14,32,33,51,52,84].includes(z)) return '#1dd1a1'; // Metalloids
            if (z >= 57 && z <= 71) return '#ff7f50'; // Lanthanides
            if (z >= 89 && z <= 103) return '#ff6b81'; // Actinides
            if ((z >= 21 && z <= 30) || (z >= 39 && z <= 48) || (z >= 72 && z <= 80) || (z >= 104 && z <= 112)) return '#5352ed'; // Transition Metals
            return '#a4b0be'; // Post-transition / Unknown
        }

        function getElementCategory(z) {
            if (z === 1) return 'Reactive Nonmetal';
            if ([2,10,18,36,54,86,118].includes(z)) return 'Noble Gas';
            if ([3,11,19,37,55,87].includes(z)) return 'Alkali Metal';
            if ([4,12,20,38,56,88].includes(z)) return 'Alkaline Earth Metal';
            if ([9,17,35,53,85,117].includes(z)) return 'Halogen';
            if ([8,16,34,52,84,116].includes(z)) return 'Chalcogen';
            if ([7,15,33,51,83,115].includes(z)) return 'Pnictogen';
            if ([5,14,32,33,51,52,84].includes(z)) return 'Metalloid';
            if (z >= 57 && z <= 71) return 'Lanthanide';
            if (z >= 89 && z <= 103) return 'Actinide';
            if ((z >= 21 && z <= 30) || (z >= 39 && z <= 48) || (z >= 72 && z <= 80) || (z >= 104 && z <= 112)) return 'Transition Metal';
            if ([13,31,49,50,81,82,83,113,114,115,116].includes(z)) return 'Post-Transition Metal';
            return 'Reactive Nonmetal'; 
        }

        function getGroupNumber(z) {
            if ([1,3,11,19,37,55,87].includes(z)) return 1;
            if ([4,12,20,38,56,88].includes(z)) return 2;
            if ([21,39].includes(z)) return 3;
            if (z >= 57 && z <= 71) return "Lanthanides";
            if (z >= 89 && z <= 103) return "Actinides";
            if ([22,40,72,104].includes(z)) return 4;
            if ([23,41,73,105].includes(z)) return 5;
            if ([24,42,74,106].includes(z)) return 6;
            if ([25,43,75,107].includes(z)) return 7;
            if ([26,44,76,108].includes(z)) return 8;
            if ([27,45,77,109].includes(z)) return 9;
            if ([28,46,78,110].includes(z)) return 10;
            if ([29,47,79,111].includes(z)) return 11;
            if ([30,48,80,112].includes(z)) return 12;
            if ([5,13,31,49,81,113].includes(z)) return 13;
            if ([6,14,32,50,82,114].includes(z)) return 14;
            if ([7,15,33,51,83,115].includes(z)) return 15;
            if ([8,16,34,52,84,116].includes(z)) return 16;
            if ([9,17,35,53,85,117].includes(z)) return 17;
            if ([2,10,18,36,54,86,118].includes(z)) return 18;
            return "";
        }

        function getReactivity(z) {
            if ([2,10,18].includes(z)) return 5; // Inert Noble Gases
            if ([36,54,86,118].includes(z)) return 15; // Heavier Noble Gases
            if ([9,17,35,53,85,117].includes(z)) return Math.max(70, 100 - (z * 0.2)); // Halogens
            if ([3,11,19,37,55,87].includes(z)) return Math.min(100, 80 + (z * 0.2)); // Alkali metals
            if ([4,12,20,38,56,88].includes(z)) return Math.min(95, 70 + (z * 0.15)); // Alkaline earth
            if ([8].includes(z)) return 90; // Oxygen
            if ([16,34,52,84,116].includes(z)) return 70; // Chalcogens
            if (z === 1) return 85; // Hydrogen
            if (z === 6) return 50; // Carbon
            if (z === 7) return 60; // Nitrogen
            if (z >= 79 && z <= 80) return 20; // Gold, Mercury
            if (z === 78) return 15; // Platinum
            if ((z >= 21 && z <= 30) || (z >= 39 && z <= 48) || (z >= 72 && z <= 80) || (z >= 104 && z <= 112)) return 40; 
            if (z >= 57 && z <= 71) return 65;
            if (z >= 89 && z <= 103) return 75;
            return 55; // Default catch-all
        }

        function getBondType(atoms) {
            const nonMetals = ["H","C","N","O","P","S","Se","F","Cl","Br","I","At","Ts","He","Ne","Ar","Kr","Xe","Rn","Og"];
            let allNonMetals = atoms.every(a => nonMetals.includes(a));
            
            if (atoms.length === 2 && atoms[0] === atoms[1]) {
                 if(["He","Ne","Ar","Kr","Xe","Rn","Og"].includes(atoms[0])) return "Van der Waals (Excimer)";
                 return "Nonpolar Covalent Bond";
            }
            if (allNonMetals) return "Polar Covalent Bond";
            return "Ionic / Polar Covalent Bond";
        }

        // Comprehensive 118 Elements Database
        const rawLevels = [
            [1, "H", "Hydrogen", "H₂", "Molecular Hydrogen / Hydrogen Gas", "The lightest element in the universe.", "Two hydrogen atoms bond to form the most abundant gas in the cosmos.", ["H","H"], ["H-H"], {"H":1}],
            [2, "He", "Helium", "He₂", "Dihelium / Helium Dimer", "A highly inert noble gas.", "Under extreme laboratory conditions, it forms a fragile, temporary excimer molecule.", ["He","He"], ["He-He"], {"He":1}],
            [3, "Li", "Lithium", "LiCl", "Lithium Chloride / Lithium(I) Chloride", "A highly reactive alkali metal.", "Forms a simple ionic salt with chlorine, used to produce lithium metal.", ["Li","Cl"], ["Li-Cl"], {"Li":1,"Cl":1}],
            [4, "Be", "Beryllium", "BeF₂", "Beryllium Fluoride / Beryllium Difluoride", "A highly toxic, strong alkaline earth metal.", "Forms an inorganic glass-like solid when bonded with fluorine.", ["Be","F","F"], ["Be-F"], {"Be":2,"F":1}],
            [5, "B", "Boron", "BF₃", "Boron Trifluoride / Trifluoroborane", "A crucial metalloid.", "Forms a pungent, toxic gas widely used as a Lewis acid catalyst in organic synthesis.", ["B","F","F","F"], ["B-F"], {"B":3,"F":1}],
            [6, "C", "Carbon", "CH₄", "Carbon Tetrahydride / Methane", "The building block of life.", "Forms four strong covalent bonds with hydrogen to create the simplest hydrocarbon.", ["C","H","H","H","H"], ["C-H"], {"C":4,"H":1}],
            [7, "N", "Nitrogen", "NH₃", "Nitrogen Trihydride / Ammonia", "Essential for global agriculture and DNA.", "Bonds with three hydrogens to form a pungent, vital gas.", ["N","H","H","H"], ["N-H"], {"N":3,"H":1}],
            [8, "O", "Oxygen", "H₂O", "Dihydrogen Monoxide / Water", "A highly reactive nonmetal.", "Two hydrogen atoms bond with one oxygen atom to create the universal solvent essential for all life.", ["H","H","O"], ["H-O"], {"H":1,"O":2}],
            [9, "F", "Fluorine", "HF", "Hydrogen Fluoride / Fluorane", "The most electronegative element.", "Forms a highly dangerous gas that creates hydrofluoric acid when dissolved.", ["H","F"], ["H-F"], {"H":1,"F":1}],
            [10, "Ne", "Neon", "Ne₂", "Dineon / Neon Dimer", "Famously inert and used in lighting.", "Under extreme low temperatures, it can form a very weak van der Waals dimer.", ["Ne","Ne"], ["Ne-Ne"], {"Ne":1}],
            [11, "Na", "Sodium", "NaCl", "Sodium Chloride / Table Salt", "A soft, highly reactive metal.", "Forms a strong ionic bond with chlorine to create common table salt.", ["Na","Cl"], ["Na-Cl"], {"Na":1,"Cl":1}],
            [12, "Mg", "Magnesium", "MgO", "Magnesium Oxide / Magnesia", "A lightweight structural metal.", "Forms a solid white mineral widely used in antacids and fireproofing.", ["Mg","O"], ["Mg-O"], {"Mg":1,"O":1}],
            [13, "Al", "Aluminum", "AlCl₃", "Aluminum Trichloride / Aluminum Chloride", "A ubiquitous, lightweight metal.", "Bonds with three chlorines to form a key compound in industrial chemistry.", ["Al","Cl","Cl","Cl"], ["Al-Cl"], {"Al":3,"Cl":1}],
            [14, "Si", "Silicon", "SiH₄", "Silicon Tetrahydride / Silane", "The foundation of modern electronics.", "Forms the silicon analogue of methane, a pyrophoric gas.", ["Si","H","H","H","H"], ["Si-H"], {"Si":4,"H":1}],
            [15, "P", "Phosphorus", "PH₃", "Phosphorus Trihydride / Phosphine", "Essential for biological energy (ATP).", "Forms a highly toxic, flammable gas with an odor of garlic.", ["P","H","H","H"], ["P-H"], {"P":3,"H":1}],
            [16, "S", "Sulfur", "H₂S", "Hydrogen Sulfide / Sulfane", "Known for its distinct yellow color.", "Forms a colorless gas known for its hazardous toxicity and foul odor.", ["H","H","S"], ["H-S"], {"H":1,"S":2}],
            [17, "Cl", "Chlorine", "Cl₂", "Molecular Chlorine / Chlorine Gas", "A highly reactive halogen.", "Two atoms bond to form a yellow-green diatomic gas used for sanitation.", ["Cl","Cl"], ["Cl-Cl"], {"Cl":1}],
            [18, "Ar", "Argon", "Ar₂", "Diargon / Argon Dimer", "The most abundant noble gas in Earth's atmosphere.", "Forms a weakly bound molecule at near absolute zero.", ["Ar","Ar"], ["Ar-Ar"], {"Ar":1}],
            [19, "K", "Potassium", "KCl", "Potassium Chloride / Sylvite", "A vital alkali metal for cellular function.", "Forms a metal halide salt used in agriculture and medicine.", ["K","Cl"], ["K-Cl"], {"K":1,"Cl":1}],

            [21, "Sc", "Scandium", "ScCl₃", "Scandium Trichloride / Scandium Chloride", "A lightweight transition metal.", "Forms an ionic compound used in high-intensity metal halide lamps.", ["Sc","Cl","Cl","Cl"], ["Sc-Cl"], {"Sc":3,"Cl":1}],

            [24, "Cr", "Chromium", "CrO₃", "Chromium Trioxide / Chromic Acid", "Famous for its anti-corrosive properties.", "Forms a powerful, toxic oxidizing agent used in chrome plating.", ["Cr","O","O","O"], ["Cr-O"], {"Cr":3,"O":1}],

            [34, "Se", "Selenium", "H₂Se", "Hydrogen Selenide / Selane", "A nonmetal with photovoltaic properties.", "Forms a highly toxic, smelly gas with hydrogen.", ["H","H","Se"], ["H-Se"], {"H":1,"Se":2}],
            [35, "Br", "Bromine", "Br₂", "Molecular Bromine / Bromine Gas", "A fuming red-brown liquid at room temperature.", "Forms a highly reactive diatomic halogen molecule.", ["Br","Br"], ["Br-Br"], {"Br":1}],
            [36, "Kr", "Krypton", "KrF₂", "Krypton(II) Fluoride / Krypton Difluoride", "A noble gas used in specialized lighting.", "Can be forced to bond with fluorine to create a volatile solid.", ["Kr","F","F"], ["Kr-F"], {"Kr":2,"F":1}],

        const symbolToName = { "Cl": "Chlorine", "O": "Oxygen", "F": "Fluorine", "H": "Hydrogen", "S": "Sulfur" };

        const formattedLevels = rawLevels.map(data => {
            const z = data[0];
            const sym = data[1];
            const elemName = data[2];
            const formula = data[3];
            const compName = data[4];
            const elemDesc = data[5];
            const compDesc = data[6];
            const atoms = data[7];
            const allowed = data[8];
            const maxBonds = data[9];
            
            symbolToName[sym] = elemName;

            let colors = {};
            atoms.forEach(atom => {
                if (atom === "H") colors[atom] = "#ffffff";
                else if (atom === "O") colors[atom] = "#ff4757";
                else if (atom === "F") colors[atom] = "#9ae5cc";
                else if (atom === "Cl") colors[atom] = "#1dd1a1";
                else if (atom === "S") colors[atom] = "#f1c40f";
                else colors[atom] = getElementColor(z);
            });

            return { z, sym, elemName, formula, compName, elemDesc, compDesc, atoms, allowed, maxBonds, colors };
        });

        // Engine Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let hoveredNode = null;

        let isRunning = false;
        let pointer = { x: 0, y: 0, isDown: false };

        // Save System
        let maxLevelUnlocked = parseInt(localStorage.getItem('atomicBondsMaxLevel')) || 0;

        function saveProgress() {
            if (currentLevel >= maxLevelUnlocked) {
                maxLevelUnlocked = currentLevel + 1;
                localStorage.setItem('atomicBondsMaxLevel', maxLevelUnlocked);
            }
        }

        // Audio Context Setup
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSynth(freq, type = 'sine', duration = 0.2, volume = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        const sfx = {
            grab: () => playSynth(300, 'triangle', 0.1, 0.05),
            snap: () => {
                playSynth(800, 'sine', 0.1, 0.1);
                setTimeout(() => playSynth(1200, 'sine', 0.2, 0.1), 50);
            },
            error: () => playSynth(150, 'square', 0.15, 0.05),
            win: () => {
                const notes = [440, 554.37, 659.25, 880]; 
                notes.forEach((freq, i) => {
                    setTimeout(() => playSynth(freq, 'sine', 0.4, 0.15), i * 150);
                });
            }
        };

        // Resize Handling
        function resize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            width = canvas.width;
            height = canvas.height;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            width /= window.devicePixelRatio;
            height /= window.devicePixelRatio;
        }
        window.addEventListener('resize', resize);

        function populateLevelGrid() {

            levelGrid.innerHTML = '';

                btn.className = 'lvl-btn';
                btn.innerText = level.z;
                if (i > maxLevelUnlocked) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => {
                        initAudio();
                        levelScreen.classList.remove('active');
                        resize();
                        startLevel(i);
                        if (!isRunning) {
                            isRunning = true;
                            loop();
                        }
                    };
                }
                levelGrid.appendChild(btn);
            });
        }

        // Core Mechanics
        function startLevel(index) {
            currentLevel = index;
            const data = formattedLevels[currentLevel];
            
            document.getElementById('target-compound').innerText = data.formula;
            levelInd.innerText = `Level ${currentLevel + 1} / 118`;
            
            uiLayer.style.opacity = 1;
            levelInd.style.opacity = 1;
            menuOpenBtn.style.opacity = 1;
            
            startScreen.classList.remove('active');
            levelScreen.classList.remove('active');
            winOverlay.classList.remove('active');
            
            nodes = [];
            links = [];
            isLevelComplete = false;
            draggedNode = null;
            hoveredNode = null;

            const radius = width < 400 ? 25 : 35;

            // Spawn Atoms
            data.atoms.forEach((symbol, i) => {
                nodes.push({
                    id: i,
                    element: symbol,
                    x: Math.random() * (width - radius * 2) + radius,
                    y: Math.random() * (height - radius * 2) + radius,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: radius,
                    color: data.colors[symbol] || '#ffffff'
                });
            });
        }

        function isValidBond(n1, n2) {
            if (links.length >= nodes.length - 1) return false;
            
            const data = formattedLevels[currentLevel];
            const pair1 = n1.element + "-" + n2.element;
            const pair2 = n2.element + "-" + n1.element;
            
            if (!data.allowed.includes(pair1) && !data.allowed.includes(pair2)) {
                return false; 
            }
            
            let bondsN1 = links.filter(l => l.nodeA === n1 || l.nodeB === n1).length;
            let bondsN2 = links.filter(l => l.nodeA === n2 || l.nodeB === n2).length;
            
            if (bondsN1 >= data.maxBonds[n1.element] || bondsN2 >= data.maxBonds[n2.element]) {
                return false; 
            }
            
            return true;
        }

        function linkExists(n1, n2) {
            return links.some(l => (l.nodeA === n1 && l.nodeB === n2) || (l.nodeA === n2 && l.nodeB === n1));
        }

        // Game Loop
        function update() {
            nodes.forEach(n => {
                if (n !== draggedNode) {
                    n.x += n.vx;
                    n.y += n.vy;
                    
                    n.vx += (Math.random() - 0.5) * 0.1;
                    n.vy += (Math.random() - 0.5) * 0.1;
                    n.vx *= 0.98;
                    n.vy *= 0.98;
                } else {
                    n.x = pointer.x;
                    n.y = pointer.y;
                    n.vx = 0;
                    n.vy = 0;
                }

                // Wall bounds
                if (n.x < n.radius) { n.x = n.radius; n.vx *= -0.8; }
                if (n.x > width - n.radius) { n.x = width - n.radius; n.vx *= -0.8; }
                if (n.y < n.radius) { n.y = n.radius; n.vy *= -0.8; }
                if (n.y > height - n.radius) { n.y = height - n.radius; n.vy *= -0.8; }
            });

            // Physics Relaxation
            const iterations = 3;
            for (let i = 0; i < iterations; i++) {
                links.forEach(link => {
                    let dx = link.nodeB.x - link.nodeA.x;
                    let dy = link.nodeB.y - link.nodeA.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist === 0) return;
                    let diff = link.targetDist - dist;
                    let percent = (diff / dist) / 2;
                    let offsetX = dx * percent * 0.5;
                    let offsetY = dy * percent * 0.5;
                    
                    if (link.nodeA !== draggedNode) {
                        link.nodeA.x -= offsetX;
                        link.nodeA.y -= offsetY;
                    }
                    if (link.nodeB !== draggedNode) {
                        link.nodeB.x += offsetX;
                        link.nodeB.y += offsetY;
                    }
                });

                // Soft Collisions
                for (let a = 0; a < nodes.length; a++) {
                    for (let b = a + 1; b < nodes.length; b++) {
                        let n1 = nodes[a];
                        let n2 = nodes[b];
                        let dx = n2.x - n1.x;
                        let dy = n2.y - n1.y;
                        let dist = Math.hypot(dx, dy);
                        let minDist = n1.radius + n2.radius + 5; 
                        
                        if (dist < minDist && dist > 0) {
                            let overlap = minDist - dist;
                            let nx = dx / dist;
                            let ny = dy / dist;
                            
                            let f = overlap * 0.5;
                            if (n1 !== draggedNode) {
                                n1.x -= nx * f;
                                n1.y -= ny * f;
                            }
                            if (n2 !== draggedNode) {
                                n2.x += nx * f;
                                n2.y += ny * f;
                            }
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Draw Links
            ctx.lineWidth = 6;
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(102, 252, 241, 0.8)';
            ctx.strokeStyle = 'rgba(102, 252, 241, 0.9)';
            
            links.forEach(link => {
                ctx.beginPath();
                ctx.moveTo(link.nodeA.x, link.nodeA.y);
                ctx.lineTo(link.nodeB.x, link.nodeB.y);
                ctx.stroke();
            });
            ctx.shadowBlur = 0;

            // Draw Nodes
            nodes.forEach(n => {
                let gradient = ctx.createRadialGradient(n.x, n.y, n.radius * 0.2, n.x, n.y, n.radius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.6, n.color);
                gradient.addColorStop(1, 'rgba(0,0,0,0.5)');

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                
                let isHovered = (hoveredNode === n || draggedNode === n);

                if (isHovered) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = n.color;
                } else {
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = '#000';
                }
                
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.stroke();

                ctx.fillStyle = '#0b0c10';
                let fontSize = n.element.length === 1 ? n.radius * 1.1 : n.radius * 0.8;
                ctx.font = `bold ${fontSize}px 'Orbitron', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(n.element, n.x, n.y + 2);
            });

            // Draw Hover Tooltip
            let displayNode = hoveredNode || draggedNode;
            if (displayNode && !isLevelComplete) {
                let text = symbolToName[displayNode.element] || displayNode.element;
                ctx.font = "bold 16px 'Rajdhani', sans-serif";
                let textWidth = ctx.measureText(text).width;
                let padX = 12, padY = 8;
                let boxW = textWidth + padX * 2;
                let boxH = 16 + padY * 2;
                let boxX = displayNode.x;
                let boxY = displayNode.y - displayNode.radius - boxH/2 - 10;

                if (boxX - boxW/2 < 10) boxX = boxW/2 + 10;
                if (boxX + boxW/2 > width - 10) boxX = width - boxW/2 - 10;
                if (boxY - boxH/2 < 10) boxY = displayNode.y + displayNode.radius + boxH/2 + 10;

                ctx.fillStyle = 'rgba(11, 12, 16, 0.9)';
                ctx.strokeStyle = '#66fcf1';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(boxX - boxW/2, boxY - boxH/2, boxW, boxH, 5) : ctx.rect(boxX - boxW/2, boxY - boxH/2, boxW, boxH);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, boxX, boxY + 1);
            }
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Pointer Events
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (width / rect.width),
                y: (clientY - rect.top) * (height / rect.height)
            };
        }

        function handlePointerDown(e) {
            if(isLevelComplete) return;
            pointer.isDown = true;
            const pos = getPointerPos(e);
            pointer.x = pos.x;
            pointer.y = pos.y;

            let closest = null;
            let minDist = Infinity;
            nodes.forEach(n => {
                let dist = Math.hypot(n.x - pos.x, n.y - pos.y);
                if (dist < n.radius * 1.5 && dist < minDist) {
                    closest = n;
                    minDist = dist;
                }
            });

            if (closest) {
                draggedNode = closest;
                hoveredNode = null; 
                sfx.grab();
            }
        }

        function handlePointerMove(e) {
            const pos = getPointerPos(e);
            
            hoveredNode = null;
            if (!pointer.isDown && !isLevelComplete) {
                for (let n of nodes) {
                    let dist = Math.hypot(n.x - pos.x, n.y - pos.y);
                    if (dist <= n.radius) {
                        hoveredNode = n;
                        break;
                    }
                }
            }

            if (pointer.isDown) {
                if (e.cancelable) e.preventDefault();
                pointer.x = pos.x;
                pointer.y = pos.y;
            }
        }

        function handlePointerUp(e) {
            pointer.isDown = false;
            if (draggedNode && !isLevelComplete) {
                let snapped = false;
                let invalidAttempt = false;
                let rejectNode = null;

                nodes.forEach(n => {
                    if (n !== draggedNode && !linkExists(n, draggedNode)) {
                        let dist = Math.hypot(n.x - draggedNode.x, n.y - draggedNode.y);
                        if (dist < n.radius + draggedNode.radius + 30) {
                            if (isValidBond(draggedNode, n)) {
                                links.push({
                                    nodeA: draggedNode, 
                                    nodeB: n, 
                                    targetDist: n.radius + draggedNode.radius + 20
                                });
                                snapped = true;
                            } else {
                                invalidAttempt = true;
                                rejectNode = n;
                            }
                        }
                    }
                });

                if (snapped) {
                    sfx.snap();
                    
                    if (links.length === nodes.length - 1) {
                        isLevelComplete = true;
                        sfx.win();
                        saveProgress();
                        
                        setTimeout(() => {
                            const data = formattedLevels[currentLevel];
                            
                            document.getElementById('compound-formula').innerText = data.formula;
                            document.getElementById('compound-name-display').innerText = data.compName;
                            
                            document.getElementById('element-name-display').innerText = `Atomic No. ${data.z} | ${data.elemName} (${data.sym})`;
                            
                            let groupInfo = getGroupNumber(data.z);
                            let categoryText = getElementCategory(data.z);
                            let groupText = (typeof groupInfo === "number") ? `Group ${groupInfo} • ${categoryText}` : `${groupInfo} • ${categoryText}`;
                            document.getElementById('element-group').innerText = groupText;
                            
                            let reactScore = getReactivity(data.z);
                            let rBar = document.getElementById('reactivity-bar');
                            rBar.style.width = '0%';
                            
                            document.getElementById('reactivity-text').innerText = `${Math.round(reactScore)}%`;
                            let reactColor = reactScore > 80 ? '#ff4757' : (reactScore > 40 ? '#feca57' : '#1dd1a1');
                            rBar.style.backgroundColor = reactColor;

                            document.getElementById('element-desc').innerText = data.elemDesc;
                            
                            document.getElementById('bond-type').innerText = "Bond Type: " + getBondType(data.atoms);
                            document.getElementById('compound-desc').innerText = data.compDesc;

                            setTimeout(() => { rBar.style.width = `${reactScore}%`; }, 100);
                            
                            if(currentLevel >= formattedLevels.length - 1) {
                                document.getElementById('next-btn').innerText = "Restart Journey";
                            } else {
                                document.getElementById('next-btn').innerText = "Next";
                            }
                            
                            winOverlay.classList.add('active');
                        }, 1000); 
                    }
                } else if (invalidAttempt && rejectNode) {
                    sfx.error();
                    let dx = draggedNode.x - rejectNode.x;
                    let dy = draggedNode.y - rejectNode.y;
                    let dist = Math.hypot(dx, dy) || 1;
                    draggedNode.vx = (dx / dist) * 15;
                    draggedNode.vy = (dy / dist) * 15;
                }
            }
            draggedNode = null;
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove, {passive: false});
        window.addEventListener('mouseup', handlePointerUp);
        
        canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
        window.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        // Buttons
        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio();
            startScreen.classList.remove('active');
            populateLevelGrid();
            levelScreen.classList.add('active');
        });

        document.getElementById('close-levels-btn').addEventListener('click', () => {
            levelScreen.classList.remove('active');
            if (!isRunning) {
                startScreen.classList.add('active');
            }
        });
        
        document.getElementById('menu-open-btn').addEventListener('click', () => {
            populateLevelGrid();
            levelScreen.classList.add('active');
        });

        document.getElementById('menu-back-btn').addEventListener('click', () => {
            winOverlay.classList.remove('active');
            populateLevelGrid();
            levelScreen.classList.add('active');
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if(currentLevel >= formattedLevels.length - 1) {
                startLevel(0); 
            } else {
                startLevel(currentLevel + 1);
            }
        });

        // Init layout
        resize();
    </script>
</body>
</html>
