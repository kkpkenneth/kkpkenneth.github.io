<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eukaryotic & Prokaryotic Cells Quiz</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f8ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .quiz-container {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 1px 2px 10px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 600px;
    text-align: left;
  }
  h2 {
    margin-top: 0;
  }
  ul {
    list-style-type: none;
    padding-left: 0;
  }
  li {
    background: #e6f7ff;
    margin: 8px 0;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
  }
  li:hover {
    background: #b3e0ff;
  }
  .correct {
    background-color: #c8f7c5 !important;
  }
  .incorrect {
    background-color: #f7c5c5 !important;
  }
  #nextBtn {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
  }
  #score {
    font-weight: bold;
    margin-bottom: 15px;
  }
</style>
</head>
<body>

<div class="quiz-container">
  <div id="score">Score: 0</div>
  <h2 id="question"></h2>
  <ul id="options"></ul>
  <button id="nextBtn">Next</button>
</div>

<script>
const questions = [
  { q: "Which of the following is found only in eukaryotic cells?", options: ["Ribosomes", "Nucleus", "Cell membrane", "Cytoplasm"], answer: "Nucleus" },
  { q: "Prokaryotic cells lack:", options: ["DNA", "Cytoplasm", "Membrane-bound organelles", "Cell wall"], answer: "Membrane-bound organelles" },
  { q: "Which cell type is generally smaller in size?", options: ["Eukaryotic", "Prokaryotic", "Both are equal", "None of the above"], answer: "Prokaryotic" },
  { q: "The site of protein synthesis in both eukaryotic and prokaryotic cells is:", options: ["Nucleus", "Ribosome", "Golgi apparatus", "Lysosome"], answer: "Ribosome" },
  { q: "Which of these is a prokaryotic organism?", options: ["Amoeba", "Bacteria", "Plant", "Fungi"], answer: "Bacteria" },
  { q: "Eukaryotic cells have linear DNA, while prokaryotic cells usually have:", options: ["Circular DNA", "Linear RNA", "Mitochondrial DNA only", "Plasmid RNA"], answer: "Circular DNA" },
  { q: "Which structure controls the entry and exit of substances in eukaryotic cells?", options: ["Nucleus", "Ribosome", "Cell membrane", "Mitochondria"], answer: "Cell membrane" },
  { q: "Which of the following can perform photosynthesis?", options: ["Animal cells", "Bacteria and plant cells", "Fungi", "Animal and fungi cells"], answer: "Bacteria and plant cells" },
  { q: "Prokaryotic cells reproduce mainly by:", options: ["Binary fission", "Mitosis", "Meiosis", "Budding"], answer: "Binary fission" },
  { q: "Which organelle is responsible for energy production in eukaryotic cells?", options: ["Nucleus", "Mitochondria", "Ribosome", "Golgi apparatus"], answer: "Mitochondria" },
  { q: "Which of the following is present in all cells?", options: ["Mitochondria", "Nucleus", "Cell membrane", "Endoplasmic reticulum"], answer: "Cell membrane" },
  { q: "Prokaryotic cells do not have:", options: ["DNA", "Ribosomes", "Endoplasmic reticulum", "Cytoplasm"], answer: "Endoplasmic reticulum" },
  { q: "Eukaryotic cells are usually larger because:", options: ["They lack ribosomes", "They have membrane-bound organelles", "They have no cytoplasm", "They have circular DNA"], answer: "They have membrane-bound organelles" },
  { q: "Which of the following is only found in plant cells?", options: ["Cell wall", "Chloroplasts", "Mitochondria", "Both A and B"], answer: "Both A and B" },
  { q: "Prokaryotic DNA is usually found in the:", options: ["Nucleus", "Nucleoid", "Mitochondria", "Cytoplasm"], answer: "Nucleoid" },
  { q: "Eukaryotic cells divide by:", options: ["Binary fission", "Mitosis or meiosis", "Budding", "Fragmentation"], answer: "Mitosis or meiosis" },
  { q: "Which of the following may have plasmids?", options: ["Plant cells", "Animal cells", "Prokaryotic cells", "Fungal cells"], answer: "Prokaryotic cells" },
  { q: "Ribosomes in prokaryotes are smaller than those in eukaryotes. What is the size?", options: ["80S", "70S", "60S", "50S"], answer: "70S" },
  { q: "Which of the following statements is correct?", options: ["All cells have a nucleus", "Prokaryotes have membrane-bound organelles", "Eukaryotes have linear chromosomes", "Prokaryotes undergo mitosis"], answer: "Eukaryotes have linear chromosomes" },
  { q: "Which of these organisms is unicellular and prokaryotic?", options: ["Paramecium", "E. coli", "Yeast", "Human skin cell"], answer: "E. coli" }
];

let shuffledQuestions = shuffle([...questions]);
let currentIndex = 0;
let score = 0;
let answered = false;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function showQuestion() {
  answered = false;
  const q = shuffledQuestions[currentIndex];
  document.getElementById('question').innerText = q.q;

  const optionsUl = document.getElementById('options');
  optionsUl.innerHTML = '';
  
  const shuffledOptions = shuffle([...q.options]);

  shuffledOptions.forEach(opt => {
    const li = document.createElement('li');
    li.textContent = opt;
    li.addEventListener('click', () => {
      if (answered) return;
      answered = true;

      optionsUl.querySelectorAll('li').forEach(el => {
        el.classList.remove('correct', 'incorrect');
        if(el.textContent === q.answer) el.classList.add('correct'); // show correct answer
      });

      if(opt === q.answer){
        li.classList.add('correct');
        score++;
        document.getElementById('score').innerText = `Score: ${score}`;
      } else {
        li.classList.add('incorrect');
      }
    });
    optionsUl.appendChild(li);
  });
}

document.getElementById('nextBtn').addEventListener('click', () => {
  currentIndex++;
  if(currentIndex >= shuffledQuestions.length){
    currentIndex = 0;
    shuffledQuestions = shuffle([...questions]);
  }
  showQuestion();
});

// Initialize first question
showQuestion();
</script>

</body>
</html>
