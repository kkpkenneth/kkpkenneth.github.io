<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Slide Puzzle</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle, #1a1a2e, #16213e, #0f3460);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #fff;
        user-select: none;
    }

    h1 {
        margin-bottom: 5px;
        font-size: 2.2em;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        color: #e94560;
    }

    .info-panel {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        font-size: 1.2em;
        font-weight: bold;
    }

    .info-box {
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
    }

    /* Puzzle Board Container */
    #board {
        display: grid;
        grid-template-columns: repeat(4, 80px);
        grid-template-rows: repeat(4, 80px);
        gap: 8px;
        background: rgba(0, 0, 0, 0.4);
        padding: 12px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        border: 2px solid rgba(233, 69, 96, 0.4);
    }

    .tile {
        background: linear-gradient(135deg, #0f3460, #16213e);
        border: 2px solid #e94560;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.8em;
        font-weight: bold;
        color: #fff;
        cursor: pointer;
        transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .tile:hover:not(.empty) {
        background: linear-gradient(135deg, #e94560, #c73650);
        transform: scale(1.03);
        box-shadow: 0 6px 12px rgba(233,69,96,0.4);
    }

    .tile:active:not(.empty) {
        transform: scale(0.97);
    }

    .tile.empty {
        background: transparent;
        border: 2px dashed rgba(255, 255, 255, 0.1);
        cursor: default;
        box-shadow: none;
    }

    #restart-btn {
        margin-top: 25px;
        padding: 12px 30px;
        font-size: 1.1em;
        font-weight: bold;
        background: #e94560;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        transition: transform 0.2s, background 0.2s;
    }

    #restart-btn:hover {
        background: #ff4769;
        transform: translateY(-2px);
    }

    #restart-btn:active {
        transform: translateY(1px);
    }

    /* Win Message Overlay */
    #win-message {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        animation: fadeIn 0.3s ease-out;
    }

    #win-message h2 {
        font-size: 3em;
        color: #2ed573;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(46, 213, 115, 0.5);
    }

    #win-message p {
        font-size: 1.3em;
        margin-bottom: 20px;
        color: #d1d8e0;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>
<body>

    <h1>Slide Puzzle</h1>
    <div class="info-panel">
        <div class="info-box">Moves: <span id="move-count">0</span></div>
        <div class="info-box">Time: <span id="timer">00:00</span></div>
    </div>

    <div id="board"></div>

    <button id="restart-btn" onclick="initGame()">Restart Game</button>

    <!-- Win Modal -->
    <div id="win-message">
        <h2>🎉 Puzzle Solved! 🎉</h2>
        <p id="win-stats">Completed in 0 moves and 00:00.</p>
        <button id="restart-btn" onclick="closeWinModal()">Play Again</button>
    </div>

<script>
    const boardSize = 4;
    let tiles = [];
    let emptyIdx = 15;
    let moves = 0;
    let seconds = 0;
    let timerInterval = null;
    let isPlaying = false;

    const board = document.getElementById('board');
    const moveCountDisplay = document.getElementById('move-count');
    const timerDisplay = document.getElementById('timer');
    const winModal = document.getElementById('win-message');
    const winStats = document.getElementById('win-stats');

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        seconds = 0;
        timerDisplay.innerText = "00:00";
        timerInterval = setInterval(() => {
            seconds++;
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    // Generate Solvable Board Configuration
    function generateSolvableBoard() {
        do {
            tiles = [];
            for (let i = 1; i <= 15; i++) tiles.push(i);
            tiles.push(""); // empty string for empty slot

            // Shuffle randomly
            for (let i = tiles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
            }
            emptyIdx = tiles.indexOf("");
        } while (!isSolvable() || isSolved()); // Ensure it's solvable and not already solved
    }

    // Check Solvability of 15-Puzzle
    function isSolvable() {
        let inversions = 0;
        let flatTiles = tiles.filter(t => t !== "");
        for (let i = 0; i < flatTiles.length - 1; i++) {
            for (let j = i + 1; j < flatTiles.length; j++) {
                if (flatTiles[i] > flatTiles[j]) inversions++;
            }
        }
        
        let emptyRowFromBottom = boardSize - Math.floor(emptyIdx / boardSize);
        if (boardSize % 2 === 1) {
            return inversions % 2 === 0;
        } else {
            if (emptyRowFromBottom % 2 === 1) {
                return inversions % 2 === 0;
            } else {
                return inversions % 2 === 1;
            }
        }
    }

    function isSolved() {
        for (let i = 0; i < 15; i++) {
            if (tiles[i] !== i + 1) return false;
        }
        return tiles[15] === "";
    }

    function renderBoard() {
        board.innerHTML = "";
        tiles.forEach((val, idx) => {
            const tile = document.createElement('div');
            tile.className = `tile ${val === "" ? "empty" : ""}`;
            tile.innerText = val;
            tile.addEventListener('click', () => handleTileClick(idx));
            board.appendChild(tile);
        });
    }

    function handleTileClick(idx) {
        if (!isPlaying) {
            isPlaying = true;
            startTimer();
        }

        const validMoves = getValidMoves(emptyIdx);
        if (validMoves.includes(idx)) {
            // Swap clicked tile with empty slot
            tiles[emptyIdx] = tiles[idx];
            tiles[idx] = "";
            emptyIdx = idx;
            moves++;
            moveCountDisplay.innerText = moves;

            renderBoard();

            if (isSolved()) {
                stopTimer();
                isPlaying = false;
                setTimeout(() => {
                    winStats.innerText = `Completed in ${moves} moves and ${timerDisplay.innerText}.`;
                    winModal.style.display = "flex";
                }, 200);
            }
        }
    }

    function getValidMoves(empIdx) {
        const row = Math.floor(empIdx / boardSize);
        const col = empIdx % boardSize;
        const valid = [];

        if (row > 0) valid.push(empIdx - boardSize); // Move Up
        if (row < boardSize - 1) valid.push(empIdx + boardSize); // Move Down
        if (col > 0) valid.push(empIdx - 1); // Move Left
        if (col < boardSize - 1) valid.push(empIdx + 1); // Move Right

        return valid;
    }

    function initGame() {
        stopTimer();
        isPlaying = false;
        moves = 0;
        moveCountDisplay.innerText = moves;
        winModal.style.display = "none";
        generateSolvableBoard();
        renderBoard();
    }

    function closeWinModal() {
        winModal.style.display = "none";
        initGame();
    }

    // Initial setup on load
    initGame();
</script>
</body>
</html>
