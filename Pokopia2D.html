<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pokopia 2D: Hybrid Edition</title>
    <style>
        body { background: #1a1a1a; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; overflow: hidden; touch-action: none; }
        #game-wrapper { display: flex; gap: 15px; background: #333; padding: 15px; border-radius: 15px; border: 4px solid #555; position: relative; max-width: 95vw; }
        canvas { background: #5a8f3c; border: 3px solid #2d4f1e; image-rendering: pixelated; width: 600px; height: 450px; touch-action: none; }
        #sidebar { width: 250px; background: #222; padding: 15px; border-radius: 10px; height: 450px; overflow-y: auto; border: 2px solid #444; }
        .res-ui { font-weight: bold; font-size: 1.4em; margin-bottom: 10px; color: #00d2ff; }
        .habitat-tag { font-size: 0.8em; background: #444; padding: 8px; border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .unlocked { border-left: 5px solid #00ff00; background: #2d3d2d; }
        .locked { color: #777; opacity: 0.6; }
        
        /* Mobile Controls */
        #controls { display: none; margin-top: 20px; gap: 50px; align-items: center; }
        .joystick-base { width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; position: relative; }
        .joystick-stick { width: 40px; height: 40px; background: #fff; border-radius: 50%; position: absolute; top: 30px; left: 30px; }
        #build-btn { width: 80px; height: 80px; background: #ffcb05; border: 4px solid #3b4cca; border-radius: 50%; color: #3b4cca; font-weight: bold; font-size: 1.2em; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #2a3a9a; }

        @media (max-width: 900px) {
            #game-wrapper { flex-direction: column; align-items: center; }
            canvas { width: 90vw; height: 60vh; }
            #sidebar { width: 90vw; height: 150px; display: flex; flex-wrap: wrap; gap: 10px; }
            #controls { display: flex; }
        }
    </style>
</head>
<body>

    <div class="res-ui">💎 <span id="res-val">0</span> | 🏠 <span id="lvl-val">0</span>/31</div>

    <div id="game-wrapper">
        <canvas id="pokopiaCanvas" width="900" height="650"></canvas>
        <div id="sidebar">
            <div id="dex-list"></div>
        </div>
    </div>

    <div id="controls">
        <div class="joystick-base" id="joy-base"><div class="joystick-stick" id="joy-stick"></div></div>
        <div id="build-btn">BUILD</div>
    </div>

    <audio id="bgMusic" loop><source src="pokopia.mp3" type="audio/mpeg"></audio>

<script>
    const canvas = document.getElementById('pokopiaCanvas');
    const ctx = canvas.getContext('2d');
    const bgMusic = document.getElementById('bgMusic');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    let materials = 0, musicStarted = false;
    const player = { x: 450, y: 325, speed: 6 };
    const resources = [], activeHabitats = [];
    const resourceEmojis = ["🌱", "🍎", "⚡", "💎", "🪵", "💧", "🐚", "🍄", "🏮", "❄️"];

    const dittoImg = new Image();
    dittoImg.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/132.png";

    const habitatData = [
        { name: "Tall Grass", color: "#2e7d32", pk: "Bulbasaur", id: 1 },
        { name: "Campsite", color: "#d84315", pk: "Charmander", id: 4 },
        { name: "Quiet Pond", color: "#0277bd", pk: "Squirtle", id: 7 },
        { name: "Electric Field", color: "#fbc02d", pk: "Pikachu", id: 25 },
        { name: "Park Bench", color: "#8bc34a", pk: "Eevee", id: 133 }
    ]; // Add more as needed...

    function playSfx(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        if(type === 'collect') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); }
        else if(type === 'success') { osc.type = 'triangle'; osc.frequency.setValueAtTime(523, audioCtx.currentTime); osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1); }
        else { osc.type = 'square'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.2); }
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    // Input Handling
    const keys = {};
    window.addEventListener('keydown', e => { 
        keys[e.code] = true; 
        if(!musicStarted) { bgMusic.play(); musicStarted = true; }
        if(e.code === 'Space') tryBuild();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Build & Recycle Logic
    canvas.addEventListener('mousedown', handleInteraction);
    canvas.addEventListener('touchstart', (e) => handleInteraction(e.touches[0]));
    document.getElementById('build-btn').addEventListener('touchstart', (e) => { e.preventDefault(); tryBuild(); });

    function handleInteraction(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;

        for (let i = activeHabitats.length - 1; i >= 0; i--) {
            const h = activeHabitats[i];
            if (mx >= h.x + 95 && mx <= h.x + 120 && my >= h.y + 5 && my <= h.y + 30) {
                activeHabitats.splice(i, 1);
                materials += 25;
                playSfx('recycle');
                updateUI();
                return;
            }
        }
    }

    function tryBuild() {
        let targetIndex = -1;
        for(let i=0; i < habitatData.length; i++) {
            if(!activeHabitats.some(ah => ah.dataIndex === i)) { targetIndex = i; break; }
        }
        if (materials >= 50 && targetIndex !== -1) {
            materials -= 50;
            const data = habitatData[targetIndex];
            const pImg = new Image(); pImg.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${data.id}.png`;
            activeHabitats.push({
                x: player.x - 60, y: player.y - 60, pkmnX: 25, pkmnY: 25, img: pImg, 
                color: data.color, name: data.name, pk: data.pk, id: data.id, dataIndex: targetIndex,
                lastMove: Date.now(), moveInterval: 1500
            });
            playSfx('success'); updateUI();
        }
    }

    function updateUI() {
        document.getElementById('res-val').innerText = materials;
        document.getElementById('lvl-val').innerText = activeHabitats.length;
        document.getElementById('dex-list').innerHTML = habitatData.map((h, i) => {
            const unlocked = activeHabitats.some(ah => ah.dataIndex === i);
            return `<div class="habitat-tag ${unlocked ? 'unlocked' : 'locked'}">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${h.id}.png" class="dex-img" style="filter:${unlocked ? 'none' : 'brightness(0)'}">
                <b>${unlocked ? h.pk : 'Locked'}</b></div>`;
        }).join('');
    }

    // Joystick Logic
    let joyX = 0, joyY = 0;
    const stick = document.getElementById('joy-stick');
    document.getElementById('joy-base').addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const base = document.getElementById('joy-base').getBoundingClientRect();
        const centerX = base.left + 50, centerY = base.top + 50;
        joyX = Math.min(Math.max((touch.clientX - centerX) / 50, -1), 1);
        joyY = Math.min(Math.max((touch.clientY - centerY) / 50, -1), 1);
        stick.style.transform = `translate(${joyX * 30}px, ${joyY * 30}px)`;
        if(!musicStarted) { bgMusic.play(); musicStarted = true; }
    });
    document.getElementById('joy-base').addEventListener('touchend', () => {
        joyX = 0; joyY = 0; stick.style.transform = `translate(0,0)`;
    });

    function loop() {
        // Movement Combine (Keyboard + Joystick)
        if (keys['ArrowUp'] || keys['KeyW'] || joyY < -0.2) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['KeyS'] || joyY > 0.2) player.y += player.speed;
        if (keys['ArrowLeft'] || keys['KeyA'] || joyX < -0.2) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['KeyD'] || joyX > 0.2) player.x += player.speed;

        ctx.clearRect(0, 0, 900, 650);
        const now = Date.now();

        activeHabitats.forEach(h => {
            ctx.fillStyle = h.color;
            ctx.beginPath(); ctx.roundRect(h.x, h.y, 120, 120, 15); ctx.fill();
            ctx.fillStyle = "#ff4444"; ctx.beginPath(); ctx.roundRect(h.x + 95, h.y + 5, 20, 20, 4); ctx.fill();
            ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.fillText("X", h.x + 100, h.y + 20);
            if (now - h.lastMove > h.moveInterval) {
                h.pkmnX = Math.random() * 50; h.pkmnY = Math.random() * 50; h.lastMove = now;
            }
            ctx.drawImage(h.img, h.x + h.pkmnX, h.y + h.pkmnY, 70, 70); 
        });

        if(Math.random() < 0.03 && resources.length < 20) {
            resources.push({x: Math.random()*850 + 20, y: Math.random()*600 + 20, emoji: resourceEmojis[Math.floor(Math.random()*resourceEmojis.length)]});
        }
        ctx.font = "28px Arial";
        for(let i=resources.length-1; i>=0; i--){
            let r = resources[i]; ctx.fillText(r.emoji, r.x, r.y);
            if(Math.hypot(player.x - r.x, player.y - r.y) < 50) { 
                resources.splice(i,1); materials += 10; playSfx('collect'); updateUI(); 
            }
        }

        ctx.drawImage(dittoImg, player.x - 40, player.y - 40, 80, 80);
        requestAnimationFrame(loop);
    }
    updateUI(); loop();
</script>
</body>
</html>
