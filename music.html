<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Genre Explorer</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header (Hidden on Start Screen) */
        #main-header {
            display: none;
            text-align: center;
            padding: 2rem 1rem;
            background-color: var(--surface);
            border-bottom: 1px solid #334155;
            animation: slideDown 0.4s ease;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        /* Buttons */
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        button.outline {
            background-color: transparent;
            border: 2px solid var(--primary);
        }

        button.outline:hover {
            background-color: var(--primary);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* View toggling */
        .view { display: none; width: 100%; }
        .view.active { display: block; animation: fadeIn 0.4s ease; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        /* Start Screen UI */
        #start-screen {
            text-align: center;
            margin: auto;
            max-width: 600px;
            padding: 4rem 2rem;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        #start-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #start-screen p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        .start-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-pulse {
            animation: pulseGlow 2s infinite;
            padding: 1.2rem;
            font-size: 1.2rem;
        }

        /* Quiz UI */
        #quiz-view {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            background: var(--surface);
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .audio-controls {
            margin: 2rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        #options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        .option-btn {
            background-color: #334155;
            padding: 1.5rem;
            font-size: 1.1rem;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .option-btn:hover:not(:disabled) { background-color: #475569; transform: none; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        .option-btn.correct { background-color: var(--success); }
        .option-btn.wrong { background-color: var(--danger); }

        /* Collection UI */
        #collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .genre-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        
        .genre-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .genre-card h3 {
            font-size: 1.5rem;
            text-transform: capitalize;
            color: var(--primary);
            border-bottom: 1px solid #334155;
            padding-bottom: 0.5rem;
        }

        .tag {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
            padding-top: 1rem;
        }

        .card-actions button {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <h1>Music Genre Explorer</h1>
        <div class="nav-tabs">
            <button onclick="switchView('quiz')" id="tab-quiz">Speed Quiz</button>
            <button onclick="switchView('collection')" id="tab-collection" class="outline">Study Collection</button>
        </div>
    </header>

    <div class="container">
        
        <!-- Start Screen View -->
        <div id="start-screen" class="view active">
            <h1>Music Genre Explorer</h1>
            <p>Train your ear and explore the characteristics of 50 different music genres.</p>
            
            <div class="start-actions">
                <button onclick="switchView('quiz')" class="btn-pulse">Start Speed Quiz</button>
                <button onclick="switchView('collection')" class="outline" style="padding: 1rem;">Browse Study Collection</button>
            </div>
        </div>

        <!-- Quiz View -->
        <div id="quiz-view" class="view">
            <h2>Identify the Genre</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Score: <span id="score">0</span></p>
            
            <div class="audio-controls">
                <p id="play-instruction" style="color: var(--primary); font-weight: bold; margin: 0;">Click Play to start!</p>
                <button onclick="playQuizAudio()" style="border-radius: 50%; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                    ▶
                </button>
            </div>

            <div id="options-grid"></div>
            <button onclick="nextQuestion()" id="next-btn" style="margin-top: 2rem; display: none; width: 100%; padding: 1.2rem;">Next Track</button>
        </div>

        <!-- Collection View -->
        <div id="collection-view" class="view">
            <div id="collection-grid"></div>
        </div>
    </div>

    <script>
        const genreData = [
            { id: "3-hiphop", name: "Hip Hop", file: "3-hiphop.mp3", mood: "Nostalgic, rhythmic, and cozy.", instruments: "Vinyl drum breaks, sampled piano or jazz loops, and heavy bass.", scene: "A slow-motion montage of city life in an urban neighborhood at dusk." },
            { id: "4-r&b", name: "R&B", file: "4-r&b.mp3", mood: "Smooth, sensual, and intimate.", instruments: "Electric piano, syncopated electronic drums, deep bass, and lush vocal harmonies.", scene: "A quiet, neon-lit drive through a modern metropolis late at night." },
            { id: "11-lo-fi", name: "Lo-Fi", file: "11-lo-fi.mp3", mood: "Relaxed, warm, and slightly melancholic.", instruments: "Vinyl crackle, muffled kick drums, detuned pianos, and environmental Foley like rain.", scene: "Studying alone by a window while rain pours outside in the evening." },
            { id: "15-ambienct", name: "Ambient", file: "15-ambienct.mp3", mood: "Weightless, atmospheric, and calm.", instruments: "Synthesizer drones, heavy reverb, and drifting electronic textures.", scene: "A wide, panning shot of the Earth viewed from a silent space station." },
            { id: "34-k-pop", name: "K-Pop", file: "34-k-pop.mp3", mood: "High-energy, glossy, and euphoric.", instruments: "Crisp four-on-the-floor kicks, bright synthesizer arpeggios, and heavy sub-bass.", scene: "A highly choreographed, neon-soaked dance battle in an underground futuristic club." },
            { id: "39-disco", name: "Disco", file: "39-disco.mp3", mood: "Celebratory, sophisticated, and rhythmic.", instruments: "Slap-bass, sweeping orchestral strings, rhythm guitar, and four-on-the-floor drums.", scene: "A protagonist making a grand, slow-motion entrance onto a packed, glowing dance floor in 1978." },
            { id: "40-industrial", name: "Industrial", file: "40-industrial.mp3", mood: "Dark, mechanical, and oppressive.", instruments: "Distorted synthesizers, heavy metallic percussion, and drum machines.", scene: "A high-speed foot chase through a dystopian, rain-slicked cyberpunk factory." },
            { id: "41-darkwave", name: "Darkwave", file: "41-darkwave.mp3", mood: "Nocturnal, moody, and sleek.", instruments: "Throbbing analog synth bass, icy hi-hats, and eerie, swelling synthesizer leads.", scene: "A lone detective walking through a foggy, technologically advanced city block at midnight." },
            { id: "42-symphonic-metal", name: "Symphonic Metal", file: "42-symphonic-metal.mp3", mood: "Epic, grand, and high-stakes.", instruments: "Distorted electric guitars, double-kick drums, choral vocals, and orchestral brass.", scene: "A climactic, final showdown between armies in front of an ancient, collapsing cathedral." },
            { id: "43-grime", name: "Grime", file: "43-grime.mp3", mood: "Aggressive, cold, and confrontational.", instruments: "Sliding sub-bass, complex syncopated hi-hats, and sharp, biting snare hits.", scene: "An underground, high-stakes street race winding through the narrow alleys of a modern city." },
            { id: "44-trap", name: "Trap", file: "44-trap.mp3", mood: "Gritty, ambitious, and heavy.", instruments: "Rapid-fire 808 hi-hats, booming sub-bass kicks, and cinematic brass stabs.", scene: "A slow-motion panning shot of a crew preparing for a massive, high-stakes heist." },
            { id: "45-drill", name: "Drill", file: "45-drill.mp3", mood: "Tense, ominous, and energetic.", instruments: "Warping, sliding 808 bass, stuttering snare rolls, and dark piano melodies.", scene: "A shadowy, high-velocity chase sequence evading pursuit in a brutalist concrete cityscape." },
            { id: "46-boom-bap", name: "Boom Bap", file: "46-boom-bap.mp3", mood: "Grounded, head-nodding, and raw.", instruments: "Hard, acoustic kick-snare loops, upright bass, and chopped horn samples.", scene: "A protagonist walking confidently down a bustling, sunlit block in a 90s metropolis." },
            { id: "47-psychedelic-rock", name: "Psychedelic Rock", file: "47-psychedelic-rock.mp3", mood: "Hypnotic, hazy, and hallucinogenic.", instruments: "Fuzz-distorted bass, wah-wah guitar, swirling Hammond organ, and delay pedals.", scene: "A surreal dream sequence where the city environment slowly melts and changes colors." },
            { id: "48-dream-pop", name: "Dream Pop", file: "48-dream-pop.mp3", mood: "Comforting, ethereal, and vulnerable.", instruments: "Chorus-drenched guitars, soft-focus drums, and sweeping, airy synthesizers.", scene: "Standing alone on a quiet city bridge during the golden hour, watching the sky change." },
            { id: "49-shoegaze", name: "Shoegaze", file: "49-shoegaze.mp3", mood: "Overwhelming, melancholic, and immersive.", instruments: "A massive wall of distorted, feedback-heavy guitars and steady, driving drums.", scene: "A moment of intense emotional realization while staring out at a vast, foggy landscape." },
            { id: "50-ska", name: "Ska", file: "50-ska.mp3", mood: "Bouncy, frantic, and rebellious.", instruments: "Walking bassline, brass fanfares (trumpet/trombone), and off-beat rhythm guitar skanks.", scene: "A comedic, high-speed chase scene knocking over fruit stands in a crowded street market." }
        ];

        const screenshotFiles = [
            "1-pop.mp3", "2-rock.mp3", "5-country.mp3", "6-indie-rock.mp3", "7-alternative-rock.mp3", 
            "8-grunge.mp3", "9-electronic.mp3", "10-synthwave.mp3", "12-techno.mp3", "13-house.mp3", 
            "14-dubstep.mp3", "16-chiptune.mp3", "17-eurodance.mp3", "18-hardstyle.mp3", "19-drum-and-bass.mp3", 
            "20-trip-hop.mp3", "21-jazz.mp3", "22-blues.mp3", "23-classical.mp3", "24-folk.mp3", 
            "25-soul.mp3", "26-funk.mp3", "27-gospel.mp3", "28-bluegrass.mp3", "29-reggae.mp3", 
            "30-latin-pop.mp3", "31-salsa.mp3", "32-bachata.mp3", "33-reggaeton.mp3", "35-city-pop.mp3", 
            "36-afrobeat.mp3", "37-heavy-metal.mp3", "38-punk-rock.mp3"
        ];

        screenshotFiles.forEach(file => {
            let name = file.replace(/^\d+-/, '').replace('.mp3', '').replace(/-/g, ' ');
            genreData.push({
                id: file.replace('.mp3', ''),
                name: name,
                file: file,
                mood: "A unique and defining emotional atmosphere.",
                instruments: "Standard instrumentation characteristic to this genre.",
                scene: "A cinematic moment perfectly suited for this track's energy."
            });
        });

        let currentAudio = null;
        let currentQuizCorrect = null;
        let score = 0;
        let isFirstQuizLoad = true;

        function switchView(view) {
            // Hide start screen and show header if moving away from start
            if (view !== 'start-screen') {
                document.getElementById('main-header').style.display = 'block';
            }

            // Toggle view visibility
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`${view}-view`).classList.add('active');
            
            // Update active tab buttons
            document.getElementById('tab-quiz').className = view === 'quiz' ? '' : 'outline';
            document.getElementById('tab-collection').className = view === 'collection' ? '' : 'outline';

            stopAudio();
            window.speechSynthesis.cancel();

            // Prepare the first quiz question if entering quiz view for the first time
            if(view === 'quiz' && isFirstQuizLoad) {
                nextQuestion(true);
                isFirstQuizLoad = false;
            }
        }

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
        }

        function playTrack(file) {
            stopAudio();
            const playInstruction = document.getElementById('play-instruction');
            if (playInstruction) playInstruction.style.display = 'none';
            
            currentAudio = new Audio(file);
            currentAudio.play().catch(e => {
                console.error("Audio playback failed.", e);
                alert("Could not play track. Make sure '" + file + "' is in the same folder as the HTML file.");
            });
        }

        function playQuizAudio() {
            if (currentQuizCorrect) playTrack(currentQuizCorrect.file);
        }

        function readExplanation(genre) {
            const synth = window.speechSynthesis;
            synth.cancel(); 
            
            const text = `${genre.name}. Mood: ${genre.mood} Main Instruments: ${genre.instruments} Perfect Movie Scene: ${genre.scene}`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            synth.speak(utterance);
        }

        function nextQuestion(preventAutoplay = false) {
            document.getElementById('next-btn').style.display = 'none';
            stopAudio();
            
            let shuffled = [...genreData].sort(() => 0.5 - Math.random());
            currentQuizCorrect = shuffled[0];
            let options = shuffled.slice(0, 4).sort(() => 0.5 - Math.random());

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.name;
                btn.onclick = () => handleGuess(btn, opt);
                grid.appendChild(btn);
            });

            if (!preventAutoplay) {
                playQuizAudio();
            }
        }

        function handleGuess(btn, selectedObj) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true); 

            if (selectedObj.id === currentQuizCorrect.id) {
                btn.classList.add('correct');
                score++;
                document.getElementById('score').innerText = score;
            } else {
                btn.classList.add('wrong');
                buttons.forEach(b => {
                    if(b.innerText.toLowerCase() === currentQuizCorrect.name.toLowerCase()) {
                        b.classList.add('correct');
                    }
                });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            const sorted = [...genreData].sort((a,b) => a.name.localeCompare(b.name));
            
            sorted.forEach(genre => {
                const card = document.createElement('div');
                card.className = 'genre-card';
                card.innerHTML = `
                    <h3>${genre.name}</h3>
                    <div>
                        <div class="tag">Mood</div>
                        <p>${genre.mood}</p>
                    </div>
                    <div>
                        <div class="tag">Instruments</div>
                        <p>${genre.instruments}</p>
                    </div>
                    <div>
                        <div class="tag">Movie Scene</div>
                        <p>${genre.scene}</p>
                    </div>
                    <div class="card-actions">
                        <button onclick="playTrack('${genre.file}')">▶ Play Track</button>
                        <button class="outline" onclick='readExplanation(${JSON.stringify(genre).replace(/'/g, "&apos;")})'>🔊 Read Aloud</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = () => {
            renderCollection();
        };
    </script>
</body>
</html>
