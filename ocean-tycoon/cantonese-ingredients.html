        // Web Audio API Sound Effects
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            if (type === 'correct') {
                playTone(523.25, 0.1, 0);     // C5
                playTone(659.25, 0.15, 0.1);  // E5
            } else if (type === 'incorrect') {
                playTone(200, 0.2, 0, 'sawtooth');
                playTone(150, 0.2, 0.1, 'sawtooth');
            } else if (type === 'complete') {
                playTone(523.25, 0.1, 0);     // C5
                playTone(659.25, 0.1, 0.1);   // E5
                playTone(783.99, 0.1, 0.2);   // G5
                playTone(1046.50, 0.3, 0.3);  // C6
            }
        }

        function playTone(freq, duration, delay, waveType = 'sine') {
            setTimeout(() => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = waveType;
                osc.frequency.value = freq;

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, delay * 1000);
        }

        // Text-to-Speech Helper for Cantonese (zh-HK) - Pronounce Chinese word only once
        function speakCantonese() {
            if ('speechSynthesis' in window && currentQuestionData) {
                window.speechSynthesis.cancel();
                const textToSpeak = currentQuestionData.chinese;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        let currentQuestionData = null;
        const totalQuestionsPerGame = 15;

        function startQuiz() {
            initAudio();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            currentQuestionIndex = 0;
            score = 0;
            questions = [...ingredientDatabase].sort(() => Math.random() - 0.5).slice(0, totalQuestionsPerGame);
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endQuiz();
                return;
            }

            currentQuestionData = questions[currentQuestionIndex];
            document.getElementById('question-box').innerText = `What is this Cantonese ingredient?\n(${currentQuestionData.chinese} — ${currentQuestionData.jyutping})`;
            document.getElementById('question-counter').innerText = `Question ${currentQuestionIndex + 1}/${questions.length}`;
            document.getElementById('score-counter').innerText = `Score: ${score}`;
            document.getElementById('feedback').innerText = '';
            document.getElementById('explanation').innerText = '';
            document.getElementById('next-btn').classList.add('hidden');

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            optionsContainer.style.pointerEvents = "auto";

            let wrongOptions = ingredientDatabase
                .filter(item => item.name !== currentQuestionData.name)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(item => item.name);

            let options = [...wrongOptions, currentQuestionData.name].sort(() => Math.random() - 0.5);

            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectAnswer(btn, option, currentQuestionData.name, currentQuestionData.desc);
                optionsContainer.appendChild(btn);
            });

            setTimeout(speakCantonese, 300);
        }

            const buttons = optionsContainer.getElementsByTagName('button');
            
            optionsContainer.style.pointerEvents = "none";

            for (let btn of buttons) {
                if (btn.innerText === correct) {
                    btn.classList.add('correct');
                }
            }

            const feedbackEl = document.getElementById('feedback');
            const explanationEl = document.getElementById('explanation');

            if (selected === correct) {
                score++;
                button.classList.add('correct');
                playSound('correct');
                feedbackEl.innerText = "Correct! 🥢 Excellent market knowledge.";
                feedbackEl.style.color = "var(--success)";
            } else {
                button.classList.add('incorrect');
                playSound('incorrect');
                feedbackEl.innerText = `Incorrect. The correct answer is: ${correct}`;
                feedbackEl.style.color = "var(--error)";
            }

            explanationEl.innerText = description;
            document.getElementById('score-counter').innerText = `Score: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function loadNextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function endQuiz() {
            playSound('complete');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score-text').innerText = `Amazing work! You scored ${score} out of ${questions.length} on your ingredient market run.`;
        }

        function resetQuiz() {
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
