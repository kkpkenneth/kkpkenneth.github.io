<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lebanese Arabizi Numbers Quiz</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #fff0f8, #f0fff0);
  margin: 0; padding: 0;
  display: flex; flex-direction: column; align-items: center; min-height: 100vh;
}
h1 { text-align: center; margin: 20px 0; color: #2c3e50; }
.card {
  background: white; padding: 20px 30px; margin: 15px 0;
  border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.15);
  width: 90%; max-width: 600px;
}
#quiz-item { font-size: 50px; margin: 20px 0; color: #e67e22; font-weight: bold; }
#choices button {
  background-color: #3498db; color: white; border: none;
  border-radius: 10px; padding: 12px 18px; margin: 8px; font-size: 16px;
  cursor: pointer; transition: 0.2s;
}
#choices button:hover { background-color: #2980b9; transform: scale(1.05); }
.row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 18px; }
.row:last-child { border-bottom: none; }
.term { font-weight: bold; color: #34495e; }
.meaning { color: #2c3e50; }
@media (max-width: 500px) {
  #quiz-item { font-size: 40px; }
  .row { font-size: 16px; }
  #choices button { font-size: 14px; padding: 10px 14px; }
}
</style>
</head>
<body>

<h1>Lebanese Arabizi Numbers Quiz</h1>

<div class="card" style="text-align:center;">
  <h2>Guess the Sound</h2>
  <div id="quiz-item">example</div>
  <div id="choices"></div>
</div>

<div class="card">
  <h2>Reference Table</h2>
  <div id="table-rows"></div>
</div>

<script>
const arabizi = [
  { num: "2", sound: "’ (hamza / glottal stop)" },
  { num: "3", sound: "‘ (Ayn)" },
  { num: "5", sound: "kh (خ)" },
  { num: "6", sound: "ṭ (ط)" },
  { num: "7", sound: "ḥ (ح)" },
  { num: "8", sound: "ṣ (ص)" },
  { num: "9", sound: "ḍ (ض)" }
];

let correctAnswer = null;

function renderTable() {
  const table = document.getElementById("table-rows");
  table.innerHTML = "";
  arabizi.forEach(item => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="term">${item.num}</span> <span class="meaning">${item.sound}</span>`;
    table.appendChild(row);
  });
}

function newQuestion() {
  const qIndex = Math.floor(Math.random() * arabizi.length);
  correctAnswer = arabizi[qIndex];

  let options = [correctAnswer];
  while (options.length < 4) {
    let r = arabizi[Math.floor(Math.random() * arabizi.length)];
    if (!options.includes(r)) options.push(r);
  }

  options.sort(() => Math.random() - 0.5);

  document.getElementById("quiz-item").innerText = correctAnswer.num;
  const box = document.getElementById("choices");
  box.innerHTML = "";

  options.forEach(opt => {
    let btn = document.createElement("button");
    btn.innerText = opt.sound;
    btn.onclick = () => {
      if(opt === correctAnswer){
        alert("✅ Correct!");
      } else {
        alert(`❌ Wrong! Correct answer: ${correctAnswer.sound}`);
      }
      newQuestion();
    };
    box.appendChild(btn);
  });
}

window.onload = () => { 
  renderTable();
  newQuestion();
};
</script>

</body>
</html>
